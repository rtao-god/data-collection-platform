[project]
name = "review-application"
version = "0.1.0"
description = "Review use cases and permission boundaries for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "review-contracts",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_application"]

[tool.uv.sources]
review-contracts = { workspace = true }
