[project]
name = "source-connector-sdk"
version = "0.1.0"
description = "Worker Gateway client boundary for source connectors"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-contracts",
  "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/source_connector_sdk"]

[tool.uv.sources]
collection-contracts = { workspace = true }
