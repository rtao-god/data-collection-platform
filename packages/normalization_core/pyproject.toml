[project]
name = "normalization-core"
version = "0.1.0"
description = "Typed evidence-preserving normalization for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-contracts",
  "phonenumbers==9.0.34",
  "tldextract==5.3.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normalization_core"]

[tool.uv.sources]
collection-contracts = { workspace = true }
