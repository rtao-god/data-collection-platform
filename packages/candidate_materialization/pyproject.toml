[project]
name = "candidate-materialization"
version = "0.1.0"
description = "Deterministic projection of verified collection observations into candidate and resolution contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-contracts",
  "resolution-contracts",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candidate_materialization"]

[tool.uv.sources]
collection-contracts = { workspace = true }
resolution-contracts = { workspace = true }
