[project]
name = "collection-application"
version = "0.1.0"
description = "Application use cases for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-contracts",
  "collection-domain",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collection_application"]

[tool.uv.sources]
collection-contracts = { workspace = true }
collection-domain = { workspace = true }
