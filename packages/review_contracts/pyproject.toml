[project]
name = "review-contracts"
version = "0.1.0"
description = "Typed contracts for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_contracts"]
