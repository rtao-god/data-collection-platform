[project]
name = "collection-infrastructure"
version = "0.1.0"
description = "Infrastructure adapters for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-application",
  "collection-contracts",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collection_infrastructure"]

[tool.uv.sources]
collection-application = { workspace = true }
collection-contracts = { workspace = true }
