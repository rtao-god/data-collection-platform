[project]
name = "collection-infrastructure"
version = "0.1.0"
description = "Infrastructure adapters for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "boto3==1.43.54",
  "botocore==1.43.54",
  "candidate-materialization",
  "collection-application",
  "collection-contracts",
  "official-http-contracts",
  "psycopg[binary]==3.3.4",
  "quality-core",
  "resolution-contracts",
  "sqlalchemy==2.0.51",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collection_infrastructure"]

[tool.uv.sources]
candidate-materialization = { workspace = true }
collection-application = { workspace = true }
collection-contracts = { workspace = true }
official-http-contracts = { workspace = true }
quality-core = { workspace = true }
resolution-contracts = { workspace = true }
