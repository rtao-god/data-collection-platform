[project]
name = "collection-infrastructure"
version = "0.1.0"
description = "Infrastructure adapters for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "boto3==1.43.54",
  "botocore==1.43.54",
  "collection-application",
  "collection-contracts",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.51",
  "review-application",
  "review-contracts",
  "review-core",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collection_infrastructure"]

[tool.uv.sources]
collection-application = { workspace = true }
collection-contracts = { workspace = true }
review-application = { workspace = true }
review-contracts = { workspace = true }
review-core = { workspace = true }
