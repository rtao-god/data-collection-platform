[project]
name = "entity-resolution-core"
version = "0.1.0"
description = "Deterministic blocking, matching, and reversible clustering"
requires-python = ">=3.13,<3.14"
dependencies = [
  "resolution-contracts",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_resolution_core"]

[tool.uv.sources]
resolution-contracts = { workspace = true }
