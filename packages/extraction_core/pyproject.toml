[project]
name = "extraction-core"
version = "0.1.0"
description = "Evidence-backed source document extraction for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-contracts",
  "extruct==0.18.0",
  "lxml==6.1.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction_core"]

[tool.uv.sources]
collection-contracts = { workspace = true }
