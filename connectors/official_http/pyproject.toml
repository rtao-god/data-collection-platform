[project]
name = "official-http-connector"
version = "0.1.0"
description = "Strict official-website HTTP acquisition contracts and one-shot Scrapy adapter"
requires-python = ">=3.13,<3.14"
dependencies = [
  "source-connector-sdk",
  "defusedxml==0.7.1",
  "pydantic==2.13.4",
  "scrapy==2.17.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/official_http"]

[tool.uv.sources]
source-connector-sdk = { workspace = true }
