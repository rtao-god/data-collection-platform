[project]
name = "wikidata-studios-connector"
version = "0.1.0"
description = "Strict Wikidata entity source records for the recording-services market"
requires-python = ">=3.13,<3.14"
dependencies = ["collection-contracts"]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikidata_studios"]

[tool.uv.sources]
collection-contracts = { workspace = true }
