[project]
name = "osm-overpass-connector"
version = "0.1.0"
description = "Strict OpenStreetMap Overpass query and observation contracts"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx==0.28.1"]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_overpass"]
