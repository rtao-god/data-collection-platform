[project]
name = "wikidata-worker"
version = "0.1.0"
description = "Capability-isolated Wikidata entity acquisition worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-contracts",
  "source-connector-sdk",
  "wikidata-studios-connector",
]

[project.scripts]
wikidata-worker = "wikidata_worker.app:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikidata_worker"]

[tool.uv.sources]
collection-contracts = { workspace = true }
source-connector-sdk = { workspace = true }
wikidata-studios-connector = { workspace = true }
