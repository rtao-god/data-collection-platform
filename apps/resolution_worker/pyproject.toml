[project]
name = "resolution-worker"
version = "0.1.0"
description = "Capability-isolated deterministic entity resolution and quality worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "entity-resolution-core",
  "quality-core",
  "resolution-contracts",
  "source-connector-sdk",
]

[project.scripts]
resolution-worker = "resolution_worker.app:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolution_worker"]

[tool.uv.sources]
entity-resolution-core = { workspace = true }
quality-core = { workspace = true }
resolution-contracts = { workspace = true }
source-connector-sdk = { workspace = true }
