[project]
name = "http-worker"
version = "0.1.0"
description = "Capability-isolated official website HTTP acquisition worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "official-http-connector",
  "source-connector-sdk",
]

[project.scripts]
http-worker = "http_worker.app:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/http_worker"]

[tool.uv.sources]
official-http-connector = { workspace = true }
source-connector-sdk = { workspace = true }
