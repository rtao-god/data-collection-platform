[project]
name = "collection-migration"
version = "0.1.0"
description = "Explicit database migration command for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-contracts",
  "collection-infrastructure",
]

[project.scripts]
collection-migrate = "collection_migration.__main__:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collection_migration"]

[tool.uv.sources]
collection-contracts = { workspace = true }
collection-infrastructure = { workspace = true }
