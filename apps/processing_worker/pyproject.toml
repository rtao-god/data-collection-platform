[project]
name = "processing-worker"
version = "0.1.0"
description = "Capability-isolated extraction and normalization worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-contracts",
  "extraction-core",
  "normalization-core",
  "pydantic==2.13.4",
  "source-connector-sdk",
]

[project.scripts]
processing-worker = "processing_worker.app:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processing_worker"]

[tool.uv.sources]
collection-contracts = { workspace = true }
extraction-core = { workspace = true }
normalization-core = { workspace = true }
source-connector-sdk = { workspace = true }
