[project]
name = "osm-worker"
version = "0.1.0"
description = "Capability-isolated OSM Overpass acquisition worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "osm-overpass-connector",
  "source-connector-sdk",
]

[project.scripts]
osm-worker = "osm_worker.app:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_worker"]

[tool.uv.sources]
osm-overpass-connector = { workspace = true }
source-connector-sdk = { workspace = true }
