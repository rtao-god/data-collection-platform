[project]
name = "worker-gateway"
version = "0.1.0"
description = "Authenticated worker-facing gateway for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-application",
  "collection-contracts",
  "collection-infrastructure",
  "fastapi",
  "pydantic",
  "sqlalchemy",
  "uvicorn",
]

[project.scripts]
worker-gateway = "worker_gateway.__main__:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_gateway"]

[tool.uv.sources]
collection-application = { workspace = true }
collection-contracts = { workspace = true }
collection-infrastructure = { workspace = true }
