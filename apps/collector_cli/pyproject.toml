[project]
name = "collector-cli"
version = "0.1.0"
description = "Operator CLI for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-application",
  "collection-contracts",
  "collection-infrastructure",
  "boto3==1.43.54",
  "sqlalchemy==2.0.51",
]

[project.scripts]
collector = "collector_cli.__main__:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector_cli"]

[tool.uv.sources]
collection-application = { workspace = true }
collection-contracts = { workspace = true }
collection-infrastructure = { workspace = true }
