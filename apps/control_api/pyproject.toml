[project]
name = "control-api"
version = "0.1.0"
description = "Authenticated operator Control API for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-infrastructure",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "review-application",
  "review-contracts",
  "sqlalchemy==2.0.51",
  "uvicorn==0.52.1",
]

[project.scripts]
control-api = "control_api.main:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_api"]

[tool.uv.sources]
collection-infrastructure = { workspace = true }
review-application = { workspace = true }
review-contracts = { workspace = true }
