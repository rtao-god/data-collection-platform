[project]
name = "collector-dagster-orchestrator"
version = "0.1.0"
description = "Dagster orchestration client for the authenticated Worker Gateway"
requires-python = ">=3.13,<3.14"
dependencies = [
  "collection-contracts",
  "dagster==1.13.30",
  "dagster-webserver==1.13.30",
  "dagster-postgres==0.29.30",
  "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector_orchestrator"]

[tool.uv.sources]
collection-contracts = { workspace = true }
