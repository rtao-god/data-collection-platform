[project]
name = "data-collection-platform-workspace"
version = "0.1.0"
description = "Workspace owner for the Data Collection Platform"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/collector_cli",
  "apps/control_api",
  "apps/http_worker",
  "apps/manual_import_worker",
  "apps/migration",
  "apps/osm_worker",
  "apps/processing_worker",
  "apps/resolution_worker",
  "apps/worker_gateway",
  "connectors/official_http",
  "connectors/osm_overpass",
  "packages/collection_application",
  "packages/collection_contracts",
  "packages/collection_domain",
  "packages/collection_infrastructure",
  "packages/entity_resolution_core",
  "packages/extraction_core",
  "packages/manual_import_core",
  "packages/normalization_core",
  "packages/quality_core",
  "packages/resolution_contracts",
  "packages/review_application",
  "packages/review_contracts",
  "packages/review_core",
  "packages/source_connector_sdk",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]==1.43.54",
  "defusedxml==0.7.1",
  "shapely==2.1.2",
  "types-shapely==2.1.0.20260630",
  "httpx",
  "mypy==2.3.0",
  "pytest==9.0.2",
  "ruff==0.16.1",
  "types-pyyaml==6.0.12.20260518",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = [
  "apps",
  "connectors",
  "database",
  "packages",
  "tools",
]
markers = [
  "integration: requires explicit PostgreSQL/PostGIS infrastructure",
  "object_store_integration: requires explicit SeaweedFS S3 infrastructure",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [
  "apps/collector_cli/src",
  "apps/control_api/src",
  "apps/http_worker/src",
  "apps/manual_import_worker/src",
  "apps/migration/src",
  "apps/osm_worker/src",
  "apps/processing_worker/src",
  "apps/resolution_worker/src",
  "apps/worker_gateway/src",
  "connectors/official_http/src",
  "connectors/osm_overpass/src",
  "packages/collection_application/src",
  "packages/collection_contracts/src",
  "packages/collection_domain/src",
  "packages/collection_infrastructure/src",
  "packages/entity_resolution_core/src",
  "packages/extraction_core/src",
  "packages/manual_import_core/src",
  "packages/normalization_core/src",
  "packages/quality_core/src",
  "packages/resolution_contracts/src",
  "packages/review_application/src",
  "packages/review_contracts/src",
  "packages/review_core/src",
  "packages/source_connector_sdk/src",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PTH", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tools/git_hooks/configure.py" = ["S404", "S603"]
"tools/git_hooks/pre_commit.py" = ["S404", "S603"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = [
  "(^|/)tests/",
]
files = [
  "apps/collector_cli/src",
  "apps/control_api/src",
  "apps/http_worker/src",
  "apps/manual_import_worker/src",
  "apps/migration/src",
  "apps/osm_worker/src",
  "apps/processing_worker/src",
  "apps/resolution_worker/src",
  "apps/worker_gateway/src",
  "connectors/official_http/src",
  "connectors/osm_overpass/src",
  "packages/collection_application/src",
  "packages/collection_contracts/src",
  "packages/collection_domain/src",
  "packages/collection_infrastructure/src",
  "packages/entity_resolution_core/src",
  "packages/extraction_core/src",
  "packages/manual_import_core/src",
  "packages/normalization_core/src",
  "packages/quality_core/src",
  "packages/resolution_contracts/src",
  "packages/review_application/src",
  "packages/review_contracts/src",
  "packages/review_core/src",
  "packages/source_connector_sdk/src",
  "database",
  "tools",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["extruct", "lxml", "lxml.*", "phonenumbers", "tldextract"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["check_dependencies", "tools.architecture_checks.check_dependencies"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true
