  - live_room
  - approximate_room_area
  - drum_recording
  - grand_piano
  - analog_equipment
  - engineer_included
  - production
  - mixing
  - mastering
  - podcast
  - voice_over_adr
  - supported_languages
  - parking
  - public_transport_note
  - website
  - email
  - phone
  - whatsapp
  - instagram
  - google_maps_reference
  - yandex_maps_reference
  - source_verification_level
prohibited_fields:
  - review_text
  - review_author
  - source_photo
