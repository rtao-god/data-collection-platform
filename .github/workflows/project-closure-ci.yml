name: Project End-to-End Closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/project-closure-ci.yml
  workflow_run:
    workflows:
      - Operational E2E
      - Berlin Bounded Live Collection
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: data-collection-platform-project-closure
  cancel-in-progress: false

jobs:
  close:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 5

      - name: Validate production inventory and immutable proofs
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            apps/review_web/package-lock.json
            apps/browser_worker/pyproject.toml
            packages/export_core/src/export_core/service.py
            apps/retention_job/pyproject.toml
            apps/orchestrator/pyproject.toml
            tools/operations/backup_restore.py
            deploy/compose/application.yaml
            docs/proofs/end-to-end-operational-ci.md
            campaigns/berlin_recording_services/geography/berlin-boundary.geojson
            campaigns/berlin_recording_services/geography/berlin-boundary.provenance.json
            campaigns/berlin_recording_services/source-inputs.provenance.json
            docs/proofs/berlin-live-collection.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing closure owner: $path" >&2; exit 1; }
          done

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          boundary = Path(
              "campaigns/berlin_recording_services/geography/berlin-boundary.geojson"
          )
          provenance = json.loads(
              Path(
                  "campaigns/berlin_recording_services/geography/"
                  "berlin-boundary.provenance.json"
              ).read_text(encoding="utf-8")
          )
          if provenance.get("authority") != "State of Berlin":
              raise SystemExit("boundary authority is not the State of Berlin")
          observed_boundary = "sha256:" + hashlib.sha256(boundary.read_bytes()).hexdigest()
          if provenance.get("boundaryDigest") != observed_boundary:
              raise SystemExit("boundary digest does not match exact GeoJSON bytes")
          source_url = str(provenance.get("resourceUrl", ""))
          if not source_url.startswith("https://") or ".berlin.de" not in source_url:
              raise SystemExit("boundary provenance does not identify an official HTTPS resource")
          if not provenance.get("licenseIdentifier") and not provenance.get("licenseTitle"):
              raise SystemExit("boundary provenance has no declared license")

          sources = json.loads(
              Path(
                  "campaigns/berlin_recording_services/source-inputs.provenance.json"
              ).read_text(encoding="utf-8")
          )
          if sources.get("automaticSchedulesEnabled") is not False:
              raise SystemExit("live source inputs enable automatic scheduling")
          binding_keys = tuple(str(value).lower() for value in sources.get("bindingKeys", ()))
          if not any("osm" in value for value in binding_keys):
              raise SystemExit("live inputs have no OSM binding")
          if not any(
              "http" in value or "website" in value for value in binding_keys
          ):
              raise SystemExit("live inputs have no official HTTP binding")

          live = json.loads(
              Path("docs/proofs/berlin-live-collection.json").read_text(
                  encoding="utf-8"
              )
          )
          if live.get("contract") != "berlin-live-collection-proof":
              raise SystemExit("live proof contract identity is invalid")
          if live.get("campaignKey") != "berlin_recording_services":
              raise SystemExit("live proof belongs to another campaign")
          if str(live.get("runState", "")).lower() not in {
              "succeeded",
              "completed",
              "sealed",
              "verified",
          }:
              raise SystemExit("live collection run did not terminate successfully")
          evidence = live.get("databaseEvidence")
          if not isinstance(evidence, dict):
              raise SystemExit("live proof has no database evidence")
          for key in (
              "rawArtifacts",
              "succeededWorkUnits",
              "candidateRows",
              "sealedExports",
          ):
              value = evidence.get(key)
              if not isinstance(value, int) or value <= 0:
                  raise SystemExit(f"live proof has no positive {key} evidence")
          if not str(live.get("runId", "")):
              raise SystemExit("live proof has no run identity")
          if not str(live.get("exportId", "")):
              raise SystemExit("live proof has no sealed export identity")
          coverage = live.get("coverage")
          if not isinstance(coverage, dict):
              raise SystemExit("live proof has no coverage object")
          coverage_text = json.dumps(coverage, sort_keys=True).lower()
          if any(
              token in coverage_text
              for token in (
                  '"state": "blocked"',
                  '"state":"blocked"',
                  '"status": "blocked"',
                  '"status":"blocked"',
                  '"dead_letter"',
              )
          ):
              raise SystemExit("live coverage contains blocked or dead-letter state")
          PY

          current_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          runs="$(curl -fsSL "${headers[@]}" "$api/actions/runs?branch=main&per_page=100")"
          verify_id="$(
            jq -r --arg current "$current_sha" --arg parent "$parent_sha" '
              .workflow_runs[]
              | select(.name == "Verify")
              | select(.status == "completed" and .conclusion == "success")
              | select(.head_sha == $current or .head_sha == $parent)
              | .id
            ' <<<"$runs" | head -1
          )"
          operational_id="$(
            jq -r '
              .workflow_runs[]
              | select(.name == "Operational E2E")
              | select(.status == "completed" and .conclusion == "success")
              | .id
            ' <<<"$runs" | head -1
          )"
          live_id="$(
            jq -r '
              .workflow_runs[]
              | select(.name == "Berlin Bounded Live Collection")
              | select(.status == "completed" and .conclusion == "success")
              | .id
            ' <<<"$runs" | head -1
          )"
          test -n "$verify_id" || { echo 'no successful exact-head Verify run' >&2; exit 1; }
          test -n "$operational_id" || { echo 'no successful Operational E2E run' >&2; exit 1; }
          test -n "$live_id" || { echo 'no successful Berlin bounded live run' >&2; exit 1; }
          echo "verify_id=$verify_id" >> "$GITHUB_OUTPUT"
          echo "operational_id=$operational_id" >> "$GITHUB_OUTPUT"
          echo "live_id=$live_id" >> "$GITHUB_OUTPUT"
          echo "subject_sha=$current_sha" >> "$GITHUB_OUTPUT"

      - name: Record project closure proof
        env:
          SUBJECT_SHA: ${{ steps.proof.outputs.subject_sha }}
          VERIFY_ID: ${{ steps.proof.outputs.verify_id }}
          OPERATIONAL_ID: ${{ steps.proof.outputs.operational_id }}
          LIVE_ID: ${{ steps.proof.outputs.live_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          live = json.loads(
              Path("docs/proofs/berlin-live-collection.json").read_text(
                  encoding="utf-8"
              )
          )
          evidence = live["databaseEvidence"]
          lines = [
              "# Data Collection Platform — end-to-end closure proof",
              "",
              "- Status: **closed**",
              f"- Subject commit: `{os.environ['SUBJECT_SHA']}`",
              f"- Permanent Verify run: `{os.environ['VERIFY_ID']}`",
              f"- Operational E2E run: `{os.environ['OPERATIONAL_ID']}`",
              f"- Berlin bounded live run: `{os.environ['LIVE_ID']}`",
              f"- Collection run: `{live['runId']}`",
              f"- Sealed export: `{live['exportId']}`",
              f"- Raw artifacts: `{evidence['rawArtifacts']}`",
              f"- Succeeded work units: `{evidence['succeededWorkUnits']}`",
              f"- Candidate rows: `{evidence['candidateRows']}`",
              f"- Sealed exports: `{evidence['sealedExports']}`",
              "",
              "The exact Berlin campaign executed through the production runtime using an",
              "authoritative licensed State of Berlin boundary, bounded OSM and official-HTTP",
              "source inputs, immutable raw Object Store artifacts, PostgreSQL lineage,",
              "pipeline processing, candidate materialization, and deterministic sealed export.",
              "",
              "The proof does not grant automatic recurring collection. Source schedules remain",
              "disabled until an operator explicitly approves production scheduling.",
          ]
          Path("docs/proofs/project-end-to-end-closure.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          git add docs/proofs/project-end-to-end-closure.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Closure proof is already current.'
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Proofs): close data collection platform E2E"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
