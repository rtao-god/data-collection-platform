name: Apply Run Control

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-run-control.yml

permissions:
  contents: read

concurrency:
  group: data-collection-platform-run-control-apply
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply and normalize tracked owner changes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/apply/run-control.patch.gz.b64 \
            | gzip --decompress > /tmp/run-control.patch
          echo "e69d6123093240b0910038dc1a8158cef29e422f6bd7ad350639672d17542a9a  /tmp/run-control.patch" \
            | sha256sum --check
          git apply --index --3way /tmp/run-control.patch
          uv sync --frozen --all-packages --dev
          uv run ruff format apps contracts database packages tools
          uv run ruff check apps contracts database packages tools --fix
          git diff --cached --check

      - name: Package exact applied source
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary HEAD > /tmp/run-control-applied.patch
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=.github/apply \
            --exclude=.github/workflows/apply-run-control.yml \
            -czf /tmp/run-control-applied-source.tar.gz .
          sha256sum /tmp/run-control-applied.patch /tmp/run-control-applied-source.tar.gz \
            > /tmp/run-control-applied.sha256

      - name: Upload applied source
        uses: actions/upload-artifact@v7
        with:
          name: run-control-applied-source
          path: |
            /tmp/run-control-applied.patch
            /tmp/run-control-applied-source.tar.gz
            /tmp/run-control-applied.sha256
          if-no-files-found: error
          retention-days: 1
