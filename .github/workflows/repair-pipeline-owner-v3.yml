name: Repair Pipeline Advancement Owner V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-pipeline-owner-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-pipeline-owner-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - name: Check out complete main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Rehydrate deterministic repair source
        shell: bash
        run: |
          set -euo pipefail
          repair_commit="$(git log --all --format=%H \
            --grep='^Build (Pipeline): stage production owner repair script$' -1)"
          test -n "$repair_commit"
          git show "$repair_commit:.github/repair_pipeline_owner_v2.py" \
            > "$RUNNER_TEMP/repair_pipeline_owner.py"
          python "$RUNNER_TEMP/repair_pipeline_owner.py"

      - name: Restore frozen workspace
        run: uv sync --frozen --all-packages --dev

      - name: Normalize repaired owner
        shell: bash
        run: |
          set -euo pipefail
          files=(
            database/migrations/versions/20260815_0013_pipeline_advancement.py
            database/tests/test_pipeline_advancement_schema.py
            packages/collection_application/tests/test_pipeline_supervision.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check --fix --unsafe-fixes "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"

      - name: Prove focused pipeline behavior
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            packages/collection_application/tests/test_pipeline_advancement.py \
            packages/collection_application/tests/test_pipeline_supervision.py \
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py \
            packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py \
            packages/collection_infrastructure/tests/test_pipeline_run_control.py \
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py \
            database/tests/test_pipeline_advancement_schema.py

      - name: Prove repository baseline
        shell: bash
        run: |
          set -euo pipefail
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py --check
          fi
          uv run python -m compileall -q apps connectors database packages tools

      - name: Prove fresh PostgreSQL/PostGIS state
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -q -m integration database/tests

      - name: Commit production files only
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/repair_pipeline_owner_v2.py; then
            git rm .github/repair_pipeline_owner_v2.py
          fi
          git add \
            database/migrations/versions/20260815_0013_pipeline_advancement.py \
            database/tests/test_pipeline_advancement_schema.py \
            packages/collection_application/tests/test_pipeline_supervision.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py \
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py \
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Pipeline): align advancement with canonical storage"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
