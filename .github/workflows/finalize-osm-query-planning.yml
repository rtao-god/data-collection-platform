name: Finalize OSM Query Planning

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-osm-query-planning.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Complete the planner owner surface
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          init_path = root / "connectors/osm_overpass/src/osm_overpass/__init__.py"
          init = init_path.read_text(encoding="utf-8")
          if "from osm_overpass.planning import" not in init:
              marker = "from osm_overpass.query import"
              if marker not in init:
                  raise RuntimeError("OSM query import marker not found")
              block = (
                  "from osm_overpass.planning import (\n"
                  "    OverpassPlannedQuery,\n"
                  "    OverpassQueryPlan,\n"
                  "    plan_overpass_queries,\n"
                  ")\n"
              )
              init = init.replace(marker, block + marker, 1)
          for name in (
              "OverpassPlannedQuery",
              "OverpassQueryPlan",
              "plan_overpass_queries",
          ):
              entry = f'    "{name}",\n'
              if entry not in init:
                  marker = '    "build_overpass_query",\n'
                  if marker not in init:
                      raise RuntimeError("OSM query export marker not found")
                  init = init.replace(marker, entry + marker, 1)
          init_path.write_text(init, encoding="utf-8")

          module_path = root / ".codex/modules/osm-overpass.md"
          module = module_path.read_text(encoding="utf-8")
          planning = (
              "\nQuery planning is a pure deterministic owner:\n\n"
              "- partitions sorted allowlisted filters into bounded query artifacts;\n"
              "- emits only `osm-overpass-query/1` documents accepted by the worker;\n"
              "- assigns contiguous positions and SHA-256 identities;\n"
              "- contains no endpoint, Worker Gateway, campaign name, or city taxonomy.\n"
          )
          if "Query planning is a pure deterministic owner" not in module:
              module = module.rstrip() + planning
          module_path.write_text(module, encoding="utf-8")

          status_path = root / "docs/implementation-status.md"
          status = status_path.read_text(encoding="utf-8")
          if "| OSM query planning |" not in status:
              marker = "| OSM Overpass contracts |"
              index = status.find(marker)
              if index < 0:
                  raise RuntimeError("OSM contract status marker not found")
              line_end = status.find("\n", index) + 1
              row = (
                  "| OSM query planning | Deterministic filter partitioning, "
                  "versioned query-spec artifacts, contiguous work positions, and "
                  "stable query/plan digests |\n"
              )
              status = status[:line_end] + row + status[line_end:]
          status_path.write_text(status, encoding="utf-8")
          PY

      - name: Remove temporary tooling and format
        run: |
          find .codex -maxdepth 1 -type f -name '*.py' -delete
          find .codex -maxdepth 1 -type f -name 'ci-trigger-*' -delete
          find .codex -maxdepth 1 -type f -name 'push-files-schema-probe*' -delete
          find .github/workflows -maxdepth 1 -type f -name '*.yml' \
            ! -name 'ci.yml' \
            ! -name 'finalize-osm-query-planning.yml' \
            -delete
          uv run ruff format .
          uv run ruff check --fix .

      - name: Verify the pure planning owner
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration and not object_store_integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps packages connectors

      - name: Commit the verified planner
        run: |
          rm .github/workflows/finalize-osm-query-planning.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Feature (OSM Planning): add deterministic query artifacts'
          git push origin HEAD:main
