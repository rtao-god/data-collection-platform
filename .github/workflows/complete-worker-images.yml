name: Complete Isolated Worker Images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/complete-worker-images.yml

permissions:
  contents: write

concurrency:
  group: complete-worker-images-main
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 3

      - name: Require reconciled permanent baseline
        run: test -f docs/proofs/reconciled-baseline-ci.md

      - name: Add capability-minimal OSM image
        run: |
          cat > deploy/docker/osm-worker.Dockerfile <<'EOF'
          FROM python:3.13.14-slim AS build

          COPY --from=ghcr.io/astral-sh/uv:0.10.0 /uv /uvx /bin/
          WORKDIR /app

          ENV UV_COMPILE_BYTECODE=1 \
              UV_LINK_MODE=copy

          COPY . .
          RUN uv sync \
              --frozen \
              --package osm-worker \
              --no-dev \
              --no-editable

          FROM python:3.13.14-slim AS runtime

          RUN useradd --uid 10001 --create-home worker
          WORKDIR /app

          COPY --from=build /app/.venv /app/.venv

          ENV PATH="/app/.venv/bin:${PATH}" \
              PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1

          USER 10001
          ENTRYPOINT ["python", "-m", "osm_worker"]
          EOF

      - name: Extend permanent worker image gates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          marker = '\n  migration:\n'
          if marker not in text:
              raise RuntimeError('CI migration job anchor is missing')
          if 'Build OSM Worker image' in text:
              raise RuntimeError('OSM worker CI gates already exist')
          steps = r'''
                - name: Build Manual Import Worker image
                  run: docker build -f deploy/docker/manual-import-worker.Dockerfile -t data-collection-platform/manual-import-worker:verify .

                - name: Verify Manual Import Worker capability inventory
                  run: |
                    docker run --rm --entrypoint python data-collection-platform/manual-import-worker:verify -c '
                    import importlib.util
                    required = ("manual_import_worker", "manual_import_core", "source_connector_sdk")
                    forbidden = ("alembic", "boto3", "botocore", "playwright", "psycopg", "scrapy", "sqlalchemy")
                    missing = [name for name in required if importlib.util.find_spec(name) is None]
                    present = [name for name in forbidden if importlib.util.find_spec(name) is not None]
                    assert not missing, f"missing required modules: {missing}"
                    assert not present, f"forbidden modules present: {present}"
                    '

                - name: Build OSM Worker image
                  run: docker build -f deploy/docker/osm-worker.Dockerfile -t data-collection-platform/osm-worker:verify .

                - name: Verify OSM Worker capability inventory
                  run: |
                    docker run --rm --entrypoint python data-collection-platform/osm-worker:verify -c '
                    import importlib.util
                    required = ("osm_worker", "osm_overpass", "source_connector_sdk")
                    forbidden = ("alembic", "boto3", "botocore", "playwright", "psycopg", "scrapy", "sqlalchemy")
                    missing = [name for name in required if importlib.util.find_spec(name) is None]
                    present = [name for name in forbidden if importlib.util.find_spec(name) is not None]
                    assert not missing, f"missing required modules: {missing}"
                    assert not present, f"forbidden modules present: {present}"
                    '
          '''
          text = text.replace(marker, '\n' + steps + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify source and worker images
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          docker build -f deploy/docker/manual-import-worker.Dockerfile -t data-collection-platform/manual-import-worker:verify .
          docker run --rm --entrypoint python data-collection-platform/manual-import-worker:verify -c '
          import importlib.util
          required = ("manual_import_worker", "manual_import_core", "source_connector_sdk")
          forbidden = ("alembic", "boto3", "botocore", "playwright", "psycopg", "scrapy", "sqlalchemy")
          assert not [name for name in required if importlib.util.find_spec(name) is None]
          assert not [name for name in forbidden if importlib.util.find_spec(name) is not None]
          '
          docker build -f deploy/docker/osm-worker.Dockerfile -t data-collection-platform/osm-worker:verify .
          docker run --rm --entrypoint python data-collection-platform/osm-worker:verify -c '
          import importlib.util
          required = ("osm_worker", "osm_overpass", "source_connector_sdk")
          forbidden = ("alembic", "boto3", "botocore", "playwright", "psycopg", "scrapy", "sqlalchemy")
          assert not [name for name in required if importlib.util.find_spec(name) is None]
          assert not [name for name in forbidden if importlib.util.find_spec(name) is not None]
          '

      - name: Commit isolated worker images
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 | xargs -0 -r git rm -f
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          git commit -m 'Build (Workers): prove isolated runtime images'
          git push origin HEAD:main

      - name: Remove failed worker automation
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 | xargs -0 -r git rm -f
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Build (Workers): remove failed image automation'
            git push origin HEAD:main
          fi
          exit 1
