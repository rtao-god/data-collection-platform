name: Operational Chain Controller V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/operational-chain-controller-v2.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-operational-chain-controller-v2
  cancel-in-progress: false

jobs:
  drive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Drive exact repository state to operational closure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          exists() {
            [[ "$(curl -sS -o /dev/null -w '%{http_code}' "${headers[@]}" "$api/contents/$1?ref=main")" == 200 ]]
          }
          dispatch_wait() {
            local workflow="$1"
            local started
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Dispatching $workflow"
            curl -fsSL -X POST "${headers[@]}" "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
            for _ in $(seq 1 1080); do
              payload="$(curl -fsSL "${headers[@]}" \
                "$api/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=50")"
              run_id="$(jq -r --arg started "$started" \
                '.workflow_runs[] | select(.created_at >= $started) | .id' <<<"$payload" | head -1)"
              status="$(jq -r --arg started "$started" \
                '.workflow_runs[] | select(.created_at >= $started) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg started "$started" \
                '.workflow_runs[] | select(.created_at >= $started) | .conclusion' <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == completed ]]; then
                echo "$workflow completed as $conclusion in $run_id"
                [[ "$conclusion" == success ]]
                return
              fi
              sleep 5
            done
            return 1
          }
          wait_for_diagnostic() {
            local path="$1"
            for _ in $(seq 1 120); do exists "$path" && return 0; sleep 5; done
            return 1
          }

          for iteration in $(seq 1 30); do
            echo "Controller iteration $iteration"
            if exists docs/proofs/end-to-end-operational-ci.md; then
              git fetch origin main
              git reset --hard origin/main
              git rm -f --ignore-unmatch \
                .github/workflows/operational-chain-controller.yml \
                .github/workflows/operational-chain-controller-v2.yml \
                .github/workflows/resume-operational-chain-from-diagnostic.yml \
                .github/workflows/continue-review-after-pipeline-recovery.yml \
                .github/workflows/capture-operational-controller-failure.yml \
                .github/workflows/capture-operational-chain-failure.yml
              rm -f docs/diagnostics/operational-chain-controller.md
              git add -A .github/workflows docs/diagnostics
              if ! git diff --cached --quiet; then
                git config user.name rtao-god
                git config user.email rtaogod@gmail.com
                git commit -m 'Build (Tooling): remove completed operational controllers'
                git push origin HEAD:main
              fi
              exit 0
            fi

            if ! exists apps/pipeline_supervisor/pyproject.toml; then
              if exists docs/diagnostics/pipeline-foundation-v8.md; then
                workflow=reconcile-pipeline-foundation-v9.yml
              elif exists docs/diagnostics/pipeline-foundation-v7.md; then
                workflow=reconcile-pipeline-foundation-v8.yml
              elif exists docs/diagnostics/reconcile-pipeline-foundation-v6.md; then
                workflow=reconcile-pipeline-foundation-v7.yml
              elif exists docs/diagnostics/pipeline-foundation-v5.md; then
                workflow=reconcile-pipeline-foundation-v6.yml
              else
                workflow=reconcile-pipeline-foundation-v5.yml
              fi
              dispatch_wait "$workflow" || {
                case "$workflow" in
                  reconcile-pipeline-foundation-v5.yml) wait_for_diagnostic docs/diagnostics/pipeline-foundation-v5.md ;;
                  reconcile-pipeline-foundation-v6.yml) wait_for_diagnostic docs/diagnostics/reconcile-pipeline-foundation-v6.md ;;
                  reconcile-pipeline-foundation-v7.yml) wait_for_diagnostic docs/diagnostics/pipeline-foundation-v7.md ;;
                  reconcile-pipeline-foundation-v8.yml) wait_for_diagnostic docs/diagnostics/pipeline-foundation-v8.md ;;
                  reconcile-pipeline-foundation-v9.yml) wait_for_diagnostic docs/diagnostics/pipeline-foundation-v9.md ;;
                esac
              }
              continue
            fi

            if ! exists apps/review_web/package-lock.json; then
              if exists docs/diagnostics/materialize-review-web-after-pipeline.md; then
                workflow=repair-review-web-from-diagnostic.yml
              else
                workflow=materialize-review-web-after-pipeline.yml
              fi
              dispatch_wait "$workflow" || wait_for_diagnostic docs/diagnostics/materialize-review-web-after-pipeline.md
              continue
            fi

            if ! exists apps/browser_worker/pyproject.toml; then
              if exists docs/diagnostics/materialize-browser-worker-after-review.md; then
                workflow=repair-browser-worker-from-diagnostic.yml
              else
                workflow=materialize-browser-worker-after-review.yml
              fi
              dispatch_wait "$workflow" || wait_for_diagnostic docs/diagnostics/materialize-browser-worker-after-review.md
              continue
            fi

            if ! exists packages/export_core/src/export_core/service.py; then
              if exists docs/diagnostics/materialize-sealed-export-after-browser.md; then
                workflow=repair-sealed-export-from-diagnostic.yml
              else
                workflow=materialize-sealed-export-after-browser.yml
              fi
              dispatch_wait "$workflow" || wait_for_diagnostic docs/diagnostics/materialize-sealed-export-after-browser.md
              continue
            fi

            if ! exists apps/retention_job/pyproject.toml \
                || ! exists apps/orchestrator/pyproject.toml \
                || ! exists tools/operations/backup_restore.py \
                || ! exists deploy/compose/application.yaml; then
              if exists docs/diagnostics/materialize-operations-after-export.md; then
                workflow=repair-operations-from-diagnostic.yml
              else
                workflow=materialize-operations-after-export.yml
              fi
              dispatch_wait "$workflow" || wait_for_diagnostic docs/diagnostics/materialize-operations-after-export.md
              continue
            fi

            dispatch_wait close-operational-e2e-after-operations.yml || \
              wait_for_diagnostic docs/diagnostics/close-operational-e2e-after-operations.md
          done
          echo 'Diagnostic-aware controller exhausted its bounded iterations.' >&2
          exit 1
