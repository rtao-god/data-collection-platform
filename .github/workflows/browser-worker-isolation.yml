name: Browser Worker Isolation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/browser-worker-isolation.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - apps/browser_worker/**
      - packages/source_connector_sdk/**
      - deploy/docker/browser-worker.Dockerfile
  pull_request:
    paths:
      - .github/workflows/browser-worker-isolation.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - apps/browser_worker/**
      - packages/source_connector_sdk/**
      - deploy/docker/browser-worker.Dockerfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect browser worker owner
        id: owner
        shell: bash
        run: |
          if test -f apps/browser_worker/pyproject.toml && test -f deploy/docker/browser-worker.Dockerfile; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build capability-minimal browser image
        if: steps.owner.outputs.present == 'true'
        run: docker build --tag data-collection-platform/browser-worker:ci --file deploy/docker/browser-worker.Dockerfile .

      - name: Verify runtime identity and credential inventory
        if: steps.owner.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image=data-collection-platform/browser-worker:ci
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image")" = "browser-worker"
          if docker image inspect --format '{{json .Config.Env}}' "$image" \
              | grep -Eiq 'DATABASE|POSTGRES|PSYCOPG|S3_ACCESS|S3_SECRET|AWS_SECRET'; then
            echo "Browser worker image contains a forbidden credential environment surface" >&2
            exit 1
          fi

      - name: Verify browser capability and forbidden modules
        if: steps.owner.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --entrypoint python \
            data-collection-platform/browser-worker:ci \
            - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          import_module("browser_worker")
          import_module("source_connector_sdk")
          import_module("playwright")

          forbidden = {
              "alembic",
              "boto3",
              "botocore",
              "psycopg",
              "scrapy",
              "sqlalchemy",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit(
                  "browser image contains forbidden dependencies: " + ", ".join(present)
              )
          PY
