name: Browser Worker Isolation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/browser-worker-isolation.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - apps/browser_worker/**
      - connectors/playwright_browser/**
      - packages/browser_contracts/**
      - packages/browser_security/**
      - packages/collection_contracts/**
      - packages/source_connector_sdk/**
      - database/migrations/versions/20260814_0010_browser_fetch_capability.py
      - database/tests/test_browser_fetch_capability.py
      - deploy/docker/browser-worker.Dockerfile
      - deploy/docker/http-worker.Dockerfile
  pull_request:
    paths:
      - .github/workflows/browser-worker-isolation.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - apps/browser_worker/**
      - connectors/playwright_browser/**
      - packages/browser_contracts/**
      - packages/browser_security/**
      - packages/collection_contracts/**
      - packages/source_connector_sdk/**
      - database/migrations/versions/20260814_0010_browser_fetch_capability.py
      - database/tests/test_browser_fetch_capability.py
      - deploy/docker/browser-worker.Dockerfile
      - deploy/docker/http-worker.Dockerfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-worker:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build capability-minimal browser image
        run: >-
          docker build
          --tag data-collection-platform/browser-worker:ci
          --file deploy/docker/browser-worker.Dockerfile
          .

      - name: Verify runtime identity, entrypoint, and sandbox policy
        shell: bash
        run: |
          set -euo pipefail
          image="data-collection-platform/browser-worker:ci"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image")" = "browser-worker"
          if grep -R -n -E -- '--no-sandbox|--disable-setuid-sandbox|--disable-sandbox' \
            apps/browser_worker/src \
            connectors/playwright_browser/src \
            deploy/docker/browser-worker.Dockerfile; then
            echo "browser production owner disables Chromium sandbox" >&2
            exit 1
          fi

      - name: Verify required and forbidden runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --entrypoint python \
            data-collection-platform/browser-worker:ci \
            - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          for module in (
              "browser_contracts",
              "browser_security",
              "browser_worker",
              "playwright",
              "playwright_browser",
              "source_connector_sdk",
          ):
              import_module(module)

          forbidden = {
              "alembic",
              "boto3",
              "botocore",
              "collection_infrastructure",
              "entity_resolution_core",
              "extraction_core",
              "official_http",
              "psycopg",
              "review_infrastructure",
              "scrapy",
              "sqlalchemy",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit(
                  "browser image contains forbidden owners: " + ", ".join(present)
              )
          PY

      - name: Run non-root Chromium fixture and cross-task cookie proof
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --ipc=host -i \
            --entrypoint python \
            data-collection-platform/browser-worker:ci \
            - <<'PY'
          import threading
          from datetime import UTC, datetime, timedelta
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from uuid import uuid4

          from browser_contracts import BrowserAcquisitionRequest, canonical_digest
          from playwright_browser import PlaywrightBrowserExecutor

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  pages = {
                      "/render": (
                          "<html><body><main></main><script>"
                          "document.querySelector('main').textContent='browser proof ok'"
                          "</script></body></html>"
                      ),
                      "/cookie-set": (
                          "<html><body><script>document.cookie='task=first; path=/';"
                          "document.body.textContent='set'</script></body></html>"
                      ),
                      "/cookie-read": (
                          "<html><body><script>document.body.textContent=document.cookie"
                          "</script></body></html>"
                      ),
                      "/blocked": (
                          "<html><body><script>"
                          "fetch('http://blocked.test/private').catch(() => {})"
                          "</script>base</body></html>"
                      ),
                  }
                  body = pages.get(self.path)
                  if body is None:
                      self.send_response(404)
                      self.end_headers()
                      return
                  encoded = body.encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "text/html; charset=utf-8")
                  self.send_header("Content-Length", str(len(encoded)))
                  self.end_headers()
                  self.wfile.write(encoded)

              def log_message(self, format, *args):
                  pass

          class Resolver:
              def resolve(self, host, port):
                  if host != "fixture.test" or port <= 0:
                      raise AssertionError("unexpected fixture resolution")
                  return ("93.184.216.34",)

          def request(port, path):
              target = f"http://fixture.test:{port}{path}"
              now = datetime.now(UTC)
              expires = now + timedelta(hours=1)
              authorization = {
                  "authorizationId": str(uuid4()),
                  "action": "browser_fetch",
                  "reason": "javascript_required",
                  "actorReference": "browser-ci-proof",
                  "issuedAtUtc": now.isoformat(),
                  "expiresAtUtc": expires.isoformat(),
                  "targetUrl": target,
                  "sourceKey": "fixture_source",
                  "sourcePolicyDigest": "sha256:" + "a" * 64,
                  "robotsDecisionDigest": "sha256:" + "b" * 64,
                  "robotsAllowed": True,
              }
              authorization["authorizationDigest"] = canonical_digest(
                  {
                      "action": "browser_fetch",
                      "actorReference": "browser-ci-proof",
                      "authorizationId": authorization["authorizationId"],
                      "expiresAtUtc": expires.isoformat().replace("+00:00", "Z"),
                      "issuedAtUtc": now.isoformat().replace("+00:00", "Z"),
                      "reason": "javascript_required",
                      "robotsAllowed": True,
                      "robotsDecisionDigest": authorization["robotsDecisionDigest"],
                      "sourceKey": "fixture_source",
                      "sourcePolicyDigest": authorization["sourcePolicyDigest"],
                      "targetUrl": target,
                  }
              )
              return BrowserAcquisitionRequest.model_validate(
                  {
                      "contract": "browser-acquisition-request",
                      "contractRevision": "browser-acquisition-request-v1",
                      "requestId": str(uuid4()),
                      "sourceKey": "fixture_source",
                      "sourcePolicyDigest": "sha256:" + "a" * 64,
                      "targetUrl": target,
                      "policy": {
                          "allowedOrigins": [
                              {"scheme": "http", "host": "fixture.test", "port": port}
                          ],
                          "allowedResourceTypes": ["document", "fetch", "script"],
                          "waitUntil": "load",
                          "navigationTimeoutMilliseconds": 30000,
                          "postLoadWaitMilliseconds": 200,
                          "maximumRequests": 50,
                          "maximumRedirects": 2,
                          "maximumDnsAddresses": 4,
                          "maximumRenderedDocumentBytes": 1048576,
                          "maximumBlockedDiagnostics": 10,
                      },
                      "authorization": authorization,
                  }
              )

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          port = int(server.server_address[1])
          executor = PlaywrightBrowserExecutor(
              Resolver(),
              launch_args=(
                  "--host-resolver-rules=MAP fixture.test 127.0.0.1",
              ),
          )
          try:
              rendered = executor.execute(request(port, "/render"))
              blocked = executor.execute(request(port, "/blocked"))
              executor.execute(request(port, "/cookie-set"))
              cookie_read = executor.execute(request(port, "/cookie-read"))
          finally:
              executor.close()
              server.shutdown()
              server.server_close()
              thread.join(timeout=5)

          if b"browser proof ok" not in rendered.rendered_document:
              raise SystemExit("Chromium did not execute fixture JavaScript")
          if blocked.blocked_request_count < 1:
              raise SystemExit("unapproved browser subresource was not blocked")
          if b"task=first" in cookie_read.rendered_document:
              raise SystemExit("browser cookie crossed task context boundary")
          PY

  http-worker-negative:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build ordinary HTTP worker image
        run: >-
          docker build
          --tag data-collection-platform/http-worker:browser-negative
          --file deploy/docker/http-worker.Dockerfile
          .

      - name: Verify HTTP worker has no browser ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --entrypoint python \
            data-collection-platform/http-worker:browser-negative \
            - <<'PY'
          from importlib.util import find_spec

          forbidden = {
              "browser_contracts",
              "browser_security",
              "browser_worker",
              "playwright",
              "playwright_browser",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit(
                  "HTTP worker image contains browser ownership: " + ", ".join(present)
              )
          PY
