name: Reconcile Worker Lease

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-worker-lease.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete exact accidental branch probes
        run: |
          for branch in \
            __schema_probe_should_not_create \
            __do_not_create \
            __cleanup_test \
            __cleanup_test_2; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Reapply bounded owner batch from Git history
        run: |
          script_commit="$(git log -n 1 --format=%H -- tools/apply_worker_lease_batch.py)"
          test -n "$script_commit"
          git show "${script_commit}:tools/apply_worker_lease_batch.py" > /tmp/apply_worker_lease_batch.py
          uv run python /tmp/apply_worker_lease_batch.py
          uv run python - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/work_engine.py"
          )
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from typing import Self, cast",
              "from typing import Any, Self, cast",
          )
          text = text.replace("Mapping[str, object]", "Mapping[str, Any]")
          path.write_text(text, encoding="utf-8")
          PY
          rm -f \
            tools/apply_worker_lease_batch.py \
            tools/apply_run_admission_batch.py \
            .github/workflows/apply-worker-lease.yml \
            .github/workflows/reconcile-worker-lease.yml \
            .github/workflows/cleanup-worker-lease-executor.yml \
            .github/workflows/apply-run-admission.yml \
            .github/workflows/repair-current-ci.yml \
            .github/workflows/cleanup-accidental-branches.yml \
            .github/workflows/consolidate-current-ci.yml \
            .github/workflows/finalize-one-shot-writers.yml
          uv run ruff check --fix .
          uv run ruff format .

      - name: Verify complete repository
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps database packages tools
          uv run collector config validate berlin_recording_services
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build --file deploy/docker/collector-cli.Dockerfile .
          docker build --file deploy/docker/migration.Dockerfile .

      - name: Commit verified operational WorkEngine
        run: |
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add -A
          git commit -m "Feat (Work Engine): own operational lease transactions" \
            -m "Owner layer: WorkEngine application port and PostgreSQL control-plane adapter." \
            -m "Root cause: durable work rows had no atomic owner for worker registration, source permits, SKIP LOCKED claims, heartbeat renewal, outcomes, retry/dead-letter, release, or crash expiry." \
            -m "Replacement: remove topology creation from the operational port and implement exact identity, timing, build, policy, capacity, counter, attempt, and lifecycle transitions in PostgreSQL." \
            -m "Proof target: application boundary tests, fresh migration, claim/completion, source release, retry/expiry dead-letter, stale-token, architecture, images, and the complete permanent gate set."
          git push origin HEAD:main
