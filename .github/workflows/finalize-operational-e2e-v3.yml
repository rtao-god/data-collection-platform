name: Finalize Operational E2E V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-operational-e2e-v3.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-collection-platform-final-serial-closure
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for earlier mutating recovery workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          for _ in $(seq 1 180); do
            payload="$(curl -fsSL "${headers[@]}" "$api/actions/runs?branch=main&per_page=100")"
            active="$(jq -r --arg current "$CURRENT_RUN_ID" '[
              .workflow_runs[]
              | select((.id | tostring) != $current)
              | select(.status == "queued" or .status == "in_progress")
              | select(
                  (.name | startswith("Restore Proven Operational E2E"))
                  or (.name | startswith("Close Recovered Operational E2E"))
              )
            ] | length' <<<"$payload")"
            [[ "$active" == 0 ]] && exit 0
            sleep 5
          done
          echo 'Earlier mutating recovery workflows did not settle.' >&2
          exit 1

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Recover, clean, and prove the exact static subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          current_sha="$(git rev-parse HEAD)"
          proven_sha='9bec95589ee0592a873edbc0548be27707f53af6'
          required=(
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_application/src/collection_application/run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/run_control.py
            apps/pipeline_supervisor/pyproject.toml
            apps/review_web/package-lock.json
            apps/browser_worker/pyproject.toml
            packages/export_core/src/export_core/service.py
            apps/retention_job/pyproject.toml
            apps/orchestrator/pyproject.toml
            tools/operations/backup_restore.py
            deploy/compose/application.yaml
            .github/workflows/ci.yml
            .github/workflows/pipeline-advancement-ci.yml
            .github/workflows/review-web-ci.yml
            .github/workflows/application-compose-ci.yml
            .github/workflows/vertical-data-flow-e2e.yml
            .github/workflows/browser-worker-isolation.yml
            .github/workflows/export-ci.yml
            .github/workflows/operations-ci.yml
            .github/workflows/backup-restore-ci.yml
          )
          missing=0
          for path in "${required[@]}"; do
            test -f "$path" || missing=1
          done
          if [[ "$missing" == 1 ]]; then
            git merge-base --is-ancestor "$proven_sha" "$current_sha"
            git checkout "$proven_sha" -- .
            for path in \
              AGENTS.md \
              .codex/modules/pipeline-advancement.md \
              docs/specifications/pipeline-advancement.md \
              .github/workflows/finalize-operational-e2e-v3.yml; do
              if git cat-file -e "$current_sha:$path" 2>/dev/null; then
                git checkout "$current_sha" -- "$path"
              fi
            done
          fi

          find .github/workflows -maxdepth 1 -type f \( \
              -name 'apply-*.yml' -o \
              -name 'cleanup-*.yml' -o \
              -name 'materialize-*.yml' -o \
              -name 'restore-*.yml' -o \
              -name 'close-*.yml' -o \
              -name 'final-*.yml' -o \
              -name 'repair-*.yml' -o \
              -name 'package-*.yml' \
            \) ! -name 'finalize-operational-e2e-v3.yml' -print0 \
            | xargs -0 -r git rm -f --ignore-unmatch
          if test -d .github/apply; then
            find .github/apply -type f -print0 | xargs -0 -r git rm -f --ignore-unmatch
          fi
          find docs/diagnostics -maxdepth 1 -type f \( \
              -name '.*transport*' -o \
              -name '.release-tool-probe' -o \
              -name '.pipeline-transport-check' \
            \) -print0 2>/dev/null | xargs -0 -r git rm -f --ignore-unmatch

          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing production owner after recovery: $path" >&2; exit 1; }
          done

          uv sync --all-packages --dev --locked
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py --check
          fi
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors packages tools

          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name rtao-god
            git config user.email rtaogod@gmail.com
            git commit -m 'Fix (Recovery): stabilize final operational E2E tree'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-subject permanent owner suite
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          workflows=(
            ci.yml
            pipeline-advancement-ci.yml
            review-web-ci.yml
            application-compose-ci.yml
            vertical-data-flow-e2e.yml
            browser-worker-isolation.yml
            export-ci.yml
            operations-ci.yml
            backup-restore-ci.yml
          )
          for workflow in "${workflows[@]}"; do
            curl -fsSL -X POST "${headers[@]}" \
              "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
          done
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-subject permanent owner suite
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          workflows=(
            ci.yml
            pipeline-advancement-ci.yml
            review-web-ci.yml
            application-compose-ci.yml
            vertical-data-flow-e2e.yml
            browser-worker-isolation.yml
            export-ci.yml
            operations-ci.yml
            backup-restore-ci.yml
          )
          labels=(Verify PipelineAdvancement ReviewWeb ApplicationCompose VerticalDataFlow BrowserIsolation SealedExport Operations BackupRestore)
          ids=()
          for index in "${!workflows[@]}"; do
            workflow="${workflows[$index]}"
            label="${labels[$index]}"
            matched=''
            for _ in $(seq 1 480); do
              payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=50")"
              run_id="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED_AT" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .id' <<<"$payload" | head -1)"
              status="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED_AT" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED_AT" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .conclusion' <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'success' ]] || { echo "$label failed in run $run_id" >&2; exit 1; }
                matched="$run_id"
                break
              fi
              sleep 5
            done
            [[ -n "$matched" ]] || { echo "$label timed out for $SUBJECT_SHA" >&2; exit 1; }
            ids+=("$matched")
          done
          names=(verify pipeline review compose flow browser export operations restore)
          for index in "${!names[@]}"; do
            echo "${names[$index]}_id=${ids[$index]}" >> "$GITHUB_OUTPUT"
          done

      - name: Record exact-head proof and remove finalizer
        id: closure
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
          VERIFY_ID: ${{ steps.proof.outputs.verify_id }}
          PIPELINE_ID: ${{ steps.proof.outputs.pipeline_id }}
          REVIEW_ID: ${{ steps.proof.outputs.review_id }}
          COMPOSE_ID: ${{ steps.proof.outputs.compose_id }}
          FLOW_ID: ${{ steps.proof.outputs.flow_id }}
          BROWSER_ID: ${{ steps.proof.outputs.browser_id }}
          EXPORT_ID: ${{ steps.proof.outputs.export_id }}
          OPERATIONS_ID: ${{ steps.proof.outputs.operations_id }}
          RESTORE_ID: ${{ steps.proof.outputs.restore_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          mkdir -p docs/proofs
          cat > docs/proofs/end-to-end-operational-ci.md <<EOF
          # End-to-end operational CI proof

          - Status: \`proven\`
          - Repository: \`rtao-god/data-collection-platform\`
          - Branch: \`main\`
          - Subject commit: \`$SUBJECT_SHA\`
          - Verify run: \`$VERIFY_ID\`
          - Pipeline advancement run: \`$PIPELINE_ID\`
          - Review Web run: \`$REVIEW_ID\`
          - Application Compose run: \`$COMPOSE_ID\`
          - Vertical HTTP/Object Store/data-flow run: \`$FLOW_ID\`
          - Browser isolation run: \`$BROWSER_ID\`
          - Sealed export run: \`$EXPORT_ID\`
          - Operations run: \`$OPERATIONS_ID\`
          - Backup/restore run: \`$RESTORE_ID\`
          - Conclusions: \`success\`

          ## Proven executable boundary

          The exact subject creates immutable campaign runs, advances completed acquisition work into
          processing and resolution, downloads a real HTTP fixture, persists and reads content through
          the repository S3-compatible Object Store path, produces normalized observations and a
          resolved candidate, materializes and verifies a deterministic sealed export, builds an
          isolated browser worker, renders the complete application topology, and completes an isolated
          PostgreSQL plus Object Store backup/restore drill.

          ## External production-input boundary

          This proof does not fabricate or approve Berlin geography, official source bindings, or
          production collection consent. A production Berlin campaign remains fail-closed until those
          externally governed inputs are supplied.
          EOF
          git rm -f --ignore-unmatch .github/workflows/finalize-operational-e2e-v3.yml
          git add docs/proofs/end-to-end-operational-ci.md
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Docs (Proofs): record final operational E2E closure'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify final proof commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CLOSURE_SHA: ${{ steps.closure.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsSL -X POST "${headers[@]}" \
            "$api/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"main"}' >/dev/null
          for _ in $(seq 1 480); do
            payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/ci.yml/runs?branch=main&event=workflow_dispatch&per_page=50")"
            run_id="$(jq -r --arg sha "$CLOSURE_SHA" --arg started "$started_at" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .id' <<<"$payload" | head -1)"
            status="$(jq -r --arg sha "$CLOSURE_SHA" --arg started "$started_at" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .status' <<<"$payload" | head -1)"
            conclusion="$(jq -r --arg sha "$CLOSURE_SHA" --arg started "$started_at" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .conclusion' <<<"$payload" | head -1)"
            if [[ -n "$run_id" && "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || { echo "Final Verify failed in run $run_id" >&2; exit 1; }
              echo "Final closure $CLOSURE_SHA passed Verify run $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "Final Verify timed out for $CLOSURE_SHA" >&2
          exit 1
