name: Apply Geography Writer Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-geography-writer-owner.yml
      - ".github/apply/geography-writer-owner.patch.part-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-geography-writer-owner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Apply reviewed geography writer patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/apply/geography-writer-owner.patch.part-00 \
            .github/apply/geography-writer-owner.patch.part-01 \
            .github/apply/geography-writer-owner.patch.part-02 \
            .github/apply/geography-writer-owner.patch.part-03 \
            .github/apply/geography-writer-owner.patch.part-04 \
            .github/apply/geography-writer-owner.patch.part-05 \
            > /tmp/geography-writer-owner.patch
          echo "e01b07b3b09f28af996946b8927ecad5599432bca16376f52596b99d3be71500  /tmp/geography-writer-owner.patch" \
            | sha256sum --check --strict
          git apply --index --3way /tmp/geography-writer-owner.patch
          git diff --cached --check
      - name: Verify geography writer owner
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/berlin_boundary_portal.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run ruff check \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/berlin_boundary_portal.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run mypy
          uv run pytest -q tools/live_collection/tests/test_berlin_boundary.py
          uv run python -m compileall -q tools/live_collection
      - name: Commit owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-geography-writer-owner.yml
          git rm .github/apply/geography-writer-owner.patch.part-*
          git add -A
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Campaign): centralize geography revision materialization"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
