name: Restore Proven Operational E2E Tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-operational-e2e-tree.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-tree-recovery
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Restore the proven operational subject without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          proven_sha='9bec95589ee0592a873edbc0548be27707f53af6'
          git merge-base --is-ancestor "$proven_sha" "$current_sha"

          git checkout "$proven_sha" -- .

          # Keep the current repository routing and the explicit advancement design freeze.
          git checkout "$current_sha" -- AGENTS.md
          for path in \
            .codex/modules/pipeline-advancement.md \
            docs/specifications/pipeline-advancement.md; do
            if git cat-file -e "$current_sha:$path" 2>/dev/null; then
              git checkout "$current_sha" -- "$path"
            fi
          done

          # Transport and historical repair workflows are not production topology.
          find .github/workflows -maxdepth 1 -type f \( \
              -name 'apply-*.yml' -o \
              -name 'cleanup-*.yml' -o \
              -name 'materialize-*.yml' -o \
              -name 'close-*.yml' -o \
              -name 'final-*.yml' -o \
              -name 'repair-*.yml' -o \
              -name 'package-*.yml' \
            \) ! -name 'restore-operational-e2e-tree.yml' -print0 | xargs -0 -r git rm -f
          if test -d .github/apply; then
            find .github/apply -type f -print0 | xargs -0 -r git rm -f
          fi
          rm -f \
            .github/workflows/apply-pipeline-owner-integration.yml \
            .github/workflows/apply-pipeline-supervision-integration.yml \
            .github/workflows/apply-pipeline-catalog-integration.yml
          find docs/diagnostics -maxdepth 1 -type f \( \
              -name '.*transport*' -o \
              -name '.release-tool-probe' -o \
              -name '.pipeline-transport-check' \
            \) -print0 2>/dev/null | xargs -0 -r git rm -f

          test -f packages/collection_application/src/collection_application/pipeline_advancement.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
          test -f apps/pipeline_supervisor/pyproject.toml
          test -f apps/review_web/package-lock.json
          test -f apps/browser_worker/pyproject.toml
          test -f packages/export_core/src/export_core/service.py
          test -f apps/retention_job/pyproject.toml
          test -f apps/orchestrator/pyproject.toml
          test -f tools/operations/backup_restore.py
          test -f deploy/compose/application.yaml

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Verify exact restored dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-packages --dev --locked
          npm --prefix apps/review_web ci

      - name: Verify restored production owners
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py --check
          fi
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors packages tools
          npm --prefix apps/review_web run lint --if-present
          npm --prefix apps/review_web run typecheck --if-present
          npm --prefix apps/review_web test --if-present -- --run
          npm --prefix apps/review_web run build
          docker compose -f deploy/compose/application.yaml config >/dev/null

      - name: Commit restored operational tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/restore-operational-e2e-tree.yml
          git add -A
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Fix (Recovery): restore proven operational E2E tree'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
