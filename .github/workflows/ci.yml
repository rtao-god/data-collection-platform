name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install exact Python
        run: uv python install 3.13.13

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify lock consistency
        run: uv lock --check

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Verify dependency boundaries
        run: uv run python tools/architecture_checks/check_dependencies.py

      - name: Validate first campaign snapshot
        run: uv run collector config validate berlin_recording_services

      - name: Build collector CLI image
        run: docker build --file deploy/docker/collector-cli.Dockerfile .
