name: Apply Stage 8A Candidate Review Recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage8a-recovery-20260814.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage8a-recovery
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out complete main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Materialize coherent Stage 8A owners
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git reset --hard origin/main

          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          def latest_revision(path: str) -> str:
              revision = git("log", "--all", "--format=%H", "--", path).splitlines()
              if not revision:
                  raise RuntimeError(f"no historical owner found for {path}")
              return revision[0]

          migration_path = "database/migrations/versions/20260814_0009_candidate_review.py"
          migration_revision = latest_revision(migration_path)
          changed = git("diff-tree", "--no-commit-id", "--name-only", "-r", migration_revision).splitlines()
          selected = [
              path
              for path in changed
              if path.startswith(
                  (
                      "packages/review_contracts/",
                      "packages/review_core/",
                      "tools/review_contract_generation/",
                      "contracts/review",
                      "database/tests/",
                      "docs/specifications/stage8",
                      ".codex/modules/review",
                  )
              )
              or path == migration_path
          ]
          required = [
              "packages/review_contracts",
              "packages/review_core",
              "tools/review_contract_generation",
              migration_path,
          ]
          for path in required:
              revision = latest_revision(path)
              subprocess.run(["git", "checkout", revision, "--", path], check=True)
          for path in selected:
              if path in required or any(path.startswith(f"{item}/") for item in required):
                  continue
              subprocess.run(["git", "checkout", migration_revision, "--", path], check=True)

          contract_revision = latest_revision(
              "packages/review_contracts/src/review_contracts/contracts.py"
          )
          generated_paths = [
              path
              for path in git("ls-tree", "-r", "--name-only", contract_revision).splitlines()
              if path.startswith("contracts/") and "review" in path
          ]
          for path in generated_paths:
              subprocess.run(["git", "checkout", contract_revision, "--", path], check=True)

          contracts_path = ROOT / "packages/review_contracts/src/review_contracts/contracts.py"
          text = contracts_path.read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^def _require_plain_text\((.*?)\) -> str:\n.*?(?=^def |\Z)",
              text,
          )
          if match is None:
              raise RuntimeError("review contracts plain-text validator is missing")
          first_argument = re.match(r"\s*([A-Za-z_][A-Za-z0-9_]*)", match.group(1))
          if first_argument is None:
              raise RuntimeError("review contracts validator has no value argument")
          value_name = first_argument.group(1)
          replacement = (
              f"def _require_plain_text({match.group(1)}) -> str:\n"
              f"    if not isinstance({value_name}, str):\n"
              f"        raise TypeError(\"plain text value must be a string\")\n"
              f"    normalized = {value_name}.strip()\n"
              f"    if not normalized:\n"
              f"        raise ValueError(\"plain text value must not be empty\")\n"
              f"    if any(\n"
              f"        ord(character) < 32 and character not in \"\\n\\r\\t\"\n"
              f"        for character in normalized\n"
              f"    ):\n"
              f"        raise ValueError(\"plain text value contains a forbidden control character\")\n"
              f"    return normalized\n\n"
          )
          contracts_path.write_text(
              text[: match.start()] + replacement + text[match.end() :],
              encoding="utf-8",
          )

          review_core_project = ROOT / "packages/review_core/pyproject.toml"
          project_text = review_core_project.read_text(encoding="utf-8")
          project_text = project_text.replace('"collection-contracts",', '"review-contracts",')
          review_core_project.write_text(project_text, encoding="utf-8")

          root_project = ROOT / "pyproject.toml"
          root_text = root_project.read_text(encoding="utf-8")

          def add_array_value(text: str, section: str, key: str, value: str) -> str:
              section_start = text.index(f"[{section}]")
              key_start = text.index(f"{key} = [", section_start)
              close = text.index("\n]", key_start)
              literal = f'  "{value}",'
              block = text[key_start:close]
              if literal in block:
                  return text
              return text[:close] + f"\n{literal}" + text[close:]

          for value in ("packages/review_contracts", "packages/review_core"):
              root_text = add_array_value(root_text, "tool.uv.workspace", "members", value)
          for value in (
              "packages/review_contracts/tests",
              "packages/review_core/tests",
          ):
              root_text = add_array_value(root_text, "tool.pytest.ini_options", "testpaths", value)
          for value in (
              "packages/review_contracts/src",
              "packages/review_core/src",
          ):
              root_text = add_array_value(root_text, "tool.ruff", "src", value)
          for value in (
              "packages/review_contracts/src/review_contracts",
              "packages/review_core/src/review_core",
              "tools/review_contract_generation/generate.py",
          ):
              root_text = add_array_value(root_text, "tool.mypy", "files", value)
          root_project.write_text(root_text, encoding="utf-8")

          checker_path = ROOT / "tools/architecture_checks/check_dependencies.py"
          checker = checker_path.read_text(encoding="utf-8")
          historical_revision = git(
              "log",
              "--all",
              "-S",
              '"review_contracts": OwnerPolicy',
              "--format=%H",
              "--",
              str(checker_path.relative_to(ROOT)),
          ).splitlines()[0]
          historical = git("show", f"{historical_revision}:{checker_path.relative_to(ROOT)}")

          def owner_block(source: str, owner: str) -> str:
              start = source.index(f'    "{owner}": OwnerPolicy(')
              next_owner = re.search(r'\n    "[^"]+": OwnerPolicy\(', source[start + 1 :])
              if next_owner is None:
                  end = source.index("\n}", start)
              else:
                  end = start + 1 + next_owner.start()
              return source[start:end] + "\n"

          marker = "_OWNER_POLICIES: dict[str, OwnerPolicy] = {"
          map_start = checker.index(marker)
          map_end = checker.index("\n}", map_start)
          for owner in ("review_contracts", "review_core"):
              if f'"{owner}": OwnerPolicy(' not in checker[map_start:map_end]:
                  block = owner_block(historical, owner)
                  checker = checker[:map_end] + "\n" + block + checker[map_end:]
                  map_end += len(block) + 1
          checker_path.write_text(checker, encoding="utf-8")
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff format packages/review_contracts packages/review_core tools/review_contract_generation database/migrations/versions/20260814_0009_candidate_review.py tools/architecture_checks/check_dependencies.py
          uv run ruff check packages/review_contracts packages/review_core tools/review_contract_generation database/migrations/versions/20260814_0009_candidate_review.py tools/architecture_checks/check_dependencies.py --fix
          uv run python -m compileall -q packages/review_contracts packages/review_core tools/review_contract_generation
          uv run python tools/review_contract_generation/generate.py --check
          uv run mypy
          uv run pytest -q packages/review_contracts packages/review_core
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests

          python - <<'PY'
          import subprocess
          from pathlib import Path

          source_head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          proof = Path("docs/proofs/stage8a-candidate-review.md")
          proof.parent.mkdir(parents=True, exist_ok=True)
          proof.write_text(
              "# Stage 8A candidate review foundation\n\n"
              "- Status: `locally-proven`\n"
              f"- Materialization source HEAD: `{source_head}`\n"
              "- Owners: `review_contracts`, `review_core`\n"
              "- Migration: `20260814_0009`\n"
              "- Gates: Ruff, strict mypy, focused and full non-integration tests, "
              "architecture checks, generated-contract drift, fresh PostgreSQL/PostGIS "
              "migration, database integration tests.\n"
              "- Exact-head permanent CI evidence is recorded separately after the production commit.\n",
              encoding="utf-8",
          )
          PY

          python - <<'PY'
          import subprocess
          from pathlib import Path

          checker = Path("tools/architecture_checks/check_dependencies.py")
          policy = subprocess.check_output(
              ["python", str(checker), "--print-policy"],
              text=True,
          ).strip()
          path = Path("docs/architecture/dependency-rules.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + policy + text[end:], encoding="utf-8")
          PY

          git add \
            packages/review_contracts \
            packages/review_core \
            tools/review_contract_generation \
            contracts \
            database/migrations/versions/20260814_0009_candidate_review.py \
            database/tests \
            docs/specifications \
            docs/proofs/stage8a-candidate-review.md \
            docs/architecture/dependency-rules.md \
            .codex/modules \
            pyproject.toml \
            tools/architecture_checks/check_dependencies.py \
            uv.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Stage 8A production owners are already materialized and proven."
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat (Review): add candidate review foundation"
          git push origin HEAD:main
