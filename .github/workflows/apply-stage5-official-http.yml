name: Apply Stage 5 Official HTTP

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage5-official-http.yml
      - .github/stage5/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage5-official-http
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Apply owner patch and prove Stage 5
        shell: bash
        run: |
          set -euo pipefail
          cat .github/stage5/payload.part-* | base64 --decode | gzip --decompress > "$RUNNER_TEMP/stage5.patch"
          git apply --check "$RUNNER_TEMP/stage5.patch"
          git apply "$RUNNER_TEMP/stage5.patch"

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"{path}: expected Stage 5 source fragment is missing")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "connectors/official_http/pyproject.toml",
              '  "pydantic==2.13.4",\n  "scrapy==2.17.0",\n',
              '  "defusedxml==0.7.1",\n  "pydantic==2.13.4",\n  "scrapy==2.17.0",\n',
          )
          replace_once(
              "connectors/official_http/src/official_http/planning.py",
              "from xml.etree import ElementTree\n",
              "from defusedxml.ElementTree import ParseError, fromstring\n",
          )
          replace_once(
              "connectors/official_http/src/official_http/planning.py",
              "        root = ElementTree.fromstring(body)\n    except ElementTree.ParseError as exc:\n",
              "        root = fromstring(body)\n    except ParseError as exc:\n",
          )

          urls = Path("connectors/official_http/src/official_http/urls.py")
          text = urls.read_text(encoding="utf-8")
          old = (
              "    split = urlsplit(normalize_http_url(url))\n"
              "    assert split.hostname is not None\n"
              "    port = split.port or (80 if split.scheme == \"http\" else 443)\n"
          )
          new = (
              "    split = urlsplit(normalize_http_url(url))\n"
              "    hostname = split.hostname\n"
              "    if hostname is None:\n"
              "        raise _url_error(\n"
              "            \"OFFICIAL_HTTP_URL_HOST_MISSING\",\n"
              "            \"The HTTP URL requires a host.\",\n"
              "        )\n"
              "    port = split.port or (80 if split.scheme == \"http\" else 443)\n"
          )
          if old not in text:
              raise RuntimeError("official_http.urls: resolver ownership anchor is missing")
          text = text.replace(old, new, 1)
          text = text.replace("resolver(split.hostname, port", "resolver(hostname, port", 1)
          text = text.replace('context={"host": split.hostname}', 'context={"host": hostname}')
          urls.write_text(text, encoding="utf-8")

          replace_once(
              "apps/http_worker/src/http_worker/gateway.py",
              '    return "Correct the official HTTP request or connector contract before scheduling replacement work."\n',
              '    return (\n'
              '        "Correct the official HTTP request or connector contract before scheduling "\n'
              '        "replacement work."\n'
              '    )\n',
          )
          replace_once(
              "connectors/official_http/src/official_http/scrapy_child.py",
              '                "Accept": "text/html,application/xhtml+xml,application/xml,text/xml,application/json,text/plain,*/*;q=0.1",\n',
              '                "Accept": (\n'
              '                    "text/html,application/xhtml+xml,application/xml,text/xml,"\n'
              '                    "application/json,text/plain,*/*;q=0.1"\n'
              '                ),\n',
          )
          replace_once(
              "tools/architecture_checks/check_dependencies.py",
              'allowed_external_imports=frozenset({"pydantic", "scrapy"}),',
              'allowed_external_imports=frozenset({"defusedxml", "pydantic", "scrapy"}),',
          )
          replace_once(
              "docs/architecture/dependency-rules.md",
              '| `official_http` | `connectors/official_http` | `source_connector_sdk` | `pydantic`, `scrapy` |',
              '| `official_http` | `connectors/official_http` | `source_connector_sdk` | `defusedxml`, `pydantic`, `scrapy` |',
          )
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff format .
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run mypy
          uv run pytest -q connectors/official_http/tests apps/http_worker/tests
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py
          uv run python tools/contract_generation/generate.py --check
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          docker build --tag data-collection-platform/http-worker:stage5 --file deploy/docker/http-worker.Dockerfile .
          docker run --rm -i \
            --entrypoint python \
            data-collection-platform/http-worker:stage5 \
            - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          import_module("http_worker")
          import_module("official_http")
          import_module("source_connector_sdk")
          import_module("scrapy")

          forbidden = {
              "alembic",
              "boto3",
              "botocore",
              "playwright",
              "psycopg",
              "sqlalchemy",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit(
                  "HTTP worker contains forbidden dependencies: " + ", ".join(present)
              )
          PY
          git diff --check

      - name: Commit proven production state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/stage5
          git add -A
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat (HTTP acquisition): add official website worker"
          git push origin HEAD:main
