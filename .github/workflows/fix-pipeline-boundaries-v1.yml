name: Fix Pipeline Boundaries V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pipeline-boundaries-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-pipeline-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Route domain types through application boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path(
                  "packages/collection_infrastructure/src/collection_infrastructure/"
                  "postgres/pipeline_run_control.py"
              ),
              Path(
                  "packages/collection_infrastructure/src/collection_infrastructure/"
                  "postgres/succeeded_work_catalog.py"
              ),
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              direct = "from collection_domain import WorkStage\n"
              boundary = "from collection_application import WorkStage\n"
              if direct in text:
                  text = text.replace(direct, boundary, 1)
              elif boundary not in text:
                  raise SystemExit(f"WorkStage boundary anchor is missing in {path}")
              path.write_text(text, encoding="utf-8")
          PY
          uv sync --frozen --all-packages --dev
          uv run ruff check \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py \
            --fix
          uv run ruff format \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py

      - name: Prove corrected boundary
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests

      - name: Commit corrected boundary
        shell: bash
        run: |
          set -euo pipefail
          git add \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Pipeline boundaries are already correct."
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Architecture): route pipeline stages through application"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
