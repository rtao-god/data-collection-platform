name: Apply Stage 8B Control API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage8b-control-api-apply-20260814.yml
      - .github/stage8b_apply_20260814/**
      - docs/proofs/stage8a-candidate-review-ci.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage8b-control-api
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 180

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Materialize and prove Stage 8B owners
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f docs/proofs/stage8a-candidate-review-ci.md
          python .github/stage8b_apply_20260814/part1.py
          python .github/stage8b_apply_20260814/part2.py
          python .github/stage8b_apply_20260814/part3a.py
          python .github/stage8b_apply_20260814/part3b.py
          python .github/stage8b_apply_20260814/part3c.py
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/control_api_contract_generation/generate.py
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest packages/review_application/tests apps/control_api/tests tools/control_api_contract_generation/tests
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/resolution_contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build --file deploy/docker/control-api.Dockerfile .
          git diff --check

      - name: Commit proven Stage 8B production diff
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/stage8b_apply_20260814
          mkdir -p docs/proofs
          cat > docs/proofs/stage8b-control-api-owner.md <<EOF
          # Stage 8B Control API owner proof

          - Status: owner gates passed
          - Build subject: \`$GITHUB_SHA\`
          - Build workflow run: \`$GITHUB_RUN_ID\`

          The review application, transactional PostgreSQL adapter, authenticated
          Control API, generated OpenAPI, full unit/database suites, dependency
          boundaries, and non-root Control API image passed before commit.

          The React review console remains the next Stage 8 owner.
          EOF
          git add -A
          git reset .github/workflows
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat (Review): add authenticated Control API"
          git push origin HEAD:main
