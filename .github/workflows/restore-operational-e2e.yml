name: Restore Operational E2E

on:
  push:
    branches: [main]
    paths:
      - docs/proofs/pipeline-advancement-ci.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-operational-e2e-restoration
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - name: Check out complete main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact pipeline proof
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/proofs/pipeline-advancement-ci.md
          grep -F -- '- Status: proven' docs/proofs/pipeline-advancement-ci.md

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Assemble operational production candidate
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          base_sha="9bec95589ee0592a873edbc0548be27707f53af6"
          candidate="$RUNNER_TEMP/operational-e2e-candidate"
          git cat-file -e "$base_sha^{commit}"
          rm -rf "$candidate"
          git worktree add --detach "$candidate" "$base_sha"
          git -C "$candidate" config user.name rtao-god
          git -C "$candidate" config user.email rtaogod@gmail.com

          apply_commit_paths() {
            local commit="$1"
            shift
            git cat-file -e "$commit^{commit}"
            if git merge-base --is-ancestor "$commit" "$base_sha"; then
              return 0
            fi
            local parent patch
            parent="$(git rev-parse "$commit^")"
            patch="$RUNNER_TEMP/${commit}.patch"
            git diff --binary "$parent" "$commit" -- "$@" > "$patch"
            if test -s "$patch"; then
              git -C "$candidate" apply --3way --index "$patch"
              if ! git -C "$candidate" diff --cached --quiet; then
                git -C "$candidate" commit -m "Recovery: $(git show -s --format=%s "$commit")"
              fi
            fi
          }

          apply_commit_paths 0ff622fbd4fb10b0b3d1ef16b4fc1b995f4f5044 \
            database/migrations/versions/20260815_0011_owned_artifacts.py \
            packages/collection_application/src/collection_application/artifacts.py \
            packages/collection_application/src/collection_application/owned_artifacts.py \
            packages/collection_application/src/collection_application/campaign_publication.py \
            packages/collection_application/src/collection_application/campaign_runs.py \
            packages/collection_infrastructure/src/collection_infrastructure/object_store.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/artifact_metadata.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/metadata.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/owned_artifact_publisher.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/campaign_snapshot_store.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/campaign_run_store.py \
            packages/collection_application/tests \
            packages/collection_infrastructure/tests \
            database/tests

          apply_commit_paths b7368ba690f588cf5e254f905ce1cdf69305444f \
            database/migrations/versions/20260815_0012_run_control.py \
            packages/collection_application/src/collection_application/run_control.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/run_control.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/work_metadata.py \
            apps/control_api/src/control_api/app.py \
            apps/control_api/src/control_api/main.py \
            apps/control_api/tests \
            packages/collection_application/tests/test_run_control.py \
            packages/collection_infrastructure/tests/test_run_control.py \
            database/tests

          pipeline_commits=(
            3201a57984616fad1b9c2a6b5c599ef1067ae52c
            c7de7a623dc6f605f19de45deffdf177d3f5a463
            f7b88a313680208e1f6392106c5d89253121c8cf
            44892d0cfc6b4225d89f1ae5d6aef9d27f0afceb
            d16fe22c4603ceec846430e9fdddd5ecb14e085f
            1ed9e32eff23f88a08be361196ef469545ce49ba
            7627532dd357fe39e6e3c33bb934e97d7a9ada07
            55c6478027d48af7537f4760cbd348650943299d
            6c165b5448a13faff6d9fe9b8825e273e3f5613e
            b323a611dfa94ec9c1785430b0a8f5103f5fdbcd
            2526ec943a85aca1563f43fb26589e970fbff5cb
            93d28e999723925fb998d8291783b3d6a15f7ffc
            4ae57ee919138284c8528a91b48e61808a4eaa6e
            23245479f652b7da1dbc14fb4c0cd8cb09ffa612
          )
          for commit in "${pipeline_commits[@]}"; do
            apply_commit_paths "$commit" \
              database/migrations/versions/20260815_0013_pipeline_advancement.py \
              database/tests/test_pipeline_advancement_schema.py \
              packages/collection_application/src/collection_application/pipeline_advancement.py \
              packages/collection_application/src/collection_application/pipeline_supervision.py \
              packages/collection_application/tests/test_pipeline_advancement.py \
              packages/collection_application/tests/test_pipeline_supervision.py \
              packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py \
              packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py \
              packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py \
              packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py \
              packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py \
              packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py \
              packages/collection_infrastructure/tests/test_pipeline_run_control.py \
              packages/collection_infrastructure/tests/test_succeeded_work_catalog.py \
              apps/pipeline_supervisor \
              apps/dagster_definitions
          done

          latest_pipeline_paths=(
            database/migrations/versions/20260815_0013_pipeline_advancement.py
            database/tests/test_pipeline_advancement_schema.py
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_application/src/collection_application/pipeline_supervision.py
            packages/collection_application/tests/test_pipeline_advancement.py
            packages/collection_application/tests/test_pipeline_supervision.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py
            packages/collection_infrastructure/tests/test_pipeline_run_control.py
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
          )
          for path in "${latest_pipeline_paths[@]}"; do
            if git cat-file -e "$current_sha:$path" 2>/dev/null; then
              mkdir -p "$candidate/$(dirname "$path")"
              git show "$current_sha:$path" > "$candidate/$path"
            fi
          done

          test -f "$candidate/apps/review_web/package-lock.json"
          test -f "$candidate/apps/browser_worker/pyproject.toml"
          test -f "$candidate/packages/export_core/src/export_core/service.py"
          test -f "$candidate/apps/retention_job/pyproject.toml"
          test -f "$candidate/apps/orchestrator/pyproject.toml"
          test -f "$candidate/tools/operations/backup_restore.py"
          test -f "$candidate/deploy/compose/application.yaml"
          test -f "$candidate/database/migrations/versions/20260815_0013_pipeline_advancement.py"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.github/apply/' \
            --exclude='.github/repair_pipeline_owner_v2.py' \
            "$candidate/" "$GITHUB_WORKSPACE/"
          rm -rf .github/apply
          rm -f .github/repair_pipeline_owner_v2.py
          uv lock

      - name: Restore assembled workspace
        run: uv sync --frozen --all-packages --dev

      - name: Prove Python production tree
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py --check
          fi
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          uv run collection-migrate upgrade head
          uv run pytest -q -m integration database/tests

      - name: Install review frontend Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Prove review frontend and Compose topology
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/review_web ci
          npm --prefix apps/review_web run lint
          npm --prefix apps/review_web run typecheck --if-present
          npm --prefix apps/review_web test -- --run
          npm --prefix apps/review_web run build
          docker compose -f deploy/compose/application.yaml config --quiet

      - name: Commit restored production tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude).github/apply/**'
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Recovery): restore complete operational E2E tree"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
