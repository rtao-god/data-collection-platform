name: Close Stage 7 Resolution and Quality

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage7-resolution-quality-closure-20260814.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage7-resolution-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 80

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Materialize missing Stage 7 owners and prove the complete block
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if test -f .github/stage7_apply_20260814/repair.py; then
            python .github/stage7_apply_20260814/repair.py
          elif test -f .github/stage7_apply_20260814/apply.py; then
            python .github/stage7_apply_20260814/apply.py
          fi
          test -f packages/resolution_contracts/src/resolution_contracts/contracts.py
          test -f packages/entity_resolution_core/src/entity_resolution_core/engine.py
          test -f packages/quality_core/src/quality_core/evaluation.py
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/resolution_contract_generation/generate.py
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest packages/resolution_contracts/tests packages/entity_resolution_core/tests packages/quality_core/tests tools/resolution_contract_generation/tests
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/resolution_contract_generation/generate.py --check
          uv run python -m compileall -q apps connectors database packages tools
          git diff --check

      - name: Commit only proven Stage 7 production artifacts
        shell: bash
        run: |
          set -euo pipefail
          if test -d .github/stage7_apply_20260814; then
            git rm -r .github/stage7_apply_20260814
          fi
          mkdir -p docs/proofs
          cat > docs/proofs/stage7-resolution-quality-owner.md <<EOF
          # Stage 7 resolution and quality owner proof

          - Status: owner gates passed
          - Build subject: \`$GITHUB_SHA\`
          - Build workflow run: \`$GITHUB_RUN_ID\`

          This owner block passed exact workspace restoration, generated resolution
          contract generation and drift checks, Ruff, strict mypy, focused Stage 7 tests,
          the complete non-integration suite, fail-closed dependency checks, and Python
          compilation before commit.

          Permanent exact-head CI evidence is recorded separately after the resulting
          production commit completes the read-only Verify workflows.
          EOF
          git add -A
          git reset .github/workflows
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat (Resolution): add deterministic resolution and quality core"
          git push origin HEAD:main
