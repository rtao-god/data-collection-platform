name: Repair Pipeline Advancement Owner V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-pipeline-advancement-owner-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-pipeline-owner-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore physical pipeline supervisor owner
        shell: bash
        run: |
          set -euo pipefail
          restore_latest_present() {
            local path="$1"
            test -e "$path" && return 0
            local sha
            while read -r sha; do
              if git cat-file -e "$sha:$path" 2>/dev/null; then
                git checkout "$sha" -- "$path"
                return 0
              fi
            done < <(git rev-list HEAD -- "$path")
            echo "No historical owner found for $path" >&2
            return 1
          }
          restore_latest_present apps/pipeline_supervisor
          restore_latest_present deploy/docker/pipeline-supervisor.Dockerfile

          checker=tools/architecture_checks/check_dependencies.py
          if ! grep -q 'pipeline_supervisor' "$checker"; then
            sha="$(git log -S 'pipeline_supervisor' --format=%H -- "$checker" | head -1)"
            test -n "$sha"
            git checkout "$sha" -- "$checker"
          fi

      - name: Repair canonical work and artifact ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          migration = Path("database/migrations/versions/20260815_0013_pipeline_advancement.py")
          text = migration.read_text(encoding="utf-8")
          text = text.replace("work.work_units.work_unit_id", "work.work_units.work_id")
          migration.write_text(text, encoding="utf-8")

          metadata = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "pipeline_advancement_metadata.py"
          )
          text = metadata.read_text(encoding="utf-8")
          text = text.replace('sa.Column("work_unit_id", sa.Uuid(), primary_key=True)', 'sa.Column("work_id", sa.Uuid(), primary_key=True)')
          text = text.replace("_work_units.c.work_unit_id", "_work_units.c.work_id")
          metadata.write_text(text, encoding="utf-8")

          schema_test = Path("database/tests/test_pipeline_advancement_schema.py")
          text = schema_test.read_text(encoding="utf-8")
          text = text.replace('assert "ON DELETE RESTRICT" in source', 'assert \'ondelete="RESTRICT"\' in source')
          schema_test.write_text(text, encoding="utf-8")

          advancement_test = Path(
              "packages/collection_application/tests/test_pipeline_advancement.py"
          )
          text = advancement_test.read_text(encoding="utf-8")
          text = text.replace("WorkStage.ACQUISITION", "WorkStage.DISCOVERY")
          advancement_test.write_text(text, encoding="utf-8")

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          workspace_marker = "[tool.uv.workspace]"
          workspace_start = text.index(workspace_marker)
          workspace_end = text.find("\n[", workspace_start + len(workspace_marker))
          workspace_end = len(text) if workspace_end < 0 else workspace_end
          workspace = text[workspace_start:workspace_end]
          member = '  "apps/pipeline_supervisor",\n'
          if '"apps/pipeline_supervisor"' not in workspace:
              close = workspace.rfind("]")
              workspace = workspace[:close] + member + workspace[close:]
              text = text[:workspace_start] + workspace + text[workspace_end:]

          mypy_start = text.index("[tool.mypy]")
          mypy_end = text.find("\n[", mypy_start + len("[tool.mypy]"))
          mypy_end = len(text) if mypy_end < 0 else mypy_end
          mypy = text[mypy_start:mypy_end]
          source = '  "apps/pipeline_supervisor/src/pipeline_supervisor",\n'
          if "apps/pipeline_supervisor/src/pipeline_supervisor" not in mypy:
              files_start = mypy.index("files = [")
              close = mypy.index("\n]", files_start)
              mypy = mypy[:close] + "\n" + source.rstrip("\n") + mypy[close:]
              text = text[:mypy_start] + mypy + text[mypy_end:]
          pyproject.write_text(text, encoding="utf-8")
          PY

          cat > packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py <<'PY'
          from __future__ import annotations

          from uuid import UUID

          import sqlalchemy as sa
          from collection_application.pipeline_advancement import (
              ArtifactIdentity,
              PipelineAdvancementConflict,
              SucceededWorkOutput,
          )
          from collection_domain import WorkStage
          from sqlalchemy.engine import Connection, Engine, RowMapping
          from sqlalchemy.exc import SQLAlchemyError

          from collection_infrastructure.postgres.artifact_metadata import (
              artifact_objects,
              artifact_records,
              work_input_artifacts,
              work_output_artifacts,
          )
          from collection_infrastructure.postgres.pipeline_advancement_metadata import (
              pipeline_advancements,
          )
          from collection_infrastructure.postgres.work_metadata import stage_runs, work_units


          class PostgresSucceededWorkCatalog:
              """Canonical succeeded-work reader and unregistered-output discovery owner."""

              def __init__(self, engine: Engine) -> None:
                  self._engine = engine

              def __call__(
                  self,
                  connection: Connection,
                  source_work_unit_id: UUID,
              ) -> SucceededWorkOutput:
                  return self.read(connection, source_work_unit_id)

              def read(
                  self,
                  connection: Connection,
                  source_work_unit_id: UUID,
              ) -> SucceededWorkOutput:
                  work = (
                      connection.execute(
                          sa.select(work_units)
                          .where(work_units.c.work_id == source_work_unit_id)
                          .with_for_update(read=True)
                      )
                      .mappings()
                      .one_or_none()
                  )
                  if work is None:
                      raise _catalog_conflict(
                          "PIPELINE_SOURCE_WORK_NOT_FOUND",
                          "The source work unit does not exist.",
                          source_work_unit_id,
                          "Refresh canonical work state and select an existing successful work unit.",
                      )
                  if _required_text(work, "state") != "succeeded":
                      raise _catalog_conflict(
                          "PIPELINE_SOURCE_WORK_NOT_SUCCEEDED",
                          "Pipeline advancement accepts only successfully completed work.",
                          source_work_unit_id,
                          "Wait for canonical successful completion before registering advancement.",
                      )
                  run_id = _required_uuid(work, "run_id")
                  stage_run_id = _required_uuid(work, "stage_run_id")
                  stage = (
                      connection.execute(
                          sa.select(stage_runs).where(
                              stage_runs.c.stage_run_id == stage_run_id,
                              stage_runs.c.run_id == run_id,
                          )
                      )
                      .mappings()
                      .one_or_none()
                  )
                  if stage is None:
                      raise _catalog_conflict(
                          "PIPELINE_STAGE_OWNER_NOT_FOUND",
                          "The successful work has no canonical stage owner.",
                          source_work_unit_id,
                          "Repair stage ownership before advancing the successful output.",
                      )

                  inputs = _load_artifacts(
                      connection,
                      work_input_artifacts,
                      source_work_unit_id,
                  )
                  outputs = _load_artifacts(
                      connection,
                      work_output_artifacts,
                      source_work_unit_id,
                  )
                  if len(outputs) != 1:
                      raise PipelineAdvancementConflict(
                          code="PIPELINE_OUTPUT_ARTIFACT_CARDINALITY",
                          message="Successful work must bind exactly one canonical output artifact.",
                          context={
                              "sourceWorkUnitId": str(source_work_unit_id),
                              "outputArtifactCount": len(outputs),
                          },
                          required_action=(
                              "Repair work completion so the exact output contract has one canonical artifact."
                          ),
                      )
                  input_ids = {item.artifact_id for item in inputs}
                  if outputs[0].artifact_id in input_ids:
                      raise _catalog_conflict(
                          "PIPELINE_ARTIFACT_DIRECTION_CONFLICT",
                          "One artifact is bound as both pipeline input and output.",
                          source_work_unit_id,
                          "Repair immutable artifact bindings before advancement.",
                      )
                  return SucceededWorkOutput(
                      source_work_unit_id=source_work_unit_id,
                      run_id=run_id,
                      stage_run_id=stage_run_id,
                      stage=WorkStage(_required_text(stage, "stage")),
                      capability=_required_text(work, "capability"),
                      output_contract=_required_text(work, "output_contract"),
                      output_digest=_required_text(work, "output_digest"),
                      output_artifact=outputs[0],
                      input_artifacts=inputs,
                  )

              def list_unregistered_succeeded(
                  self,
                  *,
                  limit: int,
                  correlation_id: str,
              ) -> tuple[SucceededWorkOutput, ...]:
                  del correlation_id
                  if not 1 <= limit <= 1_000:
                      raise ValueError("successful work discovery limit must be between 1 and 1000")
                  try:
                      with self._engine.connect() as connection:
                          statement = (
                              sa.select(work_units.c.work_id)
                              .where(
                                  work_units.c.state == "succeeded",
                                  ~sa.exists(
                                      sa.select(sa.literal(1)).where(
                                          pipeline_advancements.c.source_work_unit_id
                                          == work_units.c.work_id
                                      )
                                  ),
                              )
                              .order_by(work_units.c.updated_at_utc, work_units.c.work_id)
                              .limit(limit)
                          )
                          work_ids = tuple(
                              _uuid_value(value)
                              for value in connection.execute(statement).scalars()
                          )
                          return tuple(self.read(connection, work_id) for work_id in work_ids)
                  except PipelineAdvancementConflict:
                      raise
                  except SQLAlchemyError as exc:
                      raise PipelineAdvancementConflict(
                          code="PIPELINE_DISCOVERY_STORAGE_FAILED",
                          message="Successful work discovery did not complete.",
                          context={"causeType": type(exc).__name__},
                          required_action=(
                              "Inspect PostgreSQL owner state and retry exact discovery."
                          ),
                      ) from exc


          def _load_artifacts(
              connection: Connection,
              bindings: sa.Table,
              work_id: UUID,
          ) -> tuple[ArtifactIdentity, ...]:
              rows = (
                  connection.execute(
                      sa.select(
                          bindings.c.position,
                          bindings.c.role,
                          artifact_records.c.artifact_id,
                          artifact_records.c.content_type,
                          artifact_objects.c.content_digest,
                          artifact_objects.c.size_bytes,
                      )
                      .select_from(
                          bindings.join(
                              artifact_records,
                              bindings.c.artifact_id == artifact_records.c.artifact_id,
                          ).join(
                              artifact_objects,
                              artifact_records.c.object_id == artifact_objects.c.object_id,
                          )
                      )
                      .where(bindings.c.work_id == work_id)
                      .order_by(bindings.c.position, bindings.c.artifact_id)
                  )
                  .mappings()
                  .all()
              )
              artifacts = tuple(
                  ArtifactIdentity(
                      artifact_id=_required_uuid(row, "artifact_id"),
                      role=_required_text(row, "role"),
                      content_digest=_required_text(row, "content_digest"),
                      size_bytes=_required_non_negative_int(row, "size_bytes"),
                      content_type=_required_text(row, "content_type"),
                  )
                  for row in rows
              )
              identities = tuple(item.artifact_id for item in artifacts)
              roles = tuple(item.role for item in artifacts)
              if len(identities) != len(set(identities)) or len(roles) != len(set(roles)):
                  raise _catalog_conflict(
                      "PIPELINE_ARTIFACT_BINDING_DUPLICATE",
                      "Successful work contains duplicate artifact bindings.",
                      work_id,
                      "Repair duplicate immutable bindings before advancement.",
                  )
              return artifacts


          def _required_text(row: RowMapping, key: str) -> str:
              value = row[key]
              if not isinstance(value, str) or not value:
                  raise TypeError(f"persisted {key} is not non-empty text")
              return value


          def _required_uuid(row: RowMapping, key: str) -> UUID:
              return _uuid_value(row[key])


          def _uuid_value(value: object) -> UUID:
              if isinstance(value, UUID):
                  return value
              if isinstance(value, str):
                  return UUID(value)
              raise TypeError("persisted UUID identity has an unsupported representation")


          def _required_non_negative_int(row: RowMapping, key: str) -> int:
              value = row[key]
              if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                  raise TypeError(f"persisted {key} is not a non-negative integer")
              return value


          def _catalog_conflict(
              code: str,
              message: str,
              source_work_unit_id: UUID,
              required_action: str,
          ) -> PipelineAdvancementConflict:
              return PipelineAdvancementConflict(
                  code=code,
                  message=message,
                  context={"sourceWorkUnitId": str(source_work_unit_id)},
                  required_action=required_action,
              )
          PY

      - name: Synchronize workspace and generated owners
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py
          fi
          if test -f tools/control_api_contract_generation/generate.py; then
            uv run python tools/control_api_contract_generation/generate.py
          fi
          uv run ruff check . --fix --unsafe-fixes
          uv run ruff format .

          checker=tools/architecture_checks/check_dependencies.py
          policy="$(uv run python "$checker" --print-policy)"
          python - "$policy" <<'PY'
          from pathlib import Path
          import sys

          path = Path("docs/architecture/dependency-rules.md")
          if not path.exists():
              raise SystemExit(0)
          policy = sys.argv[1]
          text = path.read_text(encoding="utf-8")
          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              path.write_text(text[:start] + policy + text[end:], encoding="utf-8")
          PY

      - name: Prove complete owner
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py --check
          fi
          if test -f tools/control_api_contract_generation/generate.py; then
            uv run python tools/control_api_contract_generation/generate.py --check
          fi
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build \
            --file deploy/docker/pipeline-supervisor.Dockerfile \
            --tag data-collection-platform/pipeline-supervisor:repair \
            .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/pipeline-supervisor:repair)" = "10001:10001"

      - name: Commit repaired production owner
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git reset .github/workflows
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Pipeline owner already reconciled."
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Pipeline): align durable advancement with canonical work schema"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
