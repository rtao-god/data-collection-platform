name: HTTP Acquisition

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/http-acquisition.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - apps/http_worker/**
      - connectors/official_website_http/**
      - packages/source_connector_sdk/**
      - deploy/docker/http-worker.Dockerfile
      - tools/http_acquisition_contract_generation/**
      - contracts/http_acquisition/**
      - tools/architecture_checks/check_dependencies.py
  pull_request:
    paths:
      - .github/workflows/http-acquisition.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - apps/http_worker/**
      - connectors/official_website_http/**
      - packages/source_connector_sdk/**
      - deploy/docker/http-worker.Dockerfile
      - tools/http_acquisition_contract_generation/**
      - contracts/http_acquisition/**
      - tools/architecture_checks/check_dependencies.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-http-acquisition:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify HTTP acquisition contract drift
        run: uv run python tools/http_acquisition_contract_generation/generate.py --check

      - name: Verify HTTP acquisition formatting
        run: >-
          uv run ruff format --check
          apps/http_worker
          connectors/official_website_http
          tools/http_acquisition_contract_generation

      - name: Lint HTTP acquisition owners
        run: >-
          uv run ruff check
          apps/http_worker
          connectors/official_website_http
          tools/http_acquisition_contract_generation

      - name: Type-check all registered owners
        run: uv run mypy

      - name: Run HTTP acquisition tests
        run: >-
          uv run pytest -q
          apps/http_worker/tests
          connectors/official_website_http/tests
          tools/http_acquisition_contract_generation/tests

      - name: Verify dependency boundaries
        run: uv run python tools/architecture_checks/check_dependencies.py

      - name: Build HTTP worker image
        run: >-
          docker build
          --tag data-collection-platform/http-worker:ci
          --file deploy/docker/http-worker.Dockerfile
          .

      - name: Verify HTTP worker image isolation
        shell: bash
        run: |
          set -euo pipefail
          image=data-collection-platform/http-worker:ci
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image")" = "http-worker"
          docker run --rm -i --entrypoint python "$image" - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          import_module("http_worker")
          import_module("official_website_http")
          import_module("source_connector_sdk")
          import_module("scrapy")

          forbidden = {
              "alembic",
              "boto3",
              "botocore",
              "playwright",
              "psycopg",
              "sqlalchemy",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit(
                  "HTTP worker image contains forbidden dependencies: "
                  + ", ".join(present)
              )
          PY
