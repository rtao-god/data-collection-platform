name: Generate Contract Artifact

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-contract-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Generate owner contracts
        run: uv run python tools/contract_generation/generate.py

      - name: Verify generated owner contracts
        run: uv run python tools/contract_generation/generate.py --check

      - name: Upload generated contracts
        uses: actions/upload-artifact@v4
        with:
          name: generated-owner-contracts
          path: |
            contracts/openapi/worker-gateway.openapi.json
            contracts/json_schema/
          if-no-files-found: error
          retention-days: 1
