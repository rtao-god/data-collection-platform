name: Implement HTTP Crawl Planning

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/implement-http-planning.yml

permissions:
  contents: write

concurrency:
  group: implement-http-crawl-planning
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check prerequisite
        id: prerequisite
        shell: bash
        run: |
          if [ -f docs/proofs/reconciled-baseline.md ] && [ -f connectors/http_web/src/http_web/fetcher.py ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact Python
        if: steps.prerequisite.outputs.ready == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        if: steps.prerequisite.outputs.ready == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Add robots and sitemap planning contracts
        if: steps.prerequisite.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > connectors/http_web/src/http_web/robots.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from decimal import Decimal, InvalidOperation
          from urllib.parse import urlsplit


          @dataclass(frozen=True, slots=True)
          class RobotsRule:
              allow: bool
              path: str


          @dataclass(frozen=True, slots=True)
          class RobotsPolicy:
              user_agent: str
              rules: tuple[RobotsRule, ...]
              crawl_delay_seconds: Decimal | None
              sitemaps: tuple[str, ...]

              def allows(self, url: str) -> bool:
                  path = urlsplit(url).path or "/"
                  matches = [rule for rule in self.rules if path.startswith(rule.path)]
                  if not matches:
                      return True
                  longest = max(len(rule.path) for rule in matches)
                  finalists = [rule for rule in matches if len(rule.path) == longest]
                  return any(rule.allow for rule in finalists)


          @dataclass(frozen=True, slots=True)
          class _Group:
              agents: tuple[str, ...]
              rules: tuple[RobotsRule, ...]
              crawl_delay_seconds: Decimal | None


          def parse_robots_txt(payload: bytes, *, user_agent: str) -> RobotsPolicy:
              if len(payload) > 512 * 1024:
                  raise ValueError("robots.txt exceeds the byte limit")
              try:
                  text = payload.decode("utf-8-sig")
              except UnicodeDecodeError as error:
                  raise ValueError("robots.txt is not valid UTF-8") from error
              groups: list[_Group] = []
              agents: list[str] = []
              rules: list[RobotsRule] = []
              crawl_delay: Decimal | None = None
              sitemaps: list[str] = []
              seen_directive = False

              def flush() -> None:
                  nonlocal agents, rules, crawl_delay, seen_directive
                  if agents:
                      groups.append(
                          _Group(
                              agents=tuple(agents),
                              rules=tuple(rules),
                              crawl_delay_seconds=crawl_delay,
                          )
                      )
                  agents = []
                  rules = []
                  crawl_delay = None
                  seen_directive = False

              for raw_line in text.splitlines():
                  line = raw_line.split("#", 1)[0].strip()
                  if not line or ":" not in line:
                      continue
                  name, raw_value = line.split(":", 1)
                  directive = name.strip().lower()
                  value = raw_value.strip()
                  if directive == "user-agent":
                      if seen_directive:
                          flush()
                      agents.append(value.lower())
                  elif directive in {"allow", "disallow"} and agents:
                      seen_directive = True
                      if value or directive == "allow":
                          rules.append(RobotsRule(allow=directive == "allow", path=value or "/"))
                  elif directive == "crawl-delay" and agents:
                      seen_directive = True
                      crawl_delay = _crawl_delay(value)
                  elif directive == "sitemap" and value:
                      sitemaps.append(value)
              flush()

              selected = _select_group(groups, user_agent=user_agent.lower())
              return RobotsPolicy(
                  user_agent=user_agent,
                  rules=selected.rules if selected is not None else (),
                  crawl_delay_seconds=(
                      selected.crawl_delay_seconds if selected is not None else None
                  ),
                  sitemaps=tuple(dict.fromkeys(sitemaps)),
              )


          def _select_group(groups: list[_Group], *, user_agent: str) -> _Group | None:
              matches: list[tuple[int, _Group]] = []
              for group in groups:
                  lengths = [
                      len(agent)
                      for agent in group.agents
                      if agent == "*" or agent in user_agent
                  ]
                  if lengths:
                      matches.append((max(lengths), group))
              if not matches:
                  return None
              specificity = max(length for length, _ in matches)
              selected = [group for length, group in matches if length == specificity]
              rules = tuple(rule for group in selected for rule in group.rules)
              delays = [
                  group.crawl_delay_seconds
                  for group in selected
                  if group.crawl_delay_seconds is not None
              ]
              return _Group(
                  agents=(user_agent,),
                  rules=rules,
                  crawl_delay_seconds=max(delays) if delays else None,
              )


          def _crawl_delay(value: str) -> Decimal:
              try:
                  delay = Decimal(value)
              except InvalidOperation as error:
                  raise ValueError("robots crawl-delay is invalid") from error
              if not delay.is_finite() or delay < 0 or delay > 3600:
                  raise ValueError("robots crawl-delay is outside the supported range")
              return delay
          PY

          cat > connectors/http_web/src/http_web/sitemap.py <<'PY'
          from __future__ import annotations

          import xml.etree.ElementTree as element_tree
          from dataclasses import dataclass
          from urllib.parse import urlsplit

          _MAX_SITEMAP_BYTES = 8 * 1024 * 1024
          _MAX_ENTRIES = 50_000


          @dataclass(frozen=True, slots=True)
          class SitemapDocument:
              page_urls: tuple[str, ...]
              child_sitemaps: tuple[str, ...]


          def parse_sitemap(payload: bytes) -> SitemapDocument:
              if len(payload) > _MAX_SITEMAP_BYTES:
                  raise ValueError("sitemap exceeds the byte limit")
              upper = payload[:4096].upper()
              if b"<!DOCTYPE" in upper or b"<!ENTITY" in upper:
                  raise ValueError("sitemap document type declarations are forbidden")
              try:
                  root = element_tree.fromstring(payload)
              except element_tree.ParseError as error:
                  raise ValueError("sitemap XML is invalid") from error
              root_name = _local_name(root.tag)
              if root_name not in {"urlset", "sitemapindex"}:
                  raise ValueError("sitemap root must be urlset or sitemapindex")
              values: list[str] = []
              for element in root.iter():
                  if _local_name(element.tag) != "loc" or element.text is None:
                      continue
                  value = element.text.strip()
                  if value:
                      _absolute_http_url(value)
                      values.append(value)
                  if len(values) > _MAX_ENTRIES:
                      raise ValueError("sitemap entry limit was exceeded")
              unique = tuple(dict.fromkeys(values))
              if root_name == "urlset":
                  return SitemapDocument(page_urls=unique, child_sitemaps=())
              return SitemapDocument(page_urls=(), child_sitemaps=unique)


          def _absolute_http_url(value: str) -> None:
              parsed = urlsplit(value)
              if parsed.scheme.lower() not in {"http", "https"} or parsed.hostname is None:
                  raise ValueError("sitemap loc must be an absolute HTTP URL")
              if parsed.username is not None or parsed.password is not None:
                  raise ValueError("sitemap loc cannot contain credentials")


          def _local_name(tag: str) -> str:
              return tag.rsplit("}", 1)[-1].lower()
          PY

          cat > connectors/http_web/src/http_web/planning.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from hashlib import sha256
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit


          @dataclass(frozen=True, slots=True)
          class CrawlTarget:
              url: str
              semantic_key: str
              depth: int
              discovered_from: str | None


          @dataclass(frozen=True, slots=True)
          class CrawlPlan:
              targets: tuple[CrawlTarget, ...]
              digest: str


          def build_same_origin_plan(
              seed_url: str,
              discovered_urls: tuple[str, ...],
              *,
              maximum_targets: int = 10_000,
          ) -> CrawlPlan:
              if maximum_targets <= 0:
                  raise ValueError("maximum target count must be positive")
              canonical_seed = canonical_http_url(seed_url)
              origin = _origin(canonical_seed)
              ordered: list[CrawlTarget] = []
              seen: set[str] = set()
              for depth, raw_url, source in _candidates(canonical_seed, discovered_urls):
                  canonical = canonical_http_url(raw_url)
                  if _origin(canonical) != origin or canonical in seen:
                      continue
                  seen.add(canonical)
                  ordered.append(
                      CrawlTarget(
                          url=canonical,
                          semantic_key=f"http-url:{canonical}",
                          depth=depth,
                          discovered_from=source,
                      )
                  )
                  if len(ordered) > maximum_targets:
                      raise ValueError("crawl target limit was exceeded")
              payload = "\n".join(target.semantic_key for target in ordered).encode("utf-8")
              return CrawlPlan(
                  targets=tuple(ordered),
                  digest=f"sha256:{sha256(payload).hexdigest()}",
              )


          def canonical_http_url(url: str) -> str:
              parsed = urlsplit(url)
              scheme = parsed.scheme.lower()
              if scheme not in {"http", "https"} or parsed.hostname is None:
                  raise ValueError("crawl target must be an absolute HTTP URL")
              if parsed.username is not None or parsed.password is not None:
                  raise ValueError("crawl target cannot contain credentials")
              host = parsed.hostname.rstrip(".").lower()
              port = parsed.port
              default_port = 443 if scheme == "https" else 80
              display_host = f"[{host}]" if ":" in host else host
              netloc = display_host if port in {None, default_port} else f"{display_host}:{port}"
              query = urlencode(sorted(parse_qsl(parsed.query, keep_blank_values=True)), doseq=True)
              return urlunsplit((scheme, netloc, parsed.path or "/", query, ""))


          def _origin(url: str) -> tuple[str, str, int]:
              parsed = urlsplit(url)
              scheme = parsed.scheme.lower()
              return scheme, parsed.hostname or "", parsed.port or (443 if scheme == "https" else 80)


          def _candidates(
              seed_url: str,
              discovered_urls: tuple[str, ...],
          ) -> tuple[tuple[int, str, str | None], ...]:
              return ((0, seed_url, None),) + tuple(
                  (1, value, seed_url) for value in discovered_urls
              )
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('connectors/http_web/src/http_web/__init__.py')
          text = path.read_text(encoding='utf-8')
          imports = '''from http_web.planning import CrawlPlan, CrawlTarget, build_same_origin_plan, canonical_http_url
          from http_web.robots import RobotsPolicy, RobotsRule, parse_robots_txt
          from http_web.sitemap import SitemapDocument, parse_sitemap
          '''
          if 'from http_web.planning import' not in text:
              text = imports + text
          names = (
              '    "CrawlPlan",\n'
              '    "CrawlTarget",\n'
              '    "RobotsPolicy",\n'
              '    "RobotsRule",\n'
              '    "SitemapDocument",\n'
              '    "build_same_origin_plan",\n'
              '    "canonical_http_url",\n'
              '    "parse_robots_txt",\n'
              '    "parse_sitemap",\n'
          )
          if '    "CrawlPlan",' not in text:
              text = text.replace('__all__ = [\n', '__all__ = [\n' + names, 1)
          path.write_text(text, encoding='utf-8')
          PY

          cat > connectors/http_web/tests/test_robots.py <<'PY'
          from decimal import Decimal

          from http_web import parse_robots_txt


          def test_specific_group_and_longest_rule_win() -> None:
              policy = parse_robots_txt(
                  b"""
                  User-agent: *
                  Disallow: /
                  User-agent: Collector
                  Disallow: /private
                  Allow: /private/public
                  Crawl-delay: 1.5
                  Sitemap: https://example.com/sitemap.xml
                  """,
                  user_agent="Collector/1.0",
              )
              assert policy.allows("https://example.com/")
              assert not policy.allows("https://example.com/private/item")
              assert policy.allows("https://example.com/private/public/item")
              assert policy.crawl_delay_seconds == Decimal("1.5")
              assert policy.sitemaps == ("https://example.com/sitemap.xml",)


          def test_allow_wins_equal_length_tie() -> None:
              policy = parse_robots_txt(
                  b"User-agent: *\nDisallow: /x\nAllow: /x\n",
                  user_agent="Collector",
              )
              assert policy.allows("https://example.com/x")
          PY

          cat > connectors/http_web/tests/test_sitemap.py <<'PY'
          import pytest

          from http_web import parse_sitemap


          def test_urlset_is_parsed_in_source_order_with_deduplication() -> None:
              document = parse_sitemap(
                  b"""<?xml version='1.0'?>
                  <urlset xmlns='http://www.sitemaps.org/schemas/sitemap/0.9'>
                    <url><loc>https://example.com/a</loc></url>
                    <url><loc>https://example.com/b</loc></url>
                    <url><loc>https://example.com/a</loc></url>
                  </urlset>"""
              )
              assert document.page_urls == (
                  "https://example.com/a",
                  "https://example.com/b",
              )
              assert document.child_sitemaps == ()


          def test_document_type_is_rejected() -> None:
              with pytest.raises(ValueError, match="declarations"):
                  parse_sitemap(b"<!DOCTYPE x><urlset />")
          PY

          cat > connectors/http_web/tests/test_planning.py <<'PY'
          from http_web import build_same_origin_plan, canonical_http_url


          def test_canonical_url_sorts_query_and_removes_fragment() -> None:
              assert canonical_http_url("HTTPS://Example.COM/a?z=2&a=1#x") == (
                  "https://example.com/a?a=1&z=2"
              )


          def test_plan_is_same_origin_deterministic_and_deduplicated() -> None:
              first = build_same_origin_plan(
                  "https://example.com/",
                  (
                      "https://example.com/b?z=2&a=1",
                      "https://other.example/x",
                      "https://example.com/b?a=1&z=2#fragment",
                  ),
              )
              second = build_same_origin_plan(
                  "https://example.com/",
                  (
                      "https://example.com/b?z=2&a=1",
                      "https://other.example/x",
                      "https://example.com/b?a=1&z=2#fragment",
                  ),
              )
              assert [target.url for target in first.targets] == [
                  "https://example.com/",
                  "https://example.com/b?a=1&z=2",
              ]
              assert first.digest == second.digest
          PY

          cat > docs/http-crawl-planning.md <<'EOF'
          # HTTP crawl planning

          Robots evaluation, sitemap parsing, and canonical same-origin queue planning are deterministic
          connector-core operations. They do not own retries, leases, source capacity, or worker
          checkpoints. Canonical work identity is `http-url:<canonical-url>`; Collection Work Engine
          remains the durable queue owner.
          EOF

      - name: Verify planning owner
        if: steps.prerequisite.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          uv run ruff format connectors/http_web
          uv run ruff check connectors/http_web
          uv run mypy
          uv run pytest -q connectors/http_web/tests
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q connectors/http_web

      - name: Commit planning owner
        if: steps.prerequisite.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add connectors/http_web/src/http_web
          git diff --cached --check
          git commit -m 'Feature (HTTP Planning): add robots sitemap and canonical queue contracts'
          git add connectors/http_web/tests
          git commit -m 'New tests (HTTP Planning): prove deterministic crawl policy'
          git add docs/http-crawl-planning.md
          git commit -m 'Docs (HTTP Planning): document queue ownership boundary'

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git pull --rebase origin main
          git rm -f --ignore-unmatch .github/workflows/implement-http-planning.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Chore (Tooling): remove HTTP planning workflow'
          fi
          git push origin HEAD:main
