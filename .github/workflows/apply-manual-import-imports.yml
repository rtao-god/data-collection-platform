name: Apply Manual Import Imports

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-manual-import-imports.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-manual-import-imports
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Apply exact import ordering
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/collection_application/src/collection_application/manual_import_plan_document.py
            packages/collection_application/tests/test_manual_import_admission.py
            packages/collection_application/tests/test_manual_import_plan_document.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/manual_import_admission.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/manual_import_child_writer.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/manual_import_metadata.py
            packages/collection_infrastructure/tests/test_manual_import_admission.py
            packages/collection_infrastructure/tests/test_manual_import_child_writer.py
            packages/collection_infrastructure/tests/test_manual_import_metadata.py
          )
          uv run ruff check --fix --select I "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          changed="$(git diff --name-only -- "${files[@]}" | sort)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          test "$changed" = "$expected"
      - name: Commit exact owner cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-manual-import-imports.yml
          git rm .github/workflows/export-source-snapshot.yml
          git add packages/collection_application packages/collection_infrastructure
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Chore (Manual Import): organize owner imports"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
