name: Apply Vertical Data Flow E2E Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-vertical-data-flow-e2e.yml
      - .github/apply/vertical-data-flow-e2e.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-apply-vertical-data-flow-e2e
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply reviewed owner patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if test -f tools/e2e_smoke/external_flow.py; then
            exit 0
          fi
          test -s .github/apply/vertical-data-flow-e2e.patch
          git apply --index --3way .github/apply/vertical-data-flow-e2e.patch
          git diff --cached --check

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify repository baseline
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

      - name: Commit production test owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/apply-vertical-data-flow-e2e.yml \
            .github/apply/vertical-data-flow-e2e.patch
          git add .github/workflows/vertical-data-flow-e2e.yml tools/e2e_smoke tests/fixtures/e2e_site
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Tests (E2E): prove download storage and resolution flow"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
