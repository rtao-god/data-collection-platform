name: Finalize Review Console Runtime V3B

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-review-console-runtime-v3b.yml]
  workflow_dispatch:

concurrency:
  group: data-collection-platform-finalize-review-console-runtime
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download fresh content-addressed owner state
        shell: bash
        run: |
          set -euo pipefail
          base='https://filebin.net/dcp-review-v3b-c187c1704e0148fdb5580629d93e4c14'
          for _ in $(seq 1 1800); do if curl -fsS "$base/locator.txt" -o /tmp/locator.txt; then break; fi; sleep 10; done
          test -s /tmp/locator.txt
          locator="$(tr -d '\r\n' </tmp/locator.txt)"
          if [ "$locator" = failed ]; then curl -fsS "$base/failure.json" -o /tmp/failure.json||true;curl -fsS "$base/failure.log" -o /tmp/failure.log||true;cat /tmp/failure.json /tmp/failure.log 2>/dev/null||true;exit 1;fi
          curl -fsS "$base/state.json" -o /tmp/state.json
          phase="$(python - <<'PY'
          import json
          c=(json.load(open('/tmp/state.json')).get('commit') or {})
          m=(c.get('message') or '').casefold();f=c.get('files') or []
          print('operations-repair' if 'operations' in m else 'review-console' if any(str(x).startswith('web/review_console/') for x in f) or c.get('mode')=='already-complete' else 'unknown')
          PY
          )"
          [ "$phase" != unknown ];printf '%s\n' "$phase" >/tmp/phase.txt
          if [ "$locator" = already-complete ];then printf 'already-complete\n' >/tmp/mode.txt;: >/tmp/owner.patch;else [[ "$locator" =~ ^[0-9a-f]{64}$ ]];curl -fsS "$base/${locator}.patch" -o /tmp/owner.patch;printf '%s  %s\n' "$locator" /tmp/owner.patch|sha256sum -c -;printf 'patch\n' >/tmp/mode.txt;fi
          for _ in $(seq 1 180);do if curl -fsS "$base/command-locator.txt" -o /tmp/command-locator.txt;then break;fi;sleep 10;done
          csha="$(tr -d '\r\n' </tmp/command-locator.txt)";[[ "$csha" =~ ^[0-9a-f]{64}$ ]];curl -fsS "$base/${csha}.sh" -o /tmp/runtime.sh;printf '%s  %s\n' "$csha" /tmp/runtime.sh|sha256sum -c -
      - name: Enforce and apply owner patch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/mode.txt)" = patch ];then
            git apply --numstat /tmp/owner.patch >/tmp/numstat.txt
            python - <<'PY'
          from pathlib import PurePosixPath
          phase=open('/tmp/phase.txt').read().strip();allowed={'.codex','apps','campaigns','contracts','database','deploy','docs','packages','tools','web','pyproject.toml','uv.lock','package.json','pnpm-lock.yaml','package-lock.json','yarn.lock','pnpm-workspace.yaml'};permanent={'.github/workflows/review-console-ci.yml','.github/workflows/review-console.yml','.github/workflows/frontend-ci.yml'};paths=[]
          for raw in open('/tmp/numstat.txt',encoding='utf-8'):
              p=raw.rstrip('\n').split('\t')
              if len(p)!=3:raise SystemExit('invalid numstat')
              path=p[2];pure=PurePosixPath(path)
              if pure.is_absolute() or '..' in pure.parts:raise SystemExit(f'unsafe {path}')
              if path.startswith('.github/') and path not in permanent:raise SystemExit(f'unapproved {path}')
              if path.startswith(('.git/','deploy/compose/.secrets/')):raise SystemExit(f'forbidden {path}')
              if pure.parts[0] not in allowed and path not in permanent:raise SystemExit(f'unregistered {path}')
              paths.append(path)
          if len(paths)!=len(set(paths)) or len(paths)>320:raise SystemExit('invalid breadth')
          joined='\n'.join(paths).casefold()
          if phase=='review-console' and not any(x.startswith('web/review_console/') for x in paths):raise SystemExit('review console missing')
          if phase=='operations-repair' and not any(x in joined for x in ('retention','backup','restore','orchestrat','dagster')):raise SystemExit('operations missing')
          PY
            git am --3way /tmp/owner.patch
          fi
          rm -f .github/workflows/finalize-review-console-runtime*.yml .github/workflows/finalize-operations-runtime*.yml .github/workflows/finalize-browser-acquisition-runtime.yml .github/workflows/finalize-reviewed-export-runtime.yml .github/workflows/finalize-berlin-manual-seed-runtime.yml .github/workflows/finalize-manual-seed-candidate-vertical.yml .github/workflows/apply-manual-seed-candidate-vertical.yml
          git diff --check
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.10.0'
          enable-cache: true
      - uses: actions/setup-node@v5
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        with:
          node-version: '24'
      - run: uv sync --frozen --all-packages --dev
      - name: Backend gate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run collector config validate berlin_recording_services
          uv run python -m compileall -q apps connectors database packages tools
      - name: Review console gate
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        shell: bash
        working-directory: web/review_console
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ];then corepack enable;pnpm install --frozen-lockfile;r='pnpm run';elif [ -f package-lock.json ];then npm ci;r='npm run';elif [ -f yarn.lock ];then corepack enable;yarn install --immutable;r='yarn';else exit 1;fi
          node - <<'JS' >/tmp/scripts
          const s=require('./package.json').scripts||{};for(const q of ['lint','typecheck','build'])if(!s[q])process.exitCode=1;for(const q of ['generate:check','client:check','contracts:check','lint','typecheck','test','test:unit','build'])if(s[q])console.log(q)
          JS
          while read -r s;do $r "$s";done </tmp/scripts
      - name: Clean runtime proof
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/data
          sed -i "s#/mnt/data/dcp_work#${GITHUB_WORKSPACE}#g" /tmp/runtime.sh
          chmod +x /tmp/runtime.sh
          /tmp/runtime.sh|tee /tmp/runtime.log
      - uses: actions/upload-artifact@v4
        with:
          name: verified-review-console-runtime-v3b
          path: |
            /tmp/mode.txt
            /tmp/locator.txt
            /tmp/owner.patch
            /tmp/phase.txt
            /tmp/runtime.log
          if-no-files-found: error
          retention-days: 1
  commit:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-review-console-runtime-v3b
          path: /tmp/v
      - name: Commit verified owner and purge temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          mode="$(tr -d '\r\n' </tmp/v/mode.txt)"
          if [ "$mode" = patch ];then sha="$(tr -d '\r\n' </tmp/v/locator.txt)";printf '%s  %s\n' "$sha" /tmp/v/owner.patch|sha256sum -c -;git am --3way /tmp/v/owner.patch;elif [ "$mode" != already-complete ];then exit 1;fi
          git rm -f --ignore-unmatch .github/workflows/finalize-review-console-runtime*.yml .github/workflows/finalize-operations-runtime*.yml .github/workflows/finalize-browser-acquisition-runtime.yml .github/workflows/finalize-reviewed-export-runtime.yml .github/workflows/finalize-berlin-manual-seed-runtime.yml .github/workflows/finalize-manual-seed-candidate-vertical.yml .github/workflows/apply-manual-seed-candidate-vertical.yml
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if [ "$mode" = patch ];then git commit --amend --no-edit;else git commit -m 'Build (Review): remove completed transports';fi
          git diff HEAD^ --check
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
