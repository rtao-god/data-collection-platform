name: Fix Connector SDK Lint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-sdk-lint.yml

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply exact connector SDK lint fixes
        run: |
          uv sync --frozen --all-packages --dev
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/source_connector_sdk/src/source_connector_sdk/gateway.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '                message="The verified upload response does not match the requested work and upload.",': (
                  '                message=(\n'
                  '                    "The verified upload response does not match the requested work and upload."\n'
                  '                ),'
              ),
              '                required_action="Restore Worker Gateway connectivity and retry the same work action.",': (
                  '                required_action=(\n'
                  '                    "Restore Worker Gateway connectivity and retry the same work action."\n'
                  '                ),'
              ),
              '                message="Worker Gateway returned a non-success response without its error contract.",': (
                  '                message=(\n'
                  '                    "Worker Gateway returned a non-success response without its error contract."\n'
                  '                ),'
              ),
              '            required_action="Inspect the scoped object transfer and retry only while the URL is valid.",': (
                  '            required_action=(\n'
                  '                "Inspect the scoped object transfer and retry only while the URL is valid."\n'
                  '            ),'
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one lint target: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff check --fix \
            packages/source_connector_sdk/src/source_connector_sdk/__init__.py \
            packages/source_connector_sdk/src/source_connector_sdk/gateway.py \
            packages/source_connector_sdk/tests/test_gateway.py
          uv run ruff format \
            packages/source_connector_sdk/src/source_connector_sdk/__init__.py \
            packages/source_connector_sdk/src/source_connector_sdk/gateway.py \
            packages/source_connector_sdk/tests/test_gateway.py
          uv run ruff check \
            packages/source_connector_sdk/src/source_connector_sdk/__init__.py \
            packages/source_connector_sdk/src/source_connector_sdk/gateway.py \
            packages/source_connector_sdk/tests/test_gateway.py
          git add \
            packages/source_connector_sdk/src/source_connector_sdk/__init__.py \
            packages/source_connector_sdk/src/source_connector_sdk/gateway.py \
            packages/source_connector_sdk/tests/test_gateway.py
          git rm .github/workflows/fix-sdk-lint.yml
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Style (Connector SDK): satisfy canonical lint contract'
          git push origin HEAD:main
