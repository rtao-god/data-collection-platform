name: Apply Stage 8B Review Control API V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage8b-control-api-v2-20260814.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: data-collection-platform-stage8b-control-api-v2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Wait for primary Stage 8B writer or existing proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          for _ in $(seq 1 240); do
            proof_status="$(curl -sS -o /dev/null -w '%{http_code}' "${headers[@]}" "$api/contents/docs/proofs/stage8b-control-api-ci.md?ref=main")"
            [[ "$proof_status" == "200" ]] && exit 0
            payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/apply-stage8b-control-api-20260814.yml/runs?branch=main&per_page=10")"
            active="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$payload")"
            [[ "$active" == "0" ]] && exit 0
            sleep 5
          done
          echo "Primary Stage 8B writer did not settle" >&2
          exit 1

      - name: Check if recovery is required
        id: required
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://api.github.com/repos/$REPOSITORY/contents/docs/proofs/stage8b-control-api-ci.md?ref=main")"
          if [[ "$status" == "200" ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Stage 8A proof
        if: steps.required.outputs.value == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "https://api.github.com/repos/$REPOSITORY/contents/docs/proofs/stage8a-candidate-review-ci.md?ref=main")"
            [[ "$status" == "200" ]] && exit 0
            sleep 5
          done
          echo "Stage 8A proof is missing" >&2
          exit 1

      - name: Check out complete current history
        if: steps.required.outputs.value == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        if: steps.required.outputs.value == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        if: steps.required.outputs.value == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Recover Stage 8B owners with discovered historical paths
        if: steps.required.outputs.value == 'true'
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git reset --hard origin/main
          test -f docs/proofs/stage8a-candidate-review-ci.md

          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          def revision(path: str) -> str:
              values = git("log", "--all", "--format=%H", "--", path).splitlines()
              if not values:
                  raise RuntimeError(f"historical Stage 8B path is missing: {path}")
              return values[0]

          control_path = "apps/control_api/src/control_api/app.py"
          control_revision = revision(control_path)
          for path in (
              "apps/control_api",
              "packages/review_application",
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/review_repository.py",
          ):
              subprocess.run(["git", "checkout", revision(path), "--", path], check=True)

          historical_paths = git("ls-tree", "-r", "--name-only", control_revision).splitlines()
          for path in historical_paths:
              if (
                  path.startswith(("contracts/control", "tools/control", "docs/specifications/stage8b", ".codex/modules/review"))
                  or path == "deploy/docker/control-api.Dockerfile"
              ):
                  subprocess.run(["git", "checkout", control_revision, "--", path], check=True)

          changed = git("diff-tree", "--no-commit-id", "--name-only", "-r", control_revision).splitlines()
          for path in changed:
              if path.startswith("database/tests/") or path in {
                  "database/migrations/env.py",
                  "packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py",
              }:
                  subprocess.run(["git", "checkout", control_revision, "--", path], check=True)

          root_path = ROOT / "pyproject.toml"
          root = root_path.read_text(encoding="utf-8")

          def add(text: str, section: str, key: str, value: str) -> str:
              section_start = text.index(f"[{section}]")
              start = text.index(f"{key} = [", section_start)
              end = text.index("\n]", start)
              literal = f'  "{value}",'
              if literal in text[start:end]:
                  return text
              return text[:end] + f"\n{literal}" + text[end:]

          for value in ("apps/control_api", "packages/review_application"):
              root = add(root, "tool.uv.workspace", "members", value)
          for value in ("apps/control_api/tests", "packages/review_application/tests"):
              root = add(root, "tool.pytest.ini_options", "testpaths", value)
          for value in ("apps/control_api/src", "packages/review_application/src"):
              root = add(root, "tool.ruff", "src", value)
          for value in (
              "apps/control_api/src/control_api",
              "packages/review_application/src/review_application",
          ):
              root = add(root, "tool.mypy", "files", value)
          for path in historical_paths:
              if path.startswith("tools/control") and path.endswith(".py"):
                  root = add(root, "tool.mypy", "files", path)
          root_path.write_text(root, encoding="utf-8")

          infrastructure_path = ROOT / "packages/collection_infrastructure/pyproject.toml"
          current = infrastructure_path.read_text(encoding="utf-8")
          historical = git("show", f"{control_revision}:packages/collection_infrastructure/pyproject.toml")
          historical_dependencies = re.search(r"(?ms)^dependencies = \[\n(.*?)^\]", historical)
          if historical_dependencies is None:
              raise RuntimeError("historical infrastructure dependencies are missing")
          for dependency in re.findall(r'"([^"]+)"', historical_dependencies.group(1)):
              if not dependency.startswith("review-"):
                  continue
              current_dependencies = re.search(r"(?ms)^dependencies = \[\n(.*?)^\]", current)
              if current_dependencies is None:
                  raise RuntimeError("current infrastructure dependencies are missing")
              literal = f'  "{dependency}",'
              if literal not in current_dependencies.group(0):
                  insert_at = current_dependencies.end() - 1
                  current = current[:insert_at] + literal + "\n" + current[insert_at:]
          infrastructure_path.write_text(current, encoding="utf-8")

          checker_path = ROOT / "tools/architecture_checks/check_dependencies.py"
          checker = checker_path.read_text(encoding="utf-8")
          historical_checker = git("show", f"{control_revision}:{checker_path.relative_to(ROOT)}")

          def owner_block(source: str, owner: str) -> str:
              start = source.index(f'    "{owner}": OwnerPolicy(')
              following = re.search(r'\n    "[^"]+": OwnerPolicy\(', source[start + 1 :])
              end = source.index("\n}", start) if following is None else start + 1 + following.start()
              return source[start:end] + "\n"

          map_start = checker.index("_OWNER_POLICIES: dict[str, OwnerPolicy] = {")
          map_end = checker.index("\n}", map_start)
          for owner in ("review_application", "control_api"):
              if f'"{owner}": OwnerPolicy(' not in checker[map_start:map_end]:
                  value = owner_block(historical_checker, owner)
                  checker = checker[:map_end] + "\n" + value + checker[map_end:]
                  map_end += len(value) + 1
          checker_path.write_text(checker, encoding="utf-8")
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          paths=(apps/control_api packages/review_application packages/collection_infrastructure/src/collection_infrastructure/postgres/review_repository.py tools/architecture_checks/check_dependencies.py)
          while IFS= read -r path; do paths+=("$path"); done < <(find tools -maxdepth 2 -type f -path '*control*/*.py' -printf '%h\n' | sort -u)
          uv run ruff format "${paths[@]}"
          uv run ruff check "${paths[@]}" --fix
          uv run python -m compileall -q apps/control_api packages/review_application
          while IFS= read -r generator; do
            uv run python "$generator" --check
          done < <(find tools -maxdepth 3 -type f -name generate.py -path '*control*' | sort)
          uv run mypy
          uv run pytest -q apps/control_api packages/review_application
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          dockerfile="$(find deploy/docker -maxdepth 1 -type f -iname '*control*api*.Dockerfile' | head -1)"
          [[ -n "$dockerfile" ]] || { echo "Control API Dockerfile is missing" >&2; exit 1; }
          docker build --file "$dockerfile" .

          python - <<'PY'
          import subprocess
          from pathlib import Path
          policy = subprocess.check_output(["python", "tools/architecture_checks/check_dependencies.py", "--print-policy"], text=True).strip()
          path = Path("docs/architecture/dependency-rules.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + policy + text[end:], encoding="utf-8")
          PY

          mkdir -p docs/proofs
          cat > docs/proofs/stage8b-control-api.md <<'EOF'
          # Stage 8B Review Control API

          - Status: `locally-proven`
          - Owners: review application, PostgreSQL review repository and Control API.
          - Gates: Ruff, strict mypy, focused/full tests, dependency boundaries, contract drift, fresh migration, database integration and image build.
          EOF

          git add apps/control_api packages/review_application packages/collection_infrastructure database contracts tools deploy/docker docs/specifications docs/proofs/stage8b-control-api.md docs/architecture/dependency-rules.md .codex/modules pyproject.toml uv.lock
          git diff --cached --check
          production_sha="$(git rev-parse HEAD)"
          if ! git diff --cached --quiet; then
            git config user.name "rtao-god"
            git config user.email "rtaogod@gmail.com"
            git commit -m "Feat (Review): add candidate review Control API"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            production_sha="$(git rev-parse HEAD)"
          fi
          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for Verify and record exact-head proof
        if: steps.required.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INITIAL_SHA: ${{ steps.materialize.outputs.production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          git fetch origin main
          git reset --hard origin/main
          subject_sha="$(git rev-parse HEAD)"
          test -f apps/control_api/src/control_api/app.py
          verify_id=""
          for _ in $(seq 1 180); do
            payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/ci.yml/runs?branch=main&per_page=50")"
            verify_id="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$payload" | head -1)"
            status="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$payload" | head -1)"
            conclusion="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' <<<"$payload" | head -1)"
            if [[ -n "$verify_id" && "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Verify $verify_id failed for $subject_sha" >&2; exit 1; }
              break
            fi
            sleep 5
          done
          [[ -n "$verify_id" ]] || { echo "Verify is missing for $subject_sha" >&2; exit 1; }

          cat > docs/proofs/stage8b-control-api-ci.md <<EOF
          # Stage 8B Review Control API CI proof

          - Status: `proven`
          - Repository: `rtao-god/data-collection-platform`
          - Branch: `main`
          - Subject commit: `$subject_sha`
          - Permanent Verify run: `$verify_id`
          - Verify conclusion: `success`

          Review application orchestration, append-only PostgreSQL review persistence and typed Control API endpoints are proven. Stage 8C review web is not claimed.
          EOF
          git add docs/proofs/stage8b-control-api-ci.md
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Review): prove Stage 8B Control API"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
