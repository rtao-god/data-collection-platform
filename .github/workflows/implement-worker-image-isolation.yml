name: Implement Worker Image Isolation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/implement-worker-image-isolation.yml

permissions:
  contents: write

concurrency:
  group: data-collection-platform-owner-write
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Require a permanent green baseline
        run: |
          test -f docs/proofs/reconciled-baseline.md
          test -f docs/proofs/reconciled-baseline-ci.md

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Add isolated OSM worker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/docker
          cat > deploy/docker/osm-worker.Dockerfile <<'EOF'
          FROM python:3.13.14-slim AS build

          ENV PIP_DISABLE_PIP_VERSION_CHECK=1 \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONUNBUFFERED=1 \
              UV_LINK_MODE=copy

          WORKDIR /app
          RUN python -m pip install --no-cache-dir uv==0.10.0
          COPY . .
          RUN uv sync \
              --frozen \
              --package osm-worker \
              --no-dev \
              --no-editable

          FROM python:3.13.14-slim AS runtime

          ENV PATH="/app/.venv/bin:${PATH}" \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONUNBUFFERED=1

          WORKDIR /app
          COPY --from=build /app/.venv /app/.venv
          RUN groupadd --gid 10001 collector \
              && useradd --uid 10001 --gid 10001 --no-create-home --shell /usr/sbin/nologin collector
          USER 10001:10001
          ENTRYPOINT ["/app/.venv/bin/python", "-m", "osm_worker"]
          EOF

      - name: Extend permanent CI worker image proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          marker = '      - name: Build isolated worker images\n'
          if marker not in text:
              anchor = '      - name: Build Worker Gateway image\n'
              index = text.find(anchor)
              if index < 0:
                  raise RuntimeError('Worker Gateway image step was not found')
              next_step = text.find('\n      - name:', index + len(anchor))
              if next_step < 0:
                  next_step = len(text)
              block = '''\n      - name: Build isolated worker images\n        run: |\n          docker build --file deploy/docker/manual-import-worker.Dockerfile --tag data-collection-platform/manual-import-worker:ci .\n          docker build --file deploy/docker/osm-worker.Dockerfile --tag data-collection-platform/osm-worker:ci .\n\n      - name: Verify worker image capability inventory\n        run: |\n          python - <<'PY_IMAGE'\n          import subprocess\n\n          forbidden = (\n              "alembic",\n              "boto3",\n              "botocore",\n              "playwright",\n              "psycopg",\n              "scrapy",\n              "sqlalchemy",\n          )\n          required = {\n              "data-collection-platform/manual-import-worker:ci": (\n                  "manual_import_worker",\n                  "manual_import_core",\n                  "source_connector_sdk",\n              ),\n              "data-collection-platform/osm-worker:ci": (\n                  "osm_worker",\n                  "osm_overpass",\n                  "source_connector_sdk",\n              ),\n          }\n          script = """\n          import importlib.util\n          import json\n          import sys\n          names = json.loads(sys.argv[1])\n          print(json.dumps({name: importlib.util.find_spec(name) is not None for name in names}))\n          """\n          import json\n          for image, required_modules in required.items():\n              names = (*forbidden, *required_modules)\n              completed = subprocess.run(\n                  [\n                      "docker",\n                      "run",\n                      "--rm",\n                      "--entrypoint",\n                      "/app/.venv/bin/python",\n                      image,\n                      "-c",\n                      script,\n                      json.dumps(names),\n                  ],\n                  check=True,\n                  capture_output=True,\n                  text=True,\n              )\n              inventory = json.loads(completed.stdout.strip())\n              leaked = [name for name in forbidden if inventory[name]]\n              missing = [name for name in required_modules if not inventory[name]]\n              if leaked or missing:\n                  raise SystemExit(\n                      f"{image}: forbidden={leaked}; missing={missing}"\n                  )\n          PY_IMAGE\n'''
              text = text[:next_step] + block + text[next_step:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify implementation locally
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          docker build --file deploy/docker/manual-import-worker.Dockerfile --tag data-collection-platform/manual-import-worker:local .
          docker build --file deploy/docker/osm-worker.Dockerfile --tag data-collection-platform/osm-worker:local .
          python - <<'PY'
          import importlib.util
          import json
          import subprocess

          forbidden = ('alembic', 'boto3', 'botocore', 'playwright', 'psycopg', 'scrapy', 'sqlalchemy')
          required = {
              'data-collection-platform/manual-import-worker:local': (
                  'manual_import_worker', 'manual_import_core', 'source_connector_sdk'
              ),
              'data-collection-platform/osm-worker:local': (
                  'osm_worker', 'osm_overpass', 'source_connector_sdk'
              ),
          }
          script = (
              'import importlib.util,json,sys; names=json.loads(sys.argv[1]); '
              'print(json.dumps({name: importlib.util.find_spec(name) is not None for name in names}))'
          )
          for image, expected in required.items():
              names = (*forbidden, *expected)
              result = subprocess.run(
                  ['docker', 'run', '--rm', '--entrypoint', '/app/.venv/bin/python', image, '-c', script, json.dumps(names)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              inventory = json.loads(result.stdout.strip())
              leaked = [name for name in forbidden if inventory[name]]
              missing = [name for name in expected if not inventory[name]]
              if leaked or missing:
                  raise SystemExit(f'{image}: forbidden={leaked}; missing={missing}')
          PY

      - name: Commit worker isolation and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/worker-image-isolation.md <<EOF
          # Worker image capability isolation

          - manual-import worker image: built non-root
          - OSM worker image: built non-root
          - SQL, migration, browser, crawler, and S3 SDK modules: absent
          - required worker modules: present
          - local architecture and test gates: passed
          - source commit: \`$(git rev-parse HEAD)\`
          EOF
          git rm -f .github/workflows/implement-worker-image-isolation.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Build (Workers): enforce capability-minimal images'
          git push origin HEAD:main

      - name: Remove workflow after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rm -f --ignore-unmatch .github/workflows/implement-worker-image-isolation.yml
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Build (Tooling): remove failed worker isolation workflow'
            git push origin HEAD:main
          fi
