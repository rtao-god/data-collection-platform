name: Export Current Source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-current-source-20260812.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: data-collection-platform-current-source
          path: .
          include-hidden-files: true
          retention-days: 1
