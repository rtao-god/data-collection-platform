name: Close E2E Foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-e2e-foundation.yml
      - packages/collection_application/src/collection_application/pipeline_advancement.py
      - packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
      - apps/pipeline_supervisor/**
      - apps/review_web/**
      - deploy/compose/application.yaml
      - tools/e2e_smoke/**
      - .github/workflows/vertical-data-flow-e2e.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-collection-platform-close-e2e-foundation
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for all production owners
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            apps/pipeline_supervisor/pyproject.toml
            database/migrations/versions/20260815_0013_pipeline_advancement.py
            apps/review_web/package-lock.json
            deploy/docker/review-web.Dockerfile
            deploy/compose/application.yaml
            tools/e2e_smoke/run_external.py
            .github/workflows/pipeline-advancement-ci.yml
            .github/workflows/review-web-ci.yml
            .github/workflows/application-compose-ci.yml
            .github/workflows/vertical-data-flow-e2e.yml
          )
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          for _ in $(seq 1 240); do
            missing=0
            for path in "${required[@]}"; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' "${headers[@]}" "$api/contents/$path?ref=main")"
              if [[ "$status" != "200" ]]; then
                missing=1
                break
              fi
            done
            if [[ "$missing" == "0" ]]; then
              git fetch origin main
              git reset --hard origin/main
              exit 0
            fi
            sleep 5
          done
          echo 'E2E production owners did not materialize' >&2
          exit 1

      - name: Dispatch permanent verification workflows
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          subject_sha="$(git rev-parse HEAD)"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          workflows=(
            ci.yml
            pipeline-advancement-ci.yml
            review-web-ci.yml
            application-compose-ci.yml
            vertical-data-flow-e2e.yml
          )
          for workflow in "${workflows[@]}"; do
            curl -fsSL -X POST "${headers[@]}" \
              "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
          done
          echo "subject_sha=$subject_sha" >> "$GITHUB_OUTPUT"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Wait for one-subject permanent proof set
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUBJECT_SHA: ${{ steps.dispatch.outputs.subject_sha }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          workflows=(
            ci.yml
            pipeline-advancement-ci.yml
            review-web-ci.yml
            application-compose-ci.yml
            vertical-data-flow-e2e.yml
          )
          labels=(
            Verify
            Pipeline-Advancement
            Review-Web
            Application-Compose
            Vertical-Data-Flow
          )
          run_ids=()
          for index in "${!workflows[@]}"; do
            workflow="${workflows[$index]}"
            label="${labels[$index]}"
            matched=""
            for _ in $(seq 1 240); do
              payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=30")"
              run_id="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED_AT" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .id' <<<"$payload" | head -1)"
              status="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED_AT" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED_AT" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .conclusion' <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || {
                  echo "$label failed in run $run_id" >&2
                  exit 1
                }
                matched="$run_id"
                break
              fi
              sleep 5
            done
            [[ -n "$matched" ]] || {
              echo "$label did not complete successfully for $SUBJECT_SHA" >&2
              exit 1
            }
            run_ids+=("$matched")
          done
          echo "verify_id=${run_ids[0]}" >> "$GITHUB_OUTPUT"
          echo "pipeline_id=${run_ids[1]}" >> "$GITHUB_OUTPUT"
          echo "review_id=${run_ids[2]}" >> "$GITHUB_OUTPUT"
          echo "compose_id=${run_ids[3]}" >> "$GITHUB_OUTPUT"
          echo "flow_id=${run_ids[4]}" >> "$GITHUB_OUTPUT"

      - name: Record E2E foundation and remove transport owners
        env:
          SUBJECT_SHA: ${{ steps.dispatch.outputs.subject_sha }}
          VERIFY_ID: ${{ steps.proof.outputs.verify_id }}
          PIPELINE_ID: ${{ steps.proof.outputs.pipeline_id }}
          REVIEW_ID: ${{ steps.proof.outputs.review_id }}
          COMPOSE_ID: ${{ steps.proof.outputs.compose_id }}
          FLOW_ID: ${{ steps.proof.outputs.flow_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          mkdir -p docs/proofs
          cat > docs/proofs/e2e-foundation-ci.md <<EOF
          # End-to-end foundation CI proof

          - Status: `proven`
          - Repository: `rtao-god/data-collection-platform`
          - Branch: `main`
          - Subject commit: `$SUBJECT_SHA`
          - Permanent Verify run: `$VERIFY_ID`
          - Pipeline Advancement Verify run: `$PIPELINE_ID`
          - Review Web Verify run: `$REVIEW_ID`
          - Application Compose Verify run: `$COMPOSE_ID`
          - Vertical Data Flow E2E run: `$FLOW_ID`
          - Conclusions: `success`

          ## Proven vertical flow

          A real HTTP response is downloaded from an isolated fixture, persisted through the S3-compatible Object Store path, read back by content digest, transformed by extraction and normalization owners, resolved into a candidate result, and accompanied by a canonical lineage manifest. The same subject also proves run bootstrap, idempotent pipeline advancement, the typed review console, and the complete application Compose topology.

          This proof does not claim a production Berlin campaign. Berlin remains fail-closed until approved geography and source inputs are supplied.
          EOF
          find .github/workflows -maxdepth 1 -type f \( \
              -name 'apply-*.yml' -o \
              -name 'cleanup-*.yml' -o \
              -name 'materialize-*.yml' -o \
              -name 'close-e2e-foundation.yml' \
            \) -print0 | xargs -0 -r git rm -f
          if test -d .github/apply; then
            find .github/apply -maxdepth 1 -type f -print0 | xargs -0 -r git rm -f
          fi
          find docs/diagnostics -maxdepth 1 -type f -name '.*transport*' -print0 2>/dev/null | xargs -0 -r git rm -f
          git add docs/proofs/e2e-foundation-ci.md
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Proofs): close E2E foundation"
          git push origin HEAD:main
