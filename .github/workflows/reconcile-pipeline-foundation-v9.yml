name: Reconcile Pipeline Foundation V9

on:
  push:
    branches: [main]
    paths:
      - docs/diagnostics/pipeline-foundation-v8.md
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-pipeline-foundation-v9
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore proven pipeline integration surface
        shell: bash
        run: |
          set -euo pipefail
          proven='0a9979e672541bbca6439a603229a14e561f5401'
          git cat-file -e "$proven^{commit}" 2>/dev/null || git fetch origin "$proven"
          paths=(
            apps/pipeline_supervisor
            deploy/docker/pipeline-supervisor.Dockerfile
            .github/workflows/pipeline-advancement-ci.yml
            pyproject.toml
            uv.lock
            tools/architecture_checks/check_dependencies.py
            docs/architecture/dependency-rules.md
            database/migrations/versions/20260815_0013_pipeline_advancement.py
            database/tests/test_pipeline_advancement_schema.py
            packages/collection_application/src/collection_application/__init__.py
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_application/src/collection_application/pipeline_supervision.py
            packages/collection_application/tests/test_pipeline_advancement.py
            packages/collection_application/tests/test_pipeline_supervision.py
            packages/collection_infrastructure/src/collection_infrastructure/__init__.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py
            packages/collection_infrastructure/tests/test_pipeline_run_control.py
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
          )
          for path in "${paths[@]}"; do
            if git cat-file -e "$proven:$path" 2>/dev/null; then git checkout "$proven" -- "$path"; fi
          done
          test -f apps/pipeline_supervisor/pyproject.toml

      - name: Preserve current non-pipeline workspace owners and align work identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("pyproject.toml")
          text = root.read_text(encoding="utf-8")
          actual_members = []
          for pattern in ("apps/*/pyproject.toml", "connectors/*/pyproject.toml", "packages/*/pyproject.toml"):
              actual_members.extend(path.parent.as_posix() for path in Path().glob(pattern))
          actual_members = sorted(set(actual_members))
          workspace = re.search(r'(?ms)(\[tool\.uv\.workspace\]\s*members\s*=\s*\[)(.*?)(\])', text)
          if workspace is None:
              raise RuntimeError("workspace registry missing")
          body = ''.join(f'\n  "{member}",' for member in actual_members) + '\n'
          text = text[:workspace.start(2)] + body + text[workspace.end(2):]
          source_roots = []
          for member in actual_members:
              src = Path(member) / "src"
              if not src.is_dir():
                  continue
              for child in sorted(src.iterdir()):
                  if child.is_dir() and (child / "__init__.py").exists():
                      source_roots.append(child.as_posix())
          source_roots.extend(
              path.as_posix()
              for path in (
                  Path("database/migrations/env.py"),
                  Path("database/migrations/versions"),
                  Path("tools/contract_generation/generate.py"),
                  Path("tools/review_contract_generation/generate.py"),
                  Path("tools/control_api_contract_generation/generate.py"),
              )
              if path.exists()
          )
          mypy = re.search(r'(?ms)(\[tool\.mypy\].*?\nfiles\s*=\s*\[)(.*?)(\])', text)
          if mypy is None:
              raise RuntimeError("mypy registry missing")
          body = ''.join(f'\n  "{source}",' for source in sorted(set(source_roots))) + '\n'
          text = text[:mypy.start(2)] + body + text[mypy.end(2):]
          root.write_text(text, encoding="utf-8")

          migration = Path("database/migrations/versions/20260815_0013_pipeline_advancement.py")
          migration.write_text(
              migration.read_text(encoding="utf-8").replace(
                  '("work.work_units.work_unit_id",)', '("work.work_units.work_id",)'
              ),
              encoding="utf-8",
          )
          metadata = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "pipeline_advancement_metadata.py"
          )
          value = metadata.read_text(encoding="utf-8").replace(
              'sa.Column("work_unit_id", sa.Uuid(), primary_key=True)',
              'sa.Column("work_id", sa.Uuid(), primary_key=True)',
          ).replace("_work_units.c.work_unit_id", "_work_units.c.work_id")
          metadata.write_text(value, encoding="utf-8")
          PY
          uv lock
          uv sync --all-packages --dev --locked

      - name: Prove exact recovered integration
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee pipeline-foundation-v9.log) 2>&1
          set -euo pipefail
          uv run ruff format \
            apps/pipeline_supervisor \
            database/migrations/versions/20260815_0013_pipeline_advancement.py \
            packages/collection_application \
            packages/collection_infrastructure \
            tools/architecture_checks/check_dependencies.py
          uv run ruff check --fix \
            apps/pipeline_supervisor \
            database/migrations/versions/20260815_0013_pipeline_advancement.py \
            packages/collection_application \
            packages/collection_infrastructure \
            tools/architecture_checks/check_dependencies.py
          uv run ruff format --check .
          uv run ruff check .
          uv lock --check
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build --file deploy/docker/pipeline-supervisor.Dockerfile \
            --tag data-collection-platform/pipeline-supervisor:ci .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/pipeline-supervisor:ci)" = "10001:10001"

      - name: Upload V9 diagnostics
        if: steps.gate.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-foundation-v9-diagnostics
          path: pipeline-foundation-v9.log
          if-no-files-found: error
          retention-days: 3
      - name: Stop on failed gate
        if: steps.gate.outcome != 'success'
        run: exit 1

      - name: Commit proven integration and continue
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( \
              -name 'repair-pipeline-*.yml' -o \
              -name 'reconcile-pipeline-foundation-v[4-9].yml' -o \
              -name 'capture-pipeline-foundation-*.yml' -o \
              -name 'materialize-pipeline-supervisor-direct.yml' \
            \) -print0 | xargs -0 -r git rm -f --ignore-unmatch
          rm -f docs/diagnostics/pipeline-foundation-v4.md \
                docs/diagnostics/pipeline-foundation-v5.md \
                docs/diagnostics/reconcile-pipeline-foundation-v6.md \
                docs/diagnostics/pipeline-foundation-v7.md \
                docs/diagnostics/pipeline-foundation-v8.md
          git add -A \
            apps/pipeline_supervisor \
            deploy/docker/pipeline-supervisor.Dockerfile \
            .github/workflows \
            pyproject.toml uv.lock \
            tools/architecture_checks/check_dependencies.py \
            docs/architecture/dependency-rules.md \
            docs/diagnostics \
            database/migrations/versions/20260815_0013_pipeline_advancement.py \
            database/tests/test_pipeline_advancement_schema.py \
            packages/collection_application \
            packages/collection_infrastructure
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Feature (Pipeline): reconcile proven integration surface'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/materialize-review-web-after-pipeline.yml/dispatches" \
            -d '{"ref":"main"}' >/dev/null
