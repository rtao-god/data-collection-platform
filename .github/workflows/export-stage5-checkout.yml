name: Export Stage 5 Checkout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-stage5-checkout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@v6

      - name: Package repository sources
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude='**/__pycache__' \
            -czf "$RUNNER_TEMP/repository.tar.gz" .

      - name: Upload repository archive
        uses: actions/upload-artifact@v7
        with:
          name: stage5-owner-checkout
          path: ${{ runner.temp }}/repository.tar.gz
          if-no-files-found: error
          retention-days: 1
