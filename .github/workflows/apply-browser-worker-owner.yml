name: Apply Browser Worker Owner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-browser-worker-owner.yml
      - .github/apply/browser-worker-owner.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-apply-browser-worker-owner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Apply reviewed owner patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if test -f apps/browser_worker/pyproject.toml && test -f deploy/docker/browser-worker.Dockerfile; then
            exit 0
          fi
          test -s .github/apply/browser-worker-owner.patch
          git apply --index --3way .github/apply/browser-worker-owner.patch
          git diff --cached --check
      - name: Verify Python owner
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          uv run ruff format --check .
          uv run ruff check .
          uv lock --check
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
      - name: Build capability-isolated image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file deploy/docker/browser-worker.Dockerfile \
            --tag data-collection-platform/browser-worker:ci \
            .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/browser-worker:ci)" = "10001:10001"
          docker run --rm --entrypoint python data-collection-platform/browser-worker:ci - <<'PY'
          from importlib.util import find_spec
          required = ("browser_worker", "playwright", "source_connector_sdk")
          forbidden = ("alembic", "boto3", "psycopg", "sqlalchemy")
          missing = [name for name in required if find_spec(name) is None]
          present = [name for name in forbidden if find_spec(name) is not None]
          if missing or present:
              raise SystemExit(f"missing={missing}; forbidden={present}")
          PY
      - name: Commit production owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/apply-browser-worker-owner.yml \
            .github/apply/browser-worker-owner.patch
          git add \
            apps/browser_worker \
            packages/collection_domain/src/collection_domain/work_units.py \
            pyproject.toml uv.lock \
            tools/architecture_checks/check_dependencies.py \
            deploy/docker/browser-worker.Dockerfile \
            .github/workflows/browser-worker-isolation.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Feat (Browser): add isolated Playwright worker"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
