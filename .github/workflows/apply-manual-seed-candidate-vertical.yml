name: Apply Manual Seed Candidate Vertical

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-manual-seed-candidate-vertical.yml
  workflow_dispatch:

concurrency:
  group: data-collection-platform-manual-seed-candidate-vertical
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main without write credentials
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Download and authenticate content-addressed owner patch
        shell: bash
        run: |
          set -euo pipefail
          base_url='https://filebin.net/dcp-a6f0892e173b4c07b83d9f1a52e647cf'
          curl --fail-with-body --silent --show-error \
            "${base_url}/locator.txt" \
            --output /tmp/locator.txt
          patch_sha="$(tr -d '\r\n' < /tmp/locator.txt)"
          [[ "$patch_sha" =~ ^[0-9a-f]{64}$ ]]
          curl --fail-with-body --silent --show-error \
            "${base_url}/${patch_sha}.patch" \
            --output /tmp/owner.patch
          printf '%s  %s\n' "$patch_sha" /tmp/owner.patch \
            | sha256sum --check --strict

      - name: Enforce patch scope before execution
        shell: bash
        run: |
          set -euo pipefail
          git apply --numstat /tmp/owner.patch > /tmp/owner-numstat.txt
          test -s /tmp/owner-numstat.txt
          python - <<'PY'
          from pathlib import PurePosixPath

          allowed_roots = {
              '.codex',
              'apps',
              'campaigns',
              'contracts',
              'database',
              'deploy',
              'docs',
              'packages',
              'tools',
              'pyproject.toml',
              'uv.lock',
          }
          forbidden_prefixes = (
              '.github/',
              '.git/',
              'deploy/compose/.secrets/',
          )
          paths: list[str] = []
          for raw in open('/tmp/owner-numstat.txt', encoding='utf-8'):
              parts = raw.rstrip('\n').split('\t')
              if len(parts) != 3:
                  raise SystemExit(f'invalid patch numstat row: {raw!r}')
              path = parts[2]
              if ' => ' in path or path.startswith('{'):
                  raise SystemExit(f'renames are forbidden in owner transport: {path}')
              pure = PurePosixPath(path)
              if pure.is_absolute() or '..' in pure.parts:
                  raise SystemExit(f'unsafe patch path: {path}')
              if path.startswith(forbidden_prefixes):
                  raise SystemExit(f'forbidden patch path: {path}')
              root = pure.parts[0]
              if root not in allowed_roots:
                  raise SystemExit(f'unregistered patch root: {path}')
              paths.append(path)
          if len(paths) != len(set(paths)):
              raise SystemExit('owner patch contains duplicate paths')
          if len(paths) > 120:
              raise SystemExit(f'owner patch is unexpectedly broad: {len(paths)} files')
          required_prefixes = (
              'packages/collection_application/',
              'packages/collection_infrastructure/',
          )
          for prefix in required_prefixes:
              if not any(path.startswith(prefix) for path in paths):
                  raise SystemExit(f'owner patch misses required boundary: {prefix}')
          print('\n'.join(sorted(paths)))
          PY

      - name: Apply owner patch in disposable verification checkout
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way /tmp/owner.patch
          rm .github/workflows/apply-manual-seed-candidate-vertical.yml
          git diff --check

      - name: Verify intended vertical is implemented
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          production = '\n'.join(
              path.read_text(encoding='utf-8', errors='strict')
              for root in ('apps', 'packages')
              for path in Path(root).rglob('*.py')
          )
          required = (
              'manual-import-record@1',
              'ObservationBatch',
              'review',
              'candidate',
          )
          missing = [value for value in required if value not in production]
          if missing:
              raise SystemExit(f'manual-seed vertical is incomplete: {missing}')
          registry = Path(
              'packages/collection_application/src/collection_application/'
              'pipeline_advancement.py'
          ).read_text(encoding='utf-8')
          if 'MANUAL_RECORD_DOWNSTREAM_SOURCE_UNAVAILABLE' in registry:
              raise SystemExit('manual-record transition still terminates at the placeholder blocker')
          PY

      - name: Run full static and unit gate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run python -m compileall -q apps connectors database packages tools

      - name: Upload verified content-addressed patch
        uses: actions/upload-artifact@v4
        with:
          name: verified-manual-seed-candidate-vertical
          path: |
            /tmp/owner.patch
            /tmp/locator.txt
            /tmp/owner-numstat.txt
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download patch proven by read-only job
        uses: actions/download-artifact@v4
        with:
          name: verified-manual-seed-candidate-vertical
          path: /tmp/verified-owner

      - name: Revalidate and commit exact owner patch
        shell: bash
        run: |
          set -euo pipefail
          patch_sha="$(tr -d '\r\n' < /tmp/verified-owner/locator.txt)"
          [[ "$patch_sha" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$patch_sha" /tmp/verified-owner/owner.patch \
            | sha256sum --check --strict
          git am --3way /tmp/verified-owner/owner.patch
          git rm .github/workflows/apply-manual-seed-candidate-vertical.yml
          git commit --amend --no-edit
          git diff HEAD^ --check
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
