name: Package Working Snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/package-working-snapshot.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6

      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude='**/__pycache__' \
            --exclude='**/node_modules' \
            --exclude='**/dist' \
            -czf /tmp/data-collection-platform-source.tar.gz .
          git rev-parse HEAD > /tmp/source-head.txt

      - name: Upload exact snapshot
        uses: actions/upload-artifact@v7
        with:
          name: data-collection-platform-working-snapshot
          path: |
            /tmp/data-collection-platform-source.tar.gz
            /tmp/source-head.txt
          if-no-files-found: error
          retention-days: 1
