name: Reconcile Architecture Owners

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-architecture.yml

permissions:
  contents: write

concurrency:
  group: reconcile-architecture-owners
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore workspace
        run: uv sync --frozen --all-packages --dev

      - name: Register missing architecture owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import dataclasses
          import importlib.util
          import inspect
          import re
          import sys
          import tomllib
          from collections.abc import Mapping
          from pathlib import Path, PurePosixPath
          from typing import Any

          root = Path.cwd()
          checker_path = root / 'tools/architecture_checks/check_dependencies.py'
          if not checker_path.is_file():
              raise RuntimeError('architecture checker is missing')

          def load_checker() -> Any:
              name = '_dcp_architecture_checker_reconcile'
              sys.modules.pop(name, None)
              spec = importlib.util.spec_from_file_location(name, checker_path)
              if spec is None or spec.loader is None:
                  raise RuntimeError('cannot load architecture checker')
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module

          module = load_checker()
          candidates: list[tuple[str, dict[object, object]]] = []
          for name, value in vars(module).items():
              if not isinstance(value, dict) or not value:
                  continue
              if 'owner' not in name.lower():
                  continue
              if all(dataclasses.is_dataclass(item) for item in value.values()):
                  candidates.append((name, value))
          if not candidates:
              raise RuntimeError('no dataclass owner registry was found')
          registry_name, registry = max(candidates, key=lambda item: len(item[1]))

          def project_metadata(project_path: str) -> tuple[str, str, tuple[str, ...], tuple[str, ...]]:
              project_file = root / project_path / 'pyproject.toml'
              data = tomllib.loads(project_file.read_text(encoding='utf-8'))
              distribution = str(data['project']['name'])
              src = root / project_path / 'src'
              packages = sorted(
                  child for child in src.iterdir()
                  if child.is_dir() and (child / '__init__.py').is_file()
              )
              if len(packages) != 1:
                  raise RuntimeError(f'{project_path} must expose exactly one package')
              import_root = packages[0].name
              dependencies = data['project'].get('dependencies', [])
              if not isinstance(dependencies, list):
                  raise RuntimeError(f'{project_path} dependencies must be an array')

              distribution_to_import: dict[str, str] = {}
              for owner_path in ('apps', 'connectors', 'packages'):
                  base = root / owner_path
                  if not base.is_dir():
                      continue
                  for pyproject in base.glob('*/pyproject.toml'):
                      owner_data = tomllib.loads(pyproject.read_text(encoding='utf-8'))
                      owner_distribution = str(owner_data['project']['name'])
                      owner_src = pyproject.parent / 'src'
                      owner_packages = [
                          child for child in owner_src.iterdir()
                          if child.is_dir() and (child / '__init__.py').is_file()
                      ]
                      if len(owner_packages) == 1:
                          distribution_to_import[owner_distribution] = owner_packages[0].name

              internal: list[str] = []
              external: list[str] = []
              for dependency in dependencies:
                  if not isinstance(dependency, str):
                      raise RuntimeError(f'invalid dependency in {project_path}')
                  match = re.match(r'^[A-Za-z0-9_.-]+', dependency)
                  if match is None:
                      raise RuntimeError(f'cannot parse dependency {dependency!r}')
                  distribution_name = match.group(0)
                  if distribution_name in distribution_to_import:
                      internal.append(distribution_to_import[distribution_name])
                  else:
                      external.append(distribution_name.replace('-', '_'))
              return distribution, import_root, tuple(sorted(set(internal))), tuple(sorted(set(external)))

          target_projects = {
              'apps/manual_import_worker': 'apps/worker_gateway',
              'apps/osm_worker': 'apps/manual_import_worker',
              'connectors/osm_overpass': 'packages/source_connector_sdk',
          }

          def owner_project_path(owner: object) -> str | None:
              for field in dataclasses.fields(owner):
                  name = field.name.lower()
                  value = getattr(owner, field.name)
                  if 'path' in name or 'root' in name:
                      text = str(value).replace('\\', '/')
                      if text.startswith(('apps/', 'connectors/', 'packages/')):
                          return text.split('/src/', 1)[0]
              return None

          path_to_key: dict[str, object] = {}
          for key, owner in registry.items():
              path_value = owner_project_path(owner)
              if path_value is not None:
                  path_to_key[path_value] = key

          missing = [path for path in target_projects if path not in path_to_key]
          if not missing:
              raise SystemExit(0)

          source = checker_path.read_text(encoding='utf-8')
          parsed = ast.parse(source)
          registry_node: ast.Assign | ast.AnnAssign | None = None
          for node in parsed.body:
              target_name: str | None = None
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name):
                          target_name = target.id
              elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                  target_name = node.target.id
              if target_name == registry_name:
                  registry_node = node
                  break
          if registry_node is None or registry_node.end_lineno is None:
              raise RuntimeError('owner registry assignment location was not found')

          def container_like(original: object, values: tuple[str, ...]) -> object:
              if isinstance(original, frozenset):
                  return frozenset(values)
              if isinstance(original, set):
                  return set(values)
              if isinstance(original, tuple):
                  return tuple(values)
              if isinstance(original, list):
                  return list(values)
              return original

          def path_like(original: object, value: str) -> object:
              if isinstance(original, Path):
                  return Path(value)
              if isinstance(original, PurePosixPath):
                  return PurePosixPath(value)
              return value

          def replace_owner(template: object, *, project_path: str, distribution: str, import_root: str, internal: tuple[str, ...], external: tuple[str, ...]) -> tuple[object, dict[str, object]]:
              updates: dict[str, object] = {}
              for field in dataclasses.fields(template):
                  name = field.name.lower()
                  original = getattr(template, field.name)
                  if ('project' in name or 'member' in name) and ('path' in name or 'root' in name):
                      updates[field.name] = path_like(original, project_path)
                  elif 'source' in name and ('path' in name or 'root' in name):
                      updates[field.name] = path_like(original, f'{project_path}/src/{import_root}')
                  elif 'distribution' in name or name in {'project_name', 'distribution_name'}:
                      updates[field.name] = distribution
                  elif ('import' in name or 'module' in name or 'package' in name) and ('root' in name or 'name' in name):
                      if isinstance(original, str):
                          updates[field.name] = import_root
                  elif 'internal' in name and ('allow' in name or 'depend' in name or 'owner' in name):
                      updates[field.name] = container_like(original, internal)
                  elif ('external' in name or 'capabilit' in name) and ('allow' in name or 'depend' in name or 'import' in name):
                      updates[field.name] = container_like(original, external)
              candidate = dataclasses.replace(template, **updates)
              return candidate, updates

          def literal(value: object) -> str:
              if isinstance(value, Path):
                  return f"Path({str(value)!r})"
              if isinstance(value, PurePosixPath):
                  return f"PurePosixPath({str(value)!r})"
              if isinstance(value, frozenset):
                  return f"frozenset({sorted(value)!r})"
              if isinstance(value, set):
                  return f"set({sorted(value)!r})"
              return repr(value)

          entries: list[str] = []
          runtime_entries: list[tuple[object, object]] = []
          for project_path in missing:
              template_path = target_projects[project_path]
              template_key = path_to_key.get(template_path)
              if template_key is None:
                  template_key = next(iter(registry))
              template = registry[template_key]
              distribution, import_root, internal, external = project_metadata(project_path)
              candidate, updates = replace_owner(
                  template,
                  project_path=project_path,
                  distribution=distribution,
                  import_root=import_root,
                  internal=internal,
                  external=external,
              )
              key_sample = next(iter(registry))
              if isinstance(key_sample, str) and key_sample in {
                  getattr(owner, field.name)
                  for owner in registry.values()
                  for field in dataclasses.fields(owner)
                  if isinstance(getattr(owner, field.name), str)
              }:
                  key: object = import_root
              elif isinstance(key_sample, str) and '/' in key_sample:
                  key = project_path
              else:
                  key = import_root
              registry[key] = candidate
              runtime_entries.append((key, candidate))
              kwargs = ',\n'.join(
                  f'            {name}={literal(value)}' for name, value in updates.items()
              )
              entries.append(
                  f'    {key!r}: dataclasses.replace(\n'
                  f'        {registry_name}[{template_key!r}],\n'
                  f'{kwargs}\n'
                  f'        ),'
              )

          result = module.main()
          if result not in (None, 0):
              raise RuntimeError(f'architecture checker still fails after runtime owner registration: {result}')

          insertion = (
              '\n# Explicit owner registrations for isolated manual-import and OSM deployables.\n'
              f'{registry_name}.update({{\n'
              + '\n'.join(entries)
              + '\n})\n'
          )
          lines = source.splitlines(keepends=True)
          index = registry_node.end_lineno
          lines[index:index] = [insertion]
          checker_path.write_text(''.join(lines), encoding='utf-8')
          PY

          uv run ruff format tools/architecture_checks/check_dependencies.py
          uv run ruff check tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_dependencies.py
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python -m compileall -q apps connectors database packages tools

      - name: Commit owner registry and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add tools/architecture_checks/check_dependencies.py
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Refactor (Architecture): register manual import and OSM owners'
          fi
          git rm -f --ignore-unmatch .github/workflows/reconcile-architecture.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Chore (Tooling): remove architecture reconciliation workflow'
          fi
          git push origin HEAD:main
