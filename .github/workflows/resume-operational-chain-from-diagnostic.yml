name: Resume Operational Chain From Diagnostic

on:
  push:
    branches: [main]
    paths:
      - docs/diagnostics/operational-chain-controller.md
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Dispatch exact recovery for failed bounded stage
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostic='docs/diagnostics/operational-chain-controller.md'
          test -f "$diagnostic"
          workflow=''
          if grep -q 'reconcile-pipeline-foundation-v5.yml failed' "$diagnostic"; then
            workflow='reconcile-pipeline-foundation-v6.yml'
          elif grep -q 'reconcile-pipeline-foundation-v6.yml failed' "$diagnostic"; then
            workflow='reconcile-pipeline-foundation-v7.yml'
          elif grep -q 'reconcile-pipeline-foundation-v7.yml failed' "$diagnostic"; then
            echo 'Pipeline V7 needs a code correction from docs/diagnostics/pipeline-foundation-v7.md.' >&2
            exit 1
          elif grep -q 'materialize-review-web-after-pipeline.yml failed' "$diagnostic"; then
            workflow='materialize-review-web-after-pipeline.yml'
          elif grep -q 'materialize-browser-worker-after-review.yml failed' "$diagnostic"; then
            workflow='materialize-browser-worker-after-review.yml'
          elif grep -q 'materialize-sealed-export-after-browser.yml failed' "$diagnostic"; then
            workflow='materialize-sealed-export-after-browser.yml'
          elif grep -q 'materialize-operations-after-export.yml failed' "$diagnostic"; then
            workflow='materialize-operations-after-export.yml'
          elif grep -q 'close-operational-e2e-after-operations.yml failed' "$diagnostic"; then
            workflow='close-operational-e2e-after-operations.yml'
          else
            echo 'No supported failed stage was found in controller diagnostics.' >&2
            exit 1
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow/dispatches" \
            -d '{"ref":"main"}' >/dev/null
