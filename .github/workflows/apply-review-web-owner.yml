name: Apply Review Web Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-review-web-owner.yml
      - .github/apply/review-web-owner.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-apply-review-web-owner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Apply reviewed owner patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if test -f apps/review_web/package-lock.json && test -f deploy/docker/review-web.Dockerfile; then
            exit 0
          fi
          test -s .github/apply/review-web-owner.patch
          git apply --index --3way .github/apply/review-web-owner.patch
          git diff --cached --check

      - name: Verify frontend owner
        working-directory: apps/review_web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run generate:contracts
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Verify frontend and Compose boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.ts' --include='*.tsx' \
              -E 'dangerouslySetInnerHTML|innerHTML[[:space:]]*=' apps/review_web/src; then
            echo 'unsafe raw HTML rendering path detected' >&2
            exit 1
          fi
          docker compose \
            --env-file deploy/compose/.env.example \
            -f deploy/compose/infrastructure.yaml \
            -f deploy/compose/application.yaml \
            config >/tmp/application-compose.yaml
          grep -q '^  review-web:' /tmp/application-compose.yaml
          docker build \
            --file deploy/docker/review-web.Dockerfile \
            --tag data-collection-platform/review-web:ci \
            .
          user="$(docker image inspect --format '{{.Config.User}}' data-collection-platform/review-web:ci)"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"

      - name: Commit production owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/apply-review-web-owner.yml \
            .github/apply/review-web-owner.patch
          git add \
            apps/review_web \
            deploy/docker/review-web.Dockerfile \
            deploy/review-web/nginx.conf \
            deploy/compose/application.yaml \
            deploy/compose/.env.example \
            .github/workflows/review-web-ci.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Feat (Review): add typed review console"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
