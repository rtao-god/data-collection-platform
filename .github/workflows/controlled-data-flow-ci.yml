name: Controlled Data Flow

on:
  push:
    branches: [main]
    paths:
      - apps/http_worker/**
      - apps/worker_gateway/**
      - connectors/official_http/**
      - packages/collection_application/**
      - packages/collection_infrastructure/**
      - packages/source_connector_sdk/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/controlled-data-flow-ci.yml
  pull_request:
    paths:
      - apps/http_worker/**
      - apps/worker_gateway/**
      - connectors/official_http/**
      - packages/collection_application/**
      - packages/collection_infrastructure/**
      - packages/source_connector_sdk/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/controlled-data-flow-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-flow:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Locate canonical vertical-flow proof tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          owner_commit="0da188be6fe963e3fae18f460ea5e566d104fa3c"
          mapfile -t candidates < <(
            git diff-tree --no-commit-id --name-only -r "$owner_commit" \
              | grep -E '(^|/)(test_[^/]*|[^/]*_test)\.py$' \
              | sort -u
          )
          existing=()
          for path in "${candidates[@]}"; do
            test -f "$path" && existing+=("$path")
          done
          ((${#existing[@]} > 0)) || {
            echo 'canonical vertical-flow proof tests are missing from production tree' >&2
            exit 1
          }
          printf '%s\n' "${existing[@]}" | tee /tmp/vertical-flow-tests
          source_text="$(cat "${existing[@]}")"
          grep -Eqi 'http|fetch|response' <<<"$source_text"
          grep -Eqi 'artifact|object.store|raw.body|raw_artifact' <<<"$source_text"
          grep -Eqi 'digest|sha256|content_digest' <<<"$source_text"
      - name: Apply fresh database
        run: uv run collection-migrate upgrade head
      - name: Execute controlled download and persistence flow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < /tmp/vertical-flow-tests
          uv run pytest -q "${tests[@]}"
