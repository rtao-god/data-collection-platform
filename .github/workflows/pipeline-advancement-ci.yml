name: Pipeline Advancement Verify

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pipeline-advancement-ci.yml
      - apps/pipeline_supervisor/**
      - packages/collection_application/**
      - packages/collection_infrastructure/**
      - database/migrations/**
      - database/tests/**
      - deploy/docker/pipeline-supervisor.Dockerfile
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - .github/workflows/pipeline-advancement-ci.yml
      - apps/pipeline_supervisor/**
      - packages/collection_application/**
      - packages/collection_infrastructure/**
      - database/migrations/**
      - database/tests/**
      - deploy/docker/pipeline-supervisor.Dockerfile
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev
      - name: Verify pipeline owner
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/collection_application/src/collection_application/pipeline_advancement.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
          test -f apps/pipeline_supervisor/pyproject.toml
          test -f database/migrations/versions/20260815_0013_pipeline_advancement.py
          uv run ruff format --check .
          uv run ruff check .
          uv lock --check
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
      - name: Verify fresh database and supervisor image
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build \
            --file deploy/docker/pipeline-supervisor.Dockerfile \
            --tag data-collection-platform/pipeline-supervisor:ci \
            .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/pipeline-supervisor:ci)" = "10001:10001"
