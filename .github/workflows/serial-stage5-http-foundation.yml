name: Serial Stage 5 HTTP Foundation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/serial-stage5-http-foundation.yml

permissions:
  contents: write

concurrency:
  group: data-collection-platform-serial-stage5-http-foundation
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: collection
          POSTGRES_DB: collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collection -d collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      COLLECTION_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      TEST_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - name: Serialize after HTTP owner writes
        run: |
          sleep 300
          git fetch origin main
          git reset --hard origin/main

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Prove complete HTTP foundation
        id: prove
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/proofs/reconciled-baseline-ci.md
          test -f docs/proofs/worker-image-isolation-ci.md
          test -f docs/proofs/official-berlin-boundary-ci.md
          test -f docs/proofs/official-http-contracts.md
          test -f docs/proofs/official-http-transport.md
          test -f connectors/official_website_http/src/official_website_http/contracts.py
          test -f connectors/official_website_http/src/official_website_http/urls.py
          test -f connectors/official_website_http/src/official_website_http/robots.py
          test -f connectors/official_website_http/src/official_website_http/sitemap.py
          test -f connectors/official_website_http/src/official_website_http/interest.py
          test -f connectors/official_website_http/src/official_website_http/transport.py

          find .github/workflows -maxdepth 1 -type f \
            ! -name ci.yml ! -name serial-stage5-http-foundation.yml -delete
          find .codex -maxdepth 1 -type f \
            \( -name '*.py' -o -name '*probe*' -o -name 'ci-trigger*' \) -delete
          rm -rf .codex/payloads

          uv sync --frozen --all-packages --dev
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff check . --fix --unsafe-fixes
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest connectors/official_website_http/tests -q
          uv run pytest -m 'not integration and not object_store_integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

          ALEMBIC_CONFIG="$(find . -name alembic.ini -type f -print -quit)"
          test -n "$ALEMBIC_CONFIG"
          uv run alembic -c "$ALEMBIC_CONFIG" upgrade head
          uv run alembic -c "$ALEMBIC_CONFIG" check
          uv run pytest -m 'integration and not object_store_integration'

          docker build -f deploy/docker/collector-cli.Dockerfile -t dcp-collector-cli:stage5-proof .
          docker build -f deploy/docker/migration.Dockerfile -t dcp-migration:stage5-proof .
          docker build -f deploy/docker/worker-gateway.Dockerfile -t dcp-worker-gateway:stage5-proof .
          docker build -f deploy/docker/manual-import-worker.Dockerfile -t dcp-manual-import-worker:stage5-proof .
          docker build -f deploy/docker/osm-worker.Dockerfile -t dcp-osm-worker:stage5-proof .

          cat > docs/proofs/stage5-http-foundation.md <<'EOF'
          # Stage 5 HTTP acquisition foundation

          - prerequisite Stage 3-4 permanent proofs: present
          - official Berlin campaign boundary permanent proof: present
          - canonical URL identity and allowlist policy: verified
          - robots.txt semantics and sitemap bounds: verified
          - configuration-driven page-interest planning: verified
          - DNS and connected-peer SSRF controls: verified
          - redirect revalidation: verified
          - conditional 304 outcome: verified
          - decompressed response byte limit: verified
          - 401/403/408/429/5xx typed policy without browser escalation: verified
          - exact response body SHA-256 identity: verified
          - full repository static, unit, architecture, migration, integration, and image gates: passed
          EOF

      - name: Commit proof or clean failed foundation automation
        if: always()
        shell: bash
        env:
          PROVE_OUTCOME: ${{ steps.prove.outcome }}
        run: |
          set -euo pipefail
          if [ "$PROVE_OUTCOME" != 'success' ]; then
            git reset --hard HEAD
          fi
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 | xargs -0 -r git rm -f
          find .codex -maxdepth 1 -type f \( -name '*.py' -o -name '*probe*' -o -name 'ci-trigger*' \) -print0 | xargs -0 -r git rm -f
          rm -rf .codex/payloads
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "$PROVE_OUTCOME" = 'success' ]; then
            git commit -m 'CI (HTTP Acquisition): record Stage 5 foundation proof'
          else
            git commit -m 'Build (Tooling): clean failed Stage 5 foundation verifier'
          fi
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          exit 1

      - name: Preserve failed status
        if: steps.prove.outcome != 'success'
        run: exit 1
