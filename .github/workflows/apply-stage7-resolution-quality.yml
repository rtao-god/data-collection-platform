name: Apply Stage 7 Resolution and Quality

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage7-resolution-quality.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage7-resolution-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Materialize resolution and quality owners
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python .github/stage7/apply_resolution_part1.py
          python .github/stage7/apply_resolution_part2.py
          python .github/stage7/patch_resolution_types.py

          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          checker = Path("tools/architecture_checks/check_dependencies.py")
          policy = subprocess.check_output(
              [sys.executable, str(checker), "--print-policy"],
              text=True,
          ).strip()
          path = Path("docs/architecture/dependency-rules.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + policy + text[end:], encoding="utf-8")
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff check --exclude .github/stage7 . --fix --unsafe-fixes
          uv run ruff format --exclude .github/stage7 .
          uv run ruff check --exclude .github/stage7 .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          docker build --file deploy/docker/resolution-worker.Dockerfile .
          git diff --check

          git add -A
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat (Resolution): add reversible clustering and quality"
          git push origin HEAD:main
