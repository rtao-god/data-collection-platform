name: Prove Stage 8A Candidate Review Foundation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage8a-candidate-review-repair-20260814.yml
      - .github/stage8a_apply_20260814/repair.py
      - .github/stage8a_apply_20260814/repair2.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage8a-candidate-review
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 120

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Materialize and prove corrected Stage 8A owners
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f docs/proofs/stage7-resolution-quality-ci.md
          python .github/stage8a_apply_20260814/repair2.py
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/review_contract_generation/generate.py
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest packages/review_contracts/tests packages/review_core/tests tools/review_contract_generation/tests
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/resolution_contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          git diff --check

      - name: Commit proven Stage 8A production diff
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/stage8a_apply_20260814
          mkdir -p docs/proofs
          cat > docs/proofs/stage8a-candidate-review-owner.md <<EOF
          # Stage 8A candidate and review owner proof

          - Status: owner gates passed
          - Build subject: \`$GITHUB_SHA\`
          - Build workflow run: \`$GITHUB_RUN_ID\`

          The versioned contracts, pure optimistic-concurrency transitions,
          generated schemas, append-only migration, full unit suite, architecture
          checks, fresh PostgreSQL/PostGIS migration, and complete database integration
          suite passed before commit.

          Runtime PostgreSQL commands, authenticated Control API, and review UI remain
          separate downstream owners.
          EOF
          git add -A
          git reset .github/workflows
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat (Review): add candidate and review foundation"
          git push origin HEAD:main
