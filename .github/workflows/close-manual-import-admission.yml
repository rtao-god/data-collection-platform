name: Close Manual Import Admission

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/close-manual-import-admission.yml

permissions:
  contents: write

concurrency:
  group: manual-import-owner-write
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: collection
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collection -d collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      COLLECTION_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Normalize current owner
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format .

      - name: Verify static and unit contracts
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          if [ -f tools/manual_import_contract_generation/generate.py ]; then
            uv run python tools/manual_import_contract_generation/generate.py --check
          fi
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps packages connectors

      - name: Verify fresh database and integration contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -m integration

      - name: Seal proof and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/implementation-status.md')
          text = path.read_text(encoding='utf-8')
          row = (
              '| Manual import admission | Verified plan artifacts are decoded fail-closed; '
              'accepted records are admitted atomically as deterministic child work units with '
              'source/plan artifact bindings and idempotent replay |\n'
          )
          if row not in text:
              lines = text.splitlines(keepends=True)
              for index, line in enumerate(lines):
                  if line.startswith('| Manual import planning |'):
                      lines.insert(index + 1, row)
                      break
              else:
                  raise RuntimeError('manual import planning status row was not found')
              text = ''.join(lines)

          old = (
              '- manual plans are deterministic and snapshot validation consumes the same parser, '
              'but runtime intake still does not preserve the exact source as a raw artifact or '
              'schedule one work unit per accepted row;\n'
          )
          replacement = (
              '- admission of an already verified source/plan pair is implemented; an operator-facing '
              'intake owner that uploads a local source file and creates the parent work unit is still '
              'incomplete;\n'
          )
          if old in text:
              text = text.replace(old, replacement, 1)

          heading = '## Next owner batch\n'
          if heading not in text:
              raise RuntimeError('next owner heading was not found')
          prefix, _ = text.split(heading, 1)
          text = prefix + heading + (
              '\nThe next coherent Stage 3 batch is operator-facing manual intake plus object-store '
              'operations: upload and verify the exact local CSV/JSON/JSONL source, create the parent '
              'manual-import work unit without worker SQL credentials, add a SeaweedFS-backed local '
              'runtime profile and compatibility proof, then implement owner-controlled orphan cleanup, '
              'retention tombstones, and legal-hold checks.\n'
          )
          path.write_text(text, encoding='utf-8')

          proof = Path('docs/proofs/manual-import-admission.md')
          proof.parent.mkdir(parents=True, exist_ok=True)
          proof.write_text(
              '# Manual import admission proof\n\n'
              '- verified plan bytes are decoded fail-closed;\n'
              '- blocked plans enqueue no work;\n'
              '- each accepted record maps to one deterministic child work identity;\n'
              '- child work, plan/source input bindings, and admission evidence commit atomically;\n'
              '- exact replay is idempotent and changed immutable inputs are conflicts;\n'
              '- static, unit, fresh-migration, and integration gates passed before this proof was committed.\n',
              encoding='utf-8',
          )
          PY
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 \
            | xargs -0 -r git rm -f
          find .codex -maxdepth 1 -type f -name '*.py' -print0 \
            | xargs -0 -r git rm -f
          rm -rf .codex/payloads
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .

      - name: Commit closed admission owner
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Feature (Manual Import): close atomic plan admission'
          git push origin HEAD:main
