name: Finalize Full Berlin E2E

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-full-berlin-e2e.yml
  workflow_dispatch:

concurrency:
  group: data-collection-platform-finalize-full-berlin-e2e
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Publish run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(python - <<'PY'
          import json,os
          repository=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['GITHUB_RUN_ID']
          print(json.dumps({'state':'pending','context':'owner/full-berlin-e2e','description':f'full Berlin E2E run {run_id}','target_url':f'https://github.com/{repository}/actions/runs/{run_id}'}))
          PY
          )"
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "$payload" >/tmp/status.json

      - name: Resolve content-addressed owner and runtime proof
        shell: bash
        run: |
          set -euo pipefail
          base='https://filebin.net/dcp-full-e2e-2b177a91a86c4560ad7f19d971ab8d7d'
          for _ in $(seq 1 1440); do
            if curl -fsS "$base/locator.txt" -o /tmp/locator.txt; then break; fi
            sleep 10
          done
          test -s /tmp/locator.txt
          locator="$(tr -d '\r\n' </tmp/locator.txt)"
          if [ "$locator" = failed ]; then
            curl -fsS "$base/failure.json" -o /tmp/failure.json || true
            curl -fsS "$base/failure.log" -o /tmp/failure.log || true
            cat /tmp/failure.json /tmp/failure.log 2>/dev/null || true
            exit 1
          fi
          if [ "$locator" = already-complete ]; then
            printf 'already-complete\n' >/tmp/mode.txt
            : >/tmp/owner.patch
          else
            [[ "$locator" =~ ^[0-9a-f]{64}$ ]]
            curl -fsS "$base/${locator}.patch" -o /tmp/owner.patch
            printf '%s  %s\n' "$locator" /tmp/owner.patch | sha256sum -c -
            printf 'patch\n' >/tmp/mode.txt
          fi
          for _ in $(seq 1 180); do
            if curl -fsS "$base/command-locator.txt" -o /tmp/command-locator.txt; then break; fi
            sleep 10
          done
          command_sha="$(tr -d '\r\n' </tmp/command-locator.txt)"
          [[ "$command_sha" =~ ^[0-9a-f]{64}$ ]]
          curl -fsS "$base/${command_sha}.sh" -o /tmp/runtime-proof.sh
          printf '%s  %s\n' "$command_sha" /tmp/runtime-proof.sh | sha256sum -c -

      - name: Enforce E2E owner scope
        shell: bash
        run: |
          set -euo pipefail
          [ "$(cat /tmp/mode.txt)" = already-complete ] && exit 0
          git apply --numstat /tmp/owner.patch >/tmp/numstat.txt
          test -s /tmp/numstat.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          allowed={'.codex','apps','campaigns','contracts','database','deploy','docs','packages','tools','web','pyproject.toml','uv.lock','package.json','pnpm-lock.yaml','package-lock.json','yarn.lock','pnpm-workspace.yaml'}
          permanent_prefix='.github/workflows/'
          paths=[]
          for raw in open('/tmp/numstat.txt',encoding='utf-8'):
              parts=raw.rstrip('\n').split('\t')
              if len(parts)!=3: raise SystemExit(f'invalid numstat: {raw!r}')
              path=parts[2]; pure=PurePosixPath(path)
              if pure.is_absolute() or '..' in pure.parts: raise SystemExit(f'unsafe path: {path}')
              if path.startswith('.github/'):
                  if not path.startswith(permanent_prefix): raise SystemExit(f'forbidden GitHub path: {path}')
                  lowered=path.casefold()
                  if any(token in lowered for token in ('apply-','finalize-','cleanup-','materialize-','transport')): raise SystemExit(f'temporary workflow in owner patch: {path}')
              elif pure.parts[0] not in allowed: raise SystemExit(f'unregistered root: {path}')
              if path.startswith('deploy/compose/.secrets/'): raise SystemExit(f'secret path: {path}')
              paths.append(path)
          if len(paths)!=len(set(paths)) or len(paths)>420: raise SystemExit('invalid or broad E2E patch')
          joined='\n'.join(paths).casefold()
          for token in ('campaigns/berlin_recording_services','osm','http','coverage','export'):
              if token not in joined: raise SystemExit(f'missing E2E owner area: {token}')
          PY

      - name: Apply owner in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(cat /tmp/mode.txt)" = patch ] && git am --3way /tmp/owner.patch
          find .github/workflows -maxdepth 1 -type f \( -name 'apply-*.yml' -o -name 'finalize-*.yml' -o -name 'cleanup-*.yml' -o -name 'materialize-*.yml' \) -delete
          rm -rf .github/apply
          git diff --check

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.10.0'
          enable-cache: true
      - uses: actions/setup-node@v5
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        with:
          node-version: '24'
      - run: uv sync --frozen --all-packages --dev

      - name: Complete backend gate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run collector config validate berlin_recording_services
          uv run python -m compileall -q apps connectors database packages tools

      - name: Complete review console gate
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        shell: bash
        working-directory: web/review_console
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm install --frozen-lockfile; runner='pnpm run';
          elif [ -f package-lock.json ]; then npm ci; runner='npm run';
          elif [ -f yarn.lock ]; then corepack enable; yarn install --immutable; runner='yarn';
          else echo 'missing frontend lock' >&2; exit 1; fi
          node - <<'JS' >/tmp/scripts.txt
          const scripts=require('./package.json').scripts||{};
          for(const required of ['lint','typecheck','build']) if(!scripts[required]) {console.error(`missing ${required}`); process.exitCode=1;}
          for(const name of ['generate:check','client:check','contracts:check','lint','typecheck','test','test:unit','build']) if(scripts[name]) console.log(name);
          JS
          while IFS= read -r script; do $runner "$script"; done </tmp/scripts.txt

      - name: Run clean real Berlin campaign proof
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/data
          sed -i "s#/mnt/data/dcp_full_e2e#${GITHUB_WORKSPACE}#g" /tmp/runtime-proof.sh
          chmod +x /tmp/runtime-proof.sh
          /tmp/runtime-proof.sh | tee /tmp/runtime-proof.log
          python - <<'PY'
          import json,re
          text=open('/tmp/runtime-proof.log',encoding='utf-8',errors='replace').read()
          objects=[]
          for line in text.splitlines():
              line=line.strip()
              if line.startswith('{') and line.endswith('}'):
                  try: objects.append(json.loads(line))
                  except json.JSONDecodeError: pass
          if not objects: raise SystemExit('runtime proof emitted no canonical JSON summary')
          summary=objects[-1]
          rendered=json.dumps(summary,sort_keys=True)
          for token in ('manual','osm','http','candidate','review','coverage','export'):
              if token not in rendered.casefold(): raise SystemExit(f'runtime summary misses {token}')
          PY

      - name: Publish successful proof
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(python - <<'PY'
          import json,os
          repository=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['GITHUB_RUN_ID']
          print(json.dumps({'state':'success','context':'owner/full-berlin-e2e','description':'full Berlin E2E verified','target_url':f'https://github.com/{repository}/actions/runs/{run_id}'}))
          PY
          )"
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "$payload" >/tmp/status-success.json

      - uses: actions/upload-artifact@v4
        with:
          name: verified-full-berlin-e2e
          path: |
            /tmp/mode.txt
            /tmp/locator.txt
            /tmp/owner.patch
            /tmp/runtime-proof.sh
            /tmp/runtime-proof.log
          if-no-files-found: error
          retention-days: 3

  commit:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-full-berlin-e2e
          path: /tmp/verified
      - name: Commit verified E2E owner and purge temporary transport
        shell: bash
        run: |
          set -euo pipefail
          mode="$(tr -d '\r\n' </tmp/verified/mode.txt)"
          if [ "$mode" = patch ]; then
            sha="$(tr -d '\r\n' </tmp/verified/locator.txt)"
            printf '%s  %s\n' "$sha" /tmp/verified/owner.patch | sha256sum -c -
            git am --3way /tmp/verified/owner.patch
          elif [ "$mode" != already-complete ]; then exit 1; fi
          find .github/workflows -maxdepth 1 -type f \( -name 'apply-*.yml' -o -name 'finalize-*.yml' -o -name 'cleanup-*.yml' -o -name 'materialize-*.yml' \) -print -delete
          rm -rf .github/apply
          git add -A
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if [ "$mode" = patch ]; then git commit --amend --no-edit; else git commit -m 'Build (Campaign): remove completed E2E transport'; fi
          git diff HEAD^ --check
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
