name: Diagnose Stage 8 and Stage 9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-stage8-stage9-20260814.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: data-collection-platform-stage8-stage9-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for relevant runs to settle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          for _ in $(seq 1 360); do
            payload="$(curl -fsSL "${headers[@]}" "$api/actions/runs?branch=main&per_page=100")"
            active="$(jq -r --arg current "$CURRENT_RUN_ID" '[.workflow_runs[] | select((.name | test("Stage 8|Review Web|Browser Worker")) and (.id | tostring) != $current and .status != "completed")] | length' <<<"$payload")"
            [[ "$active" == "0" ]] && exit 0
            sleep 5
          done
          echo "Relevant runs did not settle before diagnostic cutoff" >&2
          exit 1

      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 10

      - name: Record exact workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          git fetch origin main
          git reset --hard origin/main
          head_sha="$(git rev-parse HEAD)"
          payload="$(curl -fsSL "${headers[@]}" "$api/actions/runs?branch=main&per_page=100")"

          mkdir -p docs/diagnostics
          {
            echo "# Stage 8 and Stage 9 workflow status"
            echo
            echo "- Recorded main HEAD: \`$head_sha\`"
            echo "- Recorded at UTC: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
            echo
            echo "## Proof inventory"
            echo
            for proof in \
              stage8a-candidate-review-ci.md \
              stage8b-control-api-ci.md \
              stage8c-review-web-ci.md \
              stage8-review-workflow-ci.md \
              stage9-browser-worker-ci.md; do
              if curl -fsS "${headers[@]}" "$api/contents/docs/proofs/$proof?ref=main" >/dev/null; then
                echo "- \`$proof\`: present"
              else
                echo "- \`$proof\`: missing"
              fi
            done
            echo
            echo "## Relevant workflow runs"
            echo
            jq -r '.workflow_runs[] | select(.name | test("Stage 8|Review Web|Browser Worker")) | "- `\(.name)` run `\(.id)` on `\(.head_sha)`: `\(.status)` / `\(.conclusion // "pending")` — \(.display_title)"' <<<"$payload" | head -80
            echo
            echo "## Failed steps"
            echo
            while IFS=$'\t' read -r run_id run_name conclusion; do
              [[ "$conclusion" == "failure" ]] || continue
              jobs="$(curl -fsSL "${headers[@]}" "$api/actions/runs/$run_id/jobs?per_page=100")"
              jq -r --arg run "$run_id" --arg workflow "$run_name" '.jobs[] | .name as $job | .steps[] | select(.conclusion == "failure") | "- `\($workflow)` run `\($run)` — `\($job) → \(.name)`"' <<<"$jobs"
            done < <(jq -r '.workflow_runs[] | select(.name | test("Stage 8|Review Web|Browser Worker")) | [.id, .name, (.conclusion // "pending")] | @tsv' <<<"$payload" | head -80)
          } > docs/diagnostics/stage8-stage9-workflow-status.md

          git add docs/diagnostics/stage8-stage9-workflow-status.md
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Diagnostics): record Stage 8 and Stage 9 status"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
