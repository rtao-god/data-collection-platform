name: Apply Run Admission

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-run-admission.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Delete exact accidental branch probes
        run: |
          for branch in \
            __schema_probe_should_not_create \
            __do_not_create \
            __cleanup_test \
            __cleanup_test_2; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Apply owner-correct run-admission batch
        run: |
          uv run python tools/apply_run_admission_batch.py
          rm -f \
            tools/apply_run_admission_batch.py \
            .github/workflows/repair-current-ci.yml \
            .github/workflows/cleanup-accidental-branches.yml \
            .github/workflows/consolidate-current-ci.yml \
            .github/workflows/apply-run-admission.yml
          uv run ruff check --fix .
          uv run ruff format .

      - name: Verify complete repository
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps database packages tools
          uv run collector config validate berlin_recording_services
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build --file deploy/docker/collector-cli.Dockerfile .
          docker build --file deploy/docker/migration.Dockerfile .

      - name: Commit verified run admission
        run: |
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add -A
          git commit -m "Feat (Run Admission): admit immutable work topology atomically" \
            -m "Owner layer: RunAdmission application use case and PostgreSQL projection." \
            -m "Root cause: published campaign snapshots and durable work metadata had no transaction that proved readiness, source ownership, topology identity, and replay safety together." \
            -m "Replacement: validate one strict plan, hash its immutable topology, gate it on a published ready snapshot, and insert run, admission identity, stages, and initial work as one transaction." \
            -m "Proof target: unit, CLI composition, schema, fresh migration, blocked-snapshot, idempotent replay, changed-plan conflict, source-capacity, immutability, architecture, image, and complete permanent CI checks."
          git push origin HEAD:main
