name: Finalize Review Console Runtime V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-review-console-runtime-v2.yml
  workflow_dispatch:

concurrency:
  group: data-collection-platform-finalize-review-console-runtime
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Publish run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          repository=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['GITHUB_RUN_ID']
          print(json.dumps({'state':'pending','context':'owner/review-console-runtime-v2','description':f'owner-aware review runtime {run_id}','target_url':f'https://github.com/{repository}/actions/runs/{run_id}'}))
          PY
          )"
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "$payload" >/tmp/status.json

      - name: Resolve content-addressed owner, state, and proof
        shell: bash
        run: |
          set -euo pipefail
          base='https://filebin.net/dcp-review-4c8f5692e2114e88bd7465fd9d9e9ec1'
          for _ in $(seq 1 360); do
            if curl -fsS "$base/locator.txt" -o /tmp/owner-locator.txt; then break; fi
            sleep 10
          done
          test -s /tmp/owner-locator.txt
          curl -fsS "$base/state.json" -o /tmp/state.json
          phase="$(python - <<'PY'
          import json
          state=json.load(open('/tmp/state.json'))
          message=((state.get('commit') or {}).get('message') or '').casefold()
          files=(state.get('commit') or {}).get('files') or []
          if 'operations' in message:
              print('operations-repair')
          elif any(str(path).startswith('web/review_console/') for path in files):
              print('review-console')
          else:
              print('unknown')
          PY
          )"
          printf '%s\n' "$phase" >/tmp/phase.txt
          [ "$phase" != unknown ]
          locator="$(tr -d '\r\n' </tmp/owner-locator.txt)"
          if [ "$locator" = failed ]; then
            curl -fsS "$base/failure.json" -o /tmp/failure.json || true
            curl -fsS "$base/failure.log" -o /tmp/failure.log || true
            cat /tmp/failure.json /tmp/failure.log 2>/dev/null || true
            exit 1
          fi
          if [ "$locator" = already-complete ]; then
            printf 'already-complete\n' >/tmp/owner-mode.txt
            : >/tmp/owner.patch
          else
            [[ "$locator" =~ ^[0-9a-f]{64}$ ]]
            curl -fsS "$base/${locator}.patch" -o /tmp/owner.patch
            printf '%s  %s\n' "$locator" /tmp/owner.patch | sha256sum -c -
            printf 'patch\n' >/tmp/owner-mode.txt
          fi
          for _ in $(seq 1 120); do
            if curl -fsS "$base/command-locator.txt" -o /tmp/command-locator.txt; then break; fi
            sleep 10
          done
          command_sha="$(tr -d '\r\n' </tmp/command-locator.txt)"
          [[ "$command_sha" =~ ^[0-9a-f]{64}$ ]]
          curl -fsS "$base/${command_sha}.sh" -o /tmp/runtime-proof.sh
          printf '%s  %s\n' "$command_sha" /tmp/runtime-proof.sh | sha256sum -c -

      - name: Enforce phase-specific patch scope
        shell: bash
        run: |
          set -euo pipefail
          [ "$(cat /tmp/owner-mode.txt)" = already-complete ] && exit 0
          git apply --numstat /tmp/owner.patch >/tmp/numstat.txt
          test -s /tmp/numstat.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          phase=open('/tmp/phase.txt',encoding='utf-8').read().strip()
          allowed={'.codex','apps','campaigns','contracts','database','deploy','docs','packages','tools','web','pyproject.toml','uv.lock','package.json','pnpm-lock.yaml','package-lock.json','yarn.lock','pnpm-workspace.yaml'}
          permanent_workflows={'.github/workflows/review-console-ci.yml','.github/workflows/review-console.yml','.github/workflows/frontend-ci.yml'}
          paths=[]
          for raw in open('/tmp/numstat.txt',encoding='utf-8'):
              parts=raw.rstrip('\n').split('\t')
              if len(parts)!=3: raise SystemExit(f'invalid numstat: {raw!r}')
              path=parts[2]; pure=PurePosixPath(path)
              if pure.is_absolute() or '..' in pure.parts: raise SystemExit(f'unsafe path: {path}')
              if path.startswith('.github/') and path not in permanent_workflows: raise SystemExit(f'unapproved GitHub path: {path}')
              if path.startswith(('.git/','deploy/compose/.secrets/')): raise SystemExit(f'forbidden path: {path}')
              if pure.parts[0] not in allowed and path not in permanent_workflows: raise SystemExit(f'unregistered root: {path}')
              paths.append(path)
          if len(paths)!=len(set(paths)) or len(paths)>300: raise SystemExit('invalid patch breadth')
          joined='\n'.join(paths).casefold()
          if phase=='review-console' and not any(path.startswith('web/review_console/') for path in paths): raise SystemExit('review console boundary absent')
          if phase=='operations-repair' and not any(token in joined for token in ('retention','backup','restore','orchestrat','dagster')): raise SystemExit('operations boundary absent')
          PY

      - name: Apply owner in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(cat /tmp/owner-mode.txt)" = patch ] && git am --3way /tmp/owner.patch
          rm -f \
            .github/workflows/finalize-review-console-runtime.yml \
            .github/workflows/finalize-review-console-runtime-v2.yml \
            .github/workflows/finalize-operations-runtime.yml \
            .github/workflows/finalize-operations-runtime-v2.yml \
            .github/workflows/finalize-browser-acquisition-runtime.yml \
            .github/workflows/finalize-reviewed-export-runtime.yml \
            .github/workflows/finalize-berlin-manual-seed-runtime.yml \
            .github/workflows/finalize-manual-seed-candidate-vertical.yml \
            .github/workflows/apply-manual-seed-candidate-vertical.yml
          git diff --check

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-node@v5
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        with:
          node-version: '24'
      - run: uv sync --frozen --all-packages --dev

      - name: Backend gate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run collector config validate berlin_recording_services
          uv run python -m compileall -q apps connectors database packages tools

      - name: Frontend gate when review console is the owner
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        shell: bash
        working-directory: web/review_console
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm install --frozen-lockfile; runner='pnpm run';
          elif [ -f package-lock.json ]; then npm ci; runner='npm run';
          elif [ -f yarn.lock ]; then corepack enable; yarn install --immutable; runner='yarn';
          else echo 'missing exact frontend lock' >&2; exit 1; fi
          node - <<'JS' >/tmp/scripts.txt
          const scripts=require('./package.json').scripts||{};
          for (const required of ['lint','typecheck','build']) if(!scripts[required]) { console.error(`missing ${required}`); process.exitCode=1; }
          for (const name of ['generate:check','client:check','contracts:check','lint','typecheck','test','test:unit','build']) if(scripts[name]) console.log(name);
          JS
          while IFS= read -r script; do $runner "$script"; done </tmp/scripts.txt

      - name: Clean runtime proof
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/data
          sed -i "s#/mnt/data/dcp_work#${GITHUB_WORKSPACE}#g" /tmp/runtime-proof.sh
          chmod +x /tmp/runtime-proof.sh
          /tmp/runtime-proof.sh | tee /tmp/runtime-proof.log

      - name: Publish successful read-only proof
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(python - <<'PY'
          import json,os
          repository=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['GITHUB_RUN_ID']
          print(json.dumps({'state':'success','context':'owner/review-console-runtime-v2','description':'owner-aware runtime verified','target_url':f'https://github.com/{repository}/actions/runs/{run_id}'}))
          PY
          )"
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "$payload" >/tmp/status-success.json

      - uses: actions/upload-artifact@v4
        with:
          name: verified-review-console-runtime-v2
          path: |
            /tmp/owner-mode.txt
            /tmp/owner-locator.txt
            /tmp/owner.patch
            /tmp/phase.txt
            /tmp/runtime-proof.log
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-review-console-runtime-v2
          path: /tmp/verified
      - name: Commit verified owner and remove all temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          mode="$(tr -d '\r\n' </tmp/verified/owner-mode.txt)"
          if [ "$mode" = patch ]; then
            sha="$(tr -d '\r\n' </tmp/verified/owner-locator.txt)"
            printf '%s  %s\n' "$sha" /tmp/verified/owner.patch | sha256sum -c -
            git am --3way /tmp/verified/owner.patch
          elif [ "$mode" != already-complete ]; then exit 1; fi
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-review-console-runtime.yml \
            .github/workflows/finalize-review-console-runtime-v2.yml \
            .github/workflows/finalize-operations-runtime.yml \
            .github/workflows/finalize-operations-runtime-v2.yml \
            .github/workflows/finalize-browser-acquisition-runtime.yml \
            .github/workflows/finalize-reviewed-export-runtime.yml \
            .github/workflows/finalize-berlin-manual-seed-runtime.yml \
            .github/workflows/finalize-manual-seed-candidate-vertical.yml \
            .github/workflows/apply-manual-seed-candidate-vertical.yml
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if [ "$mode" = patch ]; then git commit --amend --no-edit; else git commit -m 'Build (Review): remove completed runtime transports'; fi
          git diff HEAD^ --check
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
