name: Prove Owner Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prove-owner-reconciliation.yml

permissions:
  contents: write

concurrency:
  group: prove-owner-reconciliation-main
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify reconciled owners
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

      - name: Seal static and unit proof
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/owner-reconciliation.md <<EOF
          # Production owner reconciliation proof

          - verified source head: \`${GITHUB_SHA}\`
          - workspace restore: \`success\`
          - lock and generated contracts: \`success\`
          - Ruff format and lint: \`success\`
          - strict mypy: \`success\`
          - non-integration test suite: \`success\`
          - fail-closed architecture checker: \`success\`
          - Python compilation: \`success\`
          EOF
          git rm .github/workflows/prove-owner-reconciliation.yml
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          git commit -m 'CI (Owners): seal reconciled production boundaries'
          git push origin HEAD:main

      - name: Remove failed proof workflow
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git rm .github/workflows/prove-owner-reconciliation.yml
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Build (Proof): remove failed owner verification'
          git push origin HEAD:main
