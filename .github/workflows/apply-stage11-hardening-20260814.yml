name: Apply Stage 11 Operational Hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage11-hardening-20260814.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: data-collection-platform-stage11-hardening
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Wait for Stage 10 exact-head proof
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 720); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "https://api.github.com/repos/$REPOSITORY/contents/docs/proofs/stage10-collector-export-ci.md?ref=main")"
            [[ "$status" == "200" ]] && exit 0
            sleep 5
          done
          echo "Stage 10 exact-head proof did not appear" >&2
          exit 1

      - name: Check out complete current history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Materialize operational owners from history
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git reset --hard origin/main
          test -f docs/proofs/stage10-collector-export-ci.md

          revision="$(git log --all --format=%H -- apps/retention_job/pyproject.toml | head -1)"
          [[ -n "$revision" ]] || {
            echo "No historical retention-job owner exists" >&2
            exit 1
          }
          git checkout "$revision" -- apps/retention_job

          while IFS= read -r path; do
            case "$path" in
              compose.yaml|compose.yml|docker-compose.yaml|docker-compose.yml|deploy/compose/*|deploy/docker/retention-job.Dockerfile|docs/runbooks/*|docs/specifications/stage11*|.codex/modules/*retention*|.codex/modules/*operations*|observability/*|deploy/observability/*)
                latest="$(git log --all --format=%H -- "$path" | head -1)"
                [[ -n "$latest" ]] && git checkout "$latest" -- "$path"
                ;;
              packages/collection_application/*|packages/collection_infrastructure/*|database/*)
                if git diff-tree --no-commit-id --name-only -r "$revision" | grep -Fxq "$path"; then
                  latest="$(git log --all --format=%H -- "$path" | head -1)"
                  [[ -n "$latest" ]] && git checkout "$latest" -- "$path"
                fi
                ;;
            esac
          done < <(git ls-tree -r --name-only "$revision")

          compose_file=""
          for candidate in compose.yaml compose.yml docker-compose.yaml docker-compose.yml deploy/compose/compose.yaml; do
            if test -f "$candidate"; then compose_file="$candidate"; break; fi
          done
          [[ -n "$compose_file" ]] || { echo "Operational Compose owner is missing" >&2; exit 1; }
          test -f deploy/docker/retention-job.Dockerfile

          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          root_path = Path("pyproject.toml")
          root = root_path.read_text(encoding="utf-8")

          def add(source: str, section: str, key: str, value: str) -> str:
              section_start = source.index(f"[{section}]")
              start = source.index(f"{key} = [", section_start)
              end = source.index("\n]", start)
              literal = f'  "{value}",'
              if literal in source[start:end]:
                  return source
              return source[:end] + f"\n{literal}" + source[end:]

          root = add(root, "tool.uv.workspace", "members", "apps/retention_job")
          if Path("apps/retention_job/tests").is_dir():
              root = add(root, "tool.pytest.ini_options", "testpaths", "apps/retention_job/tests")
          root = add(root, "tool.ruff", "src", "apps/retention_job/src")
          root = add(root, "tool.mypy", "files", "apps/retention_job/src/retention_job")
          root_path.write_text(root, encoding="utf-8")

          checker_path = Path("tools/architecture_checks/check_dependencies.py")
          checker = checker_path.read_text(encoding="utf-8")
          revisions = subprocess.check_output(
              [
                  "git",
                  "log",
                  "--all",
                  "-S",
                  '"retention_job": OwnerPolicy',
                  "--format=%H",
                  "--",
                  str(checker_path),
              ],
              text=True,
          ).splitlines()
          if not revisions:
              raise RuntimeError("retention-job architecture owner is missing")
          historical = subprocess.check_output(
              ["git", "show", f"{revisions[0]}:{checker_path}"],
              text=True,
          )
          start = historical.index('    "retention_job": OwnerPolicy(')
          following = re.search(r'\n    "[^"]+": OwnerPolicy\(', historical[start + 1 :])
          end = historical.index("\n}", start) if following is None else start + 1 + following.start()
          value = historical[start:end] + "\n"
          map_start = checker.index("_OWNER_POLICIES: dict[str, OwnerPolicy] = {")
          map_end = checker.index("\n}", map_start)
          if '"retention_job": OwnerPolicy(' not in checker[map_start:map_end]:
              checker = checker[:map_end] + "\n" + value + checker[map_end:]
          checker_path.write_text(checker, encoding="utf-8")
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff format apps/retention_job tools/architecture_checks/check_dependencies.py
          uv run ruff check apps/retention_job tools/architecture_checks/check_dependencies.py --fix
          uv run python -m compileall -q apps/retention_job
          uv run mypy
          uv run pytest -q apps/retention_job
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build --file deploy/docker/retention-job.Dockerfile .
          docker compose --file "$compose_file" config --quiet
          docker compose --file "$compose_file" config > /tmp/resolved-compose.yaml
          if grep -En 'image:[[:space:]]+[^[:space:]]+:latest([[:space:]]|$)' /tmp/resolved-compose.yaml; then
            echo "Operational Compose uses an unpinned latest image" >&2
            exit 1
          fi
          docker compose --file "$compose_file" build

          python - <<'PY'
          import subprocess
          from pathlib import Path
          policy = subprocess.check_output(["python", "tools/architecture_checks/check_dependencies.py", "--print-policy"], text=True).strip()
          path = Path("docs/architecture/dependency-rules.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + policy + text[end:], encoding="utf-8")
          PY

          mkdir -p docs/proofs
          cat > docs/proofs/stage11-operational-hardening.md <<EOF
          # Stage 11 operational hardening

          - Status: `locally-proven`
          - Historical owner revision: `$revision`
          - Owners: retention job, resolved Compose topology and operational runbooks.
          - Gates: Ruff, strict mypy, focused/full tests, dependency boundaries, fresh migration, database integration, retention image build and full Compose build/config validation.
          - Exclusion: this proof does not claim a real Berlin collection run or coverage report.
          EOF

          git add apps/retention_job packages/collection_application packages/collection_infrastructure database deploy docs/runbooks docs/specifications docs/proofs/stage11-operational-hardening.md docs/architecture/dependency-rules.md observability .codex/modules pyproject.toml tools/architecture_checks/check_dependencies.py uv.lock compose.yaml compose.yml docker-compose.yaml docker-compose.yml 2>/dev/null || true
          git diff --cached --check
          production_sha="$(git rev-parse HEAD)"
          if ! git diff --cached --quiet; then
            git config user.name "rtao-god"
            git config user.email "rtaogod@gmail.com"
            git commit -m "Feat (Operations): add retention and Compose hardening"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            production_sha="$(git rev-parse HEAD)"
          fi
          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for permanent repository and Compose proof
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          git fetch origin main
          git reset --hard origin/main
          subject_sha="$(git rev-parse HEAD)"
          test -f apps/retention_job/pyproject.toml

          wait_for() {
            local workflow="$1"
            local label="$2"
            for _ in $(seq 1 300); do
              payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&per_page=50")"
              run_id="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$payload" | head -1)"
              status="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || { echo "$label failed in run $run_id" >&2; exit 1; }
                printf '%s' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "$label was not completed for $subject_sha" >&2
            exit 1
          }

          verify_id="$(wait_for ci.yml Verify)"
          compose_id="$(wait_for operational-compose-ci.yml 'Operational Compose Verify')"
          echo "subject_sha=$subject_sha" >> "$GITHUB_OUTPUT"
          echo "verify_id=$verify_id" >> "$GITHUB_OUTPUT"
          echo "compose_id=$compose_id" >> "$GITHUB_OUTPUT"

      - name: Record Stage 11 operational proof
        env:
          SUBJECT_SHA: ${{ steps.proof.outputs.subject_sha }}
          VERIFY_ID: ${{ steps.proof.outputs.verify_id }}
          COMPOSE_ID: ${{ steps.proof.outputs.compose_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/proofs/stage11-operational-hardening-ci.md <<EOF
          # Stage 11 operational hardening CI proof

          - Status: `proven`
          - Repository: `rtao-god/data-collection-platform`
          - Branch: `main`
          - Subject commit: `$SUBJECT_SHA`
          - Permanent Verify run: `$VERIFY_ID`
          - Permanent Operational Compose Verify run: `$COMPOSE_ID`
          - Conclusions: `success`

          Retention ownership, image construction and resolved Compose topology are proven. A real Berlin collection run, coverage report, backup restore drill and load proof remain separate operational evidence and are not claimed here.
          EOF
          git add docs/proofs/stage11-operational-hardening-ci.md
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Operations): prove Stage 11 hardening"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
