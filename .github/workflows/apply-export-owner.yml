name: Apply Sealed Export Owner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-export-owner.yml
      - .github/apply/export-owner.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-apply-sealed-export-owner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Apply reviewed owner patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if test -f packages/export_core/src/export_core/service.py && test -f deploy/docker/export-cli.Dockerfile; then
            exit 0
          fi
          test -s .github/apply/export-owner.patch
          git apply --index --3way .github/apply/export-owner.patch
          git diff --cached --check
      - name: Verify Python and database owners
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          uv run ruff format --check .
          uv run ruff check .
          uv lock --check
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/export_architecture_check.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
      - name: Verify image and complete Compose topology
        shell: bash
        run: |
          set -euo pipefail
          docker build --file deploy/docker/export-cli.Dockerfile --tag data-collection-platform/export-cli:ci .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/export-cli:ci)" = "10001:10001"
          docker compose \
            --env-file deploy/compose/.env.example \
            -f deploy/compose/infrastructure.yaml \
            -f deploy/compose/application.yaml \
            config >/tmp/application-compose.yaml
          grep -q '^  collector-export:' /tmp/application-compose.yaml
      - name: Commit production owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/apply-export-owner.yml \
            .github/apply/export-owner.patch
          git add \
            apps/export_cli \
            packages/export_contracts \
            packages/export_core \
            packages/export_infrastructure \
            database/migrations/versions/20260815_0014_collector_exports.py \
            database/tests/test_collector_export_schema.py \
            database/tests/test_postgres_export_repository.py \
            deploy/docker/export-cli.Dockerfile \
            deploy/compose/application.yaml \
            deploy/compose/.env.example \
            .github/workflows/export-ci.yml \
            .github/workflows/vertical-data-flow-e2e.yml \
            tools/e2e_smoke/run_sealed_export.py \
            tools/export_architecture_check.py \
            pyproject.toml uv.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Feat (Export): add deterministic sealed collector export"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
