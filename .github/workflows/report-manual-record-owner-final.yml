name: Report Manual Record Owner Final

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: data-collection-platform-report-manual-record-owner-final
  cancel-in-progress: false

jobs:
  report:
    if: github.event.issue.title == 'Report canonical manual record owner final'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-shot reporter first
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/report-manual-record-owner-final.yml
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Chore (Manual Import): remove final owner reporter"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Report latest owner workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(gh run list \
            --workflow apply-manual-record-owner.yml \
            --limit 5 \
            --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url)"
          gh issue comment "$ISSUE_NUMBER" --body "\`\`\`json
          ${report}
          \`\`\`"
