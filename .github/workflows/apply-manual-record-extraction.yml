name: Apply Manual Record Extraction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-manual-record-extraction.yml
      - .github/apply/manual-record-extraction.tar.xz.b64.part-*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-apply-manual-record-extraction
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Verify and extract reviewed owner bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess

          base = "bbae84b55ba0a9d04779fba5cb4ab0d082e267d9"
          workflow = ".github/workflows/apply-manual-record-extraction.yml"
          prefix = ".github/apply/manual-record-extraction.tar.xz.b64.part-"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"],
              text=True,
          ).splitlines()
          unexpected = [path for path in changed if path != workflow and not path.startswith(prefix)]
          if unexpected:
              raise SystemExit(
                  "manual-record extraction base has unrelated mutations: "
                  + ", ".join(unexpected)
              )
          PY
          cat \
            .github/apply/manual-record-extraction.tar.xz.b64.part-00 \
            .github/apply/manual-record-extraction.tar.xz.b64.part-01 \
            .github/apply/manual-record-extraction.tar.xz.b64.part-02 \
            .github/apply/manual-record-extraction.tar.xz.b64.part-03 \
            > /tmp/manual-record-extraction.tar.xz.b64
          echo "539dd836a797607eeb7d3d3450829029942986dcfff3052bf85d78d775e3f41c  /tmp/manual-record-extraction.tar.xz.b64" \
            | sha256sum --check --strict
          base64 --decode /tmp/manual-record-extraction.tar.xz.b64 \
            > /tmp/manual-record-extraction.tar.xz
          echo "d0d24e39df7ecde32c25d03f57bf4af083e12d128e9d50def2803317dd695172  /tmp/manual-record-extraction.tar.xz" \
            | sha256sum --check --strict
          xz --test /tmp/manual-record-extraction.tar.xz
          install -d /tmp/manual-record-extraction
          tar -xJf /tmp/manual-record-extraction.tar.xz -C /tmp/manual-record-extraction

      - name: Apply exact owner files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          from pathlib import Path

          repository = Path.cwd().resolve()
          bundle = Path("/tmp/manual-record-extraction")
          manifest = json.loads((bundle / "manifest.json").read_text(encoding="utf-8"))
          expected_base = "bbae84b55ba0a9d04779fba5cb4ab0d082e267d9"
          expected_tree = "0d2849b825ca87e2faf57121ce4d1f7f2b09e988"
          if manifest.get("repository") != "rtao-god/data-collection-platform":
              raise SystemExit("manual-record extraction bundle targets another repository")
          if manifest.get("branch") != "main":
              raise SystemExit("manual-record extraction bundle targets another branch")
          if manifest.get("baseCommit") != expected_base:
              raise SystemExit("manual-record extraction bundle has an unexpected base commit")
          if manifest.get("baseTree") != expected_tree:
              raise SystemExit("manual-record extraction bundle has an unexpected base tree")
          actual_tree = subprocess.check_output(
              ["git", "show", "-s", "--format=%T", expected_base],
              text=True,
          ).strip()
          if actual_tree != expected_tree:
              raise SystemExit("manual-record extraction repository base tree changed")
          files = manifest.get("files")
          if not isinstance(files, list) or len(files) != 14:
              raise SystemExit("manual-record extraction bundle file inventory is invalid")
          paths: set[str] = set()
          for item in files:
              if not isinstance(item, dict):
                  raise SystemExit("manual-record extraction bundle file entry is invalid")
              relative = item.get("path")
              expected_size = item.get("size")
              expected_digest = item.get("sha256")
              if not isinstance(relative, str) or not relative or relative.startswith("/"):
                  raise SystemExit("manual-record extraction bundle path is invalid")
              if relative in paths:
                  raise SystemExit(f"manual-record extraction path is duplicated: {relative}")
              paths.add(relative)
              source = (bundle / "files" / relative).resolve()
              if not source.is_relative_to((bundle / "files").resolve()) or not source.is_file():
                  raise SystemExit(f"manual-record extraction source is missing: {relative}")
              payload = source.read_bytes()
              actual_digest = hashlib.sha256(payload).hexdigest()
              if len(payload) != expected_size or actual_digest != expected_digest:
                  raise SystemExit(f"manual-record extraction file identity mismatch: {relative}")
              target = (repository / relative).resolve()
              if not target.is_relative_to(repository):
                  raise SystemExit(f"manual-record extraction target escaped repository: {relative}")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
          PY
          git diff --check

      - name: Restore lock and generated contracts
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check

      - name: Remove transport before architecture proof
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-manual-record-extraction.yml
          rm .github/apply/manual-record-extraction.tar.xz.b64.part-*
          rmdir .github/apply
          git diff --check

      - name: Verify canonical manual-record extraction
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run ruff format --check .
          uv run ruff check . --output-format=github
          uv run mypy
          uv run pytest \
            packages/collection_contracts/tests/test_processing.py \
            packages/extraction_core/tests/test_manual_record.py \
            apps/processing_worker/tests/test_worker.py
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run python -m compileall -q apps connectors database packages tools
          docker build \
            --file deploy/docker/processing-worker.Dockerfile \
            --tag data-collection-platform/processing-worker:manual-record-extraction-proof \
            .

      - name: Commit production owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Feature (Extraction): process canonical manual records"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
