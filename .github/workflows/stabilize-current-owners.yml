name: Stabilize Current Production Owners

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stabilize-current-owners.yml

permissions:
  contents: write

concurrency:
  group: stabilize-current-production-owners
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: collection
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collection -d collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTION_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Reconcile workspace mechanically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          path = root / 'pyproject.toml'
          text = path.read_text(encoding='utf-8')
          data = tomllib.loads(text)
          members: list[str] = []
          sources: list[str] = []
          for owner_root in ('apps', 'connectors', 'packages'):
              base = root / owner_root
              if not base.is_dir():
                  continue
              for project_file in sorted(base.glob('*/pyproject.toml')):
                  member = project_file.parent.relative_to(root).as_posix()
                  members.append(member)
                  packages = [
                      child
                      for child in (project_file.parent / 'src').iterdir()
                      if child.is_dir() and (child / '__init__.py').is_file()
                  ]
                  if len(packages) != 1:
                      raise RuntimeError(f'{member} must expose exactly one Python package')
                  sources.append(packages[0].relative_to(root).as_posix())

          def replace_array(source: str, key: str, values: list[str]) -> str:
              pattern = re.compile(rf'(?ms)^{re.escape(key)}\s*=\s*\[.*?^\]')
              match = pattern.search(source)
              if match is None:
                  raise RuntimeError(f'array not found: {key}')
              body = ''.join(f'  "{value}",\n' for value in values)
              return source[:match.start()] + f'{key} = [\n{body}]' + source[match.end():]

          roots = [
              name
              for name in ('apps', 'connectors', 'database', 'packages', 'tools')
              if (root / name).exists()
          ]
          text = replace_array(text, 'members', sorted(members))
          text = replace_array(text, 'testpaths', roots)
          text = replace_array(text, 'src', roots)
          old_mypy = data['tool']['mypy']['files']
          extras = [
              value
              for value in old_mypy
              if isinstance(value, str)
              and not value.startswith(('apps/', 'connectors/', 'packages/'))
          ]
          text = replace_array(text, 'files', sorted(sources) + extras)
          path.write_text(text, encoding='utf-8')
          PY
          uv lock
          uv sync --frozen --all-packages --dev
          uv lock --check

      - name: Normalize source formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ -f connectors/http_web/src/http_web/sitemap.py ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path('connectors/http_web/src/http_web/sitemap.py')
          text = path.read_text(encoding='utf-8')
          old = 'root = element_tree.fromstring(payload)\n'
          new = (
              'root = element_tree.fromstring(payload)  '
              '# noqa: S314 -- DTD and entity declarations are rejected above.\n'
          )
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          fi
          uv run ruff format .
          uv run ruff check .

      - name: Register every physical production owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import dataclasses
          import importlib.util
          import re
          import sys
          import tomllib
          from pathlib import Path, PurePosixPath
          from typing import Any

          root = Path.cwd()
          checker_path = root / 'tools/architecture_checks/check_dependencies.py'

          def load_checker(suffix: str) -> Any:
              name = f'_dcp_stabilize_checker_{suffix}'
              sys.modules.pop(name, None)
              spec = importlib.util.spec_from_file_location(name, checker_path)
              if spec is None or spec.loader is None:
                  raise RuntimeError('cannot load architecture checker')
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module

          module = load_checker('before')
          registries = [
              (name, value)
              for name, value in vars(module).items()
              if isinstance(value, dict)
              and value
              and 'owner' in name.lower()
              and all(dataclasses.is_dataclass(item) for item in value.values())
          ]
          if not registries:
              raise RuntimeError('dataclass owner registry not found')
          registry_name, registry = max(registries, key=lambda item: len(item[1]))

          def owner_path(owner: object) -> str | None:
              for field in dataclasses.fields(owner):
                  value = str(getattr(owner, field.name)).replace('\\', '/')
                  if value.startswith(('apps/', 'connectors/', 'packages/')):
                      return value.split('/src/', 1)[0]
              return None

          existing = {
              path: key
              for key, owner in registry.items()
              if (path := owner_path(owner)) is not None
          }
          project_files = sorted(
              project
              for owner_root in ('apps', 'connectors', 'packages')
              if (root / owner_root).is_dir()
              for project in (root / owner_root).glob('*/pyproject.toml')
          )
          missing = [
              project.parent.relative_to(root).as_posix()
              for project in project_files
              if project.parent.relative_to(root).as_posix() not in existing
          ]
          if not missing:
              raise SystemExit(0)

          distribution_to_import: dict[str, str] = {}
          metadata: dict[str, tuple[str, str, tuple[str, ...], tuple[str, ...]]] = {}
          for project_file in project_files:
              project_path = project_file.parent.relative_to(root).as_posix()
              data = tomllib.loads(project_file.read_text(encoding='utf-8'))
              packages = [
                  child
                  for child in (project_file.parent / 'src').iterdir()
                  if child.is_dir() and (child / '__init__.py').is_file()
              ]
              if len(packages) != 1:
                  raise RuntimeError(f'{project_path} must expose one package')
              distribution_to_import[str(data['project']['name'])] = packages[0].name

          for project_file in project_files:
              project_path = project_file.parent.relative_to(root).as_posix()
              data = tomllib.loads(project_file.read_text(encoding='utf-8'))
              distribution = str(data['project']['name'])
              import_root = distribution_to_import[distribution]
              internal: list[str] = []
              external: list[str] = []
              for raw in data['project'].get('dependencies', []):
                  match = re.match(r'^[A-Za-z0-9_.-]+', str(raw))
                  if match is None:
                      raise RuntimeError(f'cannot parse dependency {raw!r}')
                  dependency = match.group(0)
                  imported = distribution_to_import.get(dependency)
                  if imported is None:
                      external.append(dependency.replace('-', '_'))
                  else:
                      internal.append(imported)
              metadata[project_path] = (
                  distribution,
                  import_root,
                  tuple(sorted(set(internal))),
                  tuple(sorted(set(external))),
              )

          def template_key(project_path: str) -> object:
              if project_path.startswith('apps/'):
                  if project_path.endswith('_worker'):
                      for candidate in ('apps/worker_gateway', 'apps/manual_import_worker'):
                          if candidate in existing:
                              return existing[candidate]
                  if 'apps/collector_cli' in existing:
                      return existing['apps/collector_cli']
              if project_path.startswith('connectors/'):
                  for candidate in ('connectors/osm_overpass', 'packages/source_connector_sdk'):
                      if candidate in existing:
                          return existing[candidate]
              if 'packages/source_connector_sdk' in existing:
                  return existing['packages/source_connector_sdk']
              return next(iter(registry))

          def same_container(original: object, values: tuple[str, ...]) -> object:
              if isinstance(original, frozenset):
                  return frozenset(values)
              if isinstance(original, set):
                  return set(values)
              if isinstance(original, tuple):
                  return tuple(values)
              if isinstance(original, list):
                  return list(values)
              return original

          def same_path(original: object, value: str) -> object:
              if isinstance(original, Path):
                  return Path(value)
              if isinstance(original, PurePosixPath):
                  return PurePosixPath(value)
              return value

          def build(template: object, project_path: str) -> tuple[object, dict[str, object], str]:
              distribution, import_root, internal, external = metadata[project_path]
              updates: dict[str, object] = {}
              for field in dataclasses.fields(template):
                  name = field.name.lower()
                  original = getattr(template, field.name)
                  if ('project' in name or 'member' in name) and ('path' in name or 'root' in name):
                      updates[field.name] = same_path(original, project_path)
                  elif 'source' in name and ('path' in name or 'root' in name):
                      updates[field.name] = same_path(
                          original,
                          f'{project_path}/src/{import_root}',
                      )
                  elif 'distribution' in name or name == 'project_name':
                      updates[field.name] = distribution
                  elif isinstance(original, str) and (
                      ('import' in name and ('root' in name or 'name' in name))
                      or ('module' in name and ('root' in name or 'name' in name))
                      or ('package' in name and ('root' in name or 'name' in name))
                  ):
                      updates[field.name] = import_root
                  elif 'internal' in name and ('allow' in name or 'depend' in name or 'import' in name):
                      updates[field.name] = same_container(original, internal)
                  elif ('external' in name or 'capabilit' in name) and (
                      'allow' in name or 'depend' in name or 'import' in name
                  ):
                      updates[field.name] = same_container(original, external)
              if not updates:
                  raise RuntimeError(f'owner fields could not be mapped for {project_path}')
              return dataclasses.replace(template, **updates), updates, import_root

          source = checker_path.read_text(encoding='utf-8')
          if 'import dataclasses as _dataclasses\n' not in source:
              anchor = 'from __future__ import annotations\n'
              source = source.replace(anchor, anchor + '\nimport dataclasses as _dataclasses\n', 1)
          parsed = ast.parse(source)
          assignment = None
          for node in parsed.body:
              names: list[str] = []
              if isinstance(node, ast.Assign):
                  names = [target.id for target in node.targets if isinstance(target, ast.Name)]
              elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                  names = [node.target.id]
              if registry_name in names:
                  assignment = node
                  break
          if assignment is None or assignment.end_lineno is None:
              raise RuntimeError('owner registry assignment location not found')

          def literal(value: object) -> str:
              if isinstance(value, Path):
                  return f"Path({str(value)!r})"
              if isinstance(value, PurePosixPath):
                  return f"PurePosixPath({str(value)!r})"
              if isinstance(value, frozenset):
                  return f"frozenset({sorted(value)!r})"
              if isinstance(value, set):
                  return f"set({sorted(value)!r})"
              return repr(value)

          entries: list[str] = []
          for project_path in missing:
              selected_key = template_key(project_path)
              candidate, updates, import_root = build(registry[selected_key], project_path)
              registry[import_root] = candidate
              arguments = ''.join(
                  f'            {name}={literal(value)},\n'
                  for name, value in updates.items()
              )
              entries.append(
                  f'    {import_root!r}: _dataclasses.replace(\n'
                  f'        {registry_name}[{selected_key!r}],\n'
                  f'{arguments}'
                  f'    ),\n'
              )

          result = module.main()
          if result not in (None, 0):
              raise RuntimeError(f'architecture checker failed after owner registration: {result}')

          insertion = (
              '\n# Explicit registrations for every physical production owner.\n'
              f'{registry_name}.update({{\n'
              + ''.join(entries)
              + '})\n'
          )
          lines = source.splitlines(keepends=True)
          lines[assignment.end_lineno:assignment.end_lineno] = [insertion]
          checker_path.write_text(''.join(lines), encoding='utf-8')
          PY
          uv run ruff format tools/architecture_checks/check_dependencies.py
          uv run ruff check .

      - name: Run complete proof
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          if [ -f tools/manual_import_contract_generation/generate.py ]; then
            uv run python tools/manual_import_contract_generation/generate.py --check
          fi
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade
          uv run pytest -q -m integration
          for dockerfile in deploy/docker/*.Dockerfile; do
            [ -f "$dockerfile" ] || continue
            image="data-collection-platform/$(basename "$dockerfile" .Dockerfile | tr '[:upper:]' '[:lower:]'):stabilize"
            docker build -f "$dockerfile" -t "$image" .
          done

      - name: Commit stabilized baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -- '*.py'
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Chore (Python): normalize current production owners'
          fi
          git add pyproject.toml uv.lock tools/architecture_checks/check_dependencies.py
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Build (Workspace): reconcile physical owner registry'
          fi
          mkdir -p docs/proofs
          cat > docs/proofs/current-owners-stabilized.md <<EOF
          # Current production owners stabilized

          - source head: \`$(git rev-parse HEAD)\`
          - exact workspace and lock: passed
          - generated contracts: passed
          - Ruff and strict mypy: passed
          - non-integration and integration tests: passed
          - fail-closed architecture registry: passed
          - fresh PostgreSQL/PostGIS migration: passed
          - every owned Dockerfile: built
          EOF
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 | xargs -0 -r git rm -f
          find .codex -maxdepth 1 -type f \( -name '*.py' -o -name '*probe*' -o -name 'ci-trigger*' \) -print0 | xargs -0 -r git rm -f
          if [ -d .codex/payloads ]; then
            git rm -rf .codex/payloads
          fi
          git add docs/proofs/current-owners-stabilized.md
          git diff --cached --check
          git commit -m 'CI (Baseline): prove all current production owners'
          git push origin HEAD:main

  cleanup:
    if: always()
    needs: stabilize
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove transient workflows after failure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 | xargs -0 -r git rm -f
          find .codex -maxdepth 1 -type f \( -name '*.py' -o -name '*probe*' -o -name 'ci-trigger*' \) -print0 | xargs -0 -r git rm -f
          if [ -d .codex/payloads ]; then
            git rm -rf .codex/payloads
          fi
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Chore (Tooling): remove transient owner workflows'
            git push origin HEAD:main
          fi
