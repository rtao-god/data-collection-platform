name: Apply Canonical Geography Boundary Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-canonical-geography-boundary-fix.yml
      - .github/apply/canonical-geography-boundary-fix.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-canonical-geography-boundary-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Apply canonical geography boundary fix
        shell: bash
        run: |
          set -euo pipefail
          echo "c40e866394f9f11c24260f6a2d4711735e208be3b6fd093b6a7575d91255310c  .github/apply/canonical-geography-boundary-fix.patch" \
            | sha256sum --check --strict
          git apply --index .github/apply/canonical-geography-boundary-fix.patch
          git diff --cached --check
      - name: Verify canonical geography boundary fix
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run ruff check \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run mypy
          uv run pytest -q \
            packages/collection_application/tests/test_geography.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run python -m compileall -q packages tools
      - name: Commit fix and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-canonical-geography-boundary-fix.yml \
            .github/apply/canonical-geography-boundary-fix.patch
          git add -A
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Campaign): publish canonical geography geometry"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
