name: Finalize Manual Import Admission

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-manual-import-admission.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: collection
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collection -d collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: true

      - name: Integrate worker and admission owners
        run: |
          python - <<'PY'
          from pathlib import Path

          db_script = Path('.codex/integrate_manual_import_worker_db.py')
          if db_script.exists():
              text = db_script.read_text(encoding='utf-8')
              text = text.replace(
                  "'ADD CONSTRAINT {constraint} CHECK (' || expression || ')';",
                  "'ADD CONSTRAINT {constraint} CHECK ({expression})';",
              )
              db_script.write_text(text, encoding='utf-8')

          worker_script = Path('.codex/integrate_manual_import_worker.py')
          if worker_script.exists():
              exec(compile(worker_script.read_text(encoding='utf-8'), str(worker_script), 'exec'), {'__name__': '__main__'})
          if db_script.exists():
              exec(compile(db_script.read_text(encoding='utf-8'), str(db_script), 'exec'), {'__name__': '__main__'})

          admission_script = Path('.codex/integrate_manual_import_admission.py')
          if admission_script.exists():
              exec(
                  compile(admission_script.read_text(encoding='utf-8'), str(admission_script), 'exec'),
                  {'__name__': '__main__'},
              )

          test_path = Path('packages/collection_application/tests/test_manual_import_admission.py')
          if test_path.exists():
              text = test_path.read_text(encoding='utf-8')
              if 'from collections.abc import Sequence' not in text:
                  text = text.replace(
                      'from __future__ import annotations\n',
                      'from __future__ import annotations\n\nfrom collections.abc import Sequence\n',
                      1,
                  )
              text = text.replace(
                  'children: tuple[ManualImportChildWork, ...],',
                  'children: Sequence[ManualImportChildWork],',
              )
              text = text.replace('self.children = children', 'self.children = tuple(children)')
              test_path.write_text(text, encoding='utf-8')

          app_path = Path(
              'packages/collection_application/src/collection_application/manual_import_admission.py'
          )
          if app_path.exists():
              text = app_path.read_text(encoding='utf-8')
              text = text.replace(
                  '''        digests = tuple(record.record_digest for record in self.records)\n        if len(set(digests)) != len(digests):\n            raise ValueError("manual import record digests must be unique within one plan")\n''',
                  '',
              )
              app_path.write_text(text, encoding='utf-8')
          PY

      - name: Resolve exact workspace
        run: |
          uv lock
          uv sync --frozen --all-packages --dev

      - name: Generate owned contracts
        run: |
          uv run python tools/contract_generation/generate.py
          if [ -f tools/manual_import_contract_generation/generate.py ]; then
            uv run python tools/manual_import_contract_generation/generate.py
          fi

      - name: Normalize repository-owned Python
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .

      - name: Verify static contracts
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          if [ -f tools/manual_import_contract_generation/generate.py ]; then
            uv run python tools/manual_import_contract_generation/generate.py --check
          fi
          uv run mypy
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps packages connectors 2>/dev/null || \
            uv run python -m compileall -q apps packages

      - name: Verify deterministic behavior
        run: |
          uv run pytest -q -m 'not integration'

      - name: Apply fresh database migration
        run: |
          uv run collection-migrate upgrade
          uv run python - <<'PY'
          import sqlalchemy as sa
          from sqlalchemy import create_engine

          engine = create_engine('postgresql+psycopg://collection:collection@localhost:5432/collection')
          with engine.connect() as connection:
              tables = set(
                  connection.execute(
                      sa.text(
                          "SELECT table_schema || '.' || table_name "
                          "FROM information_schema.tables "
                          "WHERE table_schema = 'manual_import'"
                      )
                  ).scalars()
              )
          expected = {
              'manual_import.plan_admissions',
              'manual_import.plan_admission_items',
          }
          missing = sorted(expected - tables)
          if missing:
              raise SystemExit(f'missing manual import admission tables: {missing}')
          PY

      - name: Verify integration contracts
        run: |
          uv run pytest -q -m integration

      - name: Build capability-minimal images
        run: |
          docker build -f deploy/docker/collector-cli.Dockerfile .
          docker build -f deploy/docker/migration.Dockerfile .
          docker build -f deploy/docker/worker-gateway.Dockerfile .
          docker build -f deploy/docker/manual-import-worker.Dockerfile .

      - name: Commit verified owner batch
        run: |
          rm -f \
            .codex/integrate_manual_import_worker.py \
            .codex/integrate_manual_import_worker_db.py \
            .codex/integrate_manual_import_admission.py \
            .github/workflows/cleanup-transient-files.yml \
            .github/workflows/integrate-manual-import-worker.yml \
            .github/workflows/recover-manual-import-worker.yml \
            .github/workflows/finalize-manual-import-admission.yml \
            .codex/push-files-schema-probe \
            .codex/push-files-schema-probe-2 \
            .codex/payloads/typed-work-input-20260812.part00 \
            .codex/payloads/typed-work-input-20260812.part01 \
            __missing__
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Feat (Manual Import): admit verified plans atomically'
          git push origin HEAD:main
