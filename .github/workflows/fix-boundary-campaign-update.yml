name: Fix Nested Berlin Boundary Configuration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-boundary-campaign-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install boundary-context aware updater
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/live_collection/berlin_boundary.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _update_yaml_value(")
          end = text.index("\n\ndef update_campaign", start)
          replacement = '''def _update_yaml_value(
    value: object,
    boundary_path: str,
    digest: str,
    *,
    in_boundary: bool = False,
) -> tuple[object, int]:
    changes = 0
    if isinstance(value, list):
        updated: list[object] = []
        for item in value:
            if (
                isinstance(item, Mapping)
                and item.get("code") == "BERLIN_BOUNDARY_ARTIFACT_MISSING"
            ):
                changes += 1
                continue
            rewritten, item_changes = _update_yaml_value(
                item,
                boundary_path,
                digest,
                in_boundary=in_boundary,
            )
            changes += item_changes
            updated.append(rewritten)
        return updated, changes
    if not isinstance(value, Mapping):
        return value, 0
    result: dict[object, object] = {}
    for key, item in value.items():
        lowered = str(key).lower()
        boundary_context = in_boundary or "boundary" in lowered
        if boundary_context and "digest" in lowered and isinstance(item, str):
            result[key] = digest
            changes += 1
            continue
        if boundary_context and any(
            token in lowered for token in ("path", "artifact", "reference", "file")
        ):
            if isinstance(item, str):
                result[key] = boundary_path
                changes += 1
                continue
        rewritten, item_changes = _update_yaml_value(
            item,
            boundary_path,
            digest,
            in_boundary=boundary_context,
        )
        result[key] = rewritten
        changes += item_changes
    readiness = result.get("readiness")
    if isinstance(readiness, Mapping):
        blockers = readiness.get("blockers")
        if isinstance(blockers, Sequence) and not blockers:
            readiness = dict(readiness)
            readiness["state"] = "ready"
            result["readiness"] = readiness
    return result, changes
'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          test = Path("tools/live_collection/tests/test_berlin_boundary.py")
          test_text = test.read_text(encoding="utf-8")
          addition = '''


def test_nested_boundary_owner_is_updated(tmp_path: Path) -> None:
    campaign = tmp_path / "campaign"
    campaign.mkdir()
    (campaign / "geography.yaml").write_text(
        yaml.safe_dump(
            {
                "geography": {
                    "boundary": {
                        "artifact": {
                            "path": "missing.geojson",
                            "digest": "sha256:" + "0" * 64,
                        }
                    }
                }
            },
            sort_keys=False,
        ),
        encoding="utf-8",
    )

    update_campaign(
        campaign,
        boundary_path="campaigns/example/geography/berlin-boundary.geojson",
        digest="sha256:" + "b" * 64,
    )

    value = yaml.safe_load((campaign / "geography.yaml").read_text(encoding="utf-8"))
    assert value["geography"]["boundary"]["artifact"] == {
        "path": "campaigns/example/geography/berlin-boundary.geojson",
        "digest": "sha256:" + "b" * 64,
    }
'''
          if "def test_nested_boundary_owner_is_updated" not in test_text:
              test.write_text(test_text.rstrip() + addition, encoding="utf-8")
          PY
          uv sync --frozen --all-packages --dev
          uv run ruff format \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run ruff check \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run pytest -q tools/live_collection/tests/test_berlin_boundary.py
          uv run mypy tools/live_collection/berlin_boundary.py
      - name: Commit proven geography updater
        shell: bash
        run: |
          set -euo pipefail
          git add \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/tests/test_berlin_boundary.py
          git diff --cached --check
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Geography): update nested boundary ownership"
          git push origin HEAD:main
