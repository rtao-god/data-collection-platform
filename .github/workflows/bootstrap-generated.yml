name: Bootstrap generated artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bootstrap-generated-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Install exact Python
        run: uv python install 3.13.13

      - name: Refresh exact dependency graph
        run: uv lock --python 3.13.13

      - name: Restore refreshed workspace
        run: uv sync --frozen --all-packages --dev

      - name: Generate checked-in JSON Schemas
        run: uv run python tools/contract_generation/generate.py

      - name: Commit generated artifacts
        shell: bash
        run: |
          git add uv.lock contracts/json_schema
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build (Generated): refresh lock and JSON schemas"
          git push origin HEAD:main
