name: Bootstrap generated artifacts

"on":
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bootstrap-generated-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Refresh dependencies and contracts
        id: bootstrap
        shell: bash
        run: |
          set +e
          log=.bootstrap-generated.log
          : > "$log"

          uv python install 3.13.13 >> "$log" 2>&1
          status=$?
          if [[ $status -eq 0 ]]; then
            uv lock --python 3.13.13 >> "$log" 2>&1
            status=$?
          fi
          if [[ $status -eq 0 ]]; then
            uv sync --frozen --all-packages --dev >> "$log" 2>&1
            status=$?
          fi
          if [[ $status -eq 0 ]]; then
            uv run python tools/contract_generation/generate.py >> "$log" 2>&1
            status=$?
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit generated artifacts or diagnostic
        shell: bash
        run: |
          git add uv.lock .bootstrap-generated.log
          if [[ -d contracts/json_schema ]]; then
            git add contracts/json_schema
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build (Generated): refresh lock and JSON schemas"
          git push origin HEAD:main

      - name: Fail after preserving diagnostics
        if: steps.bootstrap.outputs.status != '0'
        run: exit 1
