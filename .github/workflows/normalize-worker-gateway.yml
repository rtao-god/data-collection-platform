name: Normalize Worker Gateway

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-worker-gateway.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply exact owner corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          checker = Path("tools/architecture_checks/check_dependencies.py")
          text = checker.read_text(encoding="utf-8")
          anchor = '''    "collection_migration": OwnerPolicy(
          '''.replace("          ", "")
          owner = '''    "worker_gateway": OwnerPolicy(
              project_path="apps/worker_gateway",
              distribution_name="worker-gateway",
              allowed_internal_imports=(
                  "collection_application",
                  "collection_contracts",
                  "collection_infrastructure",
              ),
              allowed_external_imports=frozenset(
                  {"fastapi", "pydantic", "sqlalchemy", "uvicorn"}
              ),
          ),
          '''.replace("          ", "")
          if '"worker_gateway": OwnerPolicy(' not in text:
              if anchor not in text:
                  raise SystemExit("architecture owner insertion anchor was not found")
              text = text.replace(anchor, owner + anchor, 1)
          checker.write_text(text, encoding="utf-8")

          app = Path("apps/worker_gateway/src/worker_gateway/app.py")
          text = app.read_text(encoding="utf-8")
          replacements = {
              "from fastapi import APIRouter, Depends, FastAPI, Header, Request, Response": (
                  "from fastapi import APIRouter, Depends, FastAPI, Request, Response"
              ),
              "from fastapi.responses import JSONResponse": (
                  "from fastapi.responses import JSONResponse\n"
                  "from fastapi.security import HTTPAuthorizationCredentials, HTTPBearer"
              ),
              '_CORRELATION_PATTERN = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:@+-]{0,99}$")\n': (
                  '_CORRELATION_PATTERN = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:@+-]{0,99}$")\n'
                  '_WORKER_BEARER = HTTPBearer(auto_error=False, scheme_name="WorkerBearer")\n'
              ),
              '''def _authenticate_worker(
              request: Request,
              authorization: Annotated[str | None, Header(alias="Authorization")] = None,
          ) -> WorkerPrincipal:
              return _dependencies(request).authenticator.authenticate(authorization)
          '''.replace("          ", ""): '''def _authenticate_worker(
              request: Request,
              credentials: Annotated[
                  HTTPAuthorizationCredentials | None,
                  Depends(_WORKER_BEARER),
              ],
          ) -> WorkerPrincipal:
              authorization = (
                  f"{credentials.scheme} {credentials.credentials}"
                  if credentials is not None
                  else None
              )
              return _dependencies(request).authenticator.authenticate(authorization)
          '''.replace("          ", ""),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"gateway app fragment was not found: {old!r}")
              text = text.replace(old, new, 1)
          app.write_text(text, encoding="utf-8")

          app_test = Path("apps/worker_gateway/tests/test_app.py")
          text = app_test.read_text(encoding="utf-8")
          text = text.replace(
              "from __future__ import annotations\n\nfrom datetime",
              "from __future__ import annotations\n\nfrom collections.abc import Callable\nfrom datetime",
              1,
          )
          text = text.replace(
              "    readiness_probe: object | None = None,\n",
              "    readiness_probe: Callable[[], None] | None = None,\n",
              1,
          )
          text = text.replace(
              "    probe = readiness_probe if callable(readiness_probe) else lambda: None\n",
              "    probe = readiness_probe or (lambda: None)\n",
              1,
          )
          app_test.write_text(text, encoding="utf-8")

          runtime_test = Path("database/tests/test_worker_gateway_runtime.py")
          text = runtime_test.read_text(encoding="utf-8")
          text = text.replace(
              "from __future__ import annotations\n\nimport os",
              "from __future__ import annotations\n\nimport os\nfrom collections.abc import Iterator",
              1,
          )
          fixture_anchor = '''def _digest(*parts: str) -> str:
          '''.replace("          ", "")
          fixture = '''@pytest.fixture
          def engine() -> Iterator[Engine]:
              value = sa.create_engine(_database_url(), poolclass=NullPool)
              try:
                  yield value
              finally:
                  value.dispose()


          '''.replace("          ", "")
          if "def engine() -> Iterator[Engine]:" not in text:
              if fixture_anchor not in text:
                  raise SystemExit("gateway runtime fixture anchor was not found")
              text = text.replace(fixture_anchor, fixture + fixture_anchor, 1)
          text = text.replace("    assert work == {", "    assert dict(work) == {", 1)
          runtime_test.write_text(text, encoding="utf-8")

          main = Path("apps/worker_gateway/src/worker_gateway/__main__.py")
          text = main.read_text(encoding="utf-8")
          old = '''    engine = sa.create_engine(database_url, pool_pre_ping=True)
              authenticator = WorkerAuthenticator.from_secret_file(credential_file)
          '''.replace("          ", "")
          new = '''    authenticator = WorkerAuthenticator.from_secret_file(credential_file)
              engine = sa.create_engine(database_url, pool_pre_ping=True)
          '''.replace("          ", "")
          if old not in text:
              raise SystemExit("gateway composition ordering fragment was not found")
          main.write_text(text.replace(old, new, 1), encoding="utf-8")

          architecture_test = Path("tools/architecture_checks/tests/test_check_dependencies.py")
          text = architecture_test.read_text(encoding="utf-8")
          addition = '''

          def test_worker_gateway_rejects_direct_domain_dependency(tmp_path: Path) -> None:
              checker = _load_checker()
              _write_source(
                  tmp_path,
                  "apps/worker_gateway/src/worker_gateway/app.py",
                  "from collection_domain import WorkLease\\n",
              )

              violations = checker.find_violations(tmp_path)

              assert len(violations) == 1
              assert "must not import production owner collection_domain" in violations[0].message
          '''.replace("          ", "")
          if "test_worker_gateway_rejects_direct_domain_dependency" not in text:
              text += addition
          architecture_test.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate dependency policy documentation
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          policy = subprocess.check_output(
              ["python", "tools/architecture_checks/check_dependencies.py", "--print-policy"],
              text=True,
          ).strip()
          path = Path("docs/architecture/dependency-rules.md")
          content = path.read_text(encoding="utf-8")
          start = content.index(start_marker)
          end = content.index(end_marker, start) + len(end_marker)
          path.write_text(content[:start] + policy + content[end:], encoding="utf-8")
          PY

      - name: Update and restore the exact workspace
        run: |
          uv lock
          uv sync --frozen --all-packages --dev

      - name: Generate owned contracts
        run: uv run python tools/contract_generation/generate.py

      - name: Apply canonical formatting and lint fixes
        run: |
          uv run ruff format \
            apps/worker_gateway \
            database/tests/test_worker_gateway_runtime.py \
            tools/architecture_checks/check_dependencies.py \
            tools/architecture_checks/tests/test_check_dependencies.py \
            tools/contract_generation/generate.py \
            tools/contract_generation/tests/test_generate.py
          uv run ruff check --fix \
            apps/worker_gateway \
            database/tests/test_worker_gateway_runtime.py \
            tools/architecture_checks/check_dependencies.py \
            tools/architecture_checks/tests/test_check_dependencies.py \
            tools/contract_generation/generate.py \
            tools/contract_generation/tests/test_generate.py
          uv run ruff format \
            apps/worker_gateway \
            database/tests/test_worker_gateway_runtime.py \
            tools/architecture_checks/check_dependencies.py \
            tools/architecture_checks/tests/test_check_dependencies.py \
            tools/contract_generation/generate.py \
            tools/contract_generation/tests/test_generate.py

      - name: Prove the normalized owner boundary
        run: |
          uv run mypy
          uv run pytest -m "not integration" \
            apps/worker_gateway \
            tools/architecture_checks/tests \
            tools/contract_generation/tests
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check

      - name: Commit normalized owner outputs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add \
            apps/worker_gateway \
            contracts/openapi \
            database/tests/test_worker_gateway_runtime.py \
            docs/architecture/dependency-rules.md \
            tools/architecture_checks/check_dependencies.py \
            tools/architecture_checks/tests/test_check_dependencies.py \
            tools/contract_generation/generate.py \
            tools/contract_generation/tests/test_generate.py \
            uv.lock
          git commit -m "Build (Gateway): seal the Worker Gateway owner boundary" \
            -m "Owner layer: authenticated Worker Gateway deployable and generated transport contract." \
            -m "Root cause: source, architecture registry, dependency lock, OpenAPI, formatting, and static proof were not yet one reproducible package set." \
            -m "Replacement: register the owner, project bearer security into OpenAPI, add exact runtime fixtures, regenerate the frozen lock and contract, and apply canonical source formatting." \
            -m "Proof target: strict mypy, focused gateway/architecture/contract tests, owner dependency checks, generated drift, permanent image build, and PostgreSQL end-to-end verification."
          git push origin HEAD:main
