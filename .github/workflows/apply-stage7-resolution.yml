name: Apply Stage 7 Resolution Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage7-resolution.yml
      - .github/stage7/**

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage7-resolution-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact payload commit
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Verify expected production parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9eb4775d184a3cc3f0fde34d0345e18c95b5d148"

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Apply and prove Stage 7 owner
        shell: bash
        run: |
          set -euo pipefail
          cat .github/stage7/payload-* > /tmp/stage7-owner.patch.xz.b64
          base64 --decode /tmp/stage7-owner.patch.xz.b64 > /tmp/stage7-owner.patch.xz
          printf '%s  %s\n' \
            '95ddbb852ca8922336074b6f0a1898e605d42de9b381f794812fdb8649a8d8f8' \
            '/tmp/stage7-owner.patch.xz' | sha256sum --check --strict
          xz --decompress --stdout /tmp/stage7-owner.patch.xz > /tmp/stage7-owner.patch
          git apply --index /tmp/stage7-owner.patch

          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py
          uv run python - <<'PY'
          from pathlib import Path

          from resolution_contracts import (
              canonical_resolution_snapshot_json,
              decode_resolution_batch,
          )
          from resolution_worker.snapshot import build_resolution_snapshot

          root = Path.cwd()
          batch = decode_resolution_batch(
              (root / "datasets/entity_resolution/golden-batch.json").read_bytes()
          )
          snapshot = build_resolution_snapshot(batch)
          (root / "datasets/entity_resolution/golden-snapshot.json").write_text(
              canonical_resolution_snapshot_json(snapshot),
              encoding="utf-8",
          )
          PY

          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python -m compileall -q apps connectors database packages tools
          docker build --file deploy/docker/resolution-worker.Dockerfile .
          git diff --check

          git rm -r .github/stage7
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Stage 7 production commit must not mutate workflow files.' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat (Resolution): add deterministic Stage 7 owner"
          git push origin HEAD:main
