name: Repair Review Web From Diagnostic

on:
  push:
    branches: [main]
    paths:
      - docs/diagnostics/materialize-review-web-after-pipeline.md
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-review-web-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Restore latest bounded Review Web owner
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git log --all --format=%H -- apps/review_web/package-lock.json | head -1)"
          test -n "$commit"
          git checkout "$commit" -- apps/review_web
          for path in .github/workflows/review-web-ci.yml deploy/docker/review-web.Dockerfile; do
            if git cat-file -e "$commit:$path" 2>/dev/null; then git checkout "$commit" -- "$path"; fi
          done
          test -f apps/review_web/package.json

      - name: Normalize deterministic frontend contract
        working-directory: apps/review_web
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.lint ||= 'eslint .';
          pkg.scripts.typecheck ||= 'tsc --noEmit';
          pkg.scripts.test ||= 'vitest run';
          pkg.scripts.build ||= 'tsc -b && vite build';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          JS
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run lint
          npm run typecheck
          npm run test -- --run
          npm run build
          if grep -R --line-number -E 'dangerouslySetInnerHTML|\.innerHTML' src; then
            echo 'unsafe HTML ownership is forbidden' >&2
            exit 1
          fi

      - name: Verify production image when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f deploy/docker/review-web.Dockerfile; then
            docker build --file deploy/docker/review-web.Dockerfile \
              --tag data-collection-platform/review-web:ci .
          fi

      - name: Commit repaired Review Web and continue
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/repair-review-web-from-diagnostic.yml \
            .github/workflows/materialize-review-web-after-pipeline.yml \
            docs/diagnostics/materialize-review-web-after-pipeline.md
          git add apps/review_web
          test ! -f .github/workflows/review-web-ci.yml || git add .github/workflows/review-web-ci.yml
          test ! -f deploy/docker/review-web.Dockerfile || git add deploy/docker/review-web.Dockerfile
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Fix (Review): close deterministic web owner'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/materialize-browser-worker-after-review.yml/dispatches" \
            -d '{"ref":"main"}' >/dev/null
