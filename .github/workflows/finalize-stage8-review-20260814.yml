name: Finalize Stage 8 Review Workflow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-stage8-review-20260814.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage8-review-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for all Stage 8 exact-head proofs
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          for _ in $(seq 1 360); do
            missing=0
            for proof in \
              stage8a-candidate-review-ci.md \
              stage8b-control-api-ci.md \
              stage8c-review-web-ci.md; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' "$api/contents/docs/proofs/$proof?ref=main")"
              [[ "$status" == "200" ]] || missing=1
            done
            [[ "$missing" == "0" ]] && exit 0
            sleep 5
          done
          echo "Stage 8 proofs did not complete" >&2
          exit 1

      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Validate Stage 8 owner inventory and record closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f packages/review_contracts/src/review_contracts/contracts.py
          test -f packages/review_core/src/review_core/transitions.py
          test -f packages/review_application/src/review_application/service.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/review_repository.py
          test -f apps/control_api/src/control_api/app.py
          test -f apps/review_web/package-lock.json
          test -f database/migrations/versions/20260814_0009_candidate_review.py
          test -f docs/proofs/stage8a-candidate-review-ci.md
          test -f docs/proofs/stage8b-control-api-ci.md
          test -f docs/proofs/stage8c-review-web-ci.md

          subject_sha="$(git rev-parse HEAD)"
          cat > docs/proofs/stage8-review-workflow-ci.md <<EOF
          # Stage 8 review workflow closure

          - Status: `proven`
          - Repository: `rtao-god/data-collection-platform`
          - Branch: `main`
          - Subject commit: `$subject_sha`

          ## Closed owners

          - immutable candidate-review contracts;
          - deterministic review state transitions and optimistic revision checks;
          - append-only PostgreSQL review persistence;
          - Control API review reads and commands;
          - typed review web with exact lock restore, tests and production build.

          ## Boundary

          Matching, quality evaluation and export eligibility remain backend-owned. The frontend presents evidence and sends typed commands; it does not reproduce domain decisions.

          Browser acquisition remains a separate Stage 9 capability and is not claimed by this proof.
          EOF
          git add docs/proofs/stage8-review-workflow-ci.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Review): close Stage 8 review workflow"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
