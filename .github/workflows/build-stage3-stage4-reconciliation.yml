name: Build Stage 3 and OSM Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-stage3-stage4-reconciliation.yml
      - .github/reconciliation/reconcile_stage3_stage4.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-collection-platform-stage3-stage4-reconciliation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Reconcile source and run owner gates
        id: reconcile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python .github/reconciliation/reconcile_stage3_stage4.py
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/manual_import_worker/src/manual_import_worker/gateway.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        with httpx.Client(timeout=timeout_seconds, follow_redirects=False) as client:\n"
              "            with client.stream(prepared.method, prepared.url) as response:\n"
          )
          new = (
              "        with (\n"
              "            httpx.Client(timeout=timeout_seconds, follow_redirects=False) as client,\n"
              "            client.stream(prepared.method, prepared.url) as response,\n"
              "        ):\n"
          )
          if old not in text:
              raise RuntimeError("ManualImportWorker: scoped read context anchor is missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff check --exclude .github/reconciliation . --fix --unsafe-fixes
          uv run ruff format --exclude .github/reconciliation .
          uv run ruff check --exclude .github/reconciliation .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          docker build --file deploy/docker/collector-cli.Dockerfile .
          docker build --file deploy/docker/manual-import-worker.Dockerfile .
          docker build --file deploy/docker/migration.Dockerfile .
          docker build --file deploy/docker/worker-gateway.Dockerfile .
          git diff --check

      - name: Package reconciled files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRT > reconciliation-files.txt
          tar -czf reconciliation-files.tar.gz --files-from reconciliation-files.txt
          git diff --binary > reconciliation.patch
          printf '%s\n' '${{ steps.reconcile.outcome }}' > reconciliation-outcome.txt

      - name: Upload reconciliation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage3-stage4-reconciliation
          path: |
            reconciliation-files.tar.gz
            reconciliation-files.txt
            reconciliation.patch
            reconciliation-outcome.txt
          if-no-files-found: error
          retention-days: 3

      - name: Fail when an owner gate failed
        if: steps.reconcile.outcome != 'success'
        run: exit 1
