name: Cleanup Transient Files

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-transient-files.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Remove transient transfer files
        run: |
          rm -f \
            .codex/push-files-schema-probe \
            .codex/push-files-schema-probe-2 \
            .codex/payloads/typed-work-input-20260812.part00 \
            .codex/payloads/typed-work-input-20260812.part01 \
            __missing__ \
            .github/workflows/cleanup-transient-files.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Build (Tooling): remove transient transfer artifacts'
          git push origin HEAD:main
