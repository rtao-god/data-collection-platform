name: Apply Final External Proof Workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-final-external-proof-workflows.yml
      - .github/apply/final-external-proof-workflows.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-final-external-proof-repair
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply autonomous external-proof workflows when closure is absent
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if test -f docs/proofs/end-to-end-operational-ci.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s .github/apply/final-external-proof-workflows.patch
          git apply --index --3way .github/apply/final-external-proof-workflows.patch
          git diff --cached --check
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Verify repaired repository contracts
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          uv run ruff format --check .
          uv run ruff check .
          uv lock --check
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools tests
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ('vertical-data-flow-e2e.yml', 'backup-restore-ci.yml'):
              path = Path('.github/workflows') / name
              payload = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict) or 'jobs' not in payload:
                  raise SystemExit(f'invalid workflow: {path}')
          PY

      - name: Commit production repair and remove transient closure automation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/apply-final-external-proof-workflows.yml \
            .github/apply/final-external-proof-workflows.patch
          if [[ "${{ steps.apply.outputs.changed }}" == 'true' ]]; then
            find .github/workflows -maxdepth 1 -type f -name 'close-operational-e2e*.yml' -print0 | xargs -0 -r git rm -f
          fi
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if [[ "${{ steps.apply.outputs.changed }}" == 'true' ]]; then
            git commit -m 'Fix (E2E): make external proofs autonomous'
          else
            git commit -m 'Build (Tooling): remove redundant external proof transport'
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
