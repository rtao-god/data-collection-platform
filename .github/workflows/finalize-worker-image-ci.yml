name: Finalize Worker Image CI

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: data-collection-platform-worker-image-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Record exact successful worker image proof
        if: github.event.workflow_run.conclusion == 'success'
        shell: bash
        env:
          VERIFIED_HEAD: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD"
          test -f docs/proofs/worker-image-isolation.md
          grep -q 'Build isolated worker images' .github/workflows/ci.yml
          grep -q 'Verify worker image capability inventory' .github/workflows/ci.yml
          mkdir -p docs/proofs
          cat > docs/proofs/worker-image-isolation-ci.md <<EOF
          # Worker image permanent CI proof

          - workflow: \`Verify\`
          - conclusion: \`success\`
          - verified head: \`${VERIFIED_HEAD}\`
          - workflow run: \`${VERIFIED_RUN}\`
          - manual-import worker image: built and inventoried
          - OSM worker image: built and inventoried
          EOF

      - name: Remove finalizer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/finalize-worker-image-ci.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -f docs/proofs/worker-image-isolation-ci.md ]; then
            git commit -m 'CI (Workers): finalize image isolation proof'
          else
            git commit -m 'Build (Tooling): remove unsuccessful worker image finalizer'
          fi
          git push origin HEAD:main
