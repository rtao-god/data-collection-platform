name: Materialize Review Web After Pipeline

on:
  workflow_run:
    workflows: ["Reconcile Pipeline Foundation V5"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: data-collection-platform-review-web-after-pipeline
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for permanent pipeline proof on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          subject="$(git rev-parse HEAD)"
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          workflows=(ci.yml pipeline-advancement-ci.yml)
          for workflow in "${workflows[@]}"; do
            matched=''
            for _ in $(seq 1 360); do
              payload="$(curl -fsSL "${headers[@]}" \
                "$api/actions/workflows/$workflow/runs?branch=main&per_page=50")"
              status="$(jq -r --arg sha "$subject" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg sha "$subject" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' <<<"$payload" | head -1)"
              run_id="$(jq -r --arg sha "$subject" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$payload" | head -1)"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || { echo "$workflow failed in $run_id" >&2; exit 1; }
                matched="$run_id"
                break
              fi
              sleep 5
            done
            test -n "$matched" || { echo "$workflow timed out for $subject" >&2; exit 1; }
          done

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Restore bounded review web owner from history
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git log --all --format=%H -- apps/review_web/package-lock.json | head -1)"
          test -n "$commit" || { echo 'review web owner is absent from main history' >&2; exit 1; }
          git checkout "$commit" -- apps/review_web
          for path in \
            .github/workflows/review-web-ci.yml \
            deploy/docker/review-web.Dockerfile; do
            if git cat-file -e "$commit:$path" 2>/dev/null; then
              git checkout "$commit" -- "$path"
            fi
          done
          test -f apps/review_web/package-lock.json
          test -f apps/review_web/package.json

      - name: Verify deterministic review application
        working-directory: apps/review_web
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const pkg = require('./package.json');
          for (const name of ['lint', 'typecheck', 'test', 'build']) {
            if (!pkg.scripts || !pkg.scripts[name]) {
              throw new Error(`required review-web script is missing: ${name}`);
            }
          }
          JS
          npm ci
          npm run lint
          npm run typecheck
          npm run test -- --run
          npm run build
          if grep -R --line-number --fixed-strings 'dangerouslySetInnerHTML' src; then
            echo 'unsafe HTML rendering is forbidden' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings '.innerHTML' src; then
            echo 'direct innerHTML mutation is forbidden' >&2
            exit 1
          fi

      - name: Verify review image when owned
        shell: bash
        run: |
          set -euo pipefail
          if test -f deploy/docker/review-web.Dockerfile; then
            docker build --file deploy/docker/review-web.Dockerfile \
              --tag data-collection-platform/review-web:ci .
          fi

      - name: Commit bounded review web owner
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/materialize-review-web-after-pipeline.yml
          git add apps/review_web
          test ! -f .github/workflows/review-web-ci.yml || git add .github/workflows/review-web-ci.yml
          test ! -f deploy/docker/review-web.Dockerfile || git add deploy/docker/review-web.Dockerfile
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Feature (Review): materialize deterministic review web'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
