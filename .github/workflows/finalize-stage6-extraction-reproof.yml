name: Finalize Stage 6 Extraction Reproof

on:
  workflow_run:
    workflows:
      - Verify
      - Extraction Worker Isolation
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: data-collection-platform-stage6-extraction-reproof
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Replace proof when both exact-head workflows are green
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [[ "$current" != "$SUBJECT_SHA" ]]; then
            echo "Skipping stale subject $SUBJECT_SHA; current main is $current."
            exit 0
          fi

          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SUBJECT_SHA&per_page=100")"
          verify="$(jq -c '[.workflow_runs[] | select(.name == "Verify" and .event == "push")] | sort_by(.created_at) | last // empty' <<<"$runs")"
          isolation="$(jq -c '[.workflow_runs[] | select(.name == "Extraction Worker Isolation" and .event == "push")] | sort_by(.created_at) | last // empty' <<<"$runs")"

          if [[ -z "$verify" || -z "$isolation" ]]; then
            echo "Both exact-head runs are not present yet."
            exit 0
          fi
          if [[ "$(jq -r '.status' <<<"$verify")" != "completed" || "$(jq -r '.status' <<<"$isolation")" != "completed" ]]; then
            echo "Both exact-head runs are not completed yet."
            exit 0
          fi
          if [[ "$(jq -r '.conclusion' <<<"$verify")" != "success" || "$(jq -r '.conclusion' <<<"$isolation")" != "success" ]]; then
            echo "One or more exact-head Stage 6 proofs failed."
            exit 1
          fi

          verify_id="$(jq -r '.id' <<<"$verify")"
          isolation_id="$(jq -r '.id' <<<"$isolation")"
          cat > docs/proofs/extraction-normalization-ci.md <<EOF
          # Extraction and normalization CI proof

          ## Proven subject

          - Status: \`proven\`
          - Repository: \`$GITHUB_REPOSITORY\`
          - Branch: \`main\`
          - Subject commit: \`$SUBJECT_SHA\`
          - Verify run: \`$verify_id\` — \`success\`
          - Extraction Worker Isolation run: \`$isolation_id\` — \`success\`

          ## Proven gates

          The permanent \`Verify\` workflow restored the frozen workspace and passed generated-contract drift, Ruff formatting and lint, strict mypy, the non-integration test suite, architecture dependency enforcement, Python compilation, campaign snapshot validation, baseline image builds, and the fresh PostgreSQL/PostGIS migration contract.

          Stage 6 tests prove deterministic observation IDs and canonical bundles; mandatory exact-artifact evidence; JSON-LD, microdata, RDFa, tel/mailto, visible contact spans, addresses and prices; prohibited-field enforcement; conflicting values; explicit missing and malformed-source states; normalizer negative cases; artifact binding; restart behavior; and rejection of source-capacity ownership on the non-source \`extraction\` capability.

          The permanent \`Extraction Worker Isolation\` workflow built \`deploy/docker/extraction-worker.Dockerfile\`, verified runtime identity \`10001:10001\`, verified entrypoint \`extraction-worker\`, imported all four Stage 6 owners and \`phonenumbers\`, and proved the runtime image contains no Alembic, boto3, botocore, Playwright, psycopg, Scrapy, or SQLAlchemy.

          ## Boundary result

          Work Engine remains the canonical scheduler and retry/crash-recovery owner. Request \`sourceKey\` is provenance only; extraction leases cannot carry source-capacity ownership. The worker reads exact gateway-bound artifacts, emits deterministic evidence-bound observations, performs no crawl or browser work, and has no direct database or Object Store implementation ownership.
          EOF

          git add docs/proofs/extraction-normalization-ci.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Proofs): refresh extraction CI"
          git push origin HEAD:main
