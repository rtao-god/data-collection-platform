name: Materialize Browser Worker After Review

on:
  workflow_run:
    workflows: ["Materialize Review Web After Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: data-collection-platform-browser-after-review
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for exact-head repository and review proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          subject="$(git rev-parse HEAD)"
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          for workflow in ci.yml review-web-ci.yml; do
            matched=''
            for _ in $(seq 1 360); do
              payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&per_page=50")"
              status="$(jq -r --arg sha "$subject" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg sha "$subject" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' <<<"$payload" | head -1)"
              run_id="$(jq -r --arg sha "$subject" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$payload" | head -1)"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || { echo "$workflow failed in $run_id" >&2; exit 1; }
                matched="$run_id"
                break
              fi
              sleep 5
            done
            test -n "$matched" || exit 1
          done

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore bounded browser owner from history
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git log --all --format=%H -- apps/browser_worker/pyproject.toml | head -1)"
          test -n "$commit" || { echo 'browser worker owner is absent from main history' >&2; exit 1; }
          git checkout "$commit" -- apps/browser_worker
          for path in \
            deploy/docker/browser-worker.Dockerfile \
            .github/workflows/browser-worker-isolation.yml; do
            if git cat-file -e "$commit:$path" 2>/dev/null; then git checkout "$commit" -- "$path"; fi
          done
          test -f apps/browser_worker/pyproject.toml
          test -f deploy/docker/browser-worker.Dockerfile

      - name: Merge browser owner into current registries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("pyproject.toml")
          text = root.read_text(encoding="utf-8")
          workspace = re.search(r'(?ms)(\[tool\.uv\.workspace\]\s*members\s*=\s*\[)(.*?)(\])', text)
          if workspace is None:
              raise RuntimeError("workspace registry missing")
          body = workspace.group(2)
          if '"apps/browser_worker"' not in body:
              body = body.rstrip() + '\n  "apps/browser_worker",\n'
              text = text[:workspace.start(2)] + body + text[workspace.end(2):]
          mypy = re.search(r'(?ms)(\[tool\.mypy\].*?\nfiles\s*=\s*\[)(.*?)(\])', text)
          if mypy is None:
              raise RuntimeError("mypy registry missing")
          body = mypy.group(2)
          if 'apps/browser_worker/src/browser_worker' not in body:
              body = body.rstrip() + '\n  "apps/browser_worker/src/browser_worker",\n'
              text = text[:mypy.start(2)] + body + text[mypy.end(2):]
          root.write_text(text, encoding="utf-8")
          PY
          uv lock
          uv sync --all-packages --dev --locked

      - name: Prove browser owner and isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format apps/browser_worker
          uv run ruff check --fix apps/browser_worker
          uv run ruff format --check apps/browser_worker
          uv run ruff check apps/browser_worker
          uv run mypy apps/browser_worker/src/browser_worker
          uv run pytest -q apps/browser_worker/tests
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps/browser_worker/src/browser_worker
          docker build --file deploy/docker/browser-worker.Dockerfile \
            --tag data-collection-platform/browser-worker:ci .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/browser-worker:ci)" = "10001:10001"
          docker run --rm -i --entrypoint python data-collection-platform/browser-worker:ci - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec
          import_module("browser_worker")
          import_module("playwright")
          forbidden = {"alembic", "boto3", "botocore", "psycopg", "sqlalchemy"}
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit("browser image contains forbidden owners: " + ", ".join(present))
          PY

      - name: Commit isolated browser owner
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/materialize-browser-worker-after-review.yml
          git add apps/browser_worker deploy/docker/browser-worker.Dockerfile pyproject.toml uv.lock
          test ! -f .github/workflows/browser-worker-isolation.yml || git add .github/workflows/browser-worker-isolation.yml
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Feature (Browser): materialize isolated acquisition worker'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
