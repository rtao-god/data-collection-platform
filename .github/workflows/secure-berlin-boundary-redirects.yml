name: Secure Berlin Boundary Redirects

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/secure-berlin-boundary-redirects.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Enforce official-host redirect requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/live_collection/berlin_boundary_portal.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''def materialize_from_portal(
'''
          helper = '''def _verify_official_request(request: httpx.Request) -> None:
    _require_official_url(str(request.url))


'''
          if "def _verify_official_request(" not in text:
              if anchor not in text:
                  raise RuntimeError("portal materializer anchor is missing")
              text = text.replace(anchor, helper + anchor, 1)
          old = '''        follow_redirects=True,
        headers={"User-Agent": "data-collection-platform-portal-boundary/1"},
'''
          new = '''        follow_redirects=True,
        headers={"User-Agent": "data-collection-platform-portal-boundary/1"},
        event_hooks={"request": [_verify_official_request]},
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError("portal HTTP client anchor is missing")
          path.write_text(text, encoding="utf-8")
          PY
          uv sync --frozen --all-packages --dev
          uv run ruff format tools/live_collection/berlin_boundary_portal.py
          uv run ruff check tools/live_collection/berlin_boundary_portal.py
          uv run pytest -q tools/live_collection/tests/test_berlin_boundary.py
          uv run mypy tools/live_collection/berlin_boundary_portal.py
      - name: Commit proven redirect boundary
        shell: bash
        run: |
          set -euo pipefail
          git add tools/live_collection/berlin_boundary_portal.py
          git diff --cached --check
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Geography): constrain official boundary redirects"
          git push origin HEAD:main
