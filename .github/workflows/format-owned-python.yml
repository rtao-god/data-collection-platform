name: Format Owned Python

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-owned-python.yml

permissions:
  contents: write

concurrency:
  group: format-owned-python-main
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore formatter
        run: uv sync --frozen --all-packages --dev

      - name: Normalize owned Python
        run: uv run ruff format .

      - name: Commit exact formatting change
        run: |
          set -euo pipefail
          git rm .github/workflows/format-owned-python.yml
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix (Formatting): normalize owned Python sources'
          git push origin HEAD:main
