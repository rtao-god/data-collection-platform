name: Add Official HTTP Transport

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-official-http-transport.yml

permissions:
  contents: write

concurrency:
  group: data-collection-platform-official-http-transport
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Serialize after contract proof
        run: |
          sleep 45
          git fetch origin main
          git reset --hard origin/main

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Implement SSRF-safe conditional transport
        id: implement
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/proofs/official-http-contracts-ci.md
          test -d connectors/official_website_http

          python - <<'PY'
          from pathlib import Path
          import tomllib

          path = Path("connectors/official_website_http/pyproject.toml")
          document = tomllib.loads(path.read_text(encoding="utf-8"))
          dependencies = [str(value) for value in document["project"].get("dependencies", [])]
          if not any(value.split("<", 1)[0].split("=", 1)[0].strip() == "httpx" for value in dependencies):
              text = path.read_text(encoding="utf-8")
              text = text.replace("dependencies = []", 'dependencies = ["httpx==0.28.1"]', 1)
              path.write_text(text, encoding="utf-8")
          PY

          cat > connectors/official_website_http/src/official_website_http/transport.py <<'PY'
          from __future__ import annotations

          import ipaddress
          import socket
          from collections.abc import Callable, Mapping, Sequence
          from dataclasses import dataclass
          from datetime import UTC, datetime
          from email.utils import parsedate_to_datetime
          from hashlib import sha256
          from urllib.parse import urljoin

          import httpx

          from official_website_http.contracts import (
              HttpCrawlPolicy,
              HttpFetchOutcome,
              HttpRedirectHop,
              HttpRequestSpec,
              NormalizedUrl,
          )
          from official_website_http.urls import UrlPolicyError, normalize_http_url

          type AddressResolver = Callable[[str, int], Sequence[str]]
          type PeerAddressReader = Callable[[httpx.Response], Sequence[str]]


          @dataclass(frozen=True, slots=True)
          class HttpFetchResult:
              outcome: HttpFetchOutcome
              body: bytes | None

              def __post_init__(self) -> None:
                  if (self.outcome.kind == "fetched") != (self.body is not None):
                      raise ValueError("HTTP fetch body and outcome are inconsistent")


          class HttpTransportError(RuntimeError):
              def __init__(
                  self,
                  *,
                  kind: str,
                  code: str,
                  message: str,
                  context: Mapping[str, object] | None = None,
              ) -> None:
                  self.kind = kind
                  self.code = code
                  self.context = dict(context or {})
                  super().__init__(message)


          class OfficialWebsiteHttpClient:
              def __init__(
                  self,
                  *,
                  resolver: AddressResolver | None = None,
                  peer_address_reader: PeerAddressReader | None = None,
                  transport: httpx.BaseTransport | None = None,
              ) -> None:
                  self._resolver = resolver or _resolve_addresses
                  self._peer_address_reader = peer_address_reader or _connected_peer_addresses
                  self._client = httpx.Client(
                      transport=transport,
                      follow_redirects=False,
                      trust_env=False,
                      timeout=None,
                  )

              def __enter__(self) -> OfficialWebsiteHttpClient:
                  return self

              def __exit__(self, *args: object) -> None:
                  self.close()

              def close(self) -> None:
                  self._client.close()

              def fetch(
                  self,
                  request: HttpRequestSpec,
                  policy: HttpCrawlPolicy,
              ) -> HttpFetchResult:
                  if request.policy_digest != policy.policy_digest:
                      raise HttpTransportError(
                          kind="contract_invalid",
                          code="HTTP_POLICY_DIGEST_MISMATCH",
                          message="Request and source policy digests differ",
                      )
                  current = normalize_http_url(
                      request.url.value,
                      allowed_hosts=policy.allowed_hosts,
                  )
                  redirects: list[HttpRedirectHop] = []
                  for redirect_index in range(policy.maximum_redirects + 1):
                      self._validate_dns(current)
                      headers = _request_headers(request, policy)
                      try:
                          with self._client.stream(
                              "GET",
                              current.value,
                              headers=headers,
                              timeout=policy.request_timeout_seconds,
                          ) as response:
                              self._validate_peer(response, current)
                              if response.status_code in {301, 302, 303, 307, 308}:
                                  location = response.headers.get("Location")
                                  if not location:
                                      return _failure_result(
                                          request,
                                          current,
                                          redirects,
                                          kind="permanent_failure",
                                          status_code=response.status_code,
                                          code="HTTP_REDIRECT_LOCATION_MISSING",
                                      )
                                  if redirect_index >= policy.maximum_redirects:
                                      return _failure_result(
                                          request,
                                          current,
                                          redirects,
                                          kind="permanent_failure",
                                          status_code=response.status_code,
                                          code="HTTP_REDIRECT_LIMIT_EXCEEDED",
                                      )
                                  target = normalize_http_url(
                                      urljoin(current.value, location),
                                      allowed_hosts=policy.allowed_hosts,
                                  )
                                  redirects.append(
                                      HttpRedirectHop(
                                          source_url=current.value,
                                          status_code=response.status_code,
                                          target_url=target.value,
                                      )
                                  )
                                  current = target
                                  continue
                              return self._consume(
                                  request=request,
                                  current=current,
                                  policy=policy,
                                  redirects=tuple(redirects),
                                  response=response,
                              )
                      except UrlPolicyError:
                          raise
                      except httpx.TimeoutException as exc:
                          return _failure_result(
                              request,
                              current,
                              redirects,
                              kind="transient_failure",
                              status_code=None,
                              code="HTTP_TIMEOUT",
                          )
                      except httpx.TransportError as exc:
                          raise HttpTransportError(
                              kind="transient",
                              code="HTTP_TRANSPORT_FAILURE",
                              message="Official website transport failed",
                              context={"causeType": type(exc).__name__},
                          ) from exc
                  raise AssertionError("redirect loop escaped its bounded iterator")

              def _consume(
                  self,
                  *,
                  request: HttpRequestSpec,
                  current: NormalizedUrl,
                  policy: HttpCrawlPolicy,
                  redirects: tuple[HttpRedirectHop, ...],
                  response: httpx.Response,
              ) -> HttpFetchResult:
                  status_code = response.status_code
                  content_type = _media_type(response.headers.get("Content-Type"))
                  etag = response.headers.get("ETag")
                  last_modified = response.headers.get("Last-Modified")
                  if status_code == 304:
                      return HttpFetchResult(
                          outcome=HttpFetchOutcome(
                              kind="unchanged",
                              requested_url=request.url.value,
                              final_url=current.value,
                              status_code=status_code,
                              body_digest=None,
                              body_size_bytes=None,
                              content_type=content_type,
                              etag=etag,
                              last_modified=last_modified,
                              redirects=redirects,
                          ),
                          body=None,
                      )
                  if status_code in {401, 403}:
                      return _failure_result(
                          request,
                          current,
                          redirects,
                          kind="policy_blocked",
                          status_code=status_code,
                          code="HTTP_ACCESS_POLICY_BLOCKED",
                      )
                  if status_code == 429 or status_code == 408 or 500 <= status_code <= 599:
                      return _failure_result(
                          request,
                          current,
                          redirects,
                          kind="transient_failure",
                          status_code=status_code,
                          code="HTTP_UPSTREAM_TRANSIENT",
                          retry_after_seconds=_retry_after_seconds(response.headers),
                      )
                  if status_code < 200 or status_code >= 300:
                      return _failure_result(
                          request,
                          current,
                          redirects,
                          kind="permanent_failure",
                          status_code=status_code,
                          code="HTTP_UPSTREAM_PERMANENT",
                      )
                  if content_type is None or not any(
                      content_type == allowed or content_type.startswith(f"{allowed}+")
                      for allowed in policy.allowed_content_types
                  ):
                      return _failure_result(
                          request,
                          current,
                          redirects,
                          kind="permanent_failure",
                          status_code=status_code,
                          code="HTTP_CONTENT_TYPE_FORBIDDEN",
                      )
                  content_length = response.headers.get("Content-Length")
                  if content_length is not None:
                      try:
                          declared_length = int(content_length)
                      except ValueError:
                          declared_length = -1
                      if declared_length > policy.maximum_response_bytes:
                          return _failure_result(
                              request,
                              current,
                              redirects,
                              kind="permanent_failure",
                              status_code=status_code,
                              code="HTTP_RESPONSE_TOO_LARGE",
                          )
                  body = bytearray()
                  for chunk in response.iter_bytes():
                      body.extend(chunk)
                      if len(body) > policy.maximum_response_bytes:
                          return _failure_result(
                              request,
                              current,
                              redirects,
                              kind="permanent_failure",
                              status_code=status_code,
                              code="HTTP_RESPONSE_TOO_LARGE",
                          )
                  payload = bytes(body)
                  digest = f"sha256:{sha256(payload).hexdigest()}"
                  return HttpFetchResult(
                      outcome=HttpFetchOutcome(
                          kind="fetched",
                          requested_url=request.url.value,
                          final_url=current.value,
                          status_code=status_code,
                          body_digest=digest,
                          body_size_bytes=len(payload),
                          content_type=content_type,
                          etag=etag,
                          last_modified=last_modified,
                          redirects=redirects,
                      ),
                      body=payload,
                  )

              def _validate_dns(self, url: NormalizedUrl) -> None:
                  port = url.port or (443 if url.scheme == "https" else 80)
                  addresses = tuple(self._resolver(url.host, port))
                  if not addresses:
                      raise HttpTransportError(
                          kind="transient",
                          code="HTTP_DNS_EMPTY",
                          message="Source host did not resolve to an address",
                          context={"host": url.host},
                      )
                  _require_public_addresses(addresses, phase="dns")

              def _validate_peer(
                  self,
                  response: httpx.Response,
                  url: NormalizedUrl,
              ) -> None:
                  addresses = tuple(self._peer_address_reader(response))
                  if not addresses:
                      raise HttpTransportError(
                          kind="policy_blocked",
                          code="HTTP_PEER_ADDRESS_UNAVAILABLE",
                          message="Connected peer address could not be verified",
                          context={"host": url.host},
                      )
                  _require_public_addresses(addresses, phase="peer")


          def _request_headers(
              request: HttpRequestSpec,
              policy: HttpCrawlPolicy,
          ) -> dict[str, str]:
              headers = {
                  "Accept": ", ".join(policy.allowed_content_types),
                  "Accept-Encoding": "gzip, deflate, br",
                  "Cache-Control": "no-cache",
                  "User-Agent": policy.user_agent,
              }
              if request.conditional.etag is not None:
                  headers["If-None-Match"] = request.conditional.etag
              if request.conditional.last_modified is not None:
                  headers["If-Modified-Since"] = request.conditional.last_modified
              return headers


          def _failure_result(
              request: HttpRequestSpec,
              current: NormalizedUrl,
              redirects: Sequence[HttpRedirectHop],
              *,
              kind: str,
              status_code: int | None,
              code: str,
              retry_after_seconds: float | None = None,
          ) -> HttpFetchResult:
              return HttpFetchResult(
                  outcome=HttpFetchOutcome(
                      kind=kind,  # type: ignore[arg-type]
                      requested_url=request.url.value,
                      final_url=current.value,
                      status_code=status_code,
                      body_digest=None,
                      body_size_bytes=None,
                      content_type=None,
                      etag=None,
                      last_modified=None,
                      redirects=tuple(redirects),
                      error_code=code,
                      retry_after_seconds=retry_after_seconds,
                  ),
                  body=None,
              )


          def _resolve_addresses(host: str, port: int) -> tuple[str, ...]:
              return tuple(
                  sorted(
                      {
                          str(item[4][0])
                          for item in socket.getaddrinfo(
                              host,
                              port,
                              type=socket.SOCK_STREAM,
                          )
                      }
                  )
              )


          def _connected_peer_addresses(response: httpx.Response) -> tuple[str, ...]:
              stream = response.extensions.get("network_stream")
              if stream is None or not hasattr(stream, "get_extra_info"):
                  return ()
              server_address = stream.get_extra_info("server_addr")
              if isinstance(server_address, tuple) and server_address:
                  return (str(server_address[0]),)
              return ()


          def _require_public_addresses(addresses: Sequence[str], *, phase: str) -> None:
              for value in addresses:
                  try:
                      address = ipaddress.ip_address(value)
                  except ValueError as exc:
                      raise HttpTransportError(
                          kind="policy_blocked",
                          code="HTTP_ADDRESS_INVALID",
                          message="Resolved address is invalid",
                          context={"address": value, "phase": phase},
                      ) from exc
                  if not address.is_global:
                      raise HttpTransportError(
                          kind="policy_blocked",
                          code="HTTP_PRIVATE_ADDRESS_BLOCKED",
                          message="Private or non-routable source address is forbidden",
                          context={"address": value, "phase": phase},
                      )


          def _media_type(value: str | None) -> str | None:
              if value is None:
                  return None
              return value.split(";", 1)[0].strip().lower() or None


          def _retry_after_seconds(headers: Mapping[str, str]) -> float | None:
              value = headers.get("Retry-After")
              if value is None:
                  return None
              try:
                  seconds = float(value)
              except ValueError:
                  try:
                      parsed = parsedate_to_datetime(value)
                  except (TypeError, ValueError, OverflowError):
                      return None
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=UTC)
                  seconds = (parsed.astimezone(UTC) - datetime.now(UTC)).total_seconds()
              return max(0.0, seconds)
          PY

          cat > connectors/official_website_http/tests/test_transport.py <<'PY'
          from __future__ import annotations

          from collections.abc import Callable
          from hashlib import sha256

          import httpx
          import pytest

          from official_website_http import (
              ConditionalRequest,
              HttpCrawlPolicy,
              HttpRequestSpec,
              normalize_http_url,
          )
          from official_website_http.transport import (
              HttpTransportError,
              OfficialWebsiteHttpClient,
          )

          _DIGEST = "sha256:" + "1" * 64


          def policy(*, maximum_response_bytes: int = 4096) -> HttpCrawlPolicy:
              return HttpCrawlPolicy(
                  policy_digest=_DIGEST,
                  allowed_hosts=("example.com",),
                  user_agent="collector/1.0",
                  maximum_response_bytes=maximum_response_bytes,
              )


          def request(
              value: str = "https://example.com/",
              *,
              conditional: ConditionalRequest = ConditionalRequest(),
          ) -> HttpRequestSpec:
              return HttpRequestSpec(
                  url=normalize_http_url(value, allowed_hosts=("example.com",)),
                  policy_digest=_DIGEST,
                  conditional=conditional,
              )


          def client(
              handler: Callable[[httpx.Request], httpx.Response],
              *,
              resolved: tuple[str, ...] = ("1.1.1.1",),
              peer: tuple[str, ...] = ("1.1.1.1",),
          ) -> OfficialWebsiteHttpClient:
              return OfficialWebsiteHttpClient(
                  resolver=lambda _host, _port: resolved,
                  peer_address_reader=lambda _response: peer,
                  transport=httpx.MockTransport(handler),
              )


          def test_private_dns_is_blocked_before_request() -> None:
              called = False

              def handler(_: httpx.Request) -> httpx.Response:
                  nonlocal called
                  called = True
                  return httpx.Response(200, text="unexpected")

              with client(handler, resolved=("127.0.0.1",)) as transport:
                  with pytest.raises(HttpTransportError) as error:
                      transport.fetch(request(), policy())
              assert error.value.code == "HTTP_PRIVATE_ADDRESS_BLOCKED"
              assert error.value.context["phase"] == "dns"
              assert not called


          def test_connected_peer_is_revalidated() -> None:
              with client(
                  lambda _: httpx.Response(200, text="unexpected"),
                  peer=("10.0.0.1",),
              ) as transport:
                  with pytest.raises(HttpTransportError) as error:
                      transport.fetch(request(), policy())
              assert error.value.code == "HTTP_PRIVATE_ADDRESS_BLOCKED"
              assert error.value.context["phase"] == "peer"


          def test_conditional_304_returns_unchanged_without_body() -> None:
              observed: dict[str, str] = {}

              def handler(value: httpx.Request) -> httpx.Response:
                  observed.update(value.headers)
                  return httpx.Response(
                      304,
                      headers={"ETag": '"new"'},
                  )

              with client(handler) as transport:
                  result = transport.fetch(
                      request(
                          conditional=ConditionalRequest(
                              etag='"old"',
                              last_modified="Tue, 12 Aug 2025 10:00:00 GMT",
                          )
                      ),
                      policy(),
                  )
              assert result.body is None
              assert result.outcome.kind == "unchanged"
              assert observed["if-none-match"] == '"old"'
              assert observed["if-modified-since"] == "Tue, 12 Aug 2025 10:00:00 GMT"


          def test_redirect_is_revalidated_and_preserved_in_lineage() -> None:
              def handler(value: httpx.Request) -> httpx.Response:
                  if value.url.path == "/":
                      return httpx.Response(302, headers={"Location": "/final"})
                  return httpx.Response(
                      200,
                      headers={"Content-Type": "text/html"},
                      content=b"ok",
                  )

              with client(handler) as transport:
                  result = transport.fetch(request(), policy())
              assert result.outcome.kind == "fetched"
              assert result.outcome.final_url == "https://example.com/final"
              assert len(result.outcome.redirects) == 1
              assert result.outcome.redirects[0].target_url == "https://example.com/final"


          @pytest.mark.parametrize(
              ("status", "kind", "code"),
              [
                  (403, "policy_blocked", "HTTP_ACCESS_POLICY_BLOCKED"),
                  (429, "transient_failure", "HTTP_UPSTREAM_TRANSIENT"),
                  (500, "transient_failure", "HTTP_UPSTREAM_TRANSIENT"),
                  (404, "permanent_failure", "HTTP_UPSTREAM_PERMANENT"),
              ],
          )
          def test_statuses_are_typed_without_browser_escalation(
              status: int,
              kind: str,
              code: str,
          ) -> None:
              with client(
                  lambda _: httpx.Response(
                      status,
                      headers={"Retry-After": "30"},
                      content=b"upstream diagnostic must not be retained",
                  )
              ) as transport:
                  result = transport.fetch(request(), policy())
              assert result.body is None
              assert result.outcome.kind == kind
              assert result.outcome.error_code == code


          def test_decompressed_stream_limit_is_enforced() -> None:
              with client(
                  lambda _: httpx.Response(
                      200,
                      headers={"Content-Type": "text/html"},
                      content=b"x" * 1025,
                  )
              ) as transport:
                  result = transport.fetch(
                      request(),
                      policy(maximum_response_bytes=1024),
                  )
              assert result.body is None
              assert result.outcome.error_code == "HTTP_RESPONSE_TOO_LARGE"


          def test_success_preserves_exact_body_identity() -> None:
              body = b"<html>ok</html>"
              with client(
                  lambda _: httpx.Response(
                      200,
                      headers={
                          "Content-Type": "text/html; charset=utf-8",
                          "ETag": '"v1"',
                      },
                      content=body,
                  )
              ) as transport:
                  result = transport.fetch(request(), policy())
              assert result.body == body
              assert result.outcome.body_digest == f"sha256:{sha256(body).hexdigest()}"
              assert result.outcome.body_size_bytes == len(body)
              assert result.outcome.content_type == "text/html"
          PY

          python - <<'PY'
          from pathlib import Path
          import ast

          checker = Path("tools/architecture_checks/check_dependencies.py")
          source = checker.read_text(encoding="utf-8")
          tree = ast.parse(source)
          registry = None
          for node in ast.walk(tree):
              value = node.value if isinstance(node, (ast.Assign, ast.AnnAssign)) else None
              if not isinstance(value, ast.Dict):
                  continue
              keys = {
                  key.value
                  for key in value.keys
                  if isinstance(key, ast.Constant) and isinstance(key.value, str)
              }
              if "official_website_http" in keys:
                  registry = value
                  break
          if registry is None:
              raise RuntimeError("official HTTP architecture owner is missing")
          changed = False
          for key, value in zip(registry.keys, registry.values, strict=True):
              if not (
                  isinstance(key, ast.Constant)
                  and key.value == "official_website_http"
                  and isinstance(value, ast.Call)
              ):
                  continue
              for keyword in value.keywords:
                  name = (keyword.arg or "").lower()
                  if "external" not in name and "capabil" not in name:
                      continue
                  current = ast.literal_eval(keyword.value)
                  values = set(current)
                  if "httpx" in values:
                      break
                  values.add("httpx")
                  if isinstance(keyword.value, ast.Call):
                      keyword.value = ast.Call(
                          func=keyword.value.func,
                          args=[ast.Set(elts=[ast.Constant(item) for item in sorted(values)])],
                          keywords=[],
                      )
                  elif isinstance(keyword.value, ast.Set):
                      keyword.value = ast.Set(elts=[ast.Constant(item) for item in sorted(values)])
                  elif isinstance(keyword.value, ast.Tuple):
                      keyword.value = ast.Tuple(
                          elts=[ast.Constant(item) for item in sorted(values)],
                          ctx=ast.Load(),
                      )
                  else:
                      raise RuntimeError("unsupported external dependency container")
                  changed = True
                  break
          if changed:
              checker.write_text(ast.unparse(tree) + "\n", encoding="utf-8")
          PY

          cat >> connectors/official_website_http/src/official_website_http/__init__.py <<'PY'

          from official_website_http.transport import (
              HttpFetchResult,
              HttpTransportError,
              OfficialWebsiteHttpClient,
          )

          __all__.extend(
              [
                  "HttpFetchResult",
                  "HttpTransportError",
                  "OfficialWebsiteHttpClient",
              ]
          )
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff check connectors/official_website_http tools/architecture_checks/check_dependencies.py --fix --unsafe-fixes
          uv run ruff format connectors/official_website_http tools/architecture_checks/check_dependencies.py
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest connectors/official_website_http/tests -q
          uv run pytest -m 'not integration and not object_store_integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

          cat > docs/http-acquisition-transport.md <<'EOF'
          # Official website HTTP transport

          The connector transport manually controls every redirect and revalidates both DNS results and
          the connected peer address before accepting bytes. Non-global addresses, URL credentials,
          IP-literal source URLs, disallowed hosts, missing peer identity, and redirect escapes fail closed.

          `httpx` automatic redirects are disabled. Response bodies are streamed through the decompressed
          byte limit. `If-None-Match` and `If-Modified-Since` produce the typed `unchanged` result on 304.
          HTTP 401/403 are policy-blocked; 408/429/5xx are transient; none of these outcomes authorizes
          browser escalation. Upstream diagnostic bodies are not retained for failure outcomes.
          EOF

          cat > docs/proofs/official-http-transport.md <<'EOF'
          # Official HTTP transport proof

          - DNS private-address rejection: tested
          - connected-peer revalidation: tested
          - redirect allowlist and lineage: tested
          - conditional 304 outcome: tested
          - 403/429/5xx typed policy: tested
          - decompressed response limit: tested
          - exact body SHA-256 identity: tested
          - automatic redirects and ambient proxy environment: disabled
          EOF

      - name: Commit transport or remove blocked automation
        if: always()
        shell: bash
        env:
          IMPLEMENT_OUTCOME: ${{ steps.implement.outcome }}
        run: |
          set -euo pipefail
          if [ "$IMPLEMENT_OUTCOME" != 'success' ]; then
            git reset --hard HEAD
          fi
          git rm -f --ignore-unmatch .github/workflows/add-official-http-transport.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "$IMPLEMENT_OUTCOME" = 'success' ]; then
            git commit -m 'Feature (HTTP Acquisition): add SSRF-safe transport'
          else
            git commit -m 'Build (Tooling): remove blocked HTTP transport batch'
          fi
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1

      - name: Preserve failed status
        if: steps.implement.outcome != 'success'
        run: exit 1
