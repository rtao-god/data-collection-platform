name: Finalize Owner Reconciliation

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: finalize-owner-reconciliation-main
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 3

      - name: Finalize or clean proof automation
        env:
          VERIFIED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
          VERIFIED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$VERIFIED_CONCLUSION" = success ] && [ -f docs/proofs/owner-reconciliation.md ]; then
            cat > docs/proofs/owner-reconciliation-ci.md <<EOF
          # Production owner permanent CI proof

          - verified head: \`${VERIFIED_HEAD_SHA}\`
          - permanent workflow: \`Verify\`
          - workflow run: \`${VERIFIED_RUN_ID}\`
          - conclusion: \`success\`
          EOF
          fi
          git rm .github/workflows/finalize-owner-reconciliation.yml
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          git commit -m 'CI (Owners): finalize permanent boundary proof'
          git push origin HEAD:main
