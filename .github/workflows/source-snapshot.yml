name: Read-only Source Snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-collection-platform-source-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Materialize formatter-normalized source snapshot
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=.pytest_cache \
            --exclude=.mypy_cache \
            --exclude=.ruff_cache \
            -czf /tmp/data-collection-platform-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: data-collection-platform-source-${{ github.sha }}
          path: /tmp/data-collection-platform-source.tar.gz
          if-no-files-found: error
          retention-days: 1
