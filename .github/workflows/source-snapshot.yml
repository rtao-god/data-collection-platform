name: One-shot Formatter Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-formatter-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Apply exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            apps/worker_gateway/src/worker_gateway/__main__.py
            tools/compose_secrets/tests/test_materialize.py
            tools/live_collection/berlin_boundary.py
            tools/live_collection/berlin_boundary_portal.py
            tools/live_collection/run_bounded_live_proof.py
            tools/live_collection/select_source_inputs.py
            tools/live_collection/tests/test_berlin_boundary.py
            tools/live_collection/tests/test_berlin_boundary_portal.py
            tools/live_collection/tests/test_run_bounded_live_proof.py
          )
          uv run ruff format "${paths[@]}"
          uv run ruff format --check .
          git diff --check
          git rm .github/workflows/source-snapshot.yml
          git add "${paths[@]}"
          changed="$(git diff --cached --name-only)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 10
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Style (Python): restore formatter baseline"
          git push origin HEAD:main
