name: Register Missing Architecture Owners

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/register-missing-owners.yml

permissions:
  contents: write

concurrency:
  group: data-collection-platform-baseline
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Extend the explicit owner registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import dataclasses
          import inspect
          import re
          import runpy
          import tomllib
          from pathlib import Path
          from typing import Any

          checker = Path('tools/architecture_checks/check_dependencies.py')
          source = checker.read_text(encoding='utf-8')
          marker_start = '# BEGIN GENERATED EXPLICIT OWNER REGISTRATIONS'
          marker_end = '# END GENERATED EXPLICIT OWNER REGISTRATIONS'
          if marker_start in source:
              before, remainder = source.split(marker_start, 1)
              _, after = remainder.split(marker_end, 1)
              source = before.rstrip() + '\n' + after.lstrip('\n')
              checker.write_text(source, encoding='utf-8')

          namespace = runpy.run_path(str(checker), run_name='_architecture_registry_probe_')
          dataclass_types = [
              value
              for value in namespace.values()
              if isinstance(value, type) and dataclasses.is_dataclass(value)
          ]
          owner_type = next(
              (
                  value
                  for value in dataclass_types
                  if {'project_path', 'distribution_name', 'import_root'}
                  <= {field.name for field in dataclasses.fields(value)}
              ),
              None,
          )
          if owner_type is None:
              raise RuntimeError('explicit OwnerRule dataclass was not found')

          registry_name = None
          registry: Any = None
          for name, value in namespace.items():
              values = list(value.values()) if isinstance(value, dict) else list(value) if isinstance(value, (list, tuple)) else []
              if values and all(isinstance(item, owner_type) for item in values):
                  registry_name = name
                  registry = value
                  break
          if registry_name is None:
              raise RuntimeError('explicit owner registry was not found')

          existing_rules = list(registry.values()) if isinstance(registry, dict) else list(registry)
          existing_by_path = {getattr(rule, 'project_path'): rule for rule in existing_rules}

          projects: list[dict[str, Any]] = []
          for root in ('apps', 'connectors', 'packages'):
              for project_file in sorted(Path(root).glob('*/pyproject.toml')):
                  project_path = str(project_file.parent).replace('\\', '/')
                  payload = tomllib.loads(project_file.read_text(encoding='utf-8'))
                  project = payload['project']
                  src = project_file.parent / 'src'
                  roots = sorted(
                      child.name
                      for child in src.iterdir()
                      if child.is_dir() and not child.name.endswith('.egg-info')
                  )
                  if len(roots) != 1:
                      raise RuntimeError(f'{project_path} must expose exactly one import root: {roots}')
                  projects.append(
                      {
                          'path': project_path,
                          'distribution': str(project['name']),
                          'import_root': roots[0],
                          'dependencies': tuple(str(value) for value in project.get('dependencies', [])),
                      }
                  )

          distribution_to_import = {
              re.sub(r'[-_.]+', '-', project['distribution']).lower(): project['import_root']
              for project in projects
          }

          def dependency_name(requirement: str) -> str:
              head = re.split(r'[<>=!~;\[\s]', requirement, maxsplit=1)[0]
              return re.sub(r'[-_.]+', '-', head).lower()

          def collection_like(original: Any, values: set[str]) -> Any:
              ordered = sorted(values)
              if isinstance(original, frozenset):
                  return frozenset(ordered)
              if isinstance(original, set):
                  return set(ordered)
              if isinstance(original, tuple):
                  return tuple(ordered)
              if isinstance(original, list):
                  return ordered
              raise RuntimeError(f'unsupported collection type: {type(original).__name__}')

          def replacement_value(field: dataclasses.Field[Any], template: Any, project: dict[str, Any]) -> Any:
              name = field.name
              original = getattr(template, name)
              dependencies = {dependency_name(value) for value in project['dependencies']}
              internal = {
                  distribution_to_import[value]
                  for value in dependencies
                  if value in distribution_to_import
              }
              external = dependencies - set(distribution_to_import)

              if name == 'project_path' or ('project' in name and 'path' in name):
                  return project['path']
              if name == 'distribution_name' or ('distribution' in name and not isinstance(original, (set, frozenset, tuple, list))):
                  return project['distribution']
              if name == 'import_root':
                  return project['import_root']
              if name == 'source_root' or ('source' in name and 'root' in name):
                  return f"{project['path']}/src/{project['import_root']}"
              if name in {'owner', 'owner_name', 'owner_id', 'name', 'key'} and isinstance(original, str):
                  return project['import_root']
              if name in {'kind', 'project_kind', 'owner_kind'} and isinstance(original, str):
                  return project['path'].split('/', 1)[0].removesuffix('s')
              if isinstance(original, (set, frozenset, tuple, list)):
                  lowered = name.lower()
                  if 'internal' in lowered or 'import' in lowered or 'owner' in lowered:
                      return collection_like(original, internal)
                  if 'external' in lowered or 'distribution' in lowered or 'dependency' in lowered:
                      return collection_like(original, external)
                  if 'path' in lowered and 'source' in lowered:
                      return collection_like(original, {f"{project['path']}/src/{project['import_root']}"})
                  return collection_like(original, set())
              if isinstance(original, str):
                  return original.replace(
                      getattr(template, 'project_path'), project['path']
                  ).replace(
                      getattr(template, 'distribution_name'), project['distribution']
                  ).replace(
                      getattr(template, 'import_root'), project['import_root']
                  )
              return original

          missing = [project for project in projects if project['path'] not in existing_by_path]
          if not missing:
              raise SystemExit(0)

          def select_template(project: dict[str, Any]) -> Any:
              prefix = project['path'].split('/', 1)[0] + '/'
              candidates = [
                  rule for rule in existing_rules
                  if str(getattr(rule, 'project_path')).startswith(prefix)
              ]
              if not candidates:
                  candidates = existing_rules
              if not candidates:
                  raise RuntimeError('owner registry has no template rule')
              return sorted(candidates, key=lambda rule: str(getattr(rule, 'project_path')))[0]

          fields = dataclasses.fields(owner_type)
          expressions: list[str] = []
          dict_entries: list[tuple[Any, str]] = []
          existing_dict_items = list(registry.items()) if isinstance(registry, dict) else []
          for project in missing:
              template = select_template(project)
              values = {
                  field.name: replacement_value(field, template, project)
                  for field in fields
              }
              arguments = ',\n'.join(
                  f'        {name}={value!r}' for name, value in values.items()
              )
              expression = f'{owner_type.__name__}(\n{arguments},\n    )'
              expressions.append(expression)
              if existing_dict_items:
                  template_key = next(
                      key for key, value in existing_dict_items if value is template
                  )
                  if template_key == getattr(template, 'project_path'):
                      key = project['path']
                  elif template_key == getattr(template, 'distribution_name'):
                      key = project['distribution']
                  else:
                      key = project['import_root']
                  dict_entries.append((key, expression))

          if isinstance(registry, tuple):
              extension = f"{registry_name} = (*{registry_name},\n" + ''.join(
                  f'    {expression},\n' for expression in expressions
              ) + ')'
          elif isinstance(registry, list):
              extension = f"{registry_name} = [*{registry_name},\n" + ''.join(
                  f'    {expression},\n' for expression in expressions
              ) + ']'
          elif isinstance(registry, dict):
              extension = f"{registry_name} = {{**{registry_name},\n" + ''.join(
                  f'    {key!r}: {expression},\n' for key, expression in dict_entries
              ) + '}'
          else:
              raise RuntimeError(f'unsupported registry type: {type(registry).__name__}')

          source = checker.read_text(encoding='utf-8')
          tree = ast.parse(source)
          assignment = next(
              node
              for node in tree.body
              if isinstance(node, (ast.Assign, ast.AnnAssign))
              and (
                  any(isinstance(target, ast.Name) and target.id == registry_name for target in getattr(node, 'targets', []))
                  or isinstance(getattr(node, 'target', None), ast.Name)
                  and getattr(node, 'target').id == registry_name
              )
          )
          lines = source.splitlines()
          insertion = assignment.end_lineno or assignment.lineno
          block = [
              '',
              marker_start,
              extension,
              marker_end,
              '',
          ]
          lines[insertion:insertion] = block
          checker.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Verify explicit owner registrations
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tools/architecture_checks/check_dependencies.py
          uv run ruff check tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_dependencies.py
          uv run mypy
          uv run pytest -q -m 'not integration'

      - name: Commit explicit owners and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/register-missing-owners.yml
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build (Architecture): register all production owners'
          git push origin HEAD:main

      - name: Remove workflow after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rm -f --ignore-unmatch .github/workflows/register-missing-owners.yml
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Build (Tooling): remove failed owner registrar'
            git push origin HEAD:main
          fi
