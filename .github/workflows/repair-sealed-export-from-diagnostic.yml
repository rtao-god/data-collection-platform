name: Repair Sealed Export From Diagnostic

on:
  push:
    branches: [main]
    paths:
      - docs/diagnostics/materialize-sealed-export-after-browser.md
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-sealed-export-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore complete export bounded context from history
        shell: bash
        run: |
          set -euo pipefail
          core="$(git log --all --format=%H -- packages/export_core/pyproject.toml | head -1)"
          test -n "$core"
          git checkout "$core" -- packages/export_core
          for path in packages/export_contracts apps/export_worker apps/export_job; do
            commit="$(git log --all --format=%H -- "$path/pyproject.toml" | head -1)"
            if [[ -n "$commit" ]] && git cat-file -e "$commit:$path" 2>/dev/null; then git checkout "$commit" -- "$path"; fi
          done
          for path in .github/workflows/export-ci.yml tools/architecture_checks/check_dependencies.py; do
            commit="$(git log --all --format=%H -- "$path" | head -1)"
            if [[ -n "$commit" ]] && git cat-file -e "$commit:$path" 2>/dev/null; then git checkout "$commit" -- "$path"; fi
          done
          while IFS= read -r migration; do
            commit="$(git log --all --format=%H -- "$migration" | head -1)"
            [[ -z "$commit" ]] || git checkout "$commit" -- "$migration"
          done < <(git ls-tree -r --name-only "$core" database/migrations/versions | grep -Ei 'export|sealed' || true)

      - name: Rebuild workspace from current physical owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('pyproject.toml')
          text=root.read_text(encoding='utf-8')
          members=[]
          for pattern in ('apps/*/pyproject.toml','connectors/*/pyproject.toml','packages/*/pyproject.toml'):
              members.extend(p.parent.as_posix() for p in Path().glob(pattern))
          members=sorted(set(members))
          ws=re.search(r'(?ms)(\[tool\.uv\.workspace\]\s*members\s*=\s*\[)(.*?)(\])',text)
          if ws is None: raise RuntimeError('workspace registry missing')
          body=''.join(f'\n  "{m}",' for m in members)+'\n'
          text=text[:ws.start(2)]+body+text[ws.end(2):]
          roots=[]
          for member in members:
              src=Path(member)/'src'
              if src.is_dir():
                  roots.extend(c.as_posix() for c in src.iterdir() if c.is_dir() and (c/'__init__.py').exists())
          mypy=re.search(r'(?ms)(\[tool\.mypy\].*?\nfiles\s*=\s*\[)(.*?)(\])',text)
          if mypy is None: raise RuntimeError('mypy registry missing')
          existing=[x.strip().strip('",') for x in mypy.group(2).splitlines() if x.strip()]
          all_roots=sorted(set(existing+roots))
          body=''.join(f'\n  "{r}",' for r in all_roots)+'\n'
          text=text[:mypy.start(2)]+body+text[mypy.end(2):]
          root.write_text(text,encoding='utf-8')
          PY
          uv lock
          uv sync --all-packages --dev --locked

      - name: Prove sealed export lifecycle and database ownership
        shell: bash
        run: |
          set -euo pipefail
          targets=(packages/export_core)
          test ! -d packages/export_contracts || targets+=(packages/export_contracts)
          uv run ruff format "${targets[@]}"
          uv run ruff check --fix "${targets[@]}"
          uv run ruff format --check "${targets[@]}"
          uv run ruff check "${targets[@]}"
          uv run mypy packages/export_core/src/export_core
          uv run pytest -q packages/export_core/tests
          if test -d packages/export_contracts; then
            uv run mypy packages/export_contracts/src/export_contracts
            uv run pytest -q packages/export_contracts/tests
          fi
          uv run python tools/architecture_checks/check_dependencies.py
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          grep -R --line-number 'collector-candidate-export' "${targets[@]}"
          grep -R --line-number -E 'draft|materialized|verified|sealed' packages/export_core
          if grep -R --line-number -Ei 'public[_-]?slug|seo|billing|booking' "${targets[@]}"; then
            echo 'backend publication or billing ownership leaked into collector export' >&2
            exit 1
          fi

      - name: Commit repaired export owner and continue
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/repair-sealed-export-from-diagnostic.yml \
            .github/workflows/materialize-sealed-export-after-browser.yml \
            docs/diagnostics/materialize-sealed-export-after-browser.md
          git add packages/export_core pyproject.toml uv.lock
          test ! -d packages/export_contracts || git add packages/export_contracts
          test ! -d apps/export_worker || git add apps/export_worker
          test ! -d apps/export_job || git add apps/export_job
          test ! -f .github/workflows/export-ci.yml || git add .github/workflows/export-ci.yml
          test ! -f tools/architecture_checks/check_dependencies.py || git add tools/architecture_checks/check_dependencies.py
          find database/migrations/versions -type f \( -iname '*export*' -o -iname '*sealed*' \) -print0 | xargs -0 -r git add
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Fix (Export): close deterministic sealed package owner'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/materialize-operations-after-export.yml/dispatches" \
            -d '{"ref":"main"}' >/dev/null
