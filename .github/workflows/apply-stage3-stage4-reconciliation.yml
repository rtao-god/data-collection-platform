name: Apply Stage 3 and OSM Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage3-stage4-reconciliation.yml

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage3-stage4-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Apply production owners and prove repository baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python .github/reconciliation/reconcile_stage3_stage4.py
          python .github/reconciliation/repair_collector_cli_architecture.py
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          checker = Path("tools/architecture_checks/check_dependencies.py")
          policy = subprocess.check_output(
              [sys.executable, str(checker), "--print-policy"],
              text=True,
          ).strip()
          path = Path("docs/architecture/dependency-rules.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + policy + text[end:], encoding="utf-8")
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("apps/manual_import_worker/src/manual_import_worker/gateway.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        with httpx.Client(timeout=timeout_seconds, follow_redirects=False) as client:\n"
              "            with client.stream(prepared.method, prepared.url) as response:\n"
          )
          new = (
              "        with (\n"
              "            httpx.Client(timeout=timeout_seconds, follow_redirects=False) as client,\n"
              "            client.stream(prepared.method, prepared.url) as response,\n"
              "        ):\n"
          )
          if old not in text:
              raise RuntimeError("ManualImportWorker: scoped read context anchor is missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff check --exclude .github/reconciliation . --fix --unsafe-fixes
          uv run ruff format --exclude .github/reconciliation .
          uv run ruff check --exclude .github/reconciliation .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          docker build --file deploy/docker/collector-cli.Dockerfile .
          docker build --file deploy/docker/manual-import-worker.Dockerfile .
          docker build --file deploy/docker/osm-worker.Dockerfile .
          docker build --file deploy/docker/migration.Dockerfile .
          docker build --file deploy/docker/worker-gateway.Dockerfile .

          git rm -r .github/reconciliation
          git rm .github/workflows/build-stage3-stage4-reconciliation.yml
          git rm .github/workflows/apply-stage3-stage4-reconciliation.yml
          git add -A
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Build (Workspace): register manual import and OSM owners"
          git push origin HEAD:main
