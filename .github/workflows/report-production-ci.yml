name: Report Production CI

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: data-collection-platform-report-production-ci
  cancel-in-progress: false

jobs:
  report:
    if: github.event.issue.title == 'Report production CI 39f437f'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-shot reporter first
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/report-production-ci.yml
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Chore (CI): remove production reporter"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Report runs for production commit
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(gh run list \
            --commit 39f437f71a0a8f6ad86ccf7db6972cb01ee688e0 \
            --limit 50 \
            --json databaseId,name,workflowName,status,conclusion,event,headSha,createdAt,updatedAt,url)"
          gh issue comment "$ISSUE_NUMBER" --body "\`\`\`json
          ${report}
          \`\`\`"
