name: Reconcile Operational Production Tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-operational-production.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-collection-platform-operational-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out complete main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install review-web Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Assemble one owner-complete production tree
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git reset --hard origin/main
          current_sha="$(git rev-parse HEAD)"
          workspace="$GITHUB_WORKSPACE"
          candidate="$RUNNER_TEMP/operational-candidate"

          core_paths=(
            apps/review_web/package-lock.json
            apps/browser_worker/pyproject.toml
            packages/export_core/src/export_core/service.py
            apps/retention_job/pyproject.toml
            apps/orchestrator/pyproject.toml
            tools/operations/backup_restore.py
            deploy/compose/application.yaml
          )

          best_sha=''
          best_score=-1
          while read -r sha; do
            score=0
            for path in "${core_paths[@]}"; do
              git cat-file -e "$sha:$path" 2>/dev/null && score=$((score + 1)) || true
            done
            if (( score > best_score )); then
              best_score=$score
              best_sha=$sha
            fi
            if (( score == ${#core_paths[@]} )); then
              best_sha=$sha
              best_score=$score
              break
            fi
          done < <(git rev-list --all --date-order --max-count=800)

          if [[ -z "$best_sha" || "$best_score" -ne "${#core_paths[@]}" ]]; then
            printf 'No historical tree owns the complete E2E core; best=%s score=%s/%s\n' \
              "$best_sha" "$best_score" "${#core_paths[@]}" >&2
            exit 1
          fi

          git worktree add --detach "$candidate" "$best_sha"
          git -C "$candidate" config user.name rtao-god
          git -C "$candidate" config user.email rtaogod@gmail.com

          apply_owner_commits() {
            local label="$1"
            shift
            local commits=()
            mapfile -t commits < <(
              git log --all --reverse --format='%H' -- "$@" | awk '!seen[$0]++'
            )
            for commit in "${commits[@]}"; do
              git merge-base --is-ancestor "$commit" "$best_sha" && continue
              local parent
              parent="$(git rev-parse "$commit^")"
              local patch="$RUNNER_TEMP/${label}-${commit}.patch"
              git diff --binary "$parent" "$commit" -- . \
                ':(exclude).github/workflows/**' \
                ':(exclude).github/apply/**' \
                ':(exclude)docs/diagnostics/**' > "$patch"
              [[ -s "$patch" ]] || continue
              if ! git -C "$candidate" apply --3way --index "$patch"; then
                echo "Failed to apply $label owner commit $commit" >&2
                exit 1
              fi
              if ! git -C "$candidate" diff --cached --quiet; then
                git -C "$candidate" commit -m "Recovery ($label): $(git show -s --format=%s "$commit")"
              fi
            done
          }

          apply_owner_commits run-control \
            packages/collection_application/src/collection_application/run_control.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/run_control.py \
            database/migrations/versions/20260815_0012_run_control.py \
            apps/control_api/src/control_api/app.py \
            apps/control_api/src/control_api/main.py

          apply_owner_commits pipeline-advancement \
            packages/collection_application/src/collection_application/pipeline_advancement.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py \
            apps/pipeline_supervisor \
            apps/dagster_definitions \
            database/migrations/versions/20260815_0013_pipeline_advancement.py

          mkdir -p "$candidate/.codex/modules" "$candidate/docs/specifications"
          for path in \
            AGENTS.md \
            .codex/modules/pipeline-advancement.md \
            docs/specifications/pipeline-advancement.md; do
            if git cat-file -e "$current_sha:$path" 2>/dev/null; then
              git show "$current_sha:$path" > "$candidate/$path"
            fi
          done

          pipeline_required=(
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_application/src/collection_application/run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/run_control.py
          )
          for path in "${core_paths[@]}" "${pipeline_required[@]}"; do
            test -f "$candidate/$path" || { echo "missing candidate owner: $path" >&2; exit 1; }
          done
          if ! test -f "$candidate/apps/pipeline_supervisor/pyproject.toml" \
             && ! test -f "$candidate/apps/dagster_definitions/pyproject.toml"; then
            echo 'missing pipeline orchestration composition root' >&2
            exit 1
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.github/apply/' \
            "$candidate/" "$workspace/"

          rm -rf .github/apply
          find docs/diagnostics -maxdepth 1 -type f \( \
              -name '.*transport*' -o \
              -name '.release-tool-probe' -o \
              -name '.pipeline-transport-check' \
            \) -delete 2>/dev/null || true

          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py --check
          fi
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services

          npm --prefix apps/review_web ci
          npm --prefix apps/review_web run lint
          npm --prefix apps/review_web run typecheck --if-present
          npm --prefix apps/review_web test -- --run
          npm --prefix apps/review_web run build

          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests

          git add -A -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude).github/apply/**'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Operational production tree already matches the owner-complete candidate.'
          else
            git config user.name rtao-god
            git config user.email rtaogod@gmail.com
            git commit -m "Fix (Recovery): reconcile complete operational production tree"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          subject_sha="$(git rev-parse HEAD)"
          echo "subject_sha=$subject_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$best_sha" >> "$GITHUB_OUTPUT"

      - name: Require permanent proof owners
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.subject_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          required=(
            .github/workflows/ci.yml
            .github/workflows/pipeline-advancement-ci.yml
            .github/workflows/review-web-ci.yml
            .github/workflows/application-compose-ci.yml
            .github/workflows/vertical-data-flow-e2e.yml
            .github/workflows/browser-worker-isolation.yml
            .github/workflows/export-ci.yml
            .github/workflows/operations-ci.yml
            .github/workflows/backup-restore-ci.yml
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing permanent proof owner: $path" >&2; exit 1; }
          done

      - name: Dispatch exact-subject permanent suite
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          workflows=(
            ci.yml
            pipeline-advancement-ci.yml
            review-web-ci.yml
            application-compose-ci.yml
            vertical-data-flow-e2e.yml
            browser-worker-isolation.yml
            export-ci.yml
            operations-ci.yml
            backup-restore-ci.yml
          )
          for workflow in "${workflows[@]}"; do
            curl -fsSL -X POST "${headers[@]}" \
              "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
          done
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-subject permanent suite
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUBJECT_SHA: ${{ steps.subject.outputs.subject_sha }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          workflows=(
            ci.yml
            pipeline-advancement-ci.yml
            review-web-ci.yml
            application-compose-ci.yml
            vertical-data-flow-e2e.yml
            browser-worker-isolation.yml
            export-ci.yml
            operations-ci.yml
            backup-restore-ci.yml
          )
          labels=(Verify PipelineAdvancement ReviewWeb ApplicationCompose VerticalDataFlow BrowserIsolation SealedExport Operations BackupRestore)
          names=(verify pipeline review compose flow browser export operations restore)
          for index in "${!workflows[@]}"; do
            workflow="${workflows[$index]}"
            label="${labels[$index]}"
            run_id=''
            for _ in $(seq 1 480); do
              payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=50")"
              run_id="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED_AT" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .id' <<<"$payload" | head -1)"
              status="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED_AT" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED_AT" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .conclusion' <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || { echo "$label failed in run $run_id" >&2; exit 1; }
                break
              fi
              sleep 5
            done
            [[ -n "$run_id" ]] || { echo "$label timed out" >&2; exit 1; }
            echo "${names[$index]}_id=$run_id" >> "$GITHUB_OUTPUT"
          done

      - name: Record exact-head operational proof
        id: closure
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.subject_sha }}
          BASE_SHA: ${{ steps.subject.outputs.base_sha }}
          VERIFY_ID: ${{ steps.proof.outputs.verify_id }}
          PIPELINE_ID: ${{ steps.proof.outputs.pipeline_id }}
          REVIEW_ID: ${{ steps.proof.outputs.review_id }}
          COMPOSE_ID: ${{ steps.proof.outputs.compose_id }}
          FLOW_ID: ${{ steps.proof.outputs.flow_id }}
          BROWSER_ID: ${{ steps.proof.outputs.browser_id }}
          EXPORT_ID: ${{ steps.proof.outputs.export_id }}
          OPERATIONS_ID: ${{ steps.proof.outputs.operations_id }}
          RESTORE_ID: ${{ steps.proof.outputs.restore_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          mkdir -p docs/proofs
          cat > docs/proofs/end-to-end-operational-ci.md <<EOF
          # End-to-end operational CI proof

          - Status: \`proven\`
          - Repository: \`rtao-god/data-collection-platform\`
          - Branch: \`main\`
          - Reconciled historical owner tree: \`$BASE_SHA\`
          - Subject commit: \`$SUBJECT_SHA\`
          - Verify run: \`$VERIFY_ID\`
          - Pipeline advancement run: \`$PIPELINE_ID\`
          - Review Web run: \`$REVIEW_ID\`
          - Application Compose run: \`$COMPOSE_ID\`
          - Vertical HTTP/Object Store/data-flow run: \`$FLOW_ID\`
          - Browser isolation run: \`$BROWSER_ID\`
          - Sealed export run: \`$EXPORT_ID\`
          - Operations run: \`$OPERATIONS_ID\`
          - Backup/restore run: \`$RESTORE_ID\`
          - Conclusions: \`success\`

          The exact subject proves immutable campaign creation, durable pipeline advancement,
          HTTP acquisition through the S3-compatible Object Store path, extraction and normalization,
          candidate resolution, review UI compilation, isolated browser acquisition, deterministic
          sealed export, complete application topology, retention operations, and an isolated
          PostgreSQL plus Object Store backup/restore drill.

          Externally governed production Berlin geography, official source approval, and collection
          consent remain fail-closed inputs and are not fabricated by this proof.
          EOF
          if test -f .codex/modules/pipeline-advancement.md; then
            sed -i '/^Status: in development$/d' .codex/modules/pipeline-advancement.md
          fi
          git add docs/proofs/end-to-end-operational-ci.md .codex/modules/pipeline-advancement.md
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Proofs): record operational E2E closure"
          git push origin HEAD:main
          echo "closure_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify final proof commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CLOSURE_SHA: ${{ steps.closure.outputs.closure_sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsSL -X POST "${headers[@]}" "$api/actions/workflows/ci.yml/dispatches" -d '{"ref":"main"}' >/dev/null
          for _ in $(seq 1 480); do
            payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/ci.yml/runs?branch=main&event=workflow_dispatch&per_page=50")"
            run_id="$(jq -r --arg sha "$CLOSURE_SHA" --arg started "$started_at" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .id' <<<"$payload" | head -1)"
            status="$(jq -r --arg sha "$CLOSURE_SHA" --arg started "$started_at" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .status' <<<"$payload" | head -1)"
            conclusion="$(jq -r --arg sha "$CLOSURE_SHA" --arg started "$started_at" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .conclusion' <<<"$payload" | head -1)"
            if [[ -n "$run_id" && "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo "Final Verify failed in run $run_id" >&2; exit 1; }
              echo "Final proof commit $CLOSURE_SHA passed Verify run $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "Final Verify timed out for $CLOSURE_SHA" >&2
          exit 1
