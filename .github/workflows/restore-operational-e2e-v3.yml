name: Restore Operational E2E V3

on:
  push:
    branches: [main]
    paths:
      - docs/proofs/pipeline-advancement-ci.md
      - .github/workflows/restore-operational-e2e-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-operational-e2e-restoration
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - name: Check out complete main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect readiness and inventory
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/proofs/pipeline-advancement-ci.md
          complete=true
          for path in \
            apps/review_web/package-lock.json \
            apps/browser_worker/pyproject.toml \
            packages/export_core/src/export_core/service.py \
            apps/retention_job/pyproject.toml \
            apps/orchestrator/pyproject.toml \
            tools/operations/backup_restore.py \
            deploy/compose/application.yaml; do
            test -f "$path" || complete=false
          done
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Install exact Python
        if: steps.inventory.outputs.complete != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        if: steps.inventory.outputs.complete != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Assemble bounded-context candidate
        if: steps.inventory.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          current="$GITHUB_WORKSPACE"
          current_sha="$(git rev-parse HEAD)"
          base_sha="9bec95589ee0592a873edbc0548be27707f53af6"
          candidate="$RUNNER_TEMP/operational-e2e-v3"
          git cat-file -e "$base_sha^{commit}"
          rm -rf "$candidate"
          git worktree add --detach "$candidate" "$base_sha"

          copy_current() {
            local path="$1"
            if test -e "$current/$path"; then
              rm -rf "$candidate/$path"
              mkdir -p "$candidate/$(dirname "$path")"
              cp -a "$current/$path" "$candidate/$path"
            fi
          }

          copy_current packages/collection_application
          copy_current packages/collection_infrastructure
          copy_current packages/collection_contracts
          copy_current packages/collection_domain
          copy_current apps/control_api
          copy_current apps/collector_cli
          copy_current apps/migration
          copy_current database
          copy_current tools/contract_generation
          copy_current tools/control_api_contract_generation
          copy_current tools/review_contract_generation
          copy_current generated
          copy_current contracts
          copy_current docs/specifications/pipeline-advancement.md
          copy_current .codex/modules/pipeline-advancement.md

          # Preserve operational workspace topology from the proven base while
          # recalculating the exact lock after current bounded contexts land.
          rm -f "$candidate/uv.lock"
          for path in \
            apps/review_web/package-lock.json \
            apps/browser_worker/pyproject.toml \
            packages/export_core/src/export_core/service.py \
            apps/retention_job/pyproject.toml \
            apps/orchestrator/pyproject.toml \
            tools/operations/backup_restore.py \
            deploy/compose/application.yaml \
            database/migrations/versions/20260815_0013_pipeline_advancement.py; do
            test -f "$candidate/$path" || {
              echo "missing assembled owner: $path" >&2
              exit 1
            }
          done

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.github/apply/' \
            --exclude='.github/repair_pipeline_owner_v2.py' \
            "$candidate/" "$current/"
          rm -rf .github/apply
          rm -f .github/repair_pipeline_owner_v2.py
          uv lock

      - name: Restore assembled workspace
        if: steps.inventory.outputs.complete != 'true'
        run: uv sync --frozen --all-packages --dev

      - name: Prove Python and database owners
        if: steps.inventory.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py --check
          fi
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          uv run collection-migrate upgrade head
          uv run pytest -q -m integration database/tests

      - name: Install review-web Node runtime
        if: steps.inventory.outputs.complete != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Prove review frontend and topology
        if: steps.inventory.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/review_web ci
          npm --prefix apps/review_web run lint
          npm --prefix apps/review_web run typecheck --if-present
          npm --prefix apps/review_web test -- --run
          npm --prefix apps/review_web run build
          docker compose -f deploy/compose/application.yaml config --quiet

      - name: Commit restored production tree
        if: steps.inventory.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude).github/apply/**'
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Recovery): restore bounded operational E2E tree"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
