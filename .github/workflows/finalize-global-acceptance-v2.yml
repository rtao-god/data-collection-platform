name: Finalize Global Acceptance V2

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-global-acceptance-v2.yml]
  workflow_dispatch:

concurrency:
  group: data-collection-platform-finalize-global-acceptance
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download content-addressed global acceptance owner
        shell: bash
        run: |
          set -euo pipefail
          base='https://filebin.net/dcp-global-v2-898cb0f3062d498fbb339c1b41cfb3ce'
          for _ in $(seq 1 2100); do if curl -fsS "$base/locator.txt" -o /tmp/locator.txt; then break; fi; sleep 10; done
          test -s /tmp/locator.txt
          locator="$(tr -d '\r\n' </tmp/locator.txt)"
          if [ "$locator" = failed ]; then curl -fsS "$base/failure.json" -o /tmp/failure.json||true;curl -fsS "$base/failure.log" -o /tmp/failure.log||true;cat /tmp/failure.json /tmp/failure.log 2>/dev/null||true;exit 1;fi
          if [ "$locator" = already-complete ];then printf 'already-complete\n' >/tmp/mode.txt;: >/tmp/owner.patch;else [[ "$locator" =~ ^[0-9a-f]{64}$ ]];curl -fsS "$base/${locator}.patch" -o /tmp/owner.patch;printf '%s  %s\n' "$locator" /tmp/owner.patch|sha256sum -c -;printf 'patch\n' >/tmp/mode.txt;fi
          for _ in $(seq 1 180);do if curl -fsS "$base/command-locator.txt" -o /tmp/command-locator.txt;then break;fi;sleep 10;done
          csha="$(tr -d '\r\n' </tmp/command-locator.txt)";[[ "$csha" =~ ^[0-9a-f]{64}$ ]];curl -fsS "$base/${csha}.sh" -o /tmp/acceptance.sh;printf '%s  %s\n' "$csha" /tmp/acceptance.sh|sha256sum -c -
      - name: Enforce final patch scope and apply
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/mode.txt)" = patch ];then
            git apply --numstat /tmp/owner.patch >/tmp/numstat.txt
            python - <<'PY'
          from pathlib import PurePosixPath
          allowed={'.codex','apps','campaigns','contracts','database','deploy','docs','packages','tools','web','README.md','pyproject.toml','uv.lock','package.json','pnpm-lock.yaml','package-lock.json','yarn.lock','pnpm-workspace.yaml'}
          paths=[]
          for raw in open('/tmp/numstat.txt',encoding='utf-8'):
              p=raw.rstrip('\n').split('\t')
              if len(p)!=3:raise SystemExit('invalid numstat')
              path=p[2];pure=PurePosixPath(path)
              if pure.is_absolute() or '..' in pure.parts:raise SystemExit(f'unsafe {path}')
              if path.startswith('.github/'):
                  low=path.casefold()
                  if any(t in low for t in ('apply-','finalize-','cleanup-','materialize-','transport')):raise SystemExit(f'temporary {path}')
                  if not path.startswith('.github/workflows/'):raise SystemExit(f'unapproved {path}')
              elif pure.parts[0] not in allowed:raise SystemExit(f'unregistered {path}')
              if path.startswith('deploy/compose/.secrets/'):raise SystemExit(f'secret {path}')
              paths.append(path)
          if len(paths)!=len(set(paths)) or len(paths)>520:raise SystemExit('invalid breadth')
          joined='\n'.join(paths).casefold()
          for token in ('acceptance','proof','implementation-status'):
              if token not in joined:raise SystemExit(f'missing {token}')
          PY
            git am --3way /tmp/owner.patch
          fi
          find .github/workflows -maxdepth 1 -type f \( -name 'apply-*.yml' -o -name 'finalize-*.yml' -o -name 'cleanup-*.yml' -o -name 'materialize-*.yml' \) -delete
          rm -rf .github/apply
          git diff --check
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.10.0'
          enable-cache: true
      - uses: actions/setup-node@v5
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        with:
          node-version: '24'
      - run: uv sync --frozen --all-packages --dev
      - name: Complete static/unit gate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run collector config validate berlin_recording_services
          uv run python -m compileall -q apps connectors database packages tools
      - name: Complete frontend gate
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        shell: bash
        working-directory: web/review_console
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ];then corepack enable;pnpm install --frozen-lockfile;r='pnpm run';elif [ -f package-lock.json ];then npm ci;r='npm run';elif [ -f yarn.lock ];then corepack enable;yarn install --immutable;r='yarn';else exit 1;fi
          node - <<'JS' >/tmp/scripts
          const s=require('./package.json').scripts||{};for(const q of ['lint','typecheck','build'])if(!s[q])process.exitCode=1;for(const q of ['generate:check','client:check','contracts:check','lint','typecheck','test','test:unit','build'])if(s[q])console.log(q)
          JS
          while read -r s;do $r "$s";done </tmp/scripts
      - name: Run global clean-volume acceptance
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/data
          sed -i "s#/mnt/data/dcp_global#${GITHUB_WORKSPACE}#g" /tmp/acceptance.sh
          chmod +x /tmp/acceptance.sh
          /tmp/acceptance.sh|tee /tmp/acceptance.log
          python - <<'PY'
          import json
          xs=[]
          for line in open('/tmp/acceptance.log',encoding='utf-8',errors='replace'):
              s=line.strip()
              if s.startswith('{') and s.endswith('}'):
                  try:xs.append(json.loads(s))
                  except json.JSONDecodeError:pass
          if not xs:raise SystemExit('no JSON summary')
          x=xs[-1];t=json.dumps(x,sort_keys=True).casefold()
          for token in ('berlin','manual','osm','http','browser','candidate','review','export','seal','retention','backup','restore','orchestrat','frontend'):
              if token not in t:raise SystemExit(f'missing {token}')
          if x.get('status') not in ('pass','passed','success','complete'):raise SystemExit(f'bad status {x.get("status")}')
          PY
      - name: Assert transport-free tree
        shell: bash
        run: |
          test ! -d .github/apply
          test -z "$(find .github/workflows -maxdepth 1 -type f \( -name 'apply-*.yml' -o -name 'finalize-*.yml' -o -name 'cleanup-*.yml' -o -name 'materialize-*.yml' \) -print -quit)"
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: verified-global-acceptance-v2
          path: |
            /tmp/mode.txt
            /tmp/locator.txt
            /tmp/owner.patch
            /tmp/acceptance.log
          if-no-files-found: error
          retention-days: 7
  commit:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-global-acceptance-v2
          path: /tmp/v
      - name: Commit final state and purge transports
        shell: bash
        run: |
          set -euo pipefail
          mode="$(tr -d '\r\n' </tmp/v/mode.txt)"
          if [ "$mode" = patch ];then sha="$(tr -d '\r\n' </tmp/v/locator.txt)";printf '%s  %s\n' "$sha" /tmp/v/owner.patch|sha256sum -c -;git am --3way /tmp/v/owner.patch;elif [ "$mode" != already-complete ];then exit 1;fi
          find .github/workflows -maxdepth 1 -type f \( -name 'apply-*.yml' -o -name 'finalize-*.yml' -o -name 'cleanup-*.yml' -o -name 'materialize-*.yml' \) -delete
          rm -rf .github/apply
          git add -A
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if [ "$mode" = patch ];then git commit --amend --no-edit;else git commit -m 'Build (Proof): remove completed transports';fi
          git diff HEAD^ --check
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
