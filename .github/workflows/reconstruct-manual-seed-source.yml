name: Reconstruct Manual Seed Source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconstruct-manual-seed-source.yml

permissions:
  contents: write

concurrency:
  group: reconstruct-manual-seed-source
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6

      - name: Reconstruct and verify owned source
        shell: bash
        run: |
          set -euo pipefail
          target='packages/collection_application/src/collection_application/manual_seed.py'
          cat .codex/manual-seed-source/part-* | tr -d '\r\n' | base64 --decode > "${target}.reconstructed"
          echo 'ae0a93af393c513cd3d609676a2a35ebd13f7f9b1374a8e57b0f81ca4bd5c89b  '"${target}.reconstructed" | sha256sum --check --strict
          mv "${target}.reconstructed" "${target}"
          python -m py_compile "${target}"

      - name: Commit verified source and remove reconstruction inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git rm -r .codex/manual-seed-source .github/workflows/reconstruct-manual-seed-source.yml
          git add packages/collection_application/src/collection_application/manual_seed.py
          git commit -m 'Fix (Manual Import): restore verified UTF-8 source' -m 'Owner layer: manual import application boundary.' -m 'Root cause: the connector write path encoded a compressed payload as a Git blob instead of the reviewed UTF-8 Python source.' -m 'Replacement: reconstruct the exact locally tested source from bounded chunks, verify its SHA-256 and Python syntax, and remove every reconstruction artifact in the same commit.'
          git push origin HEAD:main
