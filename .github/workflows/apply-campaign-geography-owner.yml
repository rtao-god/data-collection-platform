name: Apply Campaign Geography Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-campaign-geography-owner.yml
      - ".github/apply/campaign-geography-owner.patch.part-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-campaign-geography-owner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Apply reviewed geography owner patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/apply/campaign-geography-owner.patch.part-00 \
            .github/apply/campaign-geography-owner.patch.part-01 \
            .github/apply/campaign-geography-owner.patch.part-02 \
            .github/apply/campaign-geography-owner.patch.part-03 \
            .github/apply/campaign-geography-owner.patch.part-04 \
            .github/apply/campaign-geography-owner.patch.part-05 \
            .github/apply/campaign-geography-owner.patch.part-06 \
            .github/apply/campaign-geography-owner.patch.part-07 \
            > /tmp/campaign-geography-owner.patch
          echo "1a6e8698372aed01cc86f06529613d615ed0ebe89d7347c387c826d0f95f2578  /tmp/campaign-geography-owner.patch" \
            | sha256sum --check --strict
          git apply --index --3way /tmp/campaign-geography-owner.patch
          uv run python tools/contract_generation/generate.py
          git add contracts/json_schema
          git diff --cached --check
      - name: Verify campaign geography owner
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check \
            packages/collection_application/src/collection_application/campaign_documents.py \
            packages/collection_application/src/collection_application/canonicalization.py \
            packages/collection_application/src/collection_application/campaign_validation.py \
            packages/collection_application/tests/test_campaign_snapshot_service.py \
            packages/collection_contracts/src/collection_contracts/campaign_config.py \
            packages/collection_contracts/src/collection_contracts/__init__.py \
            packages/collection_infrastructure/src/collection_infrastructure/filesystem_campaign_source.py \
            packages/collection_infrastructure/tests/test_filesystem_campaign_source.py \
            tools/contract_generation/generate.py
          uv run ruff check \
            packages/collection_application/src/collection_application/campaign_documents.py \
            packages/collection_application/src/collection_application/canonicalization.py \
            packages/collection_application/src/collection_application/campaign_validation.py \
            packages/collection_application/tests/test_campaign_snapshot_service.py \
            packages/collection_contracts/src/collection_contracts/campaign_config.py \
            packages/collection_contracts/src/collection_contracts/__init__.py \
            packages/collection_infrastructure/src/collection_infrastructure/filesystem_campaign_source.py \
            packages/collection_infrastructure/tests/test_filesystem_campaign_source.py \
            tools/contract_generation/generate.py
          uv run mypy
          uv run pytest -q \
            packages/collection_application/tests/test_campaign_snapshot_service.py \
            packages/collection_application/tests/test_geography.py \
            packages/collection_infrastructure/tests/test_filesystem_campaign_source.py \
            tools/contract_generation/tests
          uv run python -m compileall -q packages tools
      - name: Commit owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-campaign-geography-owner.yml
          git rm .github/apply/campaign-geography-owner.patch.part-*
          git add -A
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Feat (Campaign): own immutable geography artifacts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
