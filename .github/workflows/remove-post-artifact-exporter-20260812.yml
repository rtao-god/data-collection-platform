name: Remove Post Artifact Exporter 20260812

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-post-artifact-exporter-20260812.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Remove exact temporary workflows
        run: |
          rm -f \
            .github/workflows/export-post-artifact-source-20260812.yml \
            .github/workflows/remove-post-artifact-exporter-20260812.yml
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add -A
          git commit \
            -m "Build (Safety): remove post-artifact inspection workflows" \
            -m "Owner layer: permanent CI workflow inventory." \
            -m "Root cause: bounded inspection workflows must not survive after the exact source snapshot has been consumed." \
            -m "Replacement: remove both the read-only exporter and its self-cleanup path." \
            -m "Proof target: only permanent read-only verification remains and runs on this commit."
          git push origin HEAD:main
