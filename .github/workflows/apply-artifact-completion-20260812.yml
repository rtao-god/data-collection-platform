name: Apply Artifact Completion 20260812

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-artifact-completion-20260812.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Apply artifact completion owners and proof
        run: |
          uv run python tools/apply_artifact_completion_core_20260812.py
          uv run python tools/apply_artifact_completion_tests_20260812.py
          uv run python tools/apply_artifact_gateway_tests_20260812.py
          uv run ruff check --fix .
          uv run ruff format .
          uv run python tools/contract_generation/generate.py

      - name: Verify complete repository
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps database packages tools
          uv run collector config validate berlin_recording_services
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build --file deploy/docker/collector-cli.Dockerfile .
          docker build --file deploy/docker/migration.Dockerfile .
          docker build --file deploy/docker/worker-gateway.Dockerfile .

      - name: Commit proven artifact completion flow
        run: |
          rm -f \
            tools/apply_artifact_completion_core_20260812.py \
            tools/apply_artifact_completion_tests_20260812.py \
            tools/apply_artifact_gateway_tests_20260812.py \
            .github/workflows/apply-artifact-completion-20260812.yml
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add -A
          git commit \
            -m "Feat (Artifacts): complete lease-scoped artifact flow" \
            -m "Owner layers: domain work inputs, application artifact commands, PostgreSQL Work Engine completion, content-addressed object storage, Worker Gateway transport, and generated OpenAPI." \
            -m "Root cause: verified uploads were not immutable work inputs/outputs, completion could not bind artifact lineage atomically, and workers lacked authenticated pre-signed upload/read routes." \
            -m "Replacement: carry exact input bindings in leases, consume verified outputs inside the Work Engine transaction, deduplicate physical objects while preserving raw observation lineage, enforce composite database ownership, and expose only principal-bound pre-signed commands." \
            -m "Proof target: exact replay, rollback on missing upload, scoped reads, gateway authentication, generated contracts, lock, format, lint, strict typing, unit, architecture, compilation, fresh migration, integration, and all runtime images."
          git push origin HEAD:main
