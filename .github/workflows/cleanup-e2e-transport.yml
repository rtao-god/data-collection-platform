name: Cleanup E2E Transport

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-e2e-transport.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-cleanup-e2e-transport
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary transport owners
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rm -f --ignore-unmatch \
            .github/workflows/cleanup-e2e-transport.yml \
            .github/workflows/cleanup-transport-noise.yml \
            .github/workflows/package-e2e-payload.yml \
            .github/workflows/package-working-snapshot.yml \
            .github/workflows/apply-owned-run-bootstrap.yml \
            .github/workflows/apply-run-control-20260815.yml \
            docs/diagnostics/.transport-status \
            docs/diagnostics/.transport-status-2 \
            docs/diagnostics/.transport-status-3 \
            docs/diagnostics/.transport-status-4 \
            docs/diagnostics/.transport-status-5 \
            docs/diagnostics/.release-tool-probe
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Build (Tooling): remove temporary E2E transport files"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
