name: Full E2E Suite Finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-e2e-suite-finalizer.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-collection-platform-full-e2e-suite-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for production finalizer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY/actions/runs?branch=main&per_page=100"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          names='["Finalize Operational Production V2","Pipeline Owner Finalize"]'
          for _ in $(seq 1 1200); do
            payload="$(curl -fsSL "${headers[@]}" "$api")"
            active="$(jq --arg current "$CURRENT_RUN_ID" --argjson names "$names" '[.workflow_runs[] | select((.id|tostring) != $current and .status != "completed" and (.name as $n | $names | index($n)) != null)] | length' <<<"$payload")"
            [[ "$active" == 0 ]] && break
            sleep 5
          done
          payload="$(curl -fsSL "${headers[@]}" "$api")"
          active="$(jq --arg current "$CURRENT_RUN_ID" --argjson names "$names" '[.workflow_runs[] | select((.id|tostring) != $current and .status != "completed" and (.name as $n | $names | index($n)) != null)] | length' <<<"$payload")"
          [[ "$active" == 0 ]] || { echo 'production finalizer did not quiesce' >&2; exit 1; }
          git fetch origin main
          git reset --hard origin/main

      - name: Require complete permanent acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            ci.yml
            pipeline-advancement-ci.yml
            review-web-ci.yml
            application-compose-ci.yml
            vertical-data-flow-e2e.yml
            browser-worker-isolation.yml
            export-ci.yml
            operations-ci.yml
            backup-restore-ci.yml
            operational-ci.yml
            controlled-data-flow-ci.yml
          )
          for workflow in "${workflows[@]}"; do
            test -f ".github/workflows/$workflow" || {
              echo "missing permanent acceptance workflow: $workflow" >&2
              exit 1
            }
          done
          required=(
            apps/review_web/package-lock.json
            apps/browser_worker/pyproject.toml
            apps/retention_job/pyproject.toml
            apps/orchestrator/pyproject.toml
            packages/export_core/src/export_core/service.py
            tools/operations/backup_restore.py
            deploy/compose/application.yaml
            packages/collection_application/src/collection_application/run_control.py
            packages/collection_application/src/collection_application/pipeline_advancement.py
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing acceptance owner: $path" >&2; exit 1; }
          done

      - name: Dispatch exact-head acceptance suite
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          workflows=(
            ci.yml
            pipeline-advancement-ci.yml
            review-web-ci.yml
            application-compose-ci.yml
            vertical-data-flow-e2e.yml
            browser-worker-isolation.yml
            export-ci.yml
            operations-ci.yml
            backup-restore-ci.yml
            operational-ci.yml
            controlled-data-flow-ci.yml
          )
          for workflow in "${workflows[@]}"; do
            curl -fsSL -X POST "${headers[@]}" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
          done
          echo "started=$started" >> "$GITHUB_OUTPUT"
          echo "subject=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head acceptance suite
        id: suite
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUBJECT: ${{ steps.dispatch.outputs.subject }}
          STARTED: ${{ steps.dispatch.outputs.started }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          workflows=(
            ci.yml
            pipeline-advancement-ci.yml
            review-web-ci.yml
            application-compose-ci.yml
            vertical-data-flow-e2e.yml
            browser-worker-isolation.yml
            export-ci.yml
            operations-ci.yml
            backup-restore-ci.yml
            operational-ci.yml
            controlled-data-flow-ci.yml
          )
          keys=(verify pipeline review compose flow browser export operations restore operational controlled)
          for index in "${!workflows[@]}"; do
            run_id=''
            for _ in $(seq 1 1200); do
              payload="$(curl -fsSL "${headers[@]}" "https://api.github.com/repos/$REPOSITORY/actions/workflows/${workflows[$index]}/runs?branch=main&per_page=50")"
              run_id="$(jq -r --arg sha "$SUBJECT" --arg started "$STARTED" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .id' <<<"$payload" | head -1)"
              status="$(jq -r --arg sha "$SUBJECT" --arg started "$STARTED" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg sha "$SUBJECT" --arg started "$STARTED" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .conclusion' <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || {
                  echo "${workflows[$index]} failed in run $run_id" >&2
                  exit 1
                }
                break
              fi
              sleep 5
            done
            [[ -n "$run_id" ]] || { echo "${workflows[$index]} timed out" >&2; exit 1; }
            echo "${keys[$index]}=$run_id" >> "$GITHUB_OUTPUT"
          done

      - name: Record full exact-head acceptance proof
        env:
          SUBJECT: ${{ steps.dispatch.outputs.subject }}
          VERIFY: ${{ steps.suite.outputs.verify }}
          PIPELINE: ${{ steps.suite.outputs.pipeline }}
          REVIEW: ${{ steps.suite.outputs.review }}
          COMPOSE: ${{ steps.suite.outputs.compose }}
          FLOW: ${{ steps.suite.outputs.flow }}
          BROWSER: ${{ steps.suite.outputs.browser }}
          EXPORT: ${{ steps.suite.outputs.export }}
          OPERATIONS: ${{ steps.suite.outputs.operations }}
          RESTORE: ${{ steps.suite.outputs.restore }}
          OPERATIONAL: ${{ steps.suite.outputs.operational }}
          CONTROLLED: ${{ steps.suite.outputs.controlled }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          mkdir -p docs/proofs
          cat > docs/proofs/end-to-end-operational-ci.md <<EOF
          # End-to-end operational CI proof

          - Status: proven
          - Repository: rtao-god/data-collection-platform
          - Branch: main
          - Subject commit: \`$SUBJECT\`
          - Verify: \`$VERIFY\`
          - Pipeline Advancement: \`$PIPELINE\`
          - Review Web: \`$REVIEW\`
          - Application Compose: \`$COMPOSE\`
          - Vertical Data Flow: \`$FLOW\`
          - Browser Isolation: \`$BROWSER\`
          - Sealed Export: \`$EXPORT\`
          - Operations: \`$OPERATIONS\`
          - Backup/Restore: \`$RESTORE\`
          - Operational Verify: \`$OPERATIONAL\`
          - Controlled Data Flow: \`$CONTROLLED\`

          The exact subject passed the complete permanent acceptance suite: frozen
          workspace and generated contracts, Ruff, strict mypy, unit and integration
          tests, architecture boundaries, fresh PostgreSQL/PostGIS migration, review
          console, resolved application Compose, controlled HTTP download and artifact
          persistence, browser isolation, deterministic sealed export, retention and
          operational tooling, plus isolated backup/restore proof.

          This proof establishes complete software and controlled-environment
          readiness. A real Berlin campaign still requires approved geography,
          production source consent and approved non-empty campaign inputs.
          EOF
          git add docs/proofs/end-to-end-operational-ci.md
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Proofs): record full exact-head E2E acceptance"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
