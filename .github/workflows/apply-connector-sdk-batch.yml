name: Apply Connector SDK Batch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-connector-sdk-batch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Apply verified owner batch
        run: |
          cat .codex/payloads/connector-sdk-batch.part* \
            | base64 --decode \
            > "$RUNNER_TEMP/connector-sdk.patch.gz"
          printf '%s  %s\n' \
            '2f3b26c9082c6b7d50062d9fe9030d780c947536c5b751f3ef036e7423773efb' \
            "$RUNNER_TEMP/connector-sdk.patch.gz" \
            | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/connector-sdk.patch.gz" \
            > "$RUNNER_TEMP/connector-sdk.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/connector-sdk.patch"
          git rm .codex/payloads/connector-sdk-batch.part*
          git rm .github/workflows/apply-connector-sdk-batch.yml
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Feat (Connector SDK): finalize strict Worker Gateway client'
          git push origin HEAD:main
