name: Apply Stage 6 Extraction and Normalization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage6-extraction-normalization.yml
      - .github/stage6-payload/**

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage6-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out exact payload commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Apply and verify Stage 6 owner batch
        shell: bash
        run: |
          set -euo pipefail

          cat .github/stage6-payload/part-* > "${RUNNER_TEMP}/stage6-payload.b64"
          base64 --decode "${RUNNER_TEMP}/stage6-payload.b64" > "${RUNNER_TEMP}/stage6-payload.tar.xz"
          printf '%s  %s\n' \
            '0861fff4d75963961cd42cbbbff63d3608cf2b27a6d98ad52bdee9152b2e1509' \
            "${RUNNER_TEMP}/stage6-payload.tar.xz" \
            | sha256sum --check --strict
          tar -xJf "${RUNNER_TEMP}/stage6-payload.tar.xz"

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff check . --fix
          uv run ruff format .
          uv run python tools/contract_generation/generate.py

          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services

          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests

          docker build \
            --tag data-collection-platform/processing-worker:stage6 \
            --file deploy/docker/processing-worker.Dockerfile \
            .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/processing-worker:stage6)" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' data-collection-platform/processing-worker:stage6)" = "processing-worker"
          docker run --rm -i \
            --entrypoint python \
            data-collection-platform/processing-worker:stage6 \
            - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          for module in (
              "processing_worker",
              "extraction_core",
              "normalization_core",
              "source_connector_sdk",
          ):
              import_module(module)

          forbidden = {
              "alembic",
              "boto3",
              "botocore",
              "playwright",
              "psycopg",
              "scrapy",
              "sqlalchemy",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit(
                  "processing worker image contains forbidden dependencies: "
                  + ", ".join(present)
              )
          PY

          rm -rf .github/stage6-payload
          git add -A
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feature (Processing): add extraction and normalization pipeline"
          git push origin HEAD:main
