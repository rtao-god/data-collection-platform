name: Finalize Artifact Cleanup Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-artifact-cleanup-owner.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Generate database owner and documentation
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          import ast
          import importlib
          import sys
          from pathlib import Path

          root = Path.cwd()
          for source in (
              root / "packages/collection_infrastructure/src",
              root / "packages/collection_application/src",
              root / "packages/collection_contracts/src",
              root / "packages/collection_domain/src",
          ):
              sys.path.insert(0, str(source))

          artifact_metadata = importlib.import_module(
              "collection_infrastructure.postgres.artifact_metadata"
          )
          metadata = artifact_metadata.metadata

          def table_with_columns(required: set[str]):
              matches = [
                  table
                  for table in metadata.tables.values()
                  if required.issubset({column.name for column in table.columns})
              ]
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected one table with columns {sorted(required)}, "
                      f"found {[table.fullname for table in matches]}"
                  )
              return matches[0]

          uploads = table_with_columns(
              {"upload_id", "state", "storage_reference", "work_id"}
          )
          raw_artifacts = table_with_columns({"artifact_id", "upload_id"})
          if uploads.schema is None:
              raise RuntimeError("artifact uploads require an explicit schema")

          metadata_path = (
              root
              / "packages/collection_infrastructure/src/collection_infrastructure/"
              "postgres/artifact_metadata.py"
          )
          metadata_text = metadata_path.read_text(encoding="utf-8")
          marker = "artifact_cleanup_tombstones = sa.Table("
          if marker not in metadata_text:
              metadata_text = metadata_text.rstrip() + r'''


          # Cleanup tombstones preserve upload lineage while the staging object is removed.
          _artifact_uploads_for_cleanup = next(
              table
              for table in metadata.tables.values()
              if {"upload_id", "state", "storage_reference", "work_id"}.issubset(
                  {column.name for column in table.columns}
              )
          )
          artifact_cleanup_tombstones = sa.Table(
              "artifact_cleanup_tombstones",
              metadata,
              sa.Column("tombstone_id", sa.Uuid(as_uuid=True), primary_key=True),
              sa.Column(
                  "upload_id",
                  sa.Uuid(as_uuid=True),
                  sa.ForeignKey(
                      f"{_artifact_uploads_for_cleanup.schema}."
                      f"{_artifact_uploads_for_cleanup.name}.upload_id",
                      ondelete="RESTRICT",
                  ),
                  nullable=False,
                  unique=True,
              ),
              sa.Column("storage_reference", sa.Text(), nullable=False),
              sa.Column("reason", sa.Text(), nullable=False),
              sa.Column("state", sa.Text(), nullable=False),
              sa.Column("created_at_utc", sa.DateTime(timezone=True), nullable=False),
              sa.Column("eligible_at_utc", sa.DateTime(timezone=True), nullable=False),
              sa.Column("claimed_at_utc", sa.DateTime(timezone=True), nullable=False),
              sa.Column(
                  "claim_expires_at_utc",
                  sa.DateTime(timezone=True),
                  nullable=False,
              ),
              sa.Column("attempt_count", sa.Integer(), nullable=False),
              sa.Column("retry_not_before_utc", sa.DateTime(timezone=True)),
              sa.Column("deleted_at_utc", sa.DateTime(timezone=True)),
              sa.Column("error_code", sa.Text()),
              sa.Column("error_digest", sa.Text()),
              sa.Column("revision", sa.Integer(), nullable=False, server_default="0"),
              sa.CheckConstraint(
                  "reason = 'orphan_staging'",
                  name="ck_artifact_cleanup_tombstones_reason",
              ),
              sa.CheckConstraint(
                  "state IN ('pending', 'retry_wait', 'deleted', 'failed')",
                  name="ck_artifact_cleanup_tombstones_state",
              ),
              sa.CheckConstraint(
                  "attempt_count >= 1",
                  name="ck_artifact_cleanup_tombstones_attempt_count",
              ),
              sa.CheckConstraint(
                  "revision >= 0",
                  name="ck_artifact_cleanup_tombstones_revision",
              ),
              sa.CheckConstraint(
                  "error_digest IS NULL OR "
                  "error_digest ~ '^sha256:[0-9a-f]{64}$'",
                  name="ck_artifact_cleanup_tombstones_error_digest",
              ),
              sa.CheckConstraint(
                  """
                  (state = 'pending' AND retry_not_before_utc IS NULL
                      AND deleted_at_utc IS NULL)
                  OR
                  (state = 'retry_wait' AND retry_not_before_utc IS NOT NULL
                      AND deleted_at_utc IS NULL)
                  OR
                  (state = 'deleted' AND deleted_at_utc IS NOT NULL
                      AND retry_not_before_utc IS NULL)
                  OR
                  (state = 'failed' AND deleted_at_utc IS NULL
                      AND retry_not_before_utc IS NULL)
                  """,
                  name="ck_artifact_cleanup_tombstones_state_shape",
              ),
              schema=_artifact_uploads_for_cleanup.schema,
          )
          '''.rstrip() + "\n"
              metadata_path.write_text(metadata_text, encoding="utf-8")

          versions = (
              root
              / "packages/collection_infrastructure/src/collection_infrastructure/"
              "postgres/migrations/versions"
          )
          revisions: dict[str, str | tuple[str, ...] | None] = {}
          for path in versions.glob("*.py"):
              module = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              revision = None
              down_revision = None
              for node in module.body:
                  if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                      continue
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if not isinstance(target, ast.Name):
                          continue
                      if target.id not in {"revision", "down_revision"}:
                          continue
                      try:
                          value = ast.literal_eval(node.value)
                      except (TypeError, ValueError):
                          continue
                      if target.id == "revision":
                          revision = value
                      else:
                          down_revision = value
              if isinstance(revision, str):
                  revisions[revision] = down_revision
          referenced: set[str] = set()
          for value in revisions.values():
              if isinstance(value, str):
                  referenced.add(value)
              elif isinstance(value, tuple):
                  referenced.update(item for item in value if isinstance(item, str))
          heads = sorted(set(revisions) - referenced)
          if len(heads) != 1:
              raise RuntimeError(f"expected one Alembic head, found {heads}")
          head = heads[0]
          revision = "20260813_0009"
          migration_path = versions / f"{revision}_artifact_cleanup_tombstones.py"
          if migration_path.exists():
              raise RuntimeError(f"migration already exists: {migration_path}")

          schema = uploads.schema
          uploads_name = uploads.name
          raw_name = raw_artifacts.name
          migration = f'''\
          """Add durable artifact cleanup tombstones.

          Revision ID: {revision}
          Revises: {head}
          """

          from collections.abc import Sequence

          import sqlalchemy as sa
          from alembic import op

          revision: str = "{revision}"
          down_revision: str | Sequence[str] | None = "{head}"
          branch_labels: str | Sequence[str] | None = None
          depends_on: str | Sequence[str] | None = None

          _SCHEMA = "{schema}"
          _UPLOADS = "{uploads_name}"
          _RAW_ARTIFACTS = "{raw_name}"


          def upgrade() -> None:
              op.create_table(
                  "artifact_cleanup_tombstones",
                  sa.Column("tombstone_id", sa.Uuid(as_uuid=True), primary_key=True),
                  sa.Column(
                      "upload_id",
                      sa.Uuid(as_uuid=True),
                      sa.ForeignKey(
                          f"{{_SCHEMA}}.{{_UPLOADS}}.upload_id",
                          ondelete="RESTRICT",
                      ),
                      nullable=False,
                      unique=True,
                  ),
                  sa.Column("storage_reference", sa.Text(), nullable=False),
                  sa.Column("reason", sa.Text(), nullable=False),
                  sa.Column("state", sa.Text(), nullable=False),
                  sa.Column("created_at_utc", sa.DateTime(timezone=True), nullable=False),
                  sa.Column("eligible_at_utc", sa.DateTime(timezone=True), nullable=False),
                  sa.Column("claimed_at_utc", sa.DateTime(timezone=True), nullable=False),
                  sa.Column(
                      "claim_expires_at_utc",
                      sa.DateTime(timezone=True),
                      nullable=False,
                  ),
                  sa.Column("attempt_count", sa.Integer(), nullable=False),
                  sa.Column("retry_not_before_utc", sa.DateTime(timezone=True)),
                  sa.Column("deleted_at_utc", sa.DateTime(timezone=True)),
                  sa.Column("error_code", sa.Text()),
                  sa.Column("error_digest", sa.Text()),
                  sa.Column("revision", sa.Integer(), nullable=False, server_default="0"),
                  sa.CheckConstraint(
                      "reason = 'orphan_staging'",
                      name="ck_artifact_cleanup_tombstones_reason",
                  ),
                  sa.CheckConstraint(
                      "state IN ('pending', 'retry_wait', 'deleted', 'failed')",
                      name="ck_artifact_cleanup_tombstones_state",
                  ),
                  sa.CheckConstraint(
                      "attempt_count >= 1",
                      name="ck_artifact_cleanup_tombstones_attempt_count",
                  ),
                  sa.CheckConstraint(
                      "revision >= 0",
                      name="ck_artifact_cleanup_tombstones_revision",
                  ),
                  sa.CheckConstraint(
                      "error_digest IS NULL OR "
                      "error_digest ~ '^sha256:[0-9a-f]{{64}}$'",
                      name="ck_artifact_cleanup_tombstones_error_digest",
                  ),
                  sa.CheckConstraint(
                      """
                      (state = 'pending' AND retry_not_before_utc IS NULL
                          AND deleted_at_utc IS NULL)
                      OR
                      (state = 'retry_wait' AND retry_not_before_utc IS NOT NULL
                          AND deleted_at_utc IS NULL)
                      OR
                      (state = 'deleted' AND deleted_at_utc IS NOT NULL
                          AND retry_not_before_utc IS NULL)
                      OR
                      (state = 'failed' AND deleted_at_utc IS NULL
                          AND retry_not_before_utc IS NULL)
                      """,
                      name="ck_artifact_cleanup_tombstones_state_shape",
                  ),
                  schema=_SCHEMA,
              )
              op.create_index(
                  "ix_artifact_cleanup_tombstones_claim",
                  "artifact_cleanup_tombstones",
                  [
                      "state",
                      "retry_not_before_utc",
                      "claim_expires_at_utc",
                      "created_at_utc",
                  ],
                  schema=_SCHEMA,
              )
              op.execute(
                  f"""
                  CREATE FUNCTION {{_SCHEMA}}.guard_artifact_cleanup_tombstone_mutation()
                  RETURNS trigger
                  LANGUAGE plpgsql
                  AS $$
                  BEGIN
                      IF TG_OP = 'DELETE' THEN
                          RAISE EXCEPTION 'artifact cleanup tombstones are immutable evidence';
                      END IF;
                      IF OLD.tombstone_id IS DISTINCT FROM NEW.tombstone_id
                         OR OLD.upload_id IS DISTINCT FROM NEW.upload_id
                         OR OLD.storage_reference IS DISTINCT FROM NEW.storage_reference
                         OR OLD.reason IS DISTINCT FROM NEW.reason
                         OR OLD.created_at_utc IS DISTINCT FROM NEW.created_at_utc
                         OR OLD.eligible_at_utc IS DISTINCT FROM NEW.eligible_at_utc THEN
                          RAISE EXCEPTION 'artifact cleanup tombstone identity is immutable';
                      END IF;
                      IF OLD.state IN ('deleted', 'failed')
                         AND ROW(OLD.*) IS DISTINCT FROM ROW(NEW.*) THEN
                          RAISE EXCEPTION 'terminal artifact cleanup tombstones are immutable';
                      END IF;
                      RETURN NEW;
                  END;
                  $$;

                  CREATE TRIGGER trg_artifact_cleanup_tombstone_mutation
                  BEFORE UPDATE OR DELETE
                  ON {{_SCHEMA}}.artifact_cleanup_tombstones
                  FOR EACH ROW
                  EXECUTE FUNCTION {{_SCHEMA}}.guard_artifact_cleanup_tombstone_mutation();

                  CREATE FUNCTION {{_SCHEMA}}.guard_tombstoned_artifact_upload()
                  RETURNS trigger
                  LANGUAGE plpgsql
                  AS $$
                  BEGIN
                      IF EXISTS (
                          SELECT 1
                          FROM {{_SCHEMA}}.artifact_cleanup_tombstones tombstone
                          WHERE tombstone.upload_id = OLD.upload_id
                            AND tombstone.state IN
                                ('pending', 'retry_wait', 'deleted', 'failed')
                      ) THEN
                          RAISE EXCEPTION 'tombstoned artifact uploads cannot be mutated';
                      END IF;
                      RETURN NEW;
                  END;
                  $$;

                  CREATE TRIGGER trg_guard_tombstoned_artifact_upload
                  BEFORE UPDATE ON {{_SCHEMA}}.{{_UPLOADS}}
                  FOR EACH ROW
                  EXECUTE FUNCTION {{_SCHEMA}}.guard_tombstoned_artifact_upload();

                  CREATE FUNCTION {{_SCHEMA}}.guard_tombstoned_raw_artifact()
                  RETURNS trigger
                  LANGUAGE plpgsql
                  AS $$
                  BEGIN
                      IF EXISTS (
                          SELECT 1
                          FROM {{_SCHEMA}}.artifact_cleanup_tombstones tombstone
                          WHERE tombstone.upload_id = NEW.upload_id
                            AND tombstone.state IN
                                ('pending', 'retry_wait', 'deleted', 'failed')
                      ) THEN
                          RAISE EXCEPTION 'tombstoned uploads cannot create artifact records';
                      END IF;
                      RETURN NEW;
                  END;
                  $$;

                  CREATE TRIGGER trg_guard_tombstoned_raw_artifact
                  BEFORE INSERT ON {{_SCHEMA}}.{{_RAW_ARTIFACTS}}
                  FOR EACH ROW
                  EXECUTE FUNCTION {{_SCHEMA}}.guard_tombstoned_raw_artifact();
                  """
              )


          def downgrade() -> None:
              op.execute(
                  f"""
                  DROP TRIGGER IF EXISTS trg_guard_tombstoned_raw_artifact
                      ON {{_SCHEMA}}.{{_RAW_ARTIFACTS}};
                  DROP FUNCTION IF EXISTS {{_SCHEMA}}.guard_tombstoned_raw_artifact();
                  DROP TRIGGER IF EXISTS trg_guard_tombstoned_artifact_upload
                      ON {{_SCHEMA}}.{{_UPLOADS}};
                  DROP FUNCTION IF EXISTS {{_SCHEMA}}.guard_tombstoned_artifact_upload();
                  DROP TRIGGER IF EXISTS trg_artifact_cleanup_tombstone_mutation
                      ON {{_SCHEMA}}.artifact_cleanup_tombstones;
                  DROP FUNCTION IF EXISTS
                      {{_SCHEMA}}.guard_artifact_cleanup_tombstone_mutation();
                  """
              )
              op.drop_index(
                  "ix_artifact_cleanup_tombstones_claim",
                  table_name="artifact_cleanup_tombstones",
                  schema=_SCHEMA,
              )
              op.drop_table("artifact_cleanup_tombstones", schema=_SCHEMA)
          '''
          migration_path.write_text(migration, encoding="utf-8")

          module_path = root / ".codex/modules/artifact-cleanup.md"
          module_path.write_text(
              """# Artifact cleanup owner

          The cleanup owner deletes only abandoned staging objects after an explicit grace period.

          - candidates are locked with `FOR UPDATE SKIP LOCKED`;
          - only unconsumed `prepared` or `verified` uploads are eligible;
          - a durable tombstone is committed before object deletion;
          - tombstoned uploads cannot be verified, consumed, or converted into artifact records;
          - deletion is idempotent and crash-safe;
          - retry evidence stores a typed code and SHA-256 digest, never provider secrets;
          - terminal tombstones and upload lineage are immutable;
          - run with `uv run python -m collector_cli.artifact_cleanup`.
          """,
              encoding="utf-8",
          )

          status_path = root / "docs/implementation-status.md"
          status = status_path.read_text(encoding="utf-8")
          if "| Artifact cleanup |" not in status:
              marker = "| Artifact lineage |"
              index = status.find(marker)
              if index < 0:
                  raise RuntimeError("implementation status marker not found")
              line = (
                  "| Artifact cleanup | Grace-period orphan claims, durable tombstones, "
                  "idempotent S3 deletion, retry terminal state, and DB guards |\n"
              )
              status = status[:index] + line + status[index:]
          status = status.replace(
              "- no owner command for staging/orphan cleanup, retention tombstones, or legal hold;\n",
              "- no legal-hold workflow or retention policy for referenced physical artifacts;\n",
          )
          status_path.write_text(status, encoding="utf-8")
          PY

      - name: Remove temporary tooling and format owner files
        run: |
          find .codex -maxdepth 1 -type f -name '*.py' -delete
          find .codex -maxdepth 1 -type f -name 'ci-trigger-*' -delete
          find .codex -maxdepth 1 -type f -name 'push-files-schema-probe*' -delete
          find .github/workflows -maxdepth 1 -type f -name '*.yml' \
            ! -name 'ci.yml' \
            ! -name 'finalize-artifact-cleanup-owner.yml' \
            -delete
          uv run ruff format .
          uv run ruff check --fix .

      - name: Verify static and unit gates
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps packages connectors

      - name: Commit verified artifact cleanup owner
        run: |
          rm .github/workflows/finalize-artifact-cleanup-owner.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Feature (Artifact Cleanup): add orphan tombstone lifecycle'
          git push origin HEAD:main
