name: Finalize OSM Overpass HTTP

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-osm-overpass-http.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 16

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: true

      - name: Complete connector wiring
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          root = Path.cwd()
          root_pyproject_path = root / "pyproject.toml"
          root_pyproject = root_pyproject_path.read_text(encoding="utf-8")
          member = '  "connectors/osm_overpass",\n'
          if '"connectors/osm_overpass"' not in root_pyproject:
              for anchor in (
                  '  "connectors/manual_import",\n',
                  '  "packages/manual_import_core",\n',
              ):
                  if anchor in root_pyproject:
                      root_pyproject = root_pyproject.replace(anchor, anchor + member, 1)
                      break
              else:
                  marker = "members = [\n"
                  if marker not in root_pyproject:
                      raise RuntimeError("workspace member list not found")
                  root_pyproject = root_pyproject.replace(marker, marker + member, 1)
          root_pyproject_path.write_text(root_pyproject, encoding="utf-8")

          connector_path = root / "connectors/osm_overpass/pyproject.toml"
          connector = connector_path.read_text(encoding="utf-8")
          connector = connector.replace(
              "dependencies = []",
              'dependencies = ["httpx==0.28.1"]',
          )
          connector_path.write_text(connector, encoding="utf-8")

          init_path = root / "connectors/osm_overpass/src/osm_overpass/__init__.py"
          init = init_path.read_text(encoding="utf-8")
          if "from osm_overpass.http import" not in init:
              http_import = """from osm_overpass.http import (\n    OverpassEndpointPolicy,\n    OverpassFailureKind,\n    OverpassFetchFailure,\n    OverpassFetchResult,\n    OverpassHttpClient,\n)\n"""
              init = init.replace(
                  "from osm_overpass.query import",
                  http_import + "from osm_overpass.query import",
              )
              marker = '    "OsmTagFilter",\n'
              exports = """    "OverpassEndpointPolicy",\n    "OverpassFailureKind",\n    "OverpassFetchFailure",\n    "OverpassFetchResult",\n    "OverpassHttpClient",\n"""
              if marker not in init:
                  raise RuntimeError("OSM export marker not found")
              init = init.replace(marker, marker + exports, 1)
          init_path.write_text(init, encoding="utf-8")

          architecture_path = root / "tools/architecture_checks/check_dependencies.py"
          architecture = architecture_path.read_text(encoding="utf-8")
          if "connectors/osm_overpass" not in architecture:
              tree = ast.parse(architecture)
              lines = architecture.splitlines(keepends=True)
              candidates: list[tuple[ast.Call, str]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call) or not hasattr(node, "end_lineno"):
                      continue
                  segment = "".join(lines[node.lineno - 1 : node.end_lineno])
                  if "connectors/manual_import" in segment:
                      candidates.append((node, segment))
              if not candidates:
                  raise RuntimeError("manual connector owner rule not found")
              node, segment = min(candidates, key=lambda item: len(item[1]))
              replacement = (
                  segment.replace(
                      "connectors/manual_import", "connectors/osm_overpass"
                  )
                  .replace("manual-import-connector", "osm-overpass-connector")
                  .replace("manual-import-core", "osm-overpass-connector")
                  .replace("manual_import_core", "osm_overpass")
                  .replace("manual import", "OSM Overpass")
                  .replace("Manual import", "OSM Overpass")
              )
              lines.insert(node.end_lineno, replacement)
              architecture_path.write_text("".join(lines), encoding="utf-8")

          module_path = root / ".codex/modules/osm-overpass.md"
          module_path.write_text(
              """# OSM Overpass owner

          `connectors/osm_overpass` owns typed query construction, hardened Overpass HTTP acquisition, and strict response-to-observation contracts.

          - Production code never accepts arbitrary Overpass QL or a per-work endpoint URL.
          - The operator endpoint must be HTTPS, have an allowlisted path and host, and resolve only to global addresses.
          - DNS addresses and the connected peer address are both checked; redirects are disabled.
          - The decompressed response stream is bounded and must be JSON.
          - Upstream status is mapped to typed transient, permanent, policy-blocked, or contract-invalid failure.
          - Error messages never include upstream bodies or the generated query.
          - No Nominatim dependency or fallback exists.
          - The connector performs no PostgreSQL or Worker Gateway I/O.
          """,
              encoding="utf-8",
          )

          status_path = root / "docs/implementation-status.md"
          status = status_path.read_text(encoding="utf-8")
          if "| OSM Overpass contracts |" not in status:
              marker = "| Manual import planning |"
              index = status.find(marker)
              if index < 0:
                  raise RuntimeError("implementation status marker not found")
              line_end = status.find("\n", index) + 1
              row = (
                  "| OSM Overpass contracts | Deterministic polygon/tag queries, "
                  "strict response parsing, OSM identity, coordinates, address, "
                  "provenance, and attribution |\n"
              )
              status = status[:line_end] + row + status[line_end:]
          if "| OSM Overpass HTTP |" not in status:
              marker = "| OSM Overpass contracts |"
              index = status.find(marker)
              if index < 0:
                  raise RuntimeError("OSM contract status marker not found")
              line_end = status.find("\n", index) + 1
              row = (
                  "| OSM Overpass HTTP | Exact endpoint allowlist, DNS and peer "
                  "address validation, no redirects, bounded decompression, and "
                  "typed status failures |\n"
              )
              status = status[:line_end] + row + status[line_end:]
          incomplete = (
              "- OSM/Overpass worker, approved Berlin polygon, PostGIS coverage "
              "evaluation, and real-source run remain incomplete;\n"
          )
          legacy = (
              "- OSM/Overpass network worker, approved Berlin polygon, "
              "PostGIS coverage evaluation, and real-source run remain incomplete;\n"
          )
          status = status.replace(legacy, incomplete)
          if incomplete not in status:
              heading = "## Explicitly incomplete\n\n"
              if heading not in status:
                  raise RuntimeError("incomplete section not found")
              status = status.replace(heading, heading + incomplete, 1)
          status_path.write_text(status, encoding="utf-8")
          PY

      - name: Lock and restore the exact workspace
        run: |
          uv lock
          uv sync --frozen --all-packages --dev

      - name: Remove temporary workflows and format
        run: |
          find .codex -maxdepth 1 -type f -name '*.py' -delete
          find .codex -maxdepth 1 -type f -name 'ci-trigger-*' -delete
          find .codex -maxdepth 1 -type f -name 'push-files-schema-probe*' -delete
          find .github/workflows -maxdepth 1 -type f -name '*.yml' \
            ! -name 'ci.yml' \
            ! -name 'finalize-osm-overpass-http.yml' \
            -delete
          uv run ruff format .
          uv run ruff check --fix .

      - name: Verify the HTTP owner
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration and not object_store_integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps packages connectors

      - name: Commit the verified acquisition boundary
        run: |
          rm .github/workflows/finalize-osm-overpass-http.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Feature (OSM Overpass): harden HTTP acquisition'
          git push origin HEAD:main
