name: Reconcile Pipeline Foundation V7

on:
  push:
    branches: [main]
    paths:
      - docs/diagnostics/reconcile-pipeline-foundation-v6.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-pipeline-foundation-v7
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact supervisor architecture owner
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git log --all --format=%H -S'pipeline_supervisor' -- tools/architecture_checks/check_dependencies.py | head -1)"
          if [[ -z "$commit" ]]; then
            commit="$(git log --all --format=%H -- apps/pipeline_supervisor/pyproject.toml | head -1)"
          fi
          test -n "$commit"
          git checkout "$commit" -- tools/architecture_checks/check_dependencies.py
          if git cat-file -e "$commit:docs/architecture/dependency-rules.md" 2>/dev/null; then
            git checkout "$commit" -- docs/architecture/dependency-rules.md
          fi
          test -f apps/pipeline_supervisor/pyproject.toml || git checkout "$commit" -- apps/pipeline_supervisor

      - name: Reapply current physical schema invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          migration = Path("database/migrations/versions/20260815_0013_pipeline_advancement.py")
          migration.write_text(
              migration.read_text(encoding="utf-8").replace(
                  '("work.work_units.work_unit_id",)', '("work.work_units.work_id",)'
              ),
              encoding="utf-8",
          )
          metadata = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "pipeline_advancement_metadata.py"
          )
          text = metadata.read_text(encoding="utf-8").replace(
              'sa.Column("work_unit_id", sa.Uuid(), primary_key=True)',
              'sa.Column("work_id", sa.Uuid(), primary_key=True)',
          ).replace("_work_units.c.work_unit_id", "_work_units.c.work_id")
          metadata.write_text(text, encoding="utf-8")
          PY
          uv lock
          uv sync --all-packages --dev --locked

      - name: Run exact V7 proof
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee pipeline-foundation-v7.log) 2>&1
          set -euo pipefail
          uv run ruff format \
            apps/pipeline_supervisor \
            database/migrations/versions/20260815_0013_pipeline_advancement.py \
            packages/collection_application \
            packages/collection_infrastructure \
            tools/architecture_checks/check_dependencies.py
          uv run ruff check --fix \
            apps/pipeline_supervisor \
            database/migrations/versions/20260815_0013_pipeline_advancement.py \
            packages/collection_application \
            packages/collection_infrastructure \
            tools/architecture_checks/check_dependencies.py
          uv run ruff format --check .
          uv run ruff check .
          uv lock --check
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build --file deploy/docker/pipeline-supervisor.Dockerfile \
            --tag data-collection-platform/pipeline-supervisor:ci .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/pipeline-supervisor:ci)" = "10001:10001"

      - name: Upload V7 diagnostics
        if: steps.gate.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-foundation-v7-diagnostics
          path: pipeline-foundation-v7.log
          if-no-files-found: error
          retention-days: 3
      - name: Stop on failed gate
        if: steps.gate.outcome != 'success'
        run: exit 1

      - name: Commit proven pipeline foundation
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( \
              -name 'repair-pipeline-*.yml' -o \
              -name 'reconcile-pipeline-foundation-v[4-7].yml' -o \
              -name 'capture-pipeline-foundation-*.yml' -o \
              -name 'materialize-pipeline-supervisor-direct.yml' \
            \) -print0 | xargs -0 -r git rm -f --ignore-unmatch
          rm -f docs/diagnostics/pipeline-foundation-v4.md \
                docs/diagnostics/pipeline-foundation-v5.md \
                docs/diagnostics/reconcile-pipeline-foundation-v6.md
          git add -A \
            apps/pipeline_supervisor \
            deploy/docker/pipeline-supervisor.Dockerfile \
            .github/workflows \
            pyproject.toml uv.lock \
            tools/architecture_checks/check_dependencies.py \
            docs/architecture/dependency-rules.md \
            docs/diagnostics \
            database/migrations/versions/20260815_0013_pipeline_advancement.py \
            packages/collection_application \
            packages/collection_infrastructure
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Feature (Pipeline): close durable supervisor foundation'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
