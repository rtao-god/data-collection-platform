name: Export Official Berlin Boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-official-berlin-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Download exact official district GML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/official-boundary
          uv run python - <<'PY'
          from pathlib import Path
          import json
          import httpx

          url = (
              "https://gdi.berlin.de/services/wfs/alkis_bezirke"
              "?service=WFS&version=2.0.0&request=GetFeature"
              "&typenames=alkis_bezirke%3Abezirksgrenzen"
              "&srsName=EPSG%3A4326&outputFormat=GML2"
          )
          with httpx.Client(
              timeout=httpx.Timeout(90.0),
              follow_redirects=False,
              headers={
                  "Accept": "application/gml+xml, application/xml;q=0.9, text/xml;q=0.8",
                  "User-Agent": "data-collection-platform-boundary-proof/1",
              },
          ) as client:
              response = client.get(url)
          output = Path(".tmp/official-boundary")
          (output / "response.bin").write_bytes(response.content)
          (output / "metadata.json").write_text(
              json.dumps(
                  {
                      "status": response.status_code,
                      "contentType": response.headers.get("content-type"),
                      "contentLength": len(response.content),
                      "url": str(response.url),
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          if response.status_code != 200 or not response.content:
              raise SystemExit("official district response is unavailable")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-berlin-boundary-raw
          path: .tmp/official-boundary/
          if-no-files-found: error
          retention-days: 1
