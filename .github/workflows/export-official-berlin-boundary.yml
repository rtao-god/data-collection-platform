name: Finalize Official Berlin Geography

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-official-berlin-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-finalize-berlin-geography
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Materialize owner-bound Berlin geography
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          import httpx
          import yaml

          from tools.live_collection.berlin_boundary import (
              _sha256,
              canonicalize_boundary,
              write_geography_revision,
          )

          repository_root = Path.cwd().resolve()
          distribution_url = (
              "https://tsb-opendata.s3.eu-central-1.amazonaws.com/"
              "bezirksgrenzen/bezirksgrenzen.geojson"
          )
          with httpx.Client(
              timeout=httpx.Timeout(90.0),
              follow_redirects=False,
              headers={
                  "Accept": "application/geo+json, application/json",
                  "User-Agent": "data-collection-platform-boundary-materializer/1",
              },
          ) as client:
              response = client.get(distribution_url)
          response.raise_for_status()
          payload = response.json()
          features = payload.get("features") if isinstance(payload, dict) else None
          if not isinstance(features, list) or len(features) != 12:
              raise SystemExit(
                  "ODIS Berlin district distribution must contain exactly 12 features"
              )
          if any(
              not isinstance(feature, dict)
              or not isinstance(feature.get("properties"), dict)
              or feature["properties"].get("Land_name") != "Berlin"
              for feature in features
          ):
              raise SystemExit("ODIS district distribution contains a non-Berlin feature")

          canonical = canonicalize_boundary(payload)
          boundary_path, provenance_path, modified = write_geography_revision(
              repository_root,
              canonical_boundary=canonical,
              source_digest=_sha256(response.content),
              source_url=str(response.url),
              dataset_title="ALKIS Berlin Bezirke - WFS",
              dataset_identifier="ced31d7d-353d-373a-b9a9-2251b9498bc0",
              distribution_owner=(
                  "Open Data Informationsstelle Berlin / Technologiestiftung Berlin"
              ),
              distribution_feature_count=12,
              license_identifier="dl-de-zero-2.0",
              license_title="Datenlizenz Deutschland - Zero - Version 2.0",
          )
          expected_artifacts = {
              (
                  repository_root
                  / "campaigns/berlin_recording_services/geography/berlin-boundary.geojson"
              ).resolve(),
              (
                  repository_root
                  / "campaigns/berlin_recording_services/geography/"
                  "berlin-boundary.provenance.json"
              ).resolve(),
          }
          actual_artifacts = {boundary_path.resolve(), provenance_path.resolve()}
          if actual_artifacts != expected_artifacts:
              raise SystemExit(
                  "geography writer returned unexpected artifact paths: "
                  f"{sorted(str(path) for path in actual_artifacts)}"
              )
          unexpected = {path.name for path in modified} - {
              "campaign.yaml",
              "geography.yaml",
          }
          if unexpected:
              raise SystemExit(f"unexpected campaign files changed: {sorted(unexpected)}")
          campaign = yaml.safe_load(
              Path("campaigns/berlin_recording_services/campaign.yaml").read_text(
                  encoding="utf-8"
              )
          )
          if campaign.get("readiness") != {"state": "ready"}:
              raise SystemExit("Berlin campaign remains blocked after geography materialization")
          PY

      - name: Verify geography owner
        shell: bash
        run: |
          set -euo pipefail
          uv run collector config validate berlin_recording_services
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check \
            packages/collection_application/src/collection_application/geography.py \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/berlin_boundary_portal.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run ruff check \
            packages/collection_application/src/collection_application/geography.py \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/berlin_boundary_portal.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run pytest -q \
            packages/collection_application/tests/test_geography.py \
            tools/live_collection/tests/test_berlin_boundary.py
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q packages tools

      - name: Commit immutable geography revision and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/export-official-berlin-boundary.yml
          git add \
            campaigns/berlin_recording_services/campaign.yaml \
            campaigns/berlin_recording_services/geography.yaml \
            campaigns/berlin_recording_services/geography/berlin-boundary.geojson \
            campaigns/berlin_recording_services/geography/berlin-boundary.provenance.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Feature (Campaign): materialize official Berlin geography"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
