name: Export Official Berlin Boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-official-berlin-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Materialize exact official WFS owner output
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path
          import httpx

          from tools.live_collection.berlin_boundary import (
              ResourceCandidate,
              _canonical_json,
              _sha256,
              canonicalize_boundary,
              download_candidate,
              update_campaign,
          )

          root = Path.cwd()
          campaign_root = root / "campaigns/berlin_recording_services"
          boundary_path = campaign_root / "geography/berlin-boundary.geojson"
          provenance_path = campaign_root / "geography/berlin-boundary.provenance.json"
          candidate = ResourceCandidate(
              dataset_title="ALKIS Berlin Landesgrenze - WFS",
              dataset_identifier="07b1347b-ce5a-3764-91a2-0d46ae09fb1c",
              resource_identifier="alkis-landesgrenze-wfs",
              resource_url="https://gdi.berlin.de/services/wfs/alkis_land",
              resource_format="wfs",
              license_identifier="dl-de-zero-2.0",
              license_title="Datenlizenz Deutschland - Zero - Version 2.0",
              score=1,
          )
          with httpx.Client(
              timeout=httpx.Timeout(90.0),
              follow_redirects=False,
              headers={"User-Agent": "data-collection-platform-boundary-proof/1"},
          ) as client:
              downloaded = download_candidate(client, candidate)
          canonical = canonicalize_boundary(downloaded.geojson)
          boundary_bytes = _canonical_json(canonical)
          boundary_digest = _sha256(boundary_bytes)
          relative = boundary_path.relative_to(root).as_posix()
          provenance = {
              "contract": "berlin-boundary-provenance",
              "contractRevision": "1",
              "authority": "State of Berlin",
              "datasetTitle": candidate.dataset_title,
              "datasetIdentifier": candidate.dataset_identifier,
              "resourceIdentifier": candidate.resource_identifier,
              "resourceUrl": downloaded.source_url,
              "resourceFormat": candidate.resource_format,
              "featureType": downloaded.feature_type,
              "licenseIdentifier": candidate.license_identifier,
              "licenseTitle": candidate.license_title,
              "sourceDigest": downloaded.source_digest,
              "boundaryDigest": boundary_digest,
              "boundaryPath": relative,
          }
          boundary_path.parent.mkdir(parents=True, exist_ok=True)
          boundary_path.write_bytes(boundary_bytes)
          provenance_path.write_bytes(_canonical_json(provenance))
          modified = update_campaign(
              campaign_root,
              boundary_path=relative,
              digest=boundary_digest,
          )
          if modified != (campaign_root / "campaign.yaml",):
              raise SystemExit(f"unexpected campaign files changed: {modified}")
          PY
          uv run collector config validate berlin_recording_services
      - uses: actions/upload-artifact@v4
        with:
          name: official-berlin-boundary
          path: |
            campaigns/berlin_recording_services/campaign.yaml
            campaigns/berlin_recording_services/geography/berlin-boundary.geojson
            campaigns/berlin_recording_services/geography/berlin-boundary.provenance.json
          if-no-files-found: error
          retention-days: 1
