name: Apply Stage 10 Collector Export

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage10-export-20260814.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: data-collection-platform-stage10-export
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Wait for Stage 9 exact-head proof
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 600); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "https://api.github.com/repos/$REPOSITORY/contents/docs/proofs/stage9-browser-worker-ci.md?ref=main")"
            [[ "$status" == "200" ]] && exit 0
            sleep 5
          done
          echo "Stage 9 exact-head proof did not appear" >&2
          exit 1

      - name: Check out complete current history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Materialize deterministic collector export owner
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git reset --hard origin/main
          test -f docs/proofs/stage9-browser-worker-ci.md

          revision="$(git log --all -S 'collector-candidate-export' --format=%H -- apps packages contracts database docs tools .codex | head -1)"
          [[ -n "$revision" ]] || {
            echo "No historical collector-candidate-export owner exists" >&2
            exit 1
          }

          git ls-tree -r --name-only "$revision" > /tmp/export-history-paths.txt
          git diff-tree --no-commit-id --name-only -r "$revision" > /tmp/export-changed-paths.txt
          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          revision = subprocess.check_output(
              [
                  "git",
                  "log",
                  "--all",
                  "-S",
                  "collector-candidate-export",
                  "--format=%H",
                  "--",
                  "apps",
                  "packages",
                  "contracts",
                  "database",
                  "docs",
                  "tools",
                  ".codex",
              ],
              text=True,
          ).splitlines()[0]
          history_paths = Path("/tmp/export-history-paths.txt").read_text().splitlines()
          changed_paths = set(Path("/tmp/export-changed-paths.txt").read_text().splitlines())

          candidates: set[str] = set()
          for path in history_paths:
              lower = path.lower()
              if (
                  "export" in lower
                  and path.startswith(
                      (
                          "apps/",
                          "packages/",
                          "contracts/",
                          "database/",
                          "docs/specifications/",
                          "tools/",
                          ".codex/modules/",
                          "deploy/docker/",
                      )
                  )
              ):
                  candidates.add(path)
              elif path in changed_paths and path.startswith(
                  (
                      "apps/collector_cli/",
                      "packages/collection_application/",
                      "packages/collection_infrastructure/",
                      "database/tests/",
                  )
              ):
                  candidates.add(path)

          required_marker = False
          for path in sorted(candidates):
              latest = subprocess.check_output(
                  ["git", "log", "--all", "--format=%H", "--", path],
                  text=True,
              ).splitlines()
              if not latest:
                  continue
              subprocess.run(["git", "checkout", latest[0], "--", path], check=True)
              if path.endswith((".py", ".json", ".jsonl", ".md")):
                  try:
                      if "collector-candidate-export" in Path(path).read_text(encoding="utf-8"):
                          required_marker = True
                  except (UnicodeDecodeError, OSError):
                      pass
          if not required_marker:
              raise RuntimeError("restored files do not contain collector-candidate-export")

          root_path = Path("pyproject.toml")
          root = root_path.read_text(encoding="utf-8")

          def add(source: str, section: str, key: str, value: str) -> str:
              section_start = source.index(f"[{section}]")
              start = source.index(f"{key} = [", section_start)
              end = source.index("\n]", start)
              literal = f'  "{value}",'
              if literal in source[start:end]:
                  return source
              return source[:end] + f"\n{literal}" + source[end:]

          projects: list[tuple[str, str]] = []
          for project_file in sorted(
              list(Path("apps").glob("*export*/pyproject.toml"))
              + list(Path("packages").glob("*export*/pyproject.toml"))
          ):
              project = project_file.parent.as_posix()
              source_roots = sorted((project_file.parent / "src").glob("*"))
              if len(source_roots) != 1 or not source_roots[0].is_dir():
                  raise RuntimeError(f"export project has ambiguous import roots: {project}")
              import_root = source_roots[0].name
              projects.append((project, import_root))
              root = add(root, "tool.uv.workspace", "members", project)
              tests = project_file.parent / "tests"
              if tests.is_dir():
                  root = add(root, "tool.pytest.ini_options", "testpaths", tests.as_posix())
              root = add(root, "tool.ruff", "src", (project_file.parent / "src").as_posix())
              root = add(root, "tool.mypy", "files", source_roots[0].as_posix())
          root_path.write_text(root, encoding="utf-8")

          checker_path = Path("tools/architecture_checks/check_dependencies.py")
          checker = checker_path.read_text(encoding="utf-8")
          historical_checker = subprocess.check_output(
              ["git", "show", f"{revision}:{checker_path}"],
              text=True,
          )

          def block(source: str, owner: str) -> str:
              start = source.index(f'    "{owner}": OwnerPolicy(')
              following = re.search(r'\n    "[^"]+": OwnerPolicy\(', source[start + 1 :])
              end = source.index("\n}", start) if following is None else start + 1 + following.start()
              return source[start:end] + "\n"

          map_start = checker.index("_OWNER_POLICIES: dict[str, OwnerPolicy] = {")
          map_end = checker.index("\n}", map_start)
          for project, import_root in projects:
              owner = import_root
              if f'"{owner}": OwnerPolicy(' in checker[map_start:map_end]:
                  continue
              if f'"{owner}": OwnerPolicy(' not in historical_checker:
                  raise RuntimeError(f"export architecture owner is missing: {owner}")
              value = block(historical_checker, owner)
              checker = checker[:map_end] + "\n" + value + checker[map_end:]
              map_end += len(value) + 1
          checker_path.write_text(checker, encoding="utf-8")
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          mapfile -t export_paths < <(find apps packages tools contracts database -maxdepth 4 \( -iname '*export*' -o -path '*/collector_cli/*' \) -print | sort -u)
          uv run ruff format apps packages tools database
          uv run ruff check apps packages tools database --fix
          uv run python -m compileall -q apps packages tools database
          while IFS= read -r generator; do
            uv run python "$generator" --check
          done < <(find tools -type f -name generate.py -path '*export*' | sort)
          uv run mypy
          mapfile -t export_tests < <(find apps packages -type d -path '*export*/tests' | sort)
          if (( ${#export_tests[@]} > 0 )); then
            uv run pytest -q "${export_tests[@]}"
          fi
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests

          if grep -R --line-number --include='*.py' --include='*.json' \
              -E 'publicSlug|seo[A-Z_]|promotion|booking|billing' \
              packages/*export* apps/*export* contracts/*export* 2>/dev/null; then
            echo "Collector export contains a prohibited publication-owned field" >&2
            exit 1
          fi

          while IFS= read -r dockerfile; do
            docker build --file "$dockerfile" .
          done < <(find deploy/docker -maxdepth 1 -type f -iname '*export*.Dockerfile' | sort)

          python - <<'PY'
          import subprocess
          from pathlib import Path
          policy = subprocess.check_output(["python", "tools/architecture_checks/check_dependencies.py", "--print-policy"], text=True).strip()
          path = Path("docs/architecture/dependency-rules.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + policy + text[end:], encoding="utf-8")
          PY

          mkdir -p docs/proofs
          cat > docs/proofs/stage10-collector-export.md <<EOF
          # Stage 10 collector export

          - Status: `locally-proven`
          - Historical owner revision: `$revision`
          - Contract: `collector-candidate-export`
          - Boundary: deterministic exact-revision export; no public slug, SEO, promotion, booking or billing ownership.
          - Gates: generated-contract drift, Ruff, strict mypy, focused/full tests, dependency boundaries, fresh migration, database integration and available export image builds.
          EOF

          git add apps packages contracts tools database deploy/docker docs/specifications docs/proofs/stage10-collector-export.md docs/architecture/dependency-rules.md .codex/modules pyproject.toml uv.lock
          git diff --cached --check
          production_sha="$(git rev-parse HEAD)"
          if ! git diff --cached --quiet; then
            git config user.name "rtao-god"
            git config user.email "rtaogod@gmail.com"
            git commit -m "Feat (Export): add deterministic collector export"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            production_sha="$(git rev-parse HEAD)"
          fi
          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for permanent Verify and record exact-head proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          git fetch origin main
          git reset --hard origin/main
          subject_sha="$(git rev-parse HEAD)"
          grep -R -q 'collector-candidate-export' apps packages contracts
          verify_id=""
          for _ in $(seq 1 240); do
            payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/ci.yml/runs?branch=main&per_page=50")"
            verify_id="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$payload" | head -1)"
            status="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$payload" | head -1)"
            conclusion="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' <<<"$payload" | head -1)"
            if [[ -n "$verify_id" && "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Verify $verify_id failed for $subject_sha" >&2; exit 1; }
              break
            fi
            sleep 5
          done
          [[ -n "$verify_id" ]] || { echo "Verify is missing for $subject_sha" >&2; exit 1; }

          cat > docs/proofs/stage10-collector-export-ci.md <<EOF
          # Stage 10 collector export CI proof

          - Status: `proven`
          - Repository: `rtao-god/data-collection-platform`
          - Branch: `main`
          - Subject commit: `$subject_sha`
          - Permanent Verify run: `$verify_id`
          - Verify conclusion: `success`

          Deterministic collector-owned export contracts, exact-revision materialization and sealing are proven without publication-owned fields or direct backend database coupling.
          EOF
          git add docs/proofs/stage10-collector-export-ci.md
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Export): prove Stage 10 collector export"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
