name: Apply Complete Run Control Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-run-control-complete.yml
      - .github/apply/run-control-complete.part*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-run-control-complete
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Reconstruct and apply exact owner patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          cat .github/apply/run-control-complete.part* > /tmp/run-control-complete.patch.gz.b64
          echo "a837dc83c4ea4ad3c0dae2ada38469f2b0819142ea694a9d243291a9df04a835  /tmp/run-control-complete.patch.gz.b64" \
            | sha256sum --check
          base64 --decode /tmp/run-control-complete.patch.gz.b64 \
            | gzip --decompress > /tmp/run-control-complete.patch
          echo "fc29f4abe65bb0131f4dd8d0c0c8be008e32ad65ffc296a6ca639d4b1dc32e5e  /tmp/run-control-complete.patch" \
            | sha256sum --check
          git apply --index --3way /tmp/run-control-complete.patch
          git diff --cached --check
          test -f packages/collection_application/src/collection_application/run_control.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/run_control.py
          test -f database/migrations/versions/20260815_0012_run_control.py
          test -f packages/collection_application/tests/test_run_control.py

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify complete repository
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services

      - name: Verify fresh PostgreSQL and control API image
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build \
            --file deploy/docker/control-api.Dockerfile \
            --tag data-collection-platform/control-api:run-control \
            .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/control-api:run-control)" = "10001:10001"

      - name: Commit production owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/apply-run-control-complete.yml
          git rm -f .github/apply/run-control-complete.part*
          git rm -f --ignore-unmatch \
            .github/workflows/apply-run-control.yml \
            .github/apply/run-control.patch.gz.b64
          git add -A
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Feature (Run Control): add operational run control and coverage"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
