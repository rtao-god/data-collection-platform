name: Reconcile Manual Import Admission

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-manual-import-admission.yml

permissions:
  contents: write

concurrency:
  group: manual-import-admission-owner
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: collection
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collection -d collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 100

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: true

      - name: Reconcile owner source
        run: |
          python - <<'PY'
          from pathlib import Path

          db_script = Path('.codex/integrate_manual_import_worker_db.py')
          if db_script.exists():
              text = db_script.read_text(encoding='utf-8')
              text = text.replace(
                  "'ADD CONSTRAINT {constraint} CHECK (' || expression || ')';",
                  "'ADD CONSTRAINT {constraint} CHECK ({expression})';",
              )
              db_script.write_text(text, encoding='utf-8')
          PY
          [ ! -f .codex/integrate_manual_import_worker.py ] || \
            python .codex/integrate_manual_import_worker.py
          [ ! -f .codex/integrate_manual_import_worker_db.py ] || \
            python .codex/integrate_manual_import_worker_db.py
          [ ! -f .codex/integrate_manual_import_admission.py ] || \
            python .codex/integrate_manual_import_admission.py
          [ ! -f .codex/harden_manual_import_admission.py ] || \
            python .codex/harden_manual_import_admission.py
          python - <<'PY'
          from pathlib import Path

          for migration in Path(
              'packages/collection_infrastructure/src/collection_infrastructure/'
              'postgres/migrations/versions'
          ).glob('*.py'):
              text = migration.read_text(encoding='utf-8')
              if 'validate_admission_item_count' not in text:
                  continue
              text = text.replace(
                  'target_admission := COALESCE(NEW.admission_id, OLD.admission_id);',
                  'target_admission := NEW.admission_id;',
              )
              text = text.replace('RETURN COALESCE(NEW, OLD);', 'RETURN NEW;')
              migration.write_text(text, encoding='utf-8')

          test_path = Path(
              'packages/collection_infrastructure/tests/'
              'test_manual_import_child_writer.py'
          )
          if test_path.exists():
              text = test_path.read_text(encoding='utf-8')
              text = text.replace(
                  'assert getattr(enqueue_command, "semantic_key") == child.semantic_key',
                  'assert (\n'
                  '        getattr(enqueue_command, "semantic_key", None)\n'
                  '        or getattr(enqueue_command, "semantic_idempotency_key")\n'
                  '    ) == child.semantic_key',
              )
              test_path.write_text(text, encoding='utf-8')
          PY

      - name: Resolve and generate workspace
        run: |
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py
          if [ -f tools/manual_import_contract_generation/generate.py ]; then
            uv run python tools/manual_import_contract_generation/generate.py
          fi

      - name: Normalize and verify source
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          if [ -f tools/manual_import_contract_generation/generate.py ]; then
            uv run python tools/manual_import_contract_generation/generate.py --check
          fi
          uv run mypy
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps packages connectors 2>/dev/null || \
            uv run python -m compileall -q apps packages

      - name: Verify deterministic and negative behavior
        run: |
          uv run pytest -q -m 'not integration'

      - name: Verify fresh schema and integration contracts
        run: |
          uv run collection-migrate upgrade
          uv run python - <<'PY'
          import sqlalchemy as sa
          from sqlalchemy import create_engine

          engine = create_engine('postgresql+psycopg://collection:collection@localhost:5432/collection')
          with engine.connect() as connection:
              tables = set(
                  connection.execute(
                      sa.text(
                          "SELECT table_schema || '.' || table_name "
                          "FROM information_schema.tables "
                          "WHERE table_schema = 'manual_import'"
                      )
                  ).scalars()
              )
              triggers = set(
                  connection.execute(
                      sa.text(
                          "SELECT trigger_name FROM information_schema.triggers "
                          "WHERE event_object_schema = 'manual_import'"
                      )
                  ).scalars()
              )
          expected_tables = {
              'manual_import.plan_admissions',
              'manual_import.plan_admission_items',
          }
          expected_triggers = {
              'plan_admissions_immutable',
              'plan_admission_items_immutable',
              'plan_admissions_item_count',
              'plan_admission_items_item_count',
          }
          if expected_tables - tables:
              raise SystemExit(f'missing tables: {sorted(expected_tables - tables)}')
          if expected_triggers - triggers:
              raise SystemExit(f'missing triggers: {sorted(expected_triggers - triggers)}')
          PY
          uv run pytest -q -m integration

      - name: Verify worker capability boundary
        run: |
          docker build -t data-collection-manual-import-worker \
            -f deploy/docker/manual-import-worker.Dockerfile .
          docker run --rm --entrypoint python data-collection-manual-import-worker - <<'PY'
          import importlib.util

          forbidden = ('alembic', 'boto3', 'botocore', 'psycopg', 'sqlalchemy')
          present = [name for name in forbidden if importlib.util.find_spec(name) is not None]
          if present:
              raise SystemExit(f'forbidden worker capabilities are installed: {present}')
          PY

      - name: Create verified commit
        run: |
          rm -f \
            .codex/integrate_manual_import_worker.py \
            .codex/integrate_manual_import_worker_db.py \
            .codex/integrate_manual_import_admission.py \
            .codex/harden_manual_import_admission.py \
            .github/workflows/cleanup-transient-files.yml \
            .github/workflows/integrate-manual-import-worker.yml \
            .github/workflows/recover-manual-import-worker.yml \
            .github/workflows/finalize-manual-import-admission.yml \
            .github/workflows/recover-manual-import-admission.yml \
            .github/workflows/reconcile-manual-import-admission.yml \
            .codex/push-files-schema-probe \
            .codex/push-files-schema-probe-2 \
            .codex/payloads/typed-work-input-20260812.part00 \
            .codex/payloads/typed-work-input-20260812.part01 \
            __missing__
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Feat (Manual Import): seal atomic plan admission'
          git fetch origin main
          git rebase origin/main
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q \
            packages/collection_application/tests/test_manual_import_admission.py \
            packages/collection_infrastructure/tests/test_manual_import_child_writer.py \
            apps/manual_import_worker/tests/test_worker.py
          git push origin HEAD:main
