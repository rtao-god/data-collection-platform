name: Verify Reconciled Baseline V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-reconciled-baseline-v2.yml

permissions:
  contents: write

concurrency:
  group: verify-reconciled-baseline-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: collection
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collection -d collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTION_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Run complete baseline gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          if [ -f tools/manual_import_contract_generation/generate.py ]; then
            uv run python tools/manual_import_contract_generation/generate.py --check
          fi
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade
          uv run pytest -q -m integration

      - name: Build every owned image and prove worker capabilities
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in deploy/docker/*.Dockerfile; do
            [ -f "$dockerfile" ] || continue
            image="data-collection-platform/$(basename "$dockerfile" .Dockerfile | tr '[:upper:]' '[:lower:]'):baseline"
            docker build -f "$dockerfile" -t "$image" .
          done
          for worker in manual-import-worker osm-worker; do
            image="data-collection-platform/${worker}:baseline"
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker run --rm --entrypoint python "$image" - <<'PY'
          import importlib.util
          forbidden = ('alembic', 'boto3', 'botocore', 'playwright', 'psycopg', 'scrapy', 'sqlalchemy')
          present = [name for name in forbidden if importlib.util.find_spec(name) is not None]
          if present:
              raise SystemExit(f'forbidden worker capabilities present: {present}')
          PY
            fi
          done

      - name: Commit proof and remove all transient automation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/reconciled-baseline.md <<EOF
          # Reconciled production baseline

          - source head: \`$(git rev-parse HEAD)\`
          - workspace ownership and lock: passed
          - generated contracts: passed
          - Ruff formatting and lint: passed
          - strict mypy: passed
          - non-integration tests: passed
          - fail-closed architecture checker: passed
          - fresh PostgreSQL/PostGIS migration: passed
          - integration tests: passed
          - all owned Dockerfiles: built
          - worker capability-negative inventory: passed
          EOF
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 | xargs -0 -r git rm -f
          find .codex -maxdepth 1 -type f \( -name '*.py' -o -name '*probe*' -o -name 'ci-trigger*' \) -print0 | xargs -0 -r git rm -f
          if [ -d .codex/payloads ]; then
            git rm -rf .codex/payloads
          fi
          git add docs/proofs/reconciled-baseline.md
          git diff --cached --check
          git commit -m 'CI (Baseline): prove reconciled workspace and owners'
          git push origin HEAD:main
