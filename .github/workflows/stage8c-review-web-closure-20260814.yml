name: Close Stage 8C Review Console

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage8c-review-web-closure-20260814.yml
      - .github/stage8c_apply_20260814/repair.py
      - docs/proofs/stage8b-control-api-ci.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage8c-review-web
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 300

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize and prove Stage 8C review web
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f docs/proofs/stage8b-control-api-ci.md
          if test -f .github/stage8c_apply_20260814/repair.py; then
            python .github/stage8c_apply_20260814/repair.py
          fi
          test -f apps/review_web/package.json
          cd apps/review_web
          npm install --save-exact react react-dom
          npm install --save-dev --save-exact \
            @testing-library/jest-dom \
            @testing-library/react \
            @testing-library/user-event \
            @types/react \
            @types/react-dom \
            @vitejs/plugin-react \
            jsdom \
            openapi-typescript \
            typescript \
            vite \
            vitest
          npm run generate:api
          npm run typecheck
          npm run test
          npm run check:architecture
          npm run build
          npm audit --omit=dev --audit-level=high
          cd ../..
          git diff --check
          docker build --tag data-collection-platform/review-web:closure --file deploy/docker/review-web.Dockerfile .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/review-web:closure)" != "0"

      - name: Commit only proven Stage 8C production artifacts
        shell: bash
        run: |
          set -euo pipefail
          if test -d .github/stage8c_apply_20260814; then
            git rm -r .github/stage8c_apply_20260814
          fi
          mkdir -p docs/proofs
          cat > docs/proofs/stage8c-review-web-owner.md <<EOF
          # Stage 8C review web owner proof

          - Status: owner gates passed
          - Build subject: \`$GITHUB_SHA\`
          - Closure workflow run: \`$GITHUB_RUN_ID\`

          Generated OpenAPI types, exact npm lock, strict TypeScript, browser tests,
          architecture checks, production build, dependency audit, CSP configuration,
          and the unprivileged review-web image passed before commit.

          Full Compose integration and browser E2E remain later operational work.
          EOF
          git add -A
          git reset .github/workflows
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat (Review): add generated-contract review console"
          git push origin HEAD:main
