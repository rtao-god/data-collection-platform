name: Repair Browser Worker From Diagnostic

on:
  push:
    branches: [main]
    paths:
      - docs/diagnostics/materialize-browser-worker-after-review.md
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-browser-worker-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact browser owner and registries
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git log --all --format=%H -- apps/browser_worker/pyproject.toml | head -1)"
          test -n "$commit"
          git checkout "$commit" -- apps/browser_worker
          for path in .github/workflows/browser-worker-isolation.yml tools/architecture_checks/check_dependencies.py; do
            if git cat-file -e "$commit:$path" 2>/dev/null; then git checkout "$commit" -- "$path"; fi
          done
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('pyproject.toml')
          text=root.read_text(encoding='utf-8')
          workspace=re.search(r'(?ms)(\[tool\.uv\.workspace\]\s*members\s*=\s*\[)(.*?)(\])',text)
          if workspace is None: raise RuntimeError('workspace registry missing')
          body=workspace.group(2)
          if '"apps/browser_worker"' not in body:
              body=body.rstrip()+'\n  "apps/browser_worker",\n'
              text=text[:workspace.start(2)]+body+text[workspace.end(2):]
          mypy=re.search(r'(?ms)(\[tool\.mypy\].*?\nfiles\s*=\s*\[)(.*?)(\])',text)
          if mypy is None: raise RuntimeError('mypy registry missing')
          body=mypy.group(2)
          if 'apps/browser_worker/src/browser_worker' not in body:
              body=body.rstrip()+'\n  "apps/browser_worker/src/browser_worker",\n'
              text=text[:mypy.start(2)]+body+text[mypy.end(2):]
          root.write_text(text,encoding='utf-8')
          PY
          uv lock
          uv sync --all-packages --dev --locked

      - name: Write stable capability-minimal image
        shell: bash
        run: |
          set -euo pipefail
          cat > deploy/docker/browser-worker.Dockerfile <<'DOCKER'
          FROM mcr.microsoft.com/playwright/python:v1.54.0-noble AS build
          ENV UV_COMPILE_BYTECODE=1 UV_LINK_MODE=copy
          WORKDIR /workspace
          RUN pip install --no-cache-dir uv==0.10.0
          COPY .python-version pyproject.toml uv.lock ./
          COPY apps ./apps
          COPY connectors ./connectors
          COPY packages ./packages
          RUN uv sync --frozen --no-dev --no-editable --package browser-worker
          FROM mcr.microsoft.com/playwright/python:v1.54.0-noble AS runtime
          ENV PATH="/workspace/.venv/bin:${PATH}" PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
          RUN groupadd --gid 10001 worker && useradd --uid 10001 --gid worker --create-home worker
          WORKDIR /workspace
          COPY --from=build --chown=worker:worker /workspace/.venv /workspace/.venv
          USER 10001:10001
          ENTRYPOINT ["browser-worker"]
          DOCKER

      - name: Prove worker code and image isolation
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format apps/browser_worker
          uv run ruff check --fix apps/browser_worker
          uv run ruff format --check apps/browser_worker
          uv run ruff check apps/browser_worker
          uv run mypy apps/browser_worker/src/browser_worker
          uv run pytest -q apps/browser_worker/tests
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps/browser_worker/src/browser_worker
          docker build --file deploy/docker/browser-worker.Dockerfile \
            --tag data-collection-platform/browser-worker:ci .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/browser-worker:ci)" = "10001:10001"
          docker run --rm -i --entrypoint python data-collection-platform/browser-worker:ci - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec
          import_module('browser_worker')
          import_module('playwright')
          forbidden={'alembic','boto3','botocore','psycopg','sqlalchemy'}
          present=sorted(name for name in forbidden if find_spec(name) is not None)
          if present: raise SystemExit('forbidden browser dependencies: '+', '.join(present))
          PY

      - name: Commit repaired browser owner and continue
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/repair-browser-worker-from-diagnostic.yml \
            .github/workflows/materialize-browser-worker-after-review.yml \
            docs/diagnostics/materialize-browser-worker-after-review.md
          git add apps/browser_worker deploy/docker/browser-worker.Dockerfile pyproject.toml uv.lock
          test ! -f .github/workflows/browser-worker-isolation.yml || git add .github/workflows/browser-worker-isolation.yml
          test ! -f tools/architecture_checks/check_dependencies.py || git add tools/architecture_checks/check_dependencies.py
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Fix (Browser): close isolated acquisition owner'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/materialize-sealed-export-after-browser.yml/dispatches" \
            -d '{"ref":"main"}' >/dev/null
