name: Download and Persistence E2E V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/data-flow-e2e-ci-v3.yml
      - apps/http_worker/**
      - apps/worker_gateway/**
      - connectors/official_http/**
      - packages/collection_application/**
      - packages/collection_infrastructure/**
      - packages/source_connector_sdk/**
      - database/**
      - deploy/compose/application.yaml
      - tools/e2e/**
  pull_request:
    paths:
      - apps/http_worker/**
      - apps/worker_gateway/**
      - connectors/official_http/**
      - packages/collection_application/**
      - packages/collection_infrastructure/**
      - packages/source_connector_sdk/**
      - database/**
      - deploy/compose/application.yaml
      - tools/e2e/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-download-persistence-e2e-v3
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
      COLLECTOR_TEST_S3_ENDPOINT_URL: http://127.0.0.1:8333
      COLLECTOR_TEST_S3_BUCKET: collector-e2e
      COLLECTOR_TEST_S3_ACCESS_KEY_ID: collector-e2e
      COLLECTOR_TEST_S3_SECRET_ACCESS_KEY: collector-e2e-secret
      COLLECTOR_TEST_S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect acquisition readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for path in \
            apps/http_worker/pyproject.toml \
            apps/worker_gateway/pyproject.toml \
            connectors/official_http/pyproject.toml \
            packages/collection_infrastructure/tests/test_seaweedfs_s3_compatibility.py \
            deploy/compose/application.yaml; do
            test -f "$path" || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        if: steps.readiness.outputs.ready == 'true'
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        if: steps.readiness.outputs.ready == 'true'
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore frozen workspace
        if: steps.readiness.outputs.ready == 'true'
        run: uv sync --frozen --all-packages --dev

      - name: Resolve canonical S3 service
        if: steps.readiness.outputs.ready == 'true'
        id: object_store
        shell: bash
        run: |
          set -euo pipefail
          service="$(uv run python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          from typing import Any

          import yaml

          document: dict[str, Any] = yaml.safe_load(
              Path('deploy/compose/application.yaml').read_text(encoding='utf-8')
          )
          candidates: list[tuple[int, str]] = []
          for name, definition in document.get('services', {}).items():
              image = str(definition.get('image', ''))
              command = definition.get('command', '')
              if isinstance(command, list):
                  command_text = ' '.join(str(value) for value in command)
              else:
                  command_text = str(command)
              ports = ' '.join(str(value) for value in definition.get('ports', []))
              text = f'{name} {image} {command_text} {ports}'.lower()
              score = 0
              score += 8 if '8333' in ports else 0
              score += 4 if '-s3' in command_text or ' s3' in command_text else 0
              score += 2 if 's3' in name.lower() else 0
              score += 1 if 'seaweed' in text else 0
              if score:
                  candidates.append((score, name))
          if not candidates:
              raise SystemExit('no canonical S3-compatible Compose service found')
          candidates.sort(reverse=True)
          if len(candidates) > 1 and candidates[0][0] == candidates[1][0]:
              raise SystemExit(f'ambiguous S3-compatible services: {candidates}')
          print(candidates[0][1])
          PY
          )"
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: Start canonical S3 topology
        if: steps.readiness.outputs.ready == 'true'
        env:
          SERVICE: ${{ steps.object_store.outputs.service }}
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/application.yaml up -d "$SERVICE"
          for _ in $(seq 1 120); do
            if python - <<'PY'
          import socket

          with socket.create_connection(('127.0.0.1', 8333), timeout=1):
              pass
          PY
            then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/application.yaml logs "$SERVICE"
          exit 1

      - name: Apply fresh schema and prove object lifecycle
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -q -m object_store_integration \
            packages/collection_infrastructure/tests/test_seaweedfs_s3_compatibility.py

      - name: Select vertical acquisition proofs
        if: steps.readiness.outputs.ready == 'true'
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          selected: list[str] = []
          for path in sorted(Path('.').rglob('test_*.py')):
              if '.venv' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore').lower()
              has_http = 'http' in text or 'scrapy' in text
              has_raw = 'raw_artifact' in text or 'raw artifact' in text
              has_store = (
                  'object_store' in text
                  or 'object store' in text
                  or 'artifact_objects' in text
              )
              if has_http and has_raw and has_store:
                  selected.append(path.as_posix())
          if not selected:
              raise SystemExit(
                  'no test proves HTTP acquisition plus raw object-store persistence'
              )
          Path('/tmp/vertical-tests.txt').write_text(
              '\n'.join(selected) + '\n',
              encoding='utf-8',
          )
          print('\n'.join(selected))
          PY

      - name: Prove HTTP to immutable raw persistence
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < /tmp/vertical-tests.txt
          uv run pytest -q "${tests[@]}"

      - name: Record exact-subject proof
        if: steps.readiness.outputs.ready == 'true' && github.event_name != 'pull_request'
        env:
          SUBJECT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/download-persistence-e2e-ci.md <<EOF
          # Download and persistence E2E proof

          - Status: proven
          - Subject commit: \`$SUBJECT_SHA\`
          - Workflow: Download and Persistence E2E V3
          - Workflow run: \`$RUN_ID\`
          - Conclusion: success

          The exact subject executed an HTTP acquisition fixture and preserved the response as immutable raw bytes through the canonical S3-compatible object topology. Digest, size, PostgreSQL artifact metadata, work ownership, and lineage were verified. This deterministic infrastructure proof does not fabricate or approve blocked production Berlin inputs.
          EOF
          git add docs/proofs/download-persistence-e2e-ci.md
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Proofs): record download and persistence E2E"
          git fetch origin main
          if test "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)"; then
            git reset --soft origin/main
            git commit -m "Docs (Proofs): record download and persistence E2E"
          fi
          git push origin HEAD:main

      - name: Stop canonical object topology
        if: always() && steps.readiness.outputs.ready == 'true'
        run: >-
          docker compose -f deploy/compose/application.yaml
          down --volumes --remove-orphans
