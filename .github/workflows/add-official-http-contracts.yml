name: Add Official HTTP Contracts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-official-http-contracts.yml

permissions:
  contents: write

concurrency:
  group: data-collection-platform-official-http-contracts
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Serialize after geography finalization
        run: |
          sleep 60
          git fetch origin main
          git reset --hard origin/main

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Implement canonical HTTP acquisition contracts
        id: implement
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/proofs/reconciled-baseline-ci.md
          test -f docs/proofs/worker-image-isolation-ci.md
          test -f docs/proofs/official-berlin-boundary-ci.md

          mkdir -p \
            connectors/official_website_http/src/official_website_http \
            connectors/official_website_http/tests \
            docs/proofs

          cat > connectors/official_website_http/pyproject.toml <<'EOF'
          [project]
          name = "official-website-http"
          version = "0.1.0"
          description = "Canonical policy and planning contracts for official website acquisition"
          requires-python = ">=3.13,<3.14"
          dependencies = []

          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [tool.hatch.build.targets.wheel]
          packages = ["src/official_website_http"]
          EOF

          cat > connectors/official_website_http/src/official_website_http/contracts.py <<'PY'
          from __future__ import annotations

          import re
          from dataclasses import dataclass
          from typing import Literal

          _SHA256 = re.compile(r"^sha256:[0-9a-f]{64}$")
          _HOST = re.compile(
              r"^(?=.{1,253}\Z)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(?:\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))*$"
          )

          type HttpScheme = Literal["http", "https"]
          type HttpFetchKind = Literal[
              "fetched",
              "unchanged",
              "robots_denied",
              "policy_blocked",
              "transient_failure",
              "permanent_failure",
          ]


          @dataclass(frozen=True, slots=True)
          class NormalizedUrl:
              value: str
              scheme: HttpScheme
              host: str
              port: int | None
              path: str
              query: str

              def __post_init__(self) -> None:
                  if self.scheme not in {"http", "https"}:
                      raise ValueError("normalized URL scheme must be HTTP or HTTPS")
                  if _HOST.fullmatch(self.host) is None:
                      raise ValueError("normalized URL host is invalid")
                  if self.port is not None and not 1 <= self.port <= 65535:
                      raise ValueError("normalized URL port is invalid")
                  if not self.path.startswith("/"):
                      raise ValueError("normalized URL path must be absolute")

              @property
              def origin(self) -> str:
                  authority = self.host if self.port is None else f"{self.host}:{self.port}"
                  return f"{self.scheme}://{authority}"


          @dataclass(frozen=True, slots=True)
          class ConditionalRequest:
              etag: str | None = None
              last_modified: str | None = None

              def __post_init__(self) -> None:
                  if self.etag is not None and not self.etag.strip():
                      raise ValueError("ETag cannot be blank")
                  if self.last_modified is not None and not self.last_modified.strip():
                      raise ValueError("Last-Modified cannot be blank")


          @dataclass(frozen=True, slots=True)
          class HttpCrawlPolicy:
              policy_digest: str
              allowed_hosts: tuple[str, ...]
              user_agent: str
              maximum_redirects: int = 5
              maximum_response_bytes: int = 16 * 1024 * 1024
              maximum_robots_bytes: int = 1024 * 1024
              maximum_sitemap_bytes: int = 8 * 1024 * 1024
              maximum_sitemap_urls: int = 50_000
              request_timeout_seconds: float = 30.0
              honor_robots: bool = True
              allow_sitemaps: bool = True
              allowed_content_types: tuple[str, ...] = (
                  "text/html",
                  "application/xhtml+xml",
              )

              def __post_init__(self) -> None:
                  if _SHA256.fullmatch(self.policy_digest) is None:
                      raise ValueError("HTTP crawl policy digest is invalid")
                  if not self.allowed_hosts:
                      raise ValueError("HTTP crawl policy requires an allowed host")
                  normalized_hosts = tuple(sorted(set(self.allowed_hosts)))
                  if normalized_hosts != self.allowed_hosts:
                      raise ValueError("allowed hosts must be unique and sorted")
                  if any(_HOST.fullmatch(host) is None for host in self.allowed_hosts):
                      raise ValueError("HTTP crawl policy contains an invalid host")
                  if not self.user_agent.strip():
                      raise ValueError("HTTP crawl policy requires a user agent")
                  if not 0 <= self.maximum_redirects <= 10:
                      raise ValueError("HTTP redirect limit is invalid")
                  for name, value in (
                      ("maximum_response_bytes", self.maximum_response_bytes),
                      ("maximum_robots_bytes", self.maximum_robots_bytes),
                      ("maximum_sitemap_bytes", self.maximum_sitemap_bytes),
                      ("maximum_sitemap_urls", self.maximum_sitemap_urls),
                  ):
                      if value <= 0:
                          raise ValueError(f"{name} must be positive")
                  if not 0.1 <= self.request_timeout_seconds <= 300.0:
                      raise ValueError("HTTP request timeout is invalid")
                  if not self.allowed_content_types:
                      raise ValueError("HTTP crawl policy requires an allowed content type")


          @dataclass(frozen=True, slots=True)
          class HttpRequestSpec:
              url: NormalizedUrl
              policy_digest: str
              conditional: ConditionalRequest = ConditionalRequest()

              def __post_init__(self) -> None:
                  if _SHA256.fullmatch(self.policy_digest) is None:
                      raise ValueError("HTTP request policy digest is invalid")


          @dataclass(frozen=True, slots=True)
          class HttpRedirectHop:
              source_url: str
              status_code: int
              target_url: str

              def __post_init__(self) -> None:
                  if not 300 <= self.status_code <= 399:
                      raise ValueError("redirect status code is invalid")


          @dataclass(frozen=True, slots=True)
          class HttpFetchOutcome:
              kind: HttpFetchKind
              requested_url: str
              final_url: str | None
              status_code: int | None
              body_digest: str | None
              body_size_bytes: int | None
              content_type: str | None
              etag: str | None
              last_modified: str | None
              redirects: tuple[HttpRedirectHop, ...] = ()
              error_code: str | None = None
              retry_after_seconds: float | None = None

              def __post_init__(self) -> None:
                  if self.kind in {"fetched", "unchanged"} and self.status_code is None:
                      raise ValueError("successful HTTP outcome requires a status code")
                  if self.kind == "fetched":
                      if self.body_digest is None or _SHA256.fullmatch(self.body_digest) is None:
                          raise ValueError("fetched HTTP outcome requires a body digest")
                      if self.body_size_bytes is None or self.body_size_bytes < 0:
                          raise ValueError("fetched HTTP outcome requires a body size")
                  elif self.body_digest is not None or self.body_size_bytes is not None:
                      raise ValueError("non-fetched HTTP outcome cannot carry body identity")
                  if self.kind.endswith("failure") and not self.error_code:
                      raise ValueError("HTTP failure outcome requires an error code")
                  if self.retry_after_seconds is not None and self.retry_after_seconds < 0:
                      raise ValueError("retry delay cannot be negative")
          PY

          cat > connectors/official_website_http/src/official_website_http/urls.py <<'PY'
          from __future__ import annotations

          import ipaddress
          import re
          from urllib.parse import quote, urlsplit, urlunsplit

          from official_website_http.contracts import NormalizedUrl

          _PERCENT_ESCAPE = re.compile(r"%([0-9a-fA-F]{2})")
          _INVALID_PERCENT = re.compile(r"%(?![0-9a-fA-F]{2})")


          class UrlPolicyError(ValueError):
              def __init__(self, code: str, message: str) -> None:
                  self.code = code
                  super().__init__(message)


          def normalize_http_url(
              value: str,
              *,
              allowed_hosts: tuple[str, ...] | None = None,
          ) -> NormalizedUrl:
              raw = value.strip()
              if not raw:
                  raise UrlPolicyError("HTTP_URL_EMPTY", "HTTP URL cannot be empty")
              try:
                  parsed = urlsplit(raw)
              except ValueError as exc:
                  raise UrlPolicyError("HTTP_URL_INVALID", "HTTP URL cannot be parsed") from exc
              scheme = parsed.scheme.lower()
              if scheme not in {"http", "https"}:
                  raise UrlPolicyError(
                      "HTTP_URL_SCHEME_FORBIDDEN",
                      "Only HTTP and HTTPS URLs are supported",
                  )
              if parsed.username is not None or parsed.password is not None:
                  raise UrlPolicyError(
                      "HTTP_URL_CREDENTIALS_FORBIDDEN",
                      "URL credentials are forbidden",
                  )
              if parsed.hostname is None:
                  raise UrlPolicyError("HTTP_URL_HOST_MISSING", "HTTP URL host is missing")
              try:
                  host = parsed.hostname.encode("idna").decode("ascii").lower().rstrip(".")
              except UnicodeError as exc:
                  raise UrlPolicyError("HTTP_URL_HOST_INVALID", "HTTP URL host is invalid") from exc
              try:
                  ipaddress.ip_address(host)
              except ValueError:
                  pass
              else:
                  raise UrlPolicyError(
                      "HTTP_URL_IP_LITERAL_FORBIDDEN",
                      "IP-literal website URLs are forbidden",
                  )
              if allowed_hosts is not None and not _host_allowed(host, allowed_hosts):
                  raise UrlPolicyError(
                      "HTTP_URL_HOST_FORBIDDEN",
                      "HTTP URL host is outside the source allowlist",
                  )
              try:
                  port = parsed.port
              except ValueError as exc:
                  raise UrlPolicyError("HTTP_URL_PORT_INVALID", "HTTP URL port is invalid") from exc
              if (scheme == "http" and port == 80) or (scheme == "https" and port == 443):
                  port = None
              path = _remove_dot_segments(_normalize_component(parsed.path or "/"))
              query = _normalize_component(parsed.query)
              authority = host if port is None else f"{host}:{port}"
              normalized = urlunsplit((scheme, authority, path, query, ""))
              return NormalizedUrl(
                  value=normalized,
                  scheme=scheme,  # type: ignore[arg-type]
                  host=host,
                  port=port,
                  path=path,
                  query=query,
              )


          def _host_allowed(host: str, allowed_hosts: tuple[str, ...]) -> bool:
              return any(host == allowed or host.endswith(f".{allowed}") for allowed in allowed_hosts)


          def _normalize_component(value: str) -> str:
              if _INVALID_PERCENT.search(value):
                  raise UrlPolicyError(
                      "HTTP_URL_PERCENT_ENCODING_INVALID",
                      "HTTP URL contains an invalid percent escape",
                  )
              quoted = quote(value, safe="/%:@!$&'()*+,;=-._~?[]")
              return _PERCENT_ESCAPE.sub(lambda match: f"%{match.group(1).upper()}", quoted)


          def _remove_dot_segments(path: str) -> str:
              trailing_slash = path.endswith("/")
              output: list[str] = []
              for segment in path.split("/"):
                  if segment in {"", "."}:
                      continue
                  if segment == "..":
                      if output:
                          output.pop()
                      continue
                  output.append(segment)
              normalized = "/" + "/".join(output)
              if trailing_slash and normalized != "/":
                  normalized += "/"
              return normalized
          PY

          cat > connectors/official_website_http/src/official_website_http/robots.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from urllib.parse import urlsplit


          @dataclass(frozen=True, slots=True)
          class RobotsRule:
              allow: bool
              path: str


          @dataclass(frozen=True, slots=True)
          class RobotsPolicy:
              rules: tuple[RobotsRule, ...]
              crawl_delay_seconds: float | None
              sitemaps: tuple[str, ...]

              def allows(self, url: str) -> bool:
                  path = urlsplit(url).path or "/"
                  matches = [rule for rule in self.rules if path.startswith(rule.path)]
                  if not matches:
                      return True
                  winner = max(matches, key=lambda rule: (len(rule.path), rule.allow))
                  return winner.allow


          def parse_robots_txt(payload: bytes, *, user_agent: str) -> RobotsPolicy:
              try:
                  text = payload.decode("utf-8-sig")
              except UnicodeDecodeError as exc:
                  raise ValueError("robots.txt is not valid UTF-8") from exc
              groups: list[tuple[list[str], list[RobotsRule], float | None]] = []
              current_agents: list[str] = []
              current_rules: list[RobotsRule] = []
              current_delay: float | None = None
              sitemaps: set[str] = set()

              def flush() -> None:
                  nonlocal current_agents, current_rules, current_delay
                  if current_agents:
                      groups.append((current_agents, current_rules, current_delay))
                  current_agents = []
                  current_rules = []
                  current_delay = None

              for raw_line in text.splitlines():
                  line = raw_line.split("#", 1)[0].strip()
                  if not line or ":" not in line:
                      continue
                  field, value = (part.strip() for part in line.split(":", 1))
                  field = field.lower()
                  if field == "user-agent":
                      if current_rules:
                          flush()
                      current_agents.append(value.lower())
                  elif field in {"allow", "disallow"} and current_agents:
                      if value:
                          current_rules.append(RobotsRule(allow=field == "allow", path=value))
                  elif field == "crawl-delay" and current_agents:
                      try:
                          delay = float(value)
                      except ValueError:
                          continue
                      if delay >= 0:
                          current_delay = delay
                  elif field == "sitemap" and value:
                      sitemaps.add(value)
              flush()

              token = user_agent.lower().split("/", 1)[0]
              ranked: list[tuple[int, list[RobotsRule], float | None]] = []
              for agents, rules, delay in groups:
                  specificity = max(
                      (len(agent) for agent in agents if agent == "*" or agent in token),
                      default=-1,
                  )
                  if specificity >= 0:
                      ranked.append((specificity, rules, delay))
              if not ranked:
                  return RobotsPolicy((), None, tuple(sorted(sitemaps)))
              best = max(item[0] for item in ranked)
              selected = [item for item in ranked if item[0] == best]
              rules = tuple(rule for _, group_rules, _ in selected for rule in group_rules)
              delays = [delay for _, _, delay in selected if delay is not None]
              return RobotsPolicy(
                  rules=rules,
                  crawl_delay_seconds=max(delays) if delays else None,
                  sitemaps=tuple(sorted(sitemaps)),
              )
          PY

          cat > connectors/official_website_http/src/official_website_http/sitemap.py <<'PY'
          from __future__ import annotations

          import xml.etree.ElementTree as ET
          from dataclasses import dataclass

          from official_website_http.urls import normalize_http_url


          @dataclass(frozen=True, slots=True)
          class SitemapDocument:
              urls: tuple[str, ...]
              child_sitemaps: tuple[str, ...]


          def parse_sitemap(
              payload: bytes,
              *,
              allowed_hosts: tuple[str, ...],
              maximum_bytes: int,
              maximum_urls: int,
          ) -> SitemapDocument:
              if len(payload) > maximum_bytes:
                  raise ValueError("sitemap exceeds the configured byte limit")
              upper = payload[:4096].upper()
              if b"<!DOCTYPE" in upper or b"<!ENTITY" in upper:
                  raise ValueError("sitemap XML entities are forbidden")
              try:
                  root = ET.fromstring(payload)
              except ET.ParseError as exc:
                  raise ValueError("sitemap XML is invalid") from exc
              root_name = _local_name(root.tag)
              if root_name not in {"urlset", "sitemapindex"}:
                  raise ValueError("sitemap root element is unsupported")
              locations: list[str] = []
              for element in root.iter():
                  if _local_name(element.tag) != "loc" or not element.text:
                      continue
                  locations.append(
                      normalize_http_url(
                          element.text,
                          allowed_hosts=allowed_hosts,
                      ).value
                  )
                  if len(locations) > maximum_urls:
                      raise ValueError("sitemap exceeds the configured URL limit")
              values = tuple(sorted(set(locations)))
              if root_name == "urlset":
                  return SitemapDocument(urls=values, child_sitemaps=())
              return SitemapDocument(urls=(), child_sitemaps=values)


          def _local_name(value: str) -> str:
              return value.rsplit("}", 1)[-1]
          PY

          cat > connectors/official_website_http/src/official_website_http/interest.py <<'PY'
          from __future__ import annotations

          import re
          from dataclasses import dataclass
          from typing import Literal

          from official_website_http.urls import normalize_http_url

          type PageInterestTarget = Literal["url", "path", "query"]


          @dataclass(frozen=True, slots=True)
          class PageInterestRule:
              key: str
              target: PageInterestTarget
              pattern: str
              score: int

              def __post_init__(self) -> None:
                  if not self.key.strip():
                      raise ValueError("page-interest rule key cannot be blank")
                  if not -1000 <= self.score <= 1000:
                      raise ValueError("page-interest score is outside the supported range")
                  re.compile(self.pattern)


          @dataclass(frozen=True, slots=True)
          class PlannedPage:
              url: str
              score: int
              reasons: tuple[str, ...]


          def plan_pages(
              urls: tuple[str, ...],
              *,
              allowed_hosts: tuple[str, ...],
              rules: tuple[PageInterestRule, ...],
              maximum_pages: int,
          ) -> tuple[PlannedPage, ...]:
              if maximum_pages <= 0:
                  raise ValueError("maximum page count must be positive")
              planned: list[PlannedPage] = []
              for value in sorted(set(urls)):
                  normalized = normalize_http_url(
                      value,
                      allowed_hosts=allowed_hosts,
                  )
                  score = 0
                  reasons: list[str] = []
                  for rule in rules:
                      target = {
                          "url": normalized.value,
                          "path": normalized.path,
                          "query": normalized.query,
                      }[rule.target]
                      if re.search(rule.pattern, target, flags=re.IGNORECASE):
                          score += rule.score
                          reasons.append(rule.key)
                  planned.append(
                      PlannedPage(
                          url=normalized.value,
                          score=score,
                          reasons=tuple(sorted(reasons)),
                      )
                  )
              planned.sort(key=lambda page: (-page.score, page.url))
              return tuple(planned[:maximum_pages])
          PY

