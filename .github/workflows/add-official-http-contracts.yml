          cat > connectors/official_website_http/tests/test_urls.py <<'PY'
          import pytest

          from official_website_http import UrlPolicyError, normalize_http_url


          def test_url_identity_normalizes_without_reordering_query() -> None:
              result = normalize_http_url(
                  "HTTPS://Example.COM:443/a/./b/../c?b=2&a=1#fragment",
                  allowed_hosts=("example.com",),
              )
              assert result.value == "https://example.com/a/c?b=2&a=1"
              assert result.origin == "https://example.com"


          @pytest.mark.parametrize(
              ("value", "code"),
              [
                  ("file:///tmp/x", "HTTP_URL_SCHEME_FORBIDDEN"),
                  ("https://user:secret@example.com", "HTTP_URL_CREDENTIALS_FORBIDDEN"),
                  ("https://127.0.0.1/private", "HTTP_URL_IP_LITERAL_FORBIDDEN"),
                  ("https://other.example/path", "HTTP_URL_HOST_FORBIDDEN"),
                  ("https://example.com/%zz", "HTTP_URL_PERCENT_ENCODING_INVALID"),
              ],
          )
          def test_url_policy_is_fail_closed(value: str, code: str) -> None:
              with pytest.raises(UrlPolicyError) as error:
                  normalize_http_url(value, allowed_hosts=("example.com",))
              assert error.value.code == code


          def test_subdomain_is_allowed_but_suffix_confusion_is_not() -> None:
              assert normalize_http_url(
                  "https://www.example.com/",
                  allowed_hosts=("example.com",),
              ).host == "www.example.com"
              with pytest.raises(UrlPolicyError):
                  normalize_http_url(
                      "https://example.com.attacker.invalid/",
                      allowed_hosts=("example.com",),
                  )
          PY

