          from official_website_http import parse_robots_txt


          def test_robots_longest_match_and_allow_tie_win() -> None:
              policy = parse_robots_txt(
                  b"""
          User-agent: collector
          Disallow: /private
          Allow: /private/public
          Crawl-delay: 2.5
          Sitemap: https://example.com/sitemap.xml
          """,
                  user_agent="collector/1.0",
              )
              assert not policy.allows("https://example.com/private/a")
              assert policy.allows("https://example.com/private/public/a")
              assert policy.crawl_delay_seconds == 2.5
              assert policy.sitemaps == ("https://example.com/sitemap.xml",)


          def test_unknown_agent_defaults_to_allow() -> None:
              policy = parse_robots_txt(
                  b"User-agent: another\nDisallow: /\n",
                  user_agent="collector/1.0",
              )
              assert policy.allows("https://example.com/anything")
