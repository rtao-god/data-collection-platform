          from official_website_http import PageInterestRule, plan_pages


          def test_page_interest_is_configuration_driven_and_deterministic() -> None:
              rules = (
                  PageInterestRule("contact", "path", r"contact|kontakt", 20),
                  PageInterestRule("legal", "path", r"imprint|impressum", 10),
                  PageInterestRule("tracking", "query", r"utm_", -50),
              )
              first = plan_pages(
                  (
                      "https://example.com/about",
                      "https://example.com/contact",
                      "https://example.com/imprint",
                  ),
                  allowed_hosts=("example.com",),
                  rules=rules,
                  maximum_pages=2,
              )
              second = plan_pages(
                  tuple(reversed(tuple(page.url for page in first)))
                  + ("https://example.com/about",),
                  allowed_hosts=("example.com",),
                  rules=rules,
                  maximum_pages=2,
              )
              assert first[0].url == "https://example.com/contact"
              assert first[0].reasons == ("contact",)
              assert second == first
          PY

          python - <<'PY'
          from __future__ import annotations

          import ast
          import copy
          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          root_file = root / "pyproject.toml"
          source = root_file.read_text(encoding="utf-8")
          member = "connectors/official_website_http"

          def append_array_value(text: str, section: str, key: str, value: str) -> str:
              lines = text.splitlines(keepends=True)
              header = f"[{section}]"
              section_index = next(
                  index for index, line in enumerate(lines) if line.strip() == header
              )
              start = next(
                  index
                  for index in range(section_index + 1, len(lines))
                  if re.match(rf"^{re.escape(key)}\s*=", lines[index].strip())
              )
              end = start
              depth = 0
              while end < len(lines):
                  depth += lines[end].count("[") - lines[end].count("]")
                  if depth <= 0 and "[" in "".join(lines[start : end + 1]):
                      break
                  end += 1
              block = "".join(lines[start : end + 1])
              if f'"{value}"' not in block:
                  lines.insert(end, f'  "{value}",\n')
              return "".join(lines)

          source = append_array_value(
              source,
              "tool.uv.workspace",
              "members",
              member,
          )
          source = append_array_value(
              source,
              "tool.mypy",
              "files",
              f"{member}/src/official_website_http",
          )
          root_file.write_text(source, encoding="utf-8")

          checker = root / "tools/architecture_checks/check_dependencies.py"
          checker_source = checker.read_text(encoding="utf-8")
          tree = ast.parse(checker_source)
          registry = None
          for node in ast.walk(tree):
              value = node.value if isinstance(node, (ast.Assign, ast.AnnAssign)) else None
              if not isinstance(value, ast.Dict):
                  continue
              keys = {
                  key.value
                  for key in value.keys
                  if isinstance(key, ast.Constant) and isinstance(key.value, str)
              }
              if {"collection_domain", "source_connector_sdk"}.issubset(keys):
                  registry = value
                  break
          if registry is None or registry.end_lineno is None:
              raise RuntimeError("architecture owner registry not found")
          entries = {
              key.value: value
              for key, value in zip(registry.keys, registry.values, strict=True)
              if isinstance(key, ast.Constant) and isinstance(key.value, str)
          }
          if "official_website_http" not in entries:
              template = entries.get("source_connector_sdk")
              if not isinstance(template, ast.Call):
                  raise RuntimeError("connector owner template is unavailable")
              call = copy.deepcopy(template)
              matched: set[str] = set()
              for keyword in call.keywords:
                  name = (keyword.arg or "").lower()
                  if name in {"project_path", "path", "root", "owner_path"}:
                      keyword.value = ast.Constant(value=member)
                      matched.add("path")
                  elif name in {"distribution", "distribution_name", "project_name"}:
                      keyword.value = ast.Constant(value="official-website-http")
                      matched.add("distribution")
                  elif name in {"import_root", "module", "package", "owner"}:
                      keyword.value = ast.Constant(value="official_website_http")
                      matched.add("import")
                  elif "internal" in name or name in {"allowed_imports", "imports"}:
                      if isinstance(keyword.value, ast.Call):
                          keyword.value = ast.Call(
                              func=copy.deepcopy(keyword.value.func),
                              args=[ast.Tuple(elts=[], ctx=ast.Load())],
                              keywords=[],
                          )
                      elif isinstance(keyword.value, ast.Set):
                          keyword.value = ast.Set(elts=[])
                      elif isinstance(keyword.value, ast.Tuple):
                          keyword.value = ast.Tuple(elts=[], ctx=ast.Load())
                      elif isinstance(keyword.value, ast.List):
                          keyword.value = ast.List(elts=[], ctx=ast.Load())
                      matched.add("internal")
                  elif "external" in name or "capabil" in name:
                      if isinstance(keyword.value, ast.Call):
                          keyword.value = ast.Call(
                              func=copy.deepcopy(keyword.value.func),
                              args=[ast.Tuple(elts=[], ctx=ast.Load())],
                              keywords=[],
                          )
                      elif isinstance(keyword.value, ast.Set):
                          keyword.value = ast.Set(elts=[])
                      elif isinstance(keyword.value, ast.Tuple):
                          keyword.value = ast.Tuple(elts=[], ctx=ast.Load())
                      elif isinstance(keyword.value, ast.List):
                          keyword.value = ast.List(elts=[], ctx=ast.Load())
                      matched.add("external")
              required = {"path", "distribution", "import", "internal", "external"}
              if matched != required:
                  raise RuntimeError(f"unsupported owner template fields: {sorted(matched)}")
              lines = checker_source.splitlines(keepends=True)
              lines[registry.end_lineno - 1 : registry.end_lineno - 1] = [
                  f'    "official_website_http": {ast.unparse(call)},\n'
              ]
              checker.write_text("".join(lines), encoding="utf-8")
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff check connectors/official_website_http pyproject.toml tools/architecture_checks/check_dependencies.py --fix --unsafe-fixes
          uv run ruff format connectors/official_website_http tools/architecture_checks/check_dependencies.py
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest connectors/official_website_http/tests -q
          uv run pytest -m 'not integration and not object_store_integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

          cat > docs/http-acquisition-contracts.md <<'EOF'
          # Official website HTTP acquisition contracts

          `official_website_http` owns deterministic, network-free HTTP acquisition policy:

          - canonical HTTP/HTTPS URL identity without query reordering;
          - host allowlisting and rejection of credentials, IP literals, fragments, and invalid escapes;
          - robots.txt group selection, longest-match allow/disallow semantics, crawl delay, and sitemap discovery;
          - bounded sitemap parsing with XML entity rejection and same-source host enforcement;
          - campaign-configured page-interest scoring with deterministic selection;
          - typed conditional requests and acquisition outcomes, including `unchanged` for HTTP 304.

          It does not own transport, Work Engine persistence, raw artifact promotion, browser escalation,
          extraction, matching, or publication.
          EOF

          cat > docs/proofs/official-http-contracts.md <<'EOF'
          # Official HTTP contract proof

          - URL normalization and source-host policy: tested
          - credentials and IP-literal URLs: rejected
          - robots longest-match semantics: tested
          - sitemap limits and XML entity rejection: tested
          - page-interest planning: deterministic and configuration-driven
          - conditional request and typed outcome contracts: validated
          - network, database, browser, and object-store capabilities: absent
          EOF

      - name: Commit contract batch or remove blocked automation
        if: always()
        shell: bash
        env:
          IMPLEMENT_OUTCOME: ${{ steps.implement.outcome }}
        run: |
          set -euo pipefail
          if [ "$IMPLEMENT_OUTCOME" != 'success' ]; then
            git reset --hard HEAD
          fi
          git rm -f --ignore-unmatch .github/workflows/add-official-http-contracts.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "$IMPLEMENT_OUTCOME" = 'success' ]; then
            git commit -m 'Feature (HTTP Acquisition): add canonical planning contracts'
          else
            git commit -m 'Build (Tooling): remove blocked HTTP contract batch'
          fi
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1

      - name: Preserve failed status
        if: steps.implement.outcome != 'success'
        run: exit 1
