name: Extend Official Berlin Boundary Link Discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extend-portal-boundary-links.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Add licensed direct-link fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/live_collection/berlin_boundary_portal.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    return tuple(sorted(result.values(), key=lambda item: (-item.score, item.resource_url)))
'''
          replacement = '''    page_license = ""
    page_title = "Berlin boundary"
    for raw in parser.json_ld:
        try:
            value = json.loads(raw)
        except ValueError:
            continue
        for node in _walk(value):
            if not isinstance(node, Mapping):
                continue
            page_license = page_license or _text_for_keys(node, _LICENSE_KEYS)
            page_title = _text_for_keys(node, _NAME_KEYS) or page_title
    if page_license:
        for link in parser.links:
            resource_url = urljoin(dataset_url, link)
            lowered = resource_url.lower()
            if not any(token in lowered for token in ("wfs", "geojson", ".json")):
                continue
            try:
                _require_official_url(resource_url)
            except BoundaryMaterializationError:
                continue
            metadata = {"name": page_title, "license": page_license}
            score = _score_metadata(metadata, resource_url)
            if score <= 0:
                continue
            identifier = hashlib.sha256(resource_url.encode("utf-8")).hexdigest()
            result.setdefault(
                resource_url,
                ResourceCandidate(
                    dataset_title=page_title,
                    dataset_identifier=hashlib.sha256(
                        dataset_url.encode("utf-8")
                    ).hexdigest(),
                    resource_identifier=identifier,
                    resource_url=resource_url,
                    resource_format=(
                        "wfs"
                        if "wfs" in lowered
                        else Path(urlparse(resource_url).path).suffix.lstrip(".").lower()
                    ),
                    license_identifier=page_license,
                    license_title=page_license,
                    score=score,
                ),
            )
    return tuple(sorted(result.values(), key=lambda item: (-item.score, item.resource_url)))
'''
          if replacement not in text:
              if anchor not in text:
                  raise RuntimeError("portal metadata candidate return anchor is missing")
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv sync --frozen --all-packages --dev
          uv run ruff format tools/live_collection/berlin_boundary_portal.py
          uv run ruff check tools/live_collection/berlin_boundary_portal.py
          uv run pytest -q \
            tools/live_collection/tests/test_berlin_boundary.py \
            tools/live_collection/tests/test_berlin_boundary_portal.py
          uv run mypy tools/live_collection/berlin_boundary_portal.py
      - name: Commit proven discovery fallback
        shell: bash
        run: |
          set -euo pipefail
          git add tools/live_collection/berlin_boundary_portal.py
          git diff --cached --check
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Geography): discover licensed portal resource links"
          git push origin HEAD:main
