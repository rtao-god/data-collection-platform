name: Capture Operational Controller Failure

on:
  workflow_run:
    workflows: ["Operational Chain Controller"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Download controller logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          run_id="$EVENT_RUN_ID"
          if [[ -z "$run_id" || "$run_id" == null ]]; then
            run_id="$(curl -fsSL "${headers[@]}" \
              "$api/actions/workflows/operational-chain-controller.yml/runs?branch=main&per_page=20" \
              | jq -r '.workflow_runs[] | select(.conclusion == "failure") | .id' | head -1)"
          fi
          test -n "$run_id"
          curl -fsSL -L "${headers[@]}" "$api/actions/runs/$run_id/logs" -o logs.zip
          mkdir logs
          unzip -q logs.zip -d logs
          echo "$run_id" > run-id.txt
      - name: Commit concise controller evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/diagnostics
          run_id="$(cat run-id.txt)"
          {
            echo '# Operational chain controller failure'
            echo
            echo "- Run: \`$run_id\`"
            echo
            echo '```text'
            find logs -type f -print0 | sort -z | xargs -0 cat \
              | grep -E -B 10 -A 45 'failed in run|requires code correction|timed out|##\[error\]|Error:|FAILED' \
              | tail -n 300 || true
            echo '```'
          } > docs/diagnostics/operational-chain-controller.md
          git rm -f --ignore-unmatch .github/workflows/capture-operational-controller-failure.yml
          git add docs/diagnostics/operational-chain-controller.md
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Docs (Diagnostics): record operational controller failure'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
