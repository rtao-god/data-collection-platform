name: Fix Pipeline Metadata Composition

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pipeline-metadata-composition.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-pipeline-owner-repair-v2
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Register pipeline tables in canonical metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f database/migrations/versions/20260815_0013_pipeline_advancement.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          postgres_init = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/"
              "postgres/__init__.py"
          )
          text = postgres_init.read_text(encoding="utf-8")
          marker = "# pipeline-metadata-composition"
          if marker not in text:
              block = '''

# pipeline-metadata-composition
from collection_infrastructure.postgres.pipeline_advancement import (
    PostgresPipelineAdvancementRepository,
)
from collection_infrastructure.postgres.pipeline_advancement_metadata import (
    PIPELINE_ADVANCEMENT_TABLES,
    pipeline_advancement_attempts,
    pipeline_advancements,
)
from collection_infrastructure.postgres.succeeded_work_catalog import (
    PostgresSucceededWorkCatalog,
)

__all__.extend(
    [
        "PIPELINE_ADVANCEMENT_TABLES",
        "PostgresPipelineAdvancementRepository",
        "PostgresSucceededWorkCatalog",
        "pipeline_advancement_attempts",
        "pipeline_advancements",
    ]
)
'''
              repository_tree = ast.parse(
                  Path(
                      "packages/collection_infrastructure/src/"
                      "collection_infrastructure/postgres/pipeline_advancement.py"
                  ).read_text(encoding="utf-8")
              )
              repository_classes = {
                  node.name
                  for node in repository_tree.body
                  if isinstance(node, ast.ClassDef)
              }
              if "PostgresPipelineAdvancementRepository" not in repository_classes:
                  candidates = sorted(
                      name
                      for name in repository_classes
                      if name.startswith("Postgres")
                  )
                  if len(candidates) != 1:
                      raise RuntimeError(
                          f"ambiguous pipeline repository classes: {candidates}"
                      )
                  block = block.replace(
                      "PostgresPipelineAdvancementRepository",
                      candidates[0],
                  )
              postgres_init.write_text(text.rstrip() + block, encoding="utf-8")

          top_init = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/"
              "__init__.py"
          )
          text = top_init.read_text(encoding="utf-8")
          marker = "# pipeline-top-level-composition"
          if marker not in text:
              postgres_source = postgres_init.read_text(encoding="utf-8")
              tree = ast.parse(postgres_source)
              exported = []
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      continue
              repository_source = Path(
                  "packages/collection_infrastructure/src/"
                  "collection_infrastructure/postgres/pipeline_advancement.py"
              ).read_text(encoding="utf-8")
              repository_tree = ast.parse(repository_source)
              repository_candidates = sorted(
                  node.name
                  for node in repository_tree.body
                  if isinstance(node, ast.ClassDef)
                  and node.name.startswith("Postgres")
              )
              if len(repository_candidates) != 1:
                  raise RuntimeError(
                      f"ambiguous pipeline repository classes: {repository_candidates}"
                  )
              repository_name = repository_candidates[0]
              block = f'''

# pipeline-top-level-composition
from collection_infrastructure.postgres import (
    {repository_name},
    PostgresSucceededWorkCatalog,
)

__all__.extend(
    [
        "{repository_name}",
        "PostgresSucceededWorkCatalog",
    ]
)
'''
              top_init.write_text(text.rstrip() + block, encoding="utf-8")

          schema_test = Path("database/tests/test_work_engine_schema.py")
          text = schema_test.read_text(encoding="utf-8")
          if '"pipeline_advancements"' not in text:
              anchor = '        "dead_letters",\n'
              if anchor not in text:
                  raise RuntimeError("work schema table-set anchor is missing")
              text = text.replace(
                  anchor,
                  anchor
                  + '        "pipeline_advancement_attempts",\n'
                  + '        "pipeline_advancements",\n',
                  1,
              )
              schema_test.write_text(text, encoding="utf-8")
          PY

      - name: Prove composition and fresh schema
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          files=(
            packages/collection_infrastructure/src/collection_infrastructure/__init__.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py
            database/tests/test_work_engine_schema.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run mypy "${files[@]}"
          uv run python - <<'PY'
          from collection_infrastructure.postgres import (
              PIPELINE_ADVANCEMENT_TABLES,
              PostgresSucceededWorkCatalog,
          )

          assert tuple(table.fullname for table in PIPELINE_ADVANCEMENT_TABLES) == (
              "work.pipeline_advancements",
              "work.pipeline_advancement_attempts",
          )
          assert PostgresSucceededWorkCatalog
          PY
          uv run collection-migrate upgrade head
          uv run pytest -q -m integration database/tests/test_work_engine_schema.py

      - name: Commit metadata composition
        shell: bash
        run: |
          set -euo pipefail
          git add \
            packages/collection_infrastructure/src/collection_infrastructure/__init__.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py \
            database/tests/test_work_engine_schema.py
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Pipeline): register metadata composition"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
