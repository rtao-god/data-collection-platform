name: Finalize Operational Production V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-operational-production-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-collection-platform-final-operational-production-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Wait for earlier mutators
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY/actions/runs?branch=main&per_page=100"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          names='["Pipeline Owner Repair V3","Pipeline Owner Finalize","Reconcile Operational Production V4","Reconcile Operational Production V5","Operational Closure V1","Finalize Operational Production V1"]'
          for _ in $(seq 1 900); do
            payload="$(curl -fsSL "${headers[@]}" "$api")"
            active="$(jq --arg current "$CURRENT_RUN_ID" --argjson names "$names" '[.workflow_runs[] | select((.id|tostring) != $current and .status != "completed" and (.name as $n | $names | index($n)) != null)] | length' <<<"$payload")"
            [[ "$active" == 0 ]] && break
            sleep 5
          done
          payload="$(curl -fsSL "${headers[@]}" "$api")"
          active="$(jq --arg current "$CURRENT_RUN_ID" --argjson names "$names" '[.workflow_runs[] | select((.id|tostring) != $current and .status != "completed" and (.name as $n | $names | index($n)) != null)] | length' <<<"$payload")"
          [[ "$active" == 0 ]] || { echo 'earlier mutators did not quiesce' >&2; exit 1; }
          git fetch origin main
          git reset --hard origin/main

      - name: Restore disjoint proven operational owners
        shell: bash
        run: |
          set -euo pipefail
          e2e_sha="9bec95589ee0592a873edbc0548be27707f53af6"
          git cat-file -e "$e2e_sha^{commit}"

          roots=(
            apps/browser_worker
            apps/dagster_definitions
            apps/orchestrator
            apps/pipeline_supervisor
            apps/retention_job
            apps/review_web
            packages/export_core
            tools/operations
            deploy/compose/application.yaml
          )
          for path in "${roots[@]}"; do
            if git cat-file -e "$e2e_sha:$path" 2>/dev/null; then
              git checkout "$e2e_sha" -- "$path"
            fi
          done

          while IFS= read -r path; do
            case "$path" in
              *browser*|*retention*|*orchestrator*|*review-web*|*review_web*|*dagster*|*pipeline-supervisor*)
                git checkout "$e2e_sha" -- "$path"
                ;;
            esac
          done < <(git ls-tree -r --name-only "$e2e_sha" deploy/docker)

          owner_commits=(
            0da188be6fe963e3fae18f460ea5e566d104fa3c
            5a035e8031a5d6e1eddfa4212b9f9c17dbb6f87c
            553c63ad7e4d3f107894f687acb787e754ce61bf
            0abfbe53bfeb18623f83f72584e5be22971ff7d5
            e80bbcfebe8dce765b0bcdf7b362e069a979dbac
            8069f7d9e926c9109e6aa7f47770ef7cfbb8d4cb
            a175eb66110e4899741af6991cce829cc1b5112f
            05d8ab74e1f20f3654b097c7e7812bcf94c70d82
            47bda1aed7f0a49ac02d5586c88bd04b38ccff71
            7e09b245b4d7b851d8d5efca2f1c765593ec2726
            24c2979e7e871c814a895d9e8ec182cb6705321f
            9bec95589ee0592a873edbc0548be27707f53af6
          )
          protected='^(packages/collection_application/src/collection_application/(run_control|pipeline_advancement|pipeline_supervision)\.py|packages/collection_infrastructure/src/collection_infrastructure/postgres/(run_control|pipeline_advancement|pipeline_advancement_metadata|pipeline_run_control|succeeded_work_catalog)\.py|database/migrations/versions/20260815_001[23]_.*\.py|database/tests/test_pipeline_advancement_schema\.py|apps/control_api/)'
          declare -A restore=()
          for commit in "${owner_commits[@]}"; do
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              [[ "$path" == .github/* ]] && continue
              [[ "$path" == .codex/* ]] && continue
              [[ "$path" == docs/diagnostics/* ]] && continue
              [[ "$path" =~ $protected ]] && continue
              git cat-file -e "$e2e_sha:$path" 2>/dev/null || continue
              restore["$path"]=1
            done < <(git diff-tree --no-commit-id --name-only -r "$commit")
          done
          for path in "${!restore[@]}"; do
            git checkout "$e2e_sha" -- "$path"
          done

          test -f packages/collection_application/src/collection_application/run_control.py
          test -f packages/collection_application/src/collection_application/pipeline_advancement.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/run_control.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
          test -f apps/review_web/package-lock.json
          test -f apps/browser_worker/pyproject.toml
          test -f apps/retention_job/pyproject.toml
          test -f apps/orchestrator/pyproject.toml
          test -f packages/export_core/src/export_core/service.py
          test -f tools/operations/backup_restore.py
          test -f deploy/compose/application.yaml

      - name: Reconcile root workspace scopes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import tomllib
          from pathlib import Path

          root = Path("pyproject.toml")
          text = root.read_text(encoding="utf-8")
          projects = sorted(
              str(path.parent).replace("\\", "/")
              for parent in (Path("apps"), Path("connectors"), Path("packages"))
              if parent.exists()
              for path in parent.glob("*/pyproject.toml")
          )
          sources = sorted(
              str(Path(project) / "src").replace("\\", "/")
              for project in projects
              if (Path(project) / "src").is_dir()
          )
          testpaths = sorted(
              {
                  "database/tests",
                  "tests",
                  *(
                      str(Path(project) / "tests").replace("\\", "/")
                      for project in projects
                      if (Path(project) / "tests").is_dir()
                  ),
              }
          )
          testpaths = [path for path in testpaths if Path(path).exists()]

          def replace_array(section: str, key: str, values: list[str]) -> None:
              nonlocal_text[0] = _replace_array(nonlocal_text[0], section, key, values)

          def _replace_array(source: str, section: str, key: str, values: list[str]) -> str:
              section_pattern = re.compile(
                  rf"(?ms)^\[{re.escape(section)}\]\n(?P<body>.*?)(?=^\[|\Z)"
              )
              match = section_pattern.search(source)
              if match is None:
                  raise RuntimeError(f"missing TOML section [{section}]")
              body = match.group("body")
              rendered = key + " = [\n" + "".join(
                  f'  "{value}",\n' for value in values
              ) + "]\n"
              key_pattern = re.compile(rf"(?ms)^{re.escape(key)}\s*=\s*\[.*?^\]\n?")
              if key_pattern.search(body):
                  body = key_pattern.sub(rendered, body, count=1)
              else:
                  body = rendered + body
              return source[: match.start("body")] + body + source[match.end("body") :]

          nonlocal_text = [text]
          replace_array("tool.uv.workspace", "members", projects)
          replace_array("tool.pytest.ini_options", "testpaths", testpaths)
          replace_array("tool.ruff", "src", sources)
          replace_array("tool.mypy", "files", sources)
          root.write_text(nonlocal_text[0], encoding="utf-8")

          with root.open("rb") as stream:
              tomllib.load(stream)
          PY

          if git cat-file -e "9bec95589ee0592a873edbc0548be27707f53af6:tools/architecture_checks/check_dependencies.py"; then
            git checkout 9bec95589ee0592a873edbc0548be27707f53af6 -- \
              tools/architecture_checks/check_dependencies.py
          fi
          if test -f docs/architecture/dependency-rules.md; then
            policy="$(python tools/architecture_checks/check_dependencies.py --print-policy)"
            POLICY="$policy" python - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/architecture/dependency-rules.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              path.write_text(
                  text[:start] + os.environ["POLICY"] + text[end:],
                  encoding="utf-8",
              )
          PY
          fi

      - name: Restore and prove deterministic Python product
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py
          uv run python tools/contract_generation/generate.py --check
          if test -f tools/control_api_contract_generation/generate.py; then
            uv run python tools/control_api_contract_generation/generate.py
            uv run python tools/control_api_contract_generation/generate.py --check
          fi
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py
            uv run python tools/review_contract_generation/generate.py --check
          fi
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          git diff --check

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Prove review frontend and deployment topology
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/review_web ci
          npm --prefix apps/review_web run lint
          npm --prefix apps/review_web run typecheck --if-present
          npm --prefix apps/review_web test -- --run
          npm --prefix apps/review_web run build
          docker compose -f deploy/compose/application.yaml config >/dev/null
          grep -R "image:.*latest" deploy/compose && exit 1 || true

      - name: Commit exact production tree
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude).github/apply/**' \
            ':(exclude)docs/diagnostics/**' \
            ':(exclude)docs/proofs/end-to-end-operational-ci.md'
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name rtao-god
            git config user.email rtaogod@gmail.com
            git commit -m "Fix (Recovery): finalize operational E2E production tree"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch permanent exact-head suite
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          for workflow in ci.yml operational-ci.yml controlled-data-flow-ci.yml; do
            curl -fsSL -X POST "${headers[@]}" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
          done
          echo "started=$started" >> "$GITHUB_OUTPUT"

      - name: Wait for permanent exact-head suite
        id: suite
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
          STARTED: ${{ steps.dispatch.outputs.started }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          workflows=(ci.yml operational-ci.yml controlled-data-flow-ci.yml)
          labels=(Verify OperationalVerify ControlledDataFlow)
          names=(verify operational flow)
          for index in "${!workflows[@]}"; do
            run_id=''
            for _ in $(seq 1 900); do
              payload="$(curl -fsSL "${headers[@]}" "https://api.github.com/repos/$REPOSITORY/actions/workflows/${workflows[$index]}/runs?branch=main&per_page=50")"
              run_id="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .id' <<<"$payload" | head -1)"
              status="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg sha "$SUBJECT_SHA" --arg started "$STARTED" '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .conclusion' <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || { echo "${labels[$index]} failed: $run_id" >&2; exit 1; }
                break
              fi
              sleep 5
            done
            [[ -n "$run_id" ]] || { echo "${labels[$index]} timed out" >&2; exit 1; }
            echo "${names[$index]}=$run_id" >> "$GITHUB_OUTPUT"
          done

      - name: Record exact-subject proof
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
          VERIFY_RUN: ${{ steps.suite.outputs.verify }}
          OPERATIONAL_RUN: ${{ steps.suite.outputs.operational }}
          FLOW_RUN: ${{ steps.suite.outputs.flow }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          mkdir -p docs/proofs
          cat > docs/proofs/end-to-end-operational-ci.md <<EOF
          # End-to-end operational CI proof

          - Status: proven
          - Repository: rtao-god/data-collection-platform
          - Branch: main
          - Subject commit: \`$SUBJECT_SHA\`
          - Verify run: \`$VERIFY_RUN\`
          - Operational Verify run: \`$OPERATIONAL_RUN\`
          - Controlled Data Flow run: \`$FLOW_RUN\`

          The exact subject passed permanent frozen-workspace, contract-drift, Ruff,
          strict mypy, unit, architecture, fresh PostgreSQL/PostGIS, review-console,
          deployment-topology, isolated-image, export/retention/operations, and
          controlled HTTP-download-to-artifact-persistence verification.

          This proof establishes software and controlled-environment readiness. It
          does not manufacture an approved Berlin boundary, production source consent,
          or a real Berlin campaign run.
          EOF
          git add docs/proofs/end-to-end-operational-ci.md
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Proofs): record exact-head operational E2E closure"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
