name: Integrate Manual Import Worker

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-manual-import-worker.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: true

      - name: Integrate and verify owner batch
        run: |
          python .codex/integrate_manual_import_worker.py
          python .codex/integrate_manual_import_worker_db.py
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py
          if [ -f tools/manual_import_contract_generation/generate.py ]; then
            uv run python tools/manual_import_contract_generation/generate.py
          fi
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps packages connectors 2>/dev/null || \
            uv run python -m compileall -q apps packages
          docker build -f deploy/docker/manual-import-worker.Dockerfile .
          rm -f \
            .codex/integrate_manual_import_worker.py \
            .codex/integrate_manual_import_worker_db.py \
            .github/workflows/integrate-manual-import-worker.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Feat (Manual Import): add isolated planning worker'
          git push origin HEAD:main
