name: Apply Generated Contract

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-generated-contract.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-generated-contract
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Generate and verify exact owner output
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/contract_generation/generate.py
          uv run python tools/contract_generation/generate.py --check
          changed="$(git diff --name-only -- contracts/json_schema contracts/openapi)"
          test "$changed" = "contracts/openapi/worker-gateway.openapi.json"
          git diff --check

      - name: Commit generated output and remove transport workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-generated-contract.yml
          git rm .github/workflows/generate-contract-artifact.yml
          git add contracts/openapi/worker-gateway.openapi.json
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Build (Contracts): regenerate Worker Gateway OpenAPI"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
