name: Apply Manual Record Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-manual-record-owner.yml
      - .github/apply/manual-record-owner.tar.xz.b64.part-*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-apply-manual-record-owner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify and extract reviewed owner bundle
        shell: bash
        run: |
          set -euo pipefail
          base_sha="2ba19d2103b4e19051b25cd176aebd05bee0d1c1"
          python - <<'PY'
          from __future__ import annotations

          import subprocess

          allowed = (
              ".github/apply/manual-record-owner.tar.xz.b64.part-",
              ".github/workflows/apply-manual-record-owner.yml",
          )
          changed = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "2ba19d2103b4e19051b25cd176aebd05bee0d1c1..HEAD",
              ],
              text=True,
          ).splitlines()
          unexpected = [
              path
              for path in changed
              if not path.startswith(allowed[0]) and path != allowed[1]
          ]
          if unexpected:
              raise SystemExit(
                  "owner bundle base has unrelated mutations: " + ", ".join(unexpected)
              )
          PY
          cat \
            .github/apply/manual-record-owner.tar.xz.b64.part-00 \
            .github/apply/manual-record-owner.tar.xz.b64.part-01 \
            .github/apply/manual-record-owner.tar.xz.b64.part-01b \
            .github/apply/manual-record-owner.tar.xz.b64.part-02 \
            .github/apply/manual-record-owner.tar.xz.b64.part-03 \
            .github/apply/manual-record-owner.tar.xz.b64.part-04 \
            .github/apply/manual-record-owner.tar.xz.b64.part-05 \
            .github/apply/manual-record-owner.tar.xz.b64.part-06 \
            > /tmp/manual-record-owner.tar.xz.b64
          echo "b14369f9b73808624b1505e0880698109c1d5561bcd33514b162fbd88fe48d48  /tmp/manual-record-owner.tar.xz.b64" \
            | sha256sum --check --strict
          base64 --decode /tmp/manual-record-owner.tar.xz.b64 \
            > /tmp/manual-record-owner.tar.xz
          echo "43dfcb0601ee8e576d8c35a9799b735dfb2e277d1da8e87920cee5d20649054e  /tmp/manual-record-owner.tar.xz" \
            | sha256sum --check --strict
          xz --test /tmp/manual-record-owner.tar.xz
          install -d /tmp/manual-record-owner
          tar -xJf /tmp/manual-record-owner.tar.xz -C /tmp/manual-record-owner

      - name: Apply exact owner files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          repository = Path.cwd().resolve()
          bundle = Path("/tmp/manual-record-owner")
          manifest = json.loads((bundle / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("repository") != "rtao-god/data-collection-platform":
              raise SystemExit("manual-record owner bundle targets another repository")
          if manifest.get("branch") != "main":
              raise SystemExit("manual-record owner bundle targets another branch")
          if manifest.get("baseCommit") != "2ba19d2103b4e19051b25cd176aebd05bee0d1c1":
              raise SystemExit("manual-record owner bundle has an unexpected base commit")
          files = manifest.get("files")
          if not isinstance(files, list) or len(files) != 35:
              raise SystemExit("manual-record owner bundle file inventory is invalid")

          for item in files:
              if not isinstance(item, dict):
                  raise SystemExit("manual-record owner bundle file entry is invalid")
              relative = item.get("path")
              expected_size = item.get("size")
              expected_digest = item.get("sha256")
              if not isinstance(relative, str) or not relative or relative.startswith("/"):
                  raise SystemExit("manual-record owner bundle path is invalid")
              source = (bundle / "files" / relative).resolve()
              if not source.is_relative_to((bundle / "files").resolve()) or not source.is_file():
                  raise SystemExit(f"manual-record owner source is missing: {relative}")
              payload = source.read_bytes()
              actual_digest = hashlib.sha256(payload).hexdigest()
              if len(payload) != expected_size or actual_digest != expected_digest:
                  raise SystemExit(f"manual-record owner file identity mismatch: {relative}")
              target = (repository / relative).resolve()
              if not target.is_relative_to(repository):
                  raise SystemExit(f"manual-record owner target escaped repository: {relative}")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
          PY
          rm .github/workflows/apply-manual-record-owner.yml
          rm .github/apply/manual-record-owner.tar.xz.b64.part-*
          rmdir .github/apply
          git diff --check

      - name: Verify canonical manual-record owner
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check . --output-format=github
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          docker build \
            --file deploy/docker/manual-import-worker.Dockerfile \
            --tag data-collection-platform/manual-import-worker:manual-record-proof \
            .

      - name: Commit production owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Feature (Manual Import): execute canonical record work"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
