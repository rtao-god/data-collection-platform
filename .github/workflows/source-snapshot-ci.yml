name: Export Current Source Snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/source-snapshot-ci.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v6

      - name: Package exact source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude='**/__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.mypy_cache' \
            --exclude='.ruff_cache' \
            -czf /tmp/data-collection-platform-source.tar.gz .
          sha256sum /tmp/data-collection-platform-source.tar.gz \
            > /tmp/data-collection-platform-source.tar.gz.sha256

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: current-source-snapshot
          path: |
            /tmp/data-collection-platform-source.tar.gz
            /tmp/data-collection-platform-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Publish workflow run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json
          import os

          repository = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          print(json.dumps({
              'state': 'success',
              'context': 'diagnostics/current-source-snapshot',
              'description': f'current-source-snapshot run {run_id}',
              'target_url': f'https://github.com/{repository}/actions/runs/{run_id}',
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" \
            > /tmp/status-response.json
