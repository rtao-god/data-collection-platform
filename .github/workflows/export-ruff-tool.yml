name: Export Ruff Tool

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-ruff-tool.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Stage Ruff binary
        run: |
          mkdir -p .artifact
          cp .venv/bin/ruff .artifact/ruff
          chmod +x .artifact/ruff

      - name: Upload Ruff binary
        uses: actions/upload-artifact@v4
        with:
          name: data-collection-platform-ruff
          path: .artifact/ruff
          retention-days: 1
