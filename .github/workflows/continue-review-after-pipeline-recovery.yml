name: Continue Review After Pipeline Recovery

on:
  workflow_run:
    workflows:
      - "Reconcile Pipeline Foundation V6"
      - "Reconcile Pipeline Foundation V7"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  continue:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch bounded Review Web materializer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/materialize-review-web-after-pipeline.yml/dispatches" \
            -d '{"ref":"main"}' >/dev/null
