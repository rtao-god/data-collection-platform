name: Materialize Validated Berlin Source Inputs

on:
  workflow_run:
    workflows:
      - Materialize Authoritative Berlin Boundary
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-berlin-source-inputs
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Prove source-input selector
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check \
            tools/live_collection/select_source_inputs.py \
            tools/live_collection/tests/test_select_source_inputs.py
          uv run ruff check \
            tools/live_collection/select_source_inputs.py \
            tools/live_collection/tests/test_select_source_inputs.py
          uv run pytest -q tools/live_collection/tests/test_select_source_inputs.py

      - name: Select exact OSM and official HTTP owners
        run: uv run python tools/live_collection/select_source_inputs.py --repository-root "$GITHUB_WORKSPACE"

      - name: Revalidate complete campaign snapshot
        run: uv run collector config validate berlin_recording_services

      - name: Commit validated source inputs
        shell: bash
        run: |
          set -euo pipefail
          git add campaigns/berlin_recording_services
          git diff --cached --check
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if git diff --cached --quiet; then
            echo 'Berlin source inputs are already current.'
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Data (Sources): enable bounded Berlin acquisition inputs"
          git push origin HEAD:main
