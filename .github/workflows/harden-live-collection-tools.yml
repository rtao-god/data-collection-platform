name: Harden Live Collection Tools

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-live-collection-tools.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-live-tool-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply fail-closed persistent-evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          selector = Path("tools/live_collection/select_source_inputs.py")
          text = selector.read_text(encoding="utf-8")
          old = '''            if any(
                token in lowered
                for token in (
                    "max_active",
                    "max_concurrency",
                    "requests_per_second",
                    "rate_per_second",
                    "minimum_interval",
                )
            ):
                bounded += 1
'''
          new = '''            if (
                isinstance(item, (int, float))
                and not isinstance(item, bool)
                and any(
                    token in lowered
                    for token in (
                        "max_active",
                        "max_concurrency",
                        "requests_per_second",
                        "rate_per_second",
                        "minimum_interval",
                    )
                )
            ):
                bounded += 1
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError("bounded source-budget anchor is missing")
          selector.write_text(text, encoding="utf-8")

          runner = Path("tools/live_collection/run_bounded_live_proof.py")
          text = runner.read_text(encoding="utf-8")
          control_start = text.index("def _control_api_url(")
          control_end = text.index("\n\ndef _wait_for_openapi", control_start)
          control = '''def _control_api_url(config: Mapping[str, Any]) -> str:
    _, service = _select_service(config, "control", "api")
    ports = _published_ports(service)
    if not ports:
        raise LiveProofError("Control API has no published host port")
    return f"http://127.0.0.1:{ports[0]}"
'''
          text = text[:control_start] + control + text[control_end:]

          database_start = text.index("def _database_url(")
          database_end = text.index("\n\ndef _count", database_start)
          database = '''def _database_url(config: Mapping[str, Any]) -> str:
    services = config.get("services")
    if not isinstance(services, Mapping):
        raise LiveProofError("Compose services are missing")
    _, postgres = _select_service(config, "postgres")
    published = _published_ports(postgres)
    host_port = published[0] if published else 5432
    for value in services.values():
        if not isinstance(value, Mapping):
            continue
        environment = value.get("environment")
        if not isinstance(environment, Mapping):
            continue
        database_url = environment.get("COLLECTOR_DATABASE_URL")
        if not isinstance(database_url, str) or not database_url:
            continue
        return re.sub(
            r"@[^:/]+:\\d+/",
            f"@127.0.0.1:{host_port}/",
            database_url,
        )
    environment_url = os.getenv("COLLECTOR_DATABASE_URL")
    if environment_url:
        return re.sub(
            r"@[^:/]+:\\d+/",
            f"@127.0.0.1:{host_port}/",
            environment_url,
        )
    raise LiveProofError("Compose exposes no collector database URL")
'''
          text = text[:database_start] + database + text[database_end:]

          count_end = text.index("\n\ndef _candidate_count", text.index("def _count("))
          raw_helper = '''

def _raw_artifact_count(connection: sa.Connection) -> int:
    metadata = sa.MetaData()
    records = sa.Table(
        "artifact_records",
        metadata,
        schema="sources",
        autoload_with=connection,
    )
    objects = sa.Table(
        "artifact_objects",
        metadata,
        schema="sources",
        autoload_with=connection,
    )
    return int(
        connection.scalar(
            sa.select(sa.func.count())
            .select_from(records.join(objects, records.c.object_id == objects.c.object_id))
            .where(objects.c.artifact_kind == "raw_artifact")
        )
        or 0
    )
'''
          if "def _raw_artifact_count(" not in text:
              text = text[:count_end] + raw_helper + text[count_end:]

          text = text.replace(
              '            raw_artifacts = _count(connection, "sources", "artifact_records")\n',
              "            raw_artifacts = _raw_artifact_count(connection)\n",
              1,
          )
          text = text.replace(
              '            state = owner.c.get("state") or owner.c.get("status")\n',
              '            state = owner.c.get("state")\n'
              '            if state is None:\n'
              '                state = owner.c.get("status")\n',
              1,
          )
          runner.write_text(text, encoding="utf-8")
          PY

      - name: Restore and prove exact tooling owners
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          uv run ruff format tools/live_collection
          uv run ruff check --fix tools/live_collection
          uv run ruff format tools/live_collection
          uv run ruff check tools/live_collection
          uv run pytest -q tools/live_collection/tests
          uv run mypy \
            tools/live_collection/berlin_boundary.py \
            tools/live_collection/select_source_inputs.py \
            tools/live_collection/run_bounded_live_proof.py
          uv run python -m compileall -q tools/live_collection

      - name: Commit only proven tool owners
        shell: bash
        run: |
          set -euo pipefail
          git add tools/live_collection
          git diff --cached --check
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if git diff --cached --quiet; then
            echo 'Live collection tools are already hardened.'
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Live collection): require exact persistent evidence"
          git push origin HEAD:main
