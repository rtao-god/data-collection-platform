name: Finalize Stage 7 Exact Head

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage7-resolution-quality-finalize2-20260814.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage7-resolution-finalize2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 80

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Prove Stage 7 exact subject
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/resolution_contracts/src/resolution_contracts/contracts.py
          test -f packages/entity_resolution_core/src/entity_resolution_core/engine.py
          test -f packages/quality_core/src/quality_core/evaluation.py
          test -f contracts/resolution/manifest.json
          uv sync --frozen --all-packages --dev
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/resolution_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest packages/resolution_contracts/tests packages/entity_resolution_core/tests packages/quality_core/tests tools/resolution_contract_generation/tests
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

      - name: Record exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/stage7-resolution-quality-ci.md <<EOF
          # Stage 7 resolution and quality CI proof

          - Status: proven
          - Repository: rtao-god/data-collection-platform
          - Branch: main
          - Subject commit: \`$GITHUB_SHA\`
          - Exact-head finalizer run: \`$GITHUB_RUN_ID\`
          - Event: \`$GITHUB_EVENT_NAME\`

          The exact subject passed frozen workspace restore, lock consistency,
          base and Stage 7 generated-contract drift checks, Ruff formatting and lint,
          strict mypy, focused resolution/quality tests, the complete non-integration
          suite, fail-closed dependency checks, and Python compilation.

          Proven owners:

          - \`resolution_contracts\` owns deterministic pair, cluster, batch, and quality wire identities;
          - \`entity_resolution_core\` owns evidence-based pair decisions,
            transitivity-safe clustering, and reversible split lineage;
          - \`quality_core\` owns fail-closed quality and export eligibility.

          Candidate persistence, review workflow, Control API, and sealed export remain
          downstream owners and are not claimed by this proof.
          EOF
          git add docs/proofs/stage7-resolution-quality-ci.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Proofs): record Stage 7 exact-head CI"
          git push origin HEAD:main
