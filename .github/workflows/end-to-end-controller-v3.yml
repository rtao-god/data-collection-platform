name: End-to-End Closure Controller V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/end-to-end-controller-v3.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-end-to-end-controller-v3
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Close exact dependency chain
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          mutators='[
            "Commit Pipeline Owner Production Patch",
            "Fix Pipeline Catalog Types",
            "Export Pipeline Owner API",
            "Fix Pipeline Metadata Composition",
            "Harden Pipeline Metadata Parity",
            "Finalize Pipeline Advancement Owner",
            "Restore Operational E2E V3",
            "Download and Persistence E2E V3"
          ]'

          refresh() {
            git fetch origin main
            git reset --hard origin/main
          }

          wait_idle() {
            for _ in $(seq 1 720); do
              payload="$(curl -fsSL "${headers[@]}" \
                "$api/actions/runs?branch=main&per_page=100")"
              active="$(jq --argjson names "$mutators" \
                '[.workflow_runs[] | select(.name as $name | $names | index($name)) |
                  select(.status != "completed")] | length' <<<"$payload")"
              [[ "$active" == 0 ]] && return 0
              sleep 10
            done
            return 1
          }

          dispatch_wait() {
            local workflow="$1"
            local started payload run_id status conclusion
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            curl -fsSL -X POST "${headers[@]}" \
              "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
            for _ in $(seq 1 720); do
              payload="$(curl -fsSL "${headers[@]}" \
                "$api/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=30")"
              run_id="$(jq -r --arg started "$started" \
                '.workflow_runs[] | select(.created_at >= $started) | .id' \
                <<<"$payload" | head -1)"
              status="$(jq -r --arg started "$started" \
                '.workflow_runs[] | select(.created_at >= $started) | .status' \
                <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg started "$started" \
                '.workflow_runs[] | select(.created_at >= $started) | .conclusion' \
                <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == completed ]]; then
                printf '%s\t%s\n' "$run_id" "$conclusion"
                return 0
              fi
              sleep 10
            done
            printf '%s\ttimeout\n' "${run_id:-unknown}"
          }

          pipeline_proven() {
            test -f docs/proofs/pipeline-advancement-ci.md \
              && grep -Fq -- '- Status: proven' docs/proofs/pipeline-advancement-ci.md
          }

          operational_complete() {
            local path
            for path in \
              apps/review_web/package-lock.json \
              apps/browser_worker/pyproject.toml \
              packages/export_core/src/export_core/service.py \
              apps/retention_job/pyproject.toml \
              apps/orchestrator/pyproject.toml \
              tools/operations/backup_restore.py \
              deploy/compose/application.yaml; do
              test -f "$path" || return 1
            done
          }

          data_flow_proven() {
            test -f docs/proofs/download-persistence-e2e-ci.md \
              && grep -Fq -- '- Status: proven' \
                docs/proofs/download-persistence-e2e-ci.md
          }

          run_gate() {
            local workflow="$1"
            local name="$2"
            dispatch_wait "$workflow" > "$RUNNER_TEMP/$name.tsv"
            wait_idle
            refresh
          }

          wait_idle
          refresh

          if ! pipeline_proven; then
            run_gate commit-pipeline-owner-production.yml production
            run_gate fix-pipeline-catalog-types.yml catalog-types
            run_gate export-pipeline-owner-api.yml public-api
            run_gate fix-pipeline-metadata-composition.yml metadata-composition
            run_gate harden-pipeline-metadata.yml metadata-parity
            run_gate pipeline-owner-finalize.yml pipeline-finalizer
          fi

          if pipeline_proven && ! operational_complete; then
            run_gate restore-operational-e2e-v3.yml operational-restore
          fi

          if pipeline_proven && operational_complete && ! data_flow_proven; then
            run_gate data-flow-e2e-ci-v3.yml data-flow
          fi

          mkdir -p docs/proofs docs/diagnostics
          current_head="$(git rev-parse HEAD)"
          if pipeline_proven && operational_complete && data_flow_proven; then
            cat > docs/proofs/end-to-end-operational-ci.md <<EOF
          # End-to-end operational CI proof

          - Status: proven
          - Repository: rtao-god/data-collection-platform
          - Branch: main
          - Verified tree head: \`$current_head\`
          - Controller: End-to-End Closure Controller V3
          - Controller run: \`${{ github.run_id }}\`

          ## Proven product path

          - successful work is advanced through one durable canonical pipeline checkpoint;
          - the production tree contains review web, isolated browser acquisition, deterministic sealed export, retention, orchestration, backup/restore, and complete application Compose owners;
          - a deterministic HTTP source is downloaded and its response is persisted as immutable raw bytes through the canonical S3-compatible object path with digest, size, PostgreSQL metadata, work ownership, and lineage verification;
          - external production Berlin geography and source approvals remain explicit readiness inputs and were not fabricated.
          EOF
            rm -f docs/diagnostics/end-to-end-controller-v3-latest.md
          else
            {
              echo '# End-to-end controller V3 state'
              echo
              echo "- main HEAD: \`$current_head\`"
              echo "- pipeline proof: \`$(pipeline_proven && echo true || echo false)\`"
              echo "- operational inventory: \`$(operational_complete && echo true || echo false)\`"
              echo "- download/persistence proof: \`$(data_flow_proven && echo true || echo false)\`"
              echo
              echo '## Gate results'
              echo
              for result in "$RUNNER_TEMP"/*.tsv; do
                test -f "$result" || continue
                read -r run_id conclusion < "$result"
                echo "- \`$(basename "$result" .tsv)\`: run \`$run_id\`, \`$conclusion\`"
              done
            } > docs/diagnostics/end-to-end-controller-v3-latest.md
          fi

      - name: Publish exact closure state
        shell: bash
        run: |
          set -euo pipefail
          git add docs/proofs/end-to-end-operational-ci.md \
            docs/diagnostics/end-to-end-controller-v3-latest.md 2>/dev/null || true
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if git diff --cached --name-only | grep -Fq \
            docs/proofs/end-to-end-operational-ci.md; then
            message='Docs (Proofs): close operational E2E'
          else
            message='Docs (Diagnostics): record E2E V3 state'
          fi
          git commit -m "$message"
          git fetch origin main
          if test "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)"; then
            git reset --soft origin/main
            git commit -m "$message"
          fi
          git push origin HEAD:main
