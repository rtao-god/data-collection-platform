name: Pipeline Production Closure Controller

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pipeline-production-controller.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-pipeline-production-controller
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch and inspect production closure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )

          dispatch_and_wait() {
            local workflow="$1"
            local output="$2"
            local started_at run_id status conclusion payload
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            curl -fsSL -X POST "${headers[@]}" \
              "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
            run_id=''
            for _ in $(seq 1 360); do
              payload="$(curl -fsSL "${headers[@]}" \
                "$api/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=30")"
              run_id="$(jq -r --arg started "$started_at" \
                '.workflow_runs[] | select(.created_at >= $started) | .id' \
                <<<"$payload" | head -1)"
              status="$(jq -r --arg started "$started_at" \
                '.workflow_runs[] | select(.created_at >= $started) | .status' \
                <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg started "$started_at" \
                '.workflow_runs[] | select(.created_at >= $started) | .conclusion' \
                <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == completed ]]; then
                printf '%s\t%s\n' "$run_id" "$conclusion" > "$output"
                return 0
              fi
              sleep 10
            done
            printf '%s\t%s\n' "$run_id" timeout > "$output"
          }

          diagnose_run() {
            local run_id="$1"
            local label="$2"
            local jobs failed_job failed_step log_file
            jobs="$(curl -fsSL "${headers[@]}" "$api/actions/runs/$run_id/jobs?per_page=100")"
            failed_job="$(jq -r '.jobs[] | select(.conclusion == "failure") | .id' \
              <<<"$jobs" | head -1)"
            failed_step="$(jq -r '.jobs[] | select(.conclusion == "failure") |
              .steps[] | select(.conclusion == "failure") | .name' \
              <<<"$jobs" | head -1)"
            mkdir -p docs/diagnostics
            log_file="$RUNNER_TEMP/$label.log"
            if [[ -n "$failed_job" ]]; then
              curl -fsSL -L "${headers[@]}" \
                "$api/actions/jobs/$failed_job/logs" > "$log_file" || true
            else
              : > "$log_file"
            fi
            {
              echo "# $label failure"
              echo
              echo "- run: \`$run_id\`"
              echo "- failed job: \`${failed_job:-unknown}\`"
              echo "- failed step: \`${failed_step:-unknown}\`"
              echo
              echo '```text'
              tail -n 240 "$log_file"
              echo '```'
            } > "docs/diagnostics/$label-latest.md"
          }

          dispatch_and_wait commit-pipeline-owner-production.yml \
            "$RUNNER_TEMP/production-result.tsv"
          read -r production_id production_result \
            < "$RUNNER_TEMP/production-result.tsv"

          if [[ "$production_result" != success ]]; then
            diagnose_run "$production_id" pipeline-production-patch
          else
            git fetch origin main
            git reset --hard origin/main
            dispatch_and_wait pipeline-owner-finalize.yml \
              "$RUNNER_TEMP/finalizer-result.tsv"
            read -r finalizer_id finalizer_result \
              < "$RUNNER_TEMP/finalizer-result.tsv"
            if [[ "$finalizer_result" != success ]]; then
              diagnose_run "$finalizer_id" pipeline-owner-finalizer
            else
              git fetch origin main
              git reset --hard origin/main
              if test -f docs/proofs/pipeline-advancement-ci.md; then
                dispatch_and_wait restore-operational-e2e.yml \
                  "$RUNNER_TEMP/restore-result.tsv"
                read -r restore_id restore_result \
                  < "$RUNNER_TEMP/restore-result.tsv"
                if [[ "$restore_result" != success ]]; then
                  diagnose_run "$restore_id" operational-e2e-restore
                fi
              fi
            fi
          fi

      - name: Publish exact diagnostics
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docs/diagnostics/*-latest.md)
          if [[ "${#files[@]}" -eq 0 ]]; then
            exit 0
          fi
          git add "${files[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Diagnostics): record production closure failure"
          git fetch origin main
          if test "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)"; then
            git reset --soft origin/main
            git commit -m "Docs (Diagnostics): record production closure failure"
          fi
          git push origin HEAD:main
