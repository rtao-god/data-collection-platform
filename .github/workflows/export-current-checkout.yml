name: Export Current Checkout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-current-checkout.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository
        uses: actions/checkout@v6

      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv --exclude='**/__pycache__' -czf "$RUNNER_TEMP/repository.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: exact-stage6-source
          path: ${{ runner.temp }}/repository.tar.gz
          if-no-files-found: error
          retention-days: 1
