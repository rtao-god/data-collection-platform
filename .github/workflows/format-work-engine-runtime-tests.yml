name: Format Work Engine Runtime Tests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-work-engine-runtime-tests.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Apply and verify canonical formatting
        run: |
          uv run ruff format database/tests/test_postgres_work_engine_runtime.py
          uv run ruff format --check database/tests/test_postgres_work_engine_runtime.py
          uv run ruff check database/tests/test_postgres_work_engine_runtime.py

      - name: Commit formatter output
        run: |
          if git diff --quiet -- database/tests/test_postgres_work_engine_runtime.py; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add database/tests/test_postgres_work_engine_runtime.py
          git commit -m "Style (Work): format PostgreSQL runtime proof" \
            -m "Owner layer: PostgreSQL Work Engine integration verification." \
            -m "Root cause: one RowMapping helper differed from the pinned Ruff formatter while every runtime scenario already passed." \
            -m "Replacement: apply only canonical formatting to the runtime test file." \
            -m "Proof target: permanent formatting, lint, typing, unit, architecture, image, and PostgreSQL migration gates."
          git push origin HEAD:main
