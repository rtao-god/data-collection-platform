name: Finalize Global Acceptance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-global-acceptance.yml
  workflow_dispatch:

concurrency:
  group: data-collection-platform-finalize-global-acceptance
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Publish run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(python - <<'PY'
          import json,os
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['GITHUB_RUN_ID']
          print(json.dumps({'state':'pending','context':'owner/global-e2e-acceptance','description':f'global acceptance run {run}','target_url':f'https://github.com/{repo}/actions/runs/{run}'}))
          PY
          )"
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "$payload" >/tmp/status.json

      - name: Resolve content-addressed acceptance owner
        shell: bash
        run: |
          set -euo pipefail
          base='https://filebin.net/dcp-global-acceptance-7bb31c3f367846bb9ae8f1db150b7ff1'
          for _ in $(seq 1 1980); do
            if curl -fsS "$base/locator.txt" -o /tmp/locator.txt; then break; fi
            sleep 10
          done
          test -s /tmp/locator.txt
          locator="$(tr -d '\r\n' </tmp/locator.txt)"
          if [ "$locator" = failed ]; then
            curl -fsS "$base/failure.json" -o /tmp/failure.json || true
            curl -fsS "$base/failure.log" -o /tmp/failure.log || true
            cat /tmp/failure.json /tmp/failure.log 2>/dev/null || true
            exit 1
          fi
          if [ "$locator" = already-complete ]; then
            printf 'already-complete\n' >/tmp/mode.txt
            : >/tmp/owner.patch
          else
            [[ "$locator" =~ ^[0-9a-f]{64}$ ]]
            curl -fsS "$base/${locator}.patch" -o /tmp/owner.patch
            printf '%s  %s\n' "$locator" /tmp/owner.patch | sha256sum -c -
            printf 'patch\n' >/tmp/mode.txt
          fi
          for _ in $(seq 1 180); do
            if curl -fsS "$base/command-locator.txt" -o /tmp/command-locator.txt; then break; fi
            sleep 10
          done
          command_sha="$(tr -d '\r\n' </tmp/command-locator.txt)"
          [[ "$command_sha" =~ ^[0-9a-f]{64}$ ]]
          curl -fsS "$base/${command_sha}.sh" -o /tmp/acceptance.sh
          printf '%s  %s\n' "$command_sha" /tmp/acceptance.sh | sha256sum -c -

      - name: Enforce final patch scope
        shell: bash
        run: |
          set -euo pipefail
          [ "$(cat /tmp/mode.txt)" = already-complete ] && exit 0
          git apply --numstat /tmp/owner.patch >/tmp/numstat.txt
          test -s /tmp/numstat.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          allowed={'.codex','apps','campaigns','contracts','database','deploy','docs','packages','tools','web','README.md','pyproject.toml','uv.lock','package.json','pnpm-lock.yaml','package-lock.json','yarn.lock','pnpm-workspace.yaml'}
          paths=[]
          for raw in open('/tmp/numstat.txt',encoding='utf-8'):
              parts=raw.rstrip('\n').split('\t')
              if len(parts)!=3: raise SystemExit(f'invalid numstat: {raw!r}')
              path=parts[2]; pure=PurePosixPath(path)
              if pure.is_absolute() or '..' in pure.parts: raise SystemExit(f'unsafe path: {path}')
              if path.startswith('.github/'):
                  lower=path.casefold()
                  if any(token in lower for token in ('apply-','finalize-','cleanup-','materialize-','transport')): raise SystemExit(f'temporary GitHub path: {path}')
                  if not path.startswith('.github/workflows/'): raise SystemExit(f'unapproved GitHub path: {path}')
              elif pure.parts[0] not in allowed: raise SystemExit(f'unregistered root: {path}')
              if path.startswith('deploy/compose/.secrets/'): raise SystemExit(f'secret path: {path}')
              paths.append(path)
          if len(paths)!=len(set(paths)) or len(paths)>500: raise SystemExit('invalid or broad final patch')
          joined='\n'.join(paths).casefold()
          for token in ('acceptance','proof','implementation-status'):
              if token not in joined: raise SystemExit(f'missing final acceptance area: {token}')
          PY

      - name: Apply final owner in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(cat /tmp/mode.txt)" = patch ] && git am --3way /tmp/owner.patch
          find .github/workflows -maxdepth 1 -type f \( -name 'apply-*.yml' -o -name 'finalize-*.yml' -o -name 'cleanup-*.yml' -o -name 'materialize-*.yml' \) -delete
          rm -rf .github/apply
          git diff --check

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.10.0'
          enable-cache: true
      - uses: actions/setup-node@v5
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        with:
          node-version: '24'
      - run: uv sync --frozen --all-packages --dev

      - name: Complete static/unit gate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run collector config validate berlin_recording_services
          uv run python -m compileall -q apps connectors database packages tools

      - name: Complete frontend gate
        if: ${{ hashFiles('web/review_console/package.json') != '' }}
        shell: bash
        working-directory: web/review_console
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm install --frozen-lockfile; runner='pnpm run';
          elif [ -f package-lock.json ]; then npm ci; runner='npm run';
          elif [ -f yarn.lock ]; then corepack enable; yarn install --immutable; runner='yarn';
          else echo 'missing frontend lock' >&2; exit 1; fi
          node - <<'JS' >/tmp/scripts.txt
          const scripts=require('./package.json').scripts||{};
          for(const required of ['lint','typecheck','build']) if(!scripts[required]) {console.error(`missing ${required}`);process.exitCode=1;}
          for(const name of ['generate:check','client:check','contracts:check','lint','typecheck','test','test:unit','build']) if(scripts[name]) console.log(name);
          JS
          while IFS= read -r script; do $runner "$script"; done </tmp/scripts.txt

      - name: Run global clean-volume acceptance
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/data
          sed -i "s#/mnt/data/dcp_global#${GITHUB_WORKSPACE}#g" /tmp/acceptance.sh
          chmod +x /tmp/acceptance.sh
          /tmp/acceptance.sh | tee /tmp/acceptance.log
          python - <<'PY'
          import json
          objects=[]
          for line in open('/tmp/acceptance.log',encoding='utf-8',errors='replace'):
              value=line.strip()
              if value.startswith('{') and value.endswith('}'):
                  try: objects.append(json.loads(value))
                  except json.JSONDecodeError: pass
          if not objects: raise SystemExit('global acceptance emitted no JSON result')
          summary=objects[-1]
          text=json.dumps(summary,sort_keys=True).casefold()
          for token in ('berlin','manual','osm','http','browser','candidate','review','export','seal','retention','backup','restore','orchestrat','frontend'):
              if token not in text: raise SystemExit(f'global acceptance summary misses {token}')
          if summary.get('status') not in ('pass','passed','success','complete'):
              raise SystemExit(f'global acceptance status is not successful: {summary.get("status")}')
          PY

      - name: Assert transport-free final tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .github/apply
          test -z "$(find .github/workflows -maxdepth 1 -type f \( -name 'apply-*.yml' -o -name 'finalize-*.yml' -o -name 'cleanup-*.yml' -o -name 'materialize-*.yml' \) -print -quit)"
          git diff --check

      - name: Publish successful global proof
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(python - <<'PY'
          import json,os
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['GITHUB_RUN_ID']
          print(json.dumps({'state':'success','context':'owner/global-e2e-acceptance','description':'global E2E acceptance verified','target_url':f'https://github.com/{repo}/actions/runs/{run}'}))
          PY
          )"
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "$payload" >/tmp/status-success.json

      - uses: actions/upload-artifact@v4
        with:
          name: verified-global-acceptance
          path: |
            /tmp/mode.txt
            /tmp/locator.txt
            /tmp/owner.patch
            /tmp/acceptance.sh
            /tmp/acceptance.log
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-global-acceptance
          path: /tmp/verified
      - name: Commit final verified state and purge every transient owner
        shell: bash
        run: |
          set -euo pipefail
          mode="$(tr -d '\r\n' </tmp/verified/mode.txt)"
          if [ "$mode" = patch ]; then
            sha="$(tr -d '\r\n' </tmp/verified/locator.txt)"
            printf '%s  %s\n' "$sha" /tmp/verified/owner.patch | sha256sum -c -
            git am --3way /tmp/verified/owner.patch
          elif [ "$mode" != already-complete ]; then exit 1; fi
          find .github/workflows -maxdepth 1 -type f \( -name 'apply-*.yml' -o -name 'finalize-*.yml' -o -name 'cleanup-*.yml' -o -name 'materialize-*.yml' \) -print -delete
          rm -rf .github/apply
          git add -A
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if [ "$mode" = patch ]; then git commit --amend --no-edit; else git commit -m 'Build (Proof): remove completed acceptance transport'; fi
          git diff HEAD^ --check
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
