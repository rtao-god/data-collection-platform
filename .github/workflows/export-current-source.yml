name: Export Current Source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-current-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Package exact checkout
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=.pytest_cache \
            --exclude=.mypy_cache \
            --exclude=.ruff_cache \
            -czf data-collection-platform-source.tar.gz .
          git rev-parse HEAD > source-head.txt

      - name: Upload exact checkout
        uses: actions/upload-artifact@v7
        with:
          name: data-collection-platform-source
          path: |
            data-collection-platform-source.tar.gz
            source-head.txt
          if-no-files-found: error
          retention-days: 1
