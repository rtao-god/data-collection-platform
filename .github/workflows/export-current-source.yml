name: Export Current Source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-current-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
      - name: Package exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > source-head.txt
          tar --exclude=.git --exclude=current-source.tar.gz -czf current-source.tar.gz .
      - name: Upload exact source tree
        uses: actions/upload-artifact@v7
        with:
          name: current-source
          path: |
            current-source.tar.gz
            source-head.txt
          if-no-files-found: error
          retention-days: 1
