name: Finalize Reconciled Baseline CI

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: data-collection-platform-baseline-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Finalize only an exact successful proof
        if: github.event.workflow_run.conclusion == 'success'
        shell: bash
        env:
          VERIFIED_HEAD: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          current_head="$(git rev-parse HEAD)"
          test "$current_head" = "$VERIFIED_HEAD"
          test -f docs/proofs/reconciled-baseline.md
          mkdir -p docs/proofs
          cat > docs/proofs/reconciled-baseline-ci.md <<EOF
          # Reconciled baseline permanent CI proof

          - workflow: \`Verify\`
          - conclusion: \`success\`
          - verified head: \`${VERIFIED_HEAD}\`
          - workflow run: \`${VERIFIED_RUN}\`
          EOF

      - name: Remove finalizer and transient automation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            ! -name ci.yml \
            ! -name finalize-reconciled-baseline-ci.yml \
            -print0 | xargs -0 -r git rm -f
          git rm -f --ignore-unmatch .github/workflows/finalize-reconciled-baseline-ci.yml
          find .codex -maxdepth 1 -type f \
            \( -name '*.py' -o -name '*probe*' -o -name 'ci-trigger*' \) \
            -print0 | xargs -0 -r git rm -f
          rm -rf .codex/payloads
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -f docs/proofs/reconciled-baseline-ci.md ]; then
            git commit -m 'CI (Baseline): finalize permanent repository proof'
          else
            git commit -m 'Build (Tooling): remove unsuccessful baseline finalizer'
          fi
          git push origin HEAD:main
