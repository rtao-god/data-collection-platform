name: Finalize Reconciled Baseline CI

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: data-collection-platform-baseline-ci-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Record exact successful proof
        if: github.event.workflow_run.conclusion == 'success'
        shell: bash
        env:
          VERIFIED_HEAD: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD"
          test -f docs/proofs/reconciled-baseline.md
          mkdir -p docs/proofs
          cat > docs/proofs/reconciled-baseline-ci.md <<EOF
          # Reconciled baseline permanent CI proof

          - workflow: \`Verify\`
          - conclusion: \`success\`
          - verified head: \`${VERIFIED_HEAD}\`
          - workflow run: \`${VERIFIED_RUN}\`
          EOF

      - name: Remove finalizer and commit exact result
        if: always()
        shell: bash
        env:
          VERIFY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/finalize-reconciled-baseline-ci.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -f docs/proofs/reconciled-baseline-ci.md ]; then
            git commit -m 'CI (Baseline): finalize exact-head proof'
          else
            git commit -m 'Build (Tooling): remove unsuccessful baseline finalizer'
          fi
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
