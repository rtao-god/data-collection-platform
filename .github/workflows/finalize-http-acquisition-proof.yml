name: Finalize HTTP Acquisition Proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-http-acquisition-proof.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-http-acquisition-proof
  cancel-in-progress: false

jobs:
  prove-and-record:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Prove Stage 5 owner
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/http_worker/pyproject.toml
          test -f connectors/official_website_http/pyproject.toml
          test -f deploy/docker/http-worker.Dockerfile
          test -f tools/http_acquisition_contract_generation/generate.py
          test -f contracts/http_acquisition/manifest.json

          uv sync --frozen --all-packages --dev
          uv lock --check
          uv run python tools/http_acquisition_contract_generation/generate.py --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          docker build --tag data-collection-platform/http-worker:proof --file deploy/docker/http-worker.Dockerfile .

          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/http-worker:proof)" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' data-collection-platform/http-worker:proof)" = "http-worker"
          docker run --rm -i --entrypoint python data-collection-platform/http-worker:proof - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          for name in (
              "http_worker",
              "official_website_http",
              "source_connector_sdk",
              "scrapy",
          ):
              import_module(name)

          forbidden = {
              "alembic",
              "boto3",
              "botocore",
              "playwright",
              "psycopg",
              "sqlalchemy",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit("forbidden HTTP worker dependencies: " + ", ".join(present))
          PY

      - name: Record immutable CI proof
        shell: bash
        env:
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_SUBJECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/http-acquisition-ci.md <<EOF
          # Official website HTTP acquisition CI proof

          - Status: proven
          - Repository: rtao-god/data-collection-platform
          - Branch: main
          - Subject commit: ${PROOF_SUBJECT_SHA}
          - Workflow: Finalize HTTP Acquisition Proof
          - Run: ${PROOF_RUN_ID}
          - Conclusion: success

          The exact subject commit passed frozen workspace restore, both generated-contract drift checks, Ruff, strict mypy, the full non-integration suite, fail-closed dependency checks, Python compilation, HTTP worker image build, non-root/entrypoint validation, required-module validation, and forbidden database/S3/browser dependency inventory.
          EOF
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add docs/proofs/http-acquisition-ci.md
          git commit -m "Docs (Proofs): record HTTP acquisition CI"
          git push origin HEAD:main
