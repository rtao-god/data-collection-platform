name: Reconcile Operational Production Tree V4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-operational-production-v4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-operational-production-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Recover the most coherent historical operational tree
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          python - "$current_sha" <<'PY'
          from __future__ import annotations

          import subprocess
          import sys
          from pathlib import Path

          current_sha = sys.argv[1]
          required = (
              "apps/pipeline_supervisor/pyproject.toml",
              "apps/review_web/package-lock.json",
              "apps/browser_worker/pyproject.toml",
              "packages/export_core/src/export_core/service.py",
              "apps/retention_job/pyproject.toml",
              "apps/orchestrator/pyproject.toml",
              "tools/operations/backup_restore.py",
              "deploy/compose/application.yaml",
          )

          def git(*args: str, check: bool = True) -> str:
              result = subprocess.run(
                  ("git", *args),
                  check=check,
                  text=True,
                  capture_output=True,
              )
              return result.stdout.strip()

          candidate_lines = git("rev-list", "HEAD", "--", *(str(Path(p).parents[0]) for p in required))
          candidates = [current_sha, *candidate_lines.splitlines()]
          seen: set[str] = set()
          best_sha = current_sha
          best_score = -1
          for sha in candidates:
              if not sha or sha in seen:
                  continue
              seen.add(sha)
              score = sum(
                  subprocess.run(
                      ("git", "cat-file", "-e", f"{sha}:{path}"),
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  ).returncode
                  == 0
                  for path in required
              )
              if score > best_score:
                  best_sha = sha
                  best_score = score
              if score == len(required):
                  break
          Path("/tmp/operational-best-sha").write_text(best_sha, encoding="utf-8")
          Path("/tmp/operational-best-score").write_text(str(best_score), encoding="utf-8")
          PY

          best_sha="$(cat /tmp/operational-best-sha)"
          best_score="$(cat /tmp/operational-best-score)"
          echo "Recovered operational source $best_sha with inventory score $best_score."
          test "$best_score" -ge 5

          git checkout "$best_sha" -- apps connectors packages database deploy tools contracts docs pyproject.toml uv.lock README.md || true

          preserve=(
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_application/src/collection_application/pipeline_supervision.py
            packages/collection_application/src/collection_application/run_control.py
            packages/collection_application/src/collection_application/__init__.py
            packages/collection_application/tests/test_pipeline_advancement.py
            packages/collection_application/tests/test_pipeline_supervision.py
            packages/collection_application/tests/test_run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/work_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/artifact_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py
            packages/collection_infrastructure/src/collection_infrastructure/__init__.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py
            packages/collection_infrastructure/tests/test_pipeline_run_control.py
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
            database/migrations/versions/20260815_0011_owned_artifacts.py
            database/migrations/versions/20260815_0012_run_control.py
            database/migrations/versions/20260815_0013_pipeline_advancement.py
            database/tests/test_pipeline_advancement_schema.py
            apps/control_api
            contracts/control_api
            tools/control_api_contract_generation
            docs/specifications/pipeline-advancement.md
          )
          for path in "${preserve[@]}"; do
            if git cat-file -e "$current_sha:$path" 2>/dev/null; then
              git checkout "$current_sha" -- "$path"
            fi
          done

          restore_latest_present() {
            local path="$1"
            test -e "$path" && return 0
            local sha
            while read -r sha; do
              if git cat-file -e "$sha:$path" 2>/dev/null; then
                git checkout "$sha" -- "$path"
                return 0
              fi
            done < <(git rev-list HEAD -- "$path")
            return 1
          }
          for path in \
            apps/pipeline_supervisor \
            apps/review_web \
            apps/browser_worker \
            apps/retention_job \
            apps/orchestrator \
            packages/export_contracts \
            packages/export_core \
            tools/operations \
            deploy/compose \
            deploy/docker/pipeline-supervisor.Dockerfile \
            deploy/docker/review-web.Dockerfile \
            deploy/docker/browser-worker.Dockerfile \
            deploy/docker/retention-job.Dockerfile \
            deploy/docker/orchestrator.Dockerfile; do
            restore_latest_present "$path" || true
          done

          required_now=(
            apps/pipeline_supervisor/pyproject.toml
            apps/review_web/package-lock.json
            apps/browser_worker/pyproject.toml
            packages/export_core/src/export_core/service.py
            apps/retention_job/pyproject.toml
            tools/operations/backup_restore.py
            deploy/compose/application.yaml
          )
          for path in "${required_now[@]}"; do
            test -e "$path" || { echo "Missing required operational owner: $path" >&2; exit 1; }
          done
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "best_sha=$best_sha" >> "$GITHUB_OUTPUT"

      - name: Reconcile canonical schema and workspace registries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          migration = Path("database/migrations/versions/20260815_0013_pipeline_advancement.py")
          if migration.exists():
              text = migration.read_text(encoding="utf-8")
              text = text.replace("work.work_units.work_unit_id", "work.work_units.work_id")
              migration.write_text(text, encoding="utf-8")

          metadata = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "pipeline_advancement_metadata.py"
          )
          if metadata.exists():
              text = metadata.read_text(encoding="utf-8")
              text = text.replace('sa.Column("work_unit_id", sa.Uuid(), primary_key=True)', 'sa.Column("work_id", sa.Uuid(), primary_key=True)')
              text = text.replace("_work_units.c.work_unit_id", "_work_units.c.work_id")
              metadata.write_text(text, encoding="utf-8")

          schema_test = Path("database/tests/test_pipeline_advancement_schema.py")
          if schema_test.exists():
              text = schema_test.read_text(encoding="utf-8")
              text = text.replace('assert "ON DELETE RESTRICT" in source', 'assert \'ondelete="RESTRICT"\' in source')
              schema_test.write_text(text, encoding="utf-8")

          advancement_test = Path("packages/collection_application/tests/test_pipeline_advancement.py")
          if advancement_test.exists():
              text = advancement_test.read_text(encoding="utf-8")
              text = text.replace("WorkStage.ACQUISITION", "WorkStage.DISCOVERY")
              advancement_test.write_text(text, encoding="utf-8")

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          discovered = sorted(
              str(path.parent).replace("\\", "/")
              for root in (Path("apps"), Path("connectors"), Path("packages"))
              if root.exists()
              for path in root.glob("*/pyproject.toml")
          )
          workspace_match = re.search(
              r"(?ms)^\[tool\.uv\.workspace\]\n(?P<body>.*?)(?=^\[|\Z)",
              text,
          )
          if workspace_match is None:
              raise RuntimeError("tool.uv.workspace section is missing")
          body = workspace_match.group("body")
          members_match = re.search(r"(?ms)^members\s*=\s*\[(?P<items>.*?)^\]", body)
          if members_match is None:
              raise RuntimeError("workspace members list is missing")
          existing = set(re.findall(r'"([^"]+)"', members_match.group("items")))
          rendered = "members = [\n" + "".join(
              f'  "{item}",\n' for item in sorted(existing | set(discovered))
          ) + "]"
          body = body[: members_match.start()] + rendered + body[members_match.end() :]
          text = text[: workspace_match.start("body")] + body + text[workspace_match.end("body") :]

          source_roots: list[str] = []
          for member in discovered:
              src = Path(member) / "src"
              if not src.exists():
                  continue
              for child in sorted(src.iterdir()):
                  if child.is_dir() and any(child.rglob("*.py")):
                      source_roots.append(str(child).replace("\\", "/"))
          mypy_match = re.search(r"(?ms)^\[tool\.mypy\]\n(?P<body>.*?)(?=^\[|\Z)", text)
          if mypy_match is None:
              raise RuntimeError("tool.mypy section is missing")
          body = mypy_match.group("body")
          files_match = re.search(r"(?ms)^files\s*=\s*\[(?P<items>.*?)^\]", body)
          if files_match is None:
              raise RuntimeError("mypy files list is missing")
          existing_files = set(re.findall(r'"([^"]+)"', files_match.group("items")))
          rendered_files = "files = [\n" + "".join(
              f'  "{item}",\n' for item in sorted(existing_files | set(source_roots))
          ) + "]"
          body = body[: files_match.start()] + rendered_files + body[files_match.end() :]
          text = text[: mypy_match.start("body")] + body + text[mypy_match.end("body") :]
          pyproject.write_text(text, encoding="utf-8")

          checker = Path("tools/architecture_checks/check_dependencies.py")
          needles = (
              "pipeline_supervisor",
              "browser_worker",
              "export_core",
              "retention_job",
              "orchestrator",
          )
          current = checker.read_text(encoding="utf-8")
          current_score = sum(needle in current for needle in needles)
          best_sha: str | None = None
          best_score = current_score
          commits = subprocess.check_output(
              ("git", "rev-list", "HEAD", "--", str(checker)),
              text=True,
          ).splitlines()
          for sha in commits:
              try:
                  candidate = subprocess.check_output(
                      ("git", "show", f"{sha}:{checker}"),
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue
              score = sum(needle in candidate for needle in needles)
              if score > best_score:
                  best_sha = sha
                  best_score = score
              if score == len(needles):
                  break
          if best_sha is not None:
              subprocess.run(("git", "checkout", best_sha, "--", str(checker)), check=True)
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py
          fi
          if test -f tools/control_api_contract_generation/generate.py; then
            uv run python tools/control_api_contract_generation/generate.py
          fi
          uv run ruff check . --fix --unsafe-fixes
          uv run ruff format .

          policy="$(uv run python tools/architecture_checks/check_dependencies.py --print-policy)"
          POLICY="$policy" python - <<'PY'
          from pathlib import Path
          import os

          path = Path("docs/architecture/dependency-rules.md")
          if path.exists():
              text = path.read_text(encoding="utf-8")
              start_marker = "<!-- dependency-policy:start -->"
              end_marker = "<!-- dependency-policy:end -->"
              if start_marker in text and end_marker in text:
                  start = text.index(start_marker)
                  end = text.index(end_marker, start) + len(end_marker)
                  path.write_text(
                      text[:start] + os.environ["POLICY"] + text[end:],
                      encoding="utf-8",
                  )
          PY

      - name: Prove Python, database, review, and topology owners
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py --check
          fi
          if test -f tools/control_api_contract_generation/generate.py; then
            uv run python tools/control_api_contract_generation/generate.py --check
          fi
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests

          npm --prefix apps/review_web ci
          npm --prefix apps/review_web run lint
          npm --prefix apps/review_web run typecheck --if-present
          npm --prefix apps/review_web test --if-present -- --run
          npm --prefix apps/review_web run build

          docker compose -f deploy/compose/application.yaml config --quiet

      - name: Commit coherent production tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git reset .github/workflows
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Operational production tree already reconciled."
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Recovery): reconcile coherent operational production tree"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
