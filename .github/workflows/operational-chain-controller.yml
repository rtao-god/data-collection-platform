name: Operational Chain Controller

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/operational-chain-controller.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-operational-chain-controller
  cancel-in-progress: false

jobs:
  drive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Drive first incomplete bounded stage until closure or exact failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )

          exists() {
            local path="$1"
            [[ "$(curl -sS -o /dev/null -w '%{http_code}' "${headers[@]}" "$api/contents/$path?ref=main")" == 200 ]]
          }

          dispatch_and_wait() {
            local workflow="$1"
            local started_at
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            curl -fsSL -X POST "${headers[@]}" \
              "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
            for _ in $(seq 1 900); do
              payload="$(curl -fsSL "${headers[@]}" \
                "$api/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=40")"
              run_id="$(jq -r --arg started "$started_at" \
                '.workflow_runs[] | select(.created_at >= $started) | .id' <<<"$payload" | head -1)"
              status="$(jq -r --arg started "$started_at" \
                '.workflow_runs[] | select(.created_at >= $started) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg started "$started_at" \
                '.workflow_runs[] | select(.created_at >= $started) | .conclusion' <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || {
                  echo "$workflow failed in run $run_id" >&2
                  return 1
                }
                return 0
              fi
              sleep 5
            done
            echo "$workflow timed out" >&2
            return 1
          }

          for _ in $(seq 1 12); do
            if exists docs/proofs/end-to-end-operational-ci.md; then
              git fetch origin main
              git reset --hard origin/main
              git rm -f --ignore-unmatch .github/workflows/operational-chain-controller.yml
              git config user.name rtao-god
              git config user.email rtaogod@gmail.com
              git commit -m 'Build (Tooling): remove completed operational controller'
              git push origin HEAD:main
              exit 0
            fi

            if ! exists apps/pipeline_supervisor/pyproject.toml; then
              if exists docs/diagnostics/pipeline-foundation-v7.md; then
                echo 'Pipeline V7 failed; exact diagnostic requires code correction.' >&2
                exit 1
              elif exists docs/diagnostics/reconcile-pipeline-foundation-v6.md; then
                dispatch_and_wait reconcile-pipeline-foundation-v7.yml
              elif exists docs/diagnostics/pipeline-foundation-v5.md; then
                dispatch_and_wait reconcile-pipeline-foundation-v6.yml
              else
                dispatch_and_wait reconcile-pipeline-foundation-v5.yml
              fi
              continue
            fi

            if ! exists apps/review_web/package-lock.json; then
              dispatch_and_wait materialize-review-web-after-pipeline.yml
              continue
            fi
            if ! exists apps/browser_worker/pyproject.toml; then
              dispatch_and_wait materialize-browser-worker-after-review.yml
              continue
            fi
            if ! exists packages/export_core/src/export_core/service.py; then
              dispatch_and_wait materialize-sealed-export-after-browser.yml
              continue
            fi
            if ! exists apps/retention_job/pyproject.toml \
                || ! exists apps/orchestrator/pyproject.toml \
                || ! exists tools/operations/backup_restore.py \
                || ! exists deploy/compose/application.yaml; then
              dispatch_and_wait materialize-operations-after-export.yml
              continue
            fi

            dispatch_and_wait close-operational-e2e-after-operations.yml
          done
          echo 'Operational chain exceeded the bounded controller iteration count.' >&2
          exit 1
