name: Trigger Manual Record Owner

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-trigger-manual-record-owner
  cancel-in-progress: false

jobs:
  trigger:
    if: github.event.issue.title == 'Trigger canonical manual record owner'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch verified owner workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-manual-record-owner.yml --ref main

      - name: Remove one-shot trigger
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/trigger-manual-record-owner.yml
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Chore (Manual Import): remove owner trigger"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
