name: Reconcile Canonical Owner Exports

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-owner-exports.yml

permissions:
  contents: write

concurrency:
  group: canonical-owner-exports-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Reconcile explicit package exports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          root = Path.cwd()
          targets: dict[Path, tuple[str, ...]] = {
              root / "packages/collection_application/src/collection_application/__init__.py": (
                  "artifact_cleanup",
                  "geography",
                  "manual_import_admission",
                  "manual_import_plan_document",
              ),
              root / "packages/collection_infrastructure/src/collection_infrastructure/__init__.py": (
                  "artifact_cleanup_object_store",
              ),
              root / "packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py": (
                  "artifact_cleanup",
                  "artifact_cleanup_metadata",
                  "geography",
                  "manual_import_admission",
                  "manual_import_child_writer",
                  "manual_import_metadata",
              ),
              root / "connectors/osm_overpass/src/osm_overpass/__init__.py": (
                  "contracts",
                  "http",
                  "input",
                  "planning",
                  "query",
                  "response",
              ),
          }

          def public_definitions(module_path: Path) -> tuple[str, ...]:
              tree = ast.parse(module_path.read_text(encoding="utf-8"), filename=str(module_path))
              names: set[str] = set()
              for node in tree.body:
                  if isinstance(node, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      if not node.name.startswith("_"):
                          names.add(node.name)
                  elif isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id.isupper():
                              names.add(target.id)
                  elif isinstance(node, ast.AnnAssign):
                      target = node.target
                      if isinstance(target, ast.Name) and target.id.isupper():
                          names.add(target.id)
              return tuple(sorted(names))

          for init_path, modules in targets.items():
              if not init_path.parent.exists():
                  continue
              if not init_path.exists():
                  init_path.write_text("", encoding="utf-8")
              content = init_path.read_text(encoding="utf-8")
              additions: list[str] = []
              for module_name in modules:
                  module_path = init_path.parent / f"{module_name}.py"
                  if not module_path.exists():
                      continue
                  for name in public_definitions(module_path):
                      statement = f"from .{module_name} import {name} as {name}"
                      if statement not in content:
                          additions.append(statement)
              if additions:
                  separator = "" if not content or content.endswith("\n\n") else "\n"
                  content = content.rstrip() + separator + "\n".join(additions) + "\n"
                  init_path.write_text(content, encoding="utf-8")
          PY

      - name: Normalize and verify owner boundaries
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python -m compileall -q apps connectors database packages tools

      - name: Commit canonical owner exports
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-owner-exports.yml
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix (Owners): expose staged module boundaries'
          git push origin HEAD:main

      - name: Remove failed reconciliation workflow
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git rm .github/workflows/reconcile-owner-exports.yml
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Build (Owners): remove failed export reconciliation'
          git push origin HEAD:main
