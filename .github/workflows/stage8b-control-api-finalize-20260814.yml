name: Finalize Stage 8B Exact Head

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage8b-control-api-finalize-20260814.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage8b-control-api-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 260

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Prove Stage 8B exact subject
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/review_application/src/review_application/service.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/review_repository.py
          test -f apps/control_api/src/control_api/app.py
          test -f contracts/control_api/openapi.json
          test -f deploy/docker/control-api.Dockerfile
          uv sync --frozen --all-packages --dev
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/resolution_contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest packages/review_application/tests apps/control_api/tests tools/control_api_contract_generation/tests
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build --tag data-collection-platform/control-api:final --file deploy/docker/control-api.Dockerfile .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/control-api:final)" = "10001:10001"

      - name: Record Stage 8B exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/stage8b-control-api-ci.md <<EOF
          # Stage 8B Control API CI proof

          - Status: proven
          - Repository: rtao-god/data-collection-platform
          - Branch: main
          - Subject commit: \`$GITHUB_SHA\`
          - Exact-head finalizer run: \`$GITHUB_RUN_ID\`
          - Event: \`$GITHUB_EVENT_NAME\`

          The exact subject passed frozen workspace restore, all generated-contract
          drift checks, Ruff, strict mypy, focused Control API tests, the complete
          non-integration suite, fail-closed dependency checks, Python compilation,
          fresh PostgreSQL migration, the complete database integration suite, and
          non-root Control API image construction.

          Proven boundaries:

          - reviewer actor identity is derived from authenticated bearer configuration;
          - queue cursors are opaque and timezone-aware;
          - review decisions and suppressions use transactional optimistic concurrency;
          - exact command replay is idempotent and conflicting replay fails closed;
          - manual observations append evidence instead of mutating source state;
          - OpenAPI is checked in and drift-checked;
          - Control API startup does not run migrations.

          The React review console remains the next Stage 8 owner.
          EOF
          git add docs/proofs/stage8b-control-api-ci.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Proofs): record Stage 8B Control API CI"
          git push origin HEAD:main
