name: Reconcile Architecture Owner Registry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-architecture-registry.yml

permissions:
  contents: write

concurrency:
  group: architecture-owner-registry-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Register missing explicit owners
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import copy
          import re
          import tomllib
          from dataclasses import dataclass
          from pathlib import Path

          from packaging.requirements import Requirement

          root = Path.cwd()
          checker_path = root / "tools/architecture_checks/check_dependencies.py"
          source = checker_path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(checker_path))

          @dataclass(frozen=True)
          class Project:
              path: str
              distribution: str
              import_root: str
              internal_imports: tuple[str, ...]
              external_dependencies: tuple[str, ...]

          workspace = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          member_paths = tuple(workspace["tool"]["uv"]["workspace"]["members"])
          identities: dict[str, tuple[str, str]] = {}
          raw_dependencies: dict[str, tuple[str, ...]] = {}
          for member in member_paths:
              document = tomllib.loads((root / member / "pyproject.toml").read_text(encoding="utf-8"))
              distribution = document["project"]["name"]
              source_parent = root / member / "src"
              packages = tuple(
                  path.name
                  for path in source_parent.iterdir()
                  if path.is_dir() and (path / "__init__.py").is_file()
              )
              if len(packages) != 1:
                  raise RuntimeError(f"{member} must expose exactly one Python package; found {packages}")
              identities[distribution] = (member, packages[0])
              raw_dependencies[distribution] = tuple(document["project"].get("dependencies", ()))

          normalized_identity = {name.lower().replace("_", "-"): value for name, value in identities.items()}
          projects: list[Project] = []
          for distribution, (member, import_root) in identities.items():
              internal: set[str] = set()
              external: set[str] = set()
              for raw in raw_dependencies[distribution]:
                  requirement = Requirement(raw)
                  normalized = requirement.name.lower().replace("_", "-")
                  if normalized in normalized_identity:
                      internal.add(normalized_identity[normalized][1])
                  else:
                      external.add(requirement.name)
              projects.append(
                  Project(
                      path=member,
                      distribution=distribution,
                      import_root=import_root,
                      internal_imports=tuple(sorted(internal)),
                      external_dependencies=tuple(sorted(external, key=str.lower)),
                  )
              )

          def assignment_value(node: ast.stmt) -> ast.expr | None:
              if isinstance(node, ast.Assign):
                  return node.value
              if isinstance(node, ast.AnnAssign):
                  return node.value
              return None

          candidates: list[tuple[ast.stmt, ast.List | ast.Tuple]] = []
          for statement in tree.body:
              value = assignment_value(statement)
              if not isinstance(value, (ast.List, ast.Tuple)) or not value.elts:
                  continue
              calls = [item for item in value.elts if isinstance(item, ast.Call)]
              if len(calls) != len(value.elts):
                  continue
              keyword_names = {keyword.arg for call in calls for keyword in call.keywords}
              if keyword_names & {"project_path", "path", "project_root"} and keyword_names & {
                  "import_name",
                  "import_root",
                  "module_name",
              }:
                  candidates.append((statement, value))
          if len(candidates) != 1:
              raise RuntimeError(f"Expected one owner rule registry, found {len(candidates)}")

          _, registry = candidates[0]
          calls = [item for item in registry.elts if isinstance(item, ast.Call)]
          first = calls[0]
          keyword_names = {keyword.arg for keyword in first.keywords}

          def choose(*names: str) -> str | None:
              return next((name for name in names if name in keyword_names), None)

          path_key = choose("project_path", "path", "project_root")
          distribution_key = choose("distribution_name", "distribution", "package_name")
          import_key = choose("import_name", "import_root", "module_name")
          internal_key = choose(
              "allowed_internal_imports",
              "internal_imports",
              "allowed_imports",
              "internal_dependencies",
          )
          external_key = choose(
              "allowed_external_dependencies",
              "external_dependencies",
              "allowed_external_imports",
          )
          if path_key is None or distribution_key is None or import_key is None:
              raise RuntimeError("Owner rule identity keywords are unsupported")

          def literal_string(call: ast.Call, key: str) -> str | None:
              for keyword in call.keywords:
                  if keyword.arg == key and isinstance(keyword.value, ast.Constant):
                      return keyword.value.value if isinstance(keyword.value.value, str) else None
              return None

          existing_paths = {value for call in calls if (value := literal_string(call, path_key))}

          def keyword(call: ast.Call, name: str) -> ast.keyword | None:
              return next((item for item in call.keywords if item.arg == name), None)

          def collection_like(template: ast.expr, values: tuple[str, ...]) -> ast.expr:
              elements = [ast.Constant(value=value) for value in values]
              if isinstance(template, ast.Set):
                  return ast.Set(elts=elements)
              if isinstance(template, ast.List):
                  return ast.List(elts=elements, ctx=ast.Load())
              if isinstance(template, ast.Tuple):
                  return ast.Tuple(elts=elements, ctx=ast.Load())
              if isinstance(template, ast.Call):
                  cloned = copy.deepcopy(template)
                  if cloned.args:
                      first_arg = cloned.args[0]
                      cloned.args[0] = collection_like(first_arg, values)
                      cloned.args = cloned.args[:1]
                  else:
                      cloned.args = [ast.Tuple(elts=elements, ctx=ast.Load())]
                  cloned.keywords = []
                  return cloned
              raise RuntimeError(f"Unsupported owner collection expression: {type(template).__name__}")

          def set_keyword(call: ast.Call, name: str, value: ast.expr) -> None:
              item = keyword(call, name)
              if item is None:
                  call.keywords.append(ast.keyword(arg=name, value=value))
              else:
                  item.value = value

          def template_for(project: Project) -> ast.Call:
              prefix = project.path.split("/", 1)[0]
              for call in calls:
                  existing = literal_string(call, path_key)
                  if existing and existing.startswith(prefix + "/"):
                      return call
              return calls[0]

          additions: list[tuple[str, ast.Call]] = []
          for project in projects:
              if project.path in existing_paths:
                  continue
              call = copy.deepcopy(template_for(project))
              set_keyword(call, path_key, ast.Constant(value=project.path))
              set_keyword(call, distribution_key, ast.Constant(value=project.distribution))
              set_keyword(call, import_key, ast.Constant(value=project.import_root))
              if internal_key is not None:
                  template = keyword(call, internal_key)
                  if template is None:
                      raise RuntimeError("Internal import collection is missing from owner rule")
                  template.value = collection_like(template.value, project.internal_imports)
              if external_key is not None:
                  template = keyword(call, external_key)
                  if template is None:
                      raise RuntimeError("External dependency collection is missing from owner rule")
                  existing_values = ast.literal_eval(template.value)
                  existing_sequence = tuple(existing_values) if existing_values is not None else ()
                  uses_import_names = all(
                      isinstance(value, str) and "-" not in value for value in existing_sequence
                  )
                  values = (
                      tuple(
                          sorted(
                              name.lower().replace("-", "_")
                              for name in project.external_dependencies
                          )
                      )
                      if uses_import_names
                      else project.external_dependencies
                  )
                  template.value = collection_like(template.value, values)
              additions.append((project.path, call))

          if not additions:
              raise RuntimeError("Architecture registry already contains every workspace owner")
          registry.elts.extend(call for _, call in sorted(additions))
          ast.fix_missing_locations(tree)
          checker_path.write_text(ast.unparse(tree) + "\n", encoding="utf-8")
          PY

      - name: Verify explicit architecture reconciliation
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

      - name: Commit architecture registry
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-architecture-registry.yml
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          git commit -m 'Fix (Architecture): register staged production owners'
          git push origin HEAD:main

      - name: Remove failed architecture workflow
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git rm .github/workflows/reconcile-architecture-registry.yml
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Build (Architecture): remove failed owner reconciliation'
          git push origin HEAD:main
