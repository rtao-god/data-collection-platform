name: Reconcile Production Workspace

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-workspace.yml

permissions:
  contents: write

concurrency:
  group: production-workspace-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Reconcile discovered production projects
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path.cwd()
          path = root / "pyproject.toml"
          text = path.read_text(encoding="utf-8")

          projects = tuple(
              sorted(
                  project.relative_to(root).as_posix()
                  for parent_name in ("apps", "connectors", "packages")
                  for project in (root / parent_name).iterdir()
                  if project.is_dir() and (project / "pyproject.toml").is_file()
              )
          )
          if not projects:
              raise RuntimeError("No production projects were discovered")

          members = "members = [\n" + "".join(f'  "{item}",\n' for item in projects) + "]"
          text, count = re.subn(
              r"members\s*=\s*\[.*?\]",
              members,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError("Workspace members block was not replaced exactly once")

          owned_roots = tuple(
              item
              for item in ("apps", "connectors", "database", "packages", "tools")
              if (root / item).exists()
          )
          root_array = "[" + ", ".join(f'\"{item}\"' for item in owned_roots) + "]"
          text, pytest_count = re.subn(
              r'testpaths\s*=\s*\[[^\]]*\]',
              f"testpaths = {root_array}",
              text,
              count=1,
          )
          text, ruff_count = re.subn(
              r'src\s*=\s*\[[^\]]*\]',
              f"src = {root_array}",
              text,
              count=1,
          )
          if pytest_count != 1 or ruff_count != 1:
              raise RuntimeError("Pytest or Ruff ownership roots were not reconciled")

          source_roots: list[str] = []
          for project_name in projects:
              source_parent = root / project_name / "src"
              if not source_parent.exists():
                  continue
              for package in sorted(source_parent.iterdir()):
                  if package.is_dir() and (package / "__init__.py").is_file():
                      source_roots.append(package.relative_to(root).as_posix())
          source_roots.extend(
              item
              for item in (
                  "database/migrations/env.py",
                  "database/migrations/versions",
                  "tools/contract_generation/generate.py",
              )
              if (root / item).exists()
          )
          files_block = "files = [\n" + "".join(f'  "{item}",\n' for item in source_roots) + "]"
          text, mypy_count = re.subn(
              r"files\s*=\s*\[.*?\]",
              files_block,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if mypy_count != 1:
              raise RuntimeError("Mypy ownership block was not reconciled")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Refresh exact workspace lock
        run: uv lock

      - name: Restore reconciled workspace
        run: uv sync --frozen --all-packages --dev

      - name: Normalize touched configuration and sources
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q apps connectors database packages tools

      - name: Commit workspace owner reconciliation
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-workspace.yml
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix (Workspace): register staged production owners'
          git push origin HEAD:main
