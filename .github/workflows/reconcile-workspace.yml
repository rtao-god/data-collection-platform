name: Reconcile Workspace Baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-workspace.yml

permissions:
  contents: write

concurrency:
  group: reconcile-workspace-baseline
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Normalize owned Python sources
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -- '*.py'
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Chore (Python): normalize owned Ruff formatting'
          fi

      - name: Reconcile workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          path = root / 'pyproject.toml'
          text = path.read_text(encoding='utf-8')
          data = tomllib.loads(text)

          members: list[str] = []
          source_roots: list[str] = []
          for owner_root in ('apps', 'connectors', 'packages'):
              base = root / owner_root
              if not base.is_dir():
                  continue
              for project_file in sorted(base.glob('*/pyproject.toml')):
                  member = project_file.parent.relative_to(root).as_posix()
                  members.append(member)
                  src = project_file.parent / 'src'
                  if not src.is_dir():
                      raise RuntimeError(f'workspace member has no src directory: {member}')
                  packages = sorted(
                      child for child in src.iterdir()
                      if child.is_dir() and (child / '__init__.py').is_file()
                  )
                  if len(packages) != 1:
                      raise RuntimeError(
                          f'workspace member must expose exactly one Python package: {member}'
                      )
                  source_roots.append(packages[0].relative_to(root).as_posix())

          members = sorted(set(members))
          source_roots = sorted(set(source_roots))
          expected_members = data['tool']['uv']['workspace']['members']
          if not isinstance(expected_members, list):
              raise RuntimeError('tool.uv.workspace.members must be an array')

          def render_array(key: str, values: list[str]) -> str:
              body = ''.join(f'  "{value}",\n' for value in values)
              return f'{key} = [\n{body}]'

          def replace_array(source: str, key: str, values: list[str], *, occurrence: int = 1) -> str:
              pattern = re.compile(rf'(?ms)^{re.escape(key)}\s*=\s*\[.*?^\]')
              matches = list(pattern.finditer(source))
              if len(matches) < occurrence:
                  raise RuntimeError(f'array not found: {key} occurrence {occurrence}')
              match = matches[occurrence - 1]
              return source[:match.start()] + render_array(key, values) + source[match.end():]

          text = replace_array(text, 'members', members)

          testpaths = [name for name in ('apps', 'connectors', 'database', 'packages', 'tools') if (root / name).exists()]
          text = replace_array(text, 'testpaths', testpaths)
          text = replace_array(text, 'src', testpaths)

          current_mypy = data['tool']['mypy']['files']
          if not isinstance(current_mypy, list):
              raise RuntimeError('tool.mypy.files must be an array')
          non_project = [
              value for value in current_mypy
              if isinstance(value, str)
              and not value.startswith(('apps/', 'connectors/', 'packages/'))
          ]
          mypy_files = source_roots + non_project
          text = replace_array(text, 'files', mypy_files)
          path.write_text(text, encoding='utf-8')
          PY
          uv lock
          uv sync --frozen --all-packages --dev
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q apps connectors database packages tools
          git add pyproject.toml uv.lock
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Build (Workspace): register owned deployables and connectors'
          fi

      - name: Remove transient tooling and push
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/reconcile-workspace.yml
          git rm -f --ignore-unmatch .github/workflows/export-dev-environment.yml
          find .codex -maxdepth 1 -type f \( -name '*.py' -o -name '*probe*' -o -name 'ci-trigger*' \) -print0 | xargs -0 -r git rm -f
          if [ -d .codex/payloads ]; then
            git rm -rf .codex/payloads
          fi
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Chore (Tooling): remove transient reconciliation automation'
          fi
          git push origin HEAD:main
