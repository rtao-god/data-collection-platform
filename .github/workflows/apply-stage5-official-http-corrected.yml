name: Apply Stage 5 Official HTTP Corrected

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage5-official-http-corrected.yml
      - .github/tools/fix_stage5.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage5-official-http-corrected
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Apply owner patch and prove Stage 5
        shell: bash
        run: |
          set -euo pipefail
          cat .github/stage5/payload.part-* | base64 --decode | gzip --decompress > "$RUNNER_TEMP/stage5.patch"
          git apply --check "$RUNNER_TEMP/stage5.patch"
          git apply "$RUNNER_TEMP/stage5.patch"
          python .github/tools/fix_stage5.py
          python - <<'PY'
          from pathlib import Path

          planning = Path("connectors/official_http/src/official_http/planning.py")
          text = planning.read_text(encoding="utf-8")
          old = '    kind = "page" if root_name == "urlset" else "sitemap"\n'
          new = (
              '    kind: Literal["page", "sitemap"] = (\n'
              '        "page" if root_name == "urlset" else "sitemap"\n'
              '    )\n'
          )
          if old not in text:
              raise RuntimeError("official_http.planning: sitemap kind anchor is missing")
          planning.write_text(text.replace(old, new, 1), encoding="utf-8")

          fetch = Path("connectors/official_http/src/official_http/fetch.py")
          text = fetch.read_text(encoding="utf-8")
          text = text.replace("from typing import Literal, cast\n", "from typing import Literal\n", 1)
          old = "        return cast(FailureKind, value)\n"
          if old not in text:
              raise RuntimeError("official_http.fetch: failure-kind cast anchor is missing")
          fetch.write_text(text.replace(old, "        return value\n", 1), encoding="utf-8")
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff format --exclude .github/tools .
          uv run ruff check --exclude .github/tools . --fix
          uv run ruff format --exclude .github/tools .
          uv run ruff check --exclude .github/tools .
          uv run mypy
          uv run pytest -q connectors/official_http/tests apps/http_worker/tests
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py
          uv run python tools/contract_generation/generate.py --check
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services

          docker build \
            --tag data-collection-platform/http-worker:stage5 \
            --file deploy/docker/http-worker.Dockerfile \
            .
          docker run --rm -i \
            --entrypoint python \
            data-collection-platform/http-worker:stage5 \
            - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          import_module("http_worker")
          import_module("official_http")
          import_module("source_connector_sdk")
          import_module("scrapy")

          forbidden = {
              "alembic",
              "boto3",
              "botocore",
              "playwright",
              "psycopg",
              "sqlalchemy",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit(
                  "HTTP worker contains forbidden dependencies: " + ", ".join(present)
              )
          PY
          git diff --check

      - name: Commit proven production state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/stage5 .github/tools/fix_stage5.py
          git add -A
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat (HTTP acquisition): add official website worker"
          git push origin HEAD:main
