name: Seal Reconciled Baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seal-reconciled-baseline.yml

permissions:
  contents: write

concurrency:
  group: seal-reconciled-baseline-main
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: collection
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collection -d collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 4

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Reconcile workspace ownership
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path.cwd()
          path = root / "pyproject.toml"
          text = path.read_text(encoding="utf-8")
          projects = tuple(
              sorted(
                  project.relative_to(root).as_posix()
                  for parent_name in ("apps", "connectors", "packages")
                  if (root / parent_name).exists()
                  for project in (root / parent_name).iterdir()
                  if project.is_dir() and (project / "pyproject.toml").is_file()
              )
          )
          members = "members = [\n" + "".join(f'  "{item}",\n' for item in projects) + "]"
          text, count = re.subn(r"members\s*=\s*\[.*?\]", members, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise RuntimeError("workspace member block mismatch")
          owned_roots = tuple(
              item for item in ("apps", "connectors", "database", "packages", "tools")
              if (root / item).exists()
          )
          roots = "[" + ", ".join(f'\"{item}\"' for item in owned_roots) + "]"
          text, pytest_count = re.subn(r'testpaths\s*=\s*\[[^\]]*\]', f"testpaths = {roots}", text, count=1)
          text, ruff_count = re.subn(r'src\s*=\s*\[[^\]]*\]', f"src = {roots}", text, count=1)
          if pytest_count != 1 or ruff_count != 1:
              raise RuntimeError("owned root configuration mismatch")
          mypy_paths: list[str] = []
          for project in projects:
              source_parent = root / project / "src"
              if not source_parent.exists():
                  continue
              for package in sorted(source_parent.iterdir()):
                  if package.is_dir() and (package / "__init__.py").is_file():
                      mypy_paths.append(package.relative_to(root).as_posix())
          mypy_paths.extend(
              item for item in (
                  "database/migrations/env.py",
                  "database/migrations/versions",
                  "tools/contract_generation/generate.py",
              ) if (root / item).exists()
          )
          files = "files = [\n" + "".join(f'  "{item}",\n' for item in mypy_paths) + "]"
          text, mypy_count = re.subn(r"files\s*=\s*\[.*?\]", files, text, count=1, flags=re.DOTALL)
          if mypy_count != 1:
              raise RuntimeError("mypy owner block mismatch")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Refresh exact lock
        run: uv lock

      - name: Restore reconciled workspace
        run: uv sync --frozen --all-packages --dev

      - name: Reconcile explicit public exports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          root = Path.cwd()
          targets = {
              root / "packages/collection_application/src/collection_application/__init__.py": (
                  "artifact_cleanup", "geography", "manual_import_admission", "manual_import_plan_document"
              ),
              root / "packages/collection_infrastructure/src/collection_infrastructure/__init__.py": (
                  "artifact_cleanup_object_store",
              ),
              root / "packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py": (
                  "artifact_cleanup", "artifact_cleanup_metadata", "geography",
                  "manual_import_admission", "manual_import_child_writer", "manual_import_metadata"
              ),
              root / "connectors/osm_overpass/src/osm_overpass/__init__.py": (
                  "contracts", "http", "input", "planning", "query", "response"
              ),
          }
          for init_path, modules in targets.items():
              if not init_path.parent.exists():
                  continue
              content = init_path.read_text(encoding="utf-8") if init_path.exists() else ""
              additions: list[str] = []
              for module_name in modules:
                  module_path = init_path.parent / f"{module_name}.py"
                  if not module_path.exists():
                      continue
                  parsed = ast.parse(module_path.read_text(encoding="utf-8"))
                  names = sorted(
                      node.name for node in parsed.body
                      if isinstance(node, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef))
                      and not node.name.startswith("_")
                  )
                  for name in names:
                      line = f"from .{module_name} import {name} as {name}"
                      if line not in content:
                          additions.append(line)
              if additions:
                  init_path.write_text(content.rstrip() + "\n\n" + "\n".join(additions) + "\n", encoding="utf-8")
          PY

      - name: Register table metadata with Alembic owner
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          root = Path.cwd()
          env_path = root / "database/migrations/env.py"
          env_source = env_path.read_text(encoding="utf-8")
          env_tree = ast.parse(env_source)
          candidate_modules: list[str] = []
          for node in ast.walk(env_tree):
              if isinstance(node, ast.ImportFrom) and node.module and node.module.startswith(
                  "collection_infrastructure.postgres"
              ):
                  candidate_modules.append(node.module)
          postgres_root = root / "packages/collection_infrastructure/src/collection_infrastructure/postgres"
          metadata_modules = tuple(
              sorted(
                  path.stem for path in postgres_root.glob("*_metadata.py")
                  if path.stem not in {"metadata"}
              )
          )
          if metadata_modules:
              imports = "\n".join(
                  f"from collection_infrastructure.postgres import {name} as _{name}"
                  for name in metadata_modules
              )
              missing = [line for line in imports.splitlines() if line not in env_source]
              if missing:
                  env_path.write_text("\n".join(missing) + "\n" + env_source, encoding="utf-8")
          PY

      - name: Normalize exact source
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .

      - name: Execute static and unit gates
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

      - name: Execute database gates
        run: |
          uv run collection-migrate upgrade head
          uv run pytest -q -m integration

      - name: Seal reconciled baseline
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/reconciled-baseline.md <<EOF
          # Reconciled production baseline

          - source head: \`${GITHUB_SHA}\`
          - discovered workspace owners: \`registered\`
          - explicit package exports: \`verified\`
          - Alembic table metadata: \`registered\`
          - lock, contracts, Ruff, mypy and architecture: \`success\`
          - non-integration tests: \`success\`
          - fresh PostgreSQL/PostGIS migration: \`success\`
          - integration tests: \`success\`
          EOF
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 | xargs -0 -r git rm -f
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          git commit -m 'Fix (Baseline): reconcile staged production owners'
          git push origin HEAD:main

      - name: Remove failed baseline automation
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 | xargs -0 -r git rm -f
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Build (Baseline): remove failed reconciliation automation'
            git push origin HEAD:main
          fi
          exit 1
