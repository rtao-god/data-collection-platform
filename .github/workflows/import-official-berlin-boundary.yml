name: Import Official Berlin Boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-official-berlin-boundary.yml

permissions:
  contents: write

concurrency:
  group: data-collection-platform-berlin-boundary
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: collection
          POSTGRES_DB: collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collection -d collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      COLLECTION_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      TEST_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Serialize after baseline finalization
        run: |
          sleep 45
          git fetch origin main
          git reset --hard origin/main

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Fetch and validate official boundary
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/proofs/reconciled-baseline-ci.md
          test -f docs/proofs/worker-image-isolation-ci.md
          uv sync --frozen --all-packages --dev
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.parse
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from typing import Any

          import httpx
          import psycopg

          ROOT = Path.cwd()
          CAMPAIGN_ROOT = ROOT / 'campaigns/berlin_recording_services'
          if not CAMPAIGN_ROOT.is_dir():
              raise RuntimeError('Berlin campaign root is missing')

          def walk(value: object, keys: tuple[str, ...] = ()) -> list[tuple[tuple[str, ...], str]]:
              found: list[tuple[tuple[str, ...], str]] = []
              if isinstance(value, dict):
                  for key, item in value.items():
                      found.extend(walk(item, keys + (str(key),)))
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      found.extend(walk(item, keys + (str(index),)))
              elif isinstance(value, str) and value.lower().endswith('.geojson'):
                  found.append((keys, value))
              return found

          candidates: set[Path] = set()
          try:
              import yaml
          except ImportError as exc:
              raise RuntimeError('PyYAML is required to inspect campaign configuration') from exc
          for path in sorted(CAMPAIGN_ROOT.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.yaml', '.yml', '.json'}:
                  continue
              if path.suffix.lower() == '.json':
                  document = json.loads(path.read_text(encoding='utf-8'))
              else:
                  document = yaml.safe_load(path.read_text(encoding='utf-8'))
              for key_path, value in walk(document):
                  semantic = '.'.join(key_path).lower()
                  if any(token in semantic for token in ('boundary', 'polygon', 'geograph')):
                      candidate = (CAMPAIGN_ROOT / value).resolve()
                      if CAMPAIGN_ROOT.resolve() not in candidate.parents:
                          raise RuntimeError(f'boundary path escapes campaign root: {value}')
                      candidates.add(candidate)
          if not candidates:
              for source_path in ROOT.rglob('*.py'):
                  source = source_path.read_text(encoding='utf-8', errors='ignore')
                  if 'BERLIN_BOUNDARY_ARTIFACT_MISSING' not in source:
                      continue
                  for match in re.finditer(r'["\']([^"\']+\.geojson)["\']', source):
                      value = match.group(1)
                      candidate = (CAMPAIGN_ROOT / value).resolve()
                      if CAMPAIGN_ROOT.resolve() in candidate.parents:
                          candidates.add(candidate)
          if len(candidates) != 1:
              raise RuntimeError(
                  'exactly one campaign-owned Berlin boundary path is required; '
                  f'found {[str(path) for path in sorted(candidates)]}'
              )
          boundary_path = next(iter(candidates))
          boundary_path.parent.mkdir(parents=True, exist_ok=True)

          endpoint = 'https://gdi.berlin.de/services/wfs/alkis_bezirke'
          timeout = httpx.Timeout(60.0, connect=20.0)
          headers = {
              'Accept': 'application/xml,text/xml;q=0.9,*/*;q=0.1',
              'User-Agent': 'data-collection-platform-boundary-import/1.0',
          }
          with httpx.Client(
              timeout=timeout,
              follow_redirects=False,
              headers=headers,
              trust_env=False,
          ) as client:
              capabilities_response = client.get(
                  endpoint,
                  params={'service': 'WFS', 'request': 'GetCapabilities'},
              )
              capabilities_response.raise_for_status()
              if capabilities_response.url.host != 'gdi.berlin.de':
                  raise RuntimeError('official WFS host changed unexpectedly')
              if len(capabilities_response.content) > 8 * 1024 * 1024:
                  raise RuntimeError('WFS capabilities document exceeds limit')
              root = ET.fromstring(capabilities_response.content)
              names: list[str] = []
              titles: dict[str, str] = {}
              for feature_type in root.iter():
                  if not feature_type.tag.endswith('FeatureType'):
                      continue
                  name = None
                  title = None
                  for child in feature_type:
                      if child.tag.endswith('Name') and child.text:
                          name = child.text.strip()
                      elif child.tag.endswith('Title') and child.text:
                          title = child.text.strip()
                  if name and 'bezirk' in f'{name} {title or ""}'.lower():
                      names.append(name)
                      titles[name] = title or name
              names = sorted(set(names))
              if len(names) != 1:
                  raise RuntimeError(f'official WFS district feature type is ambiguous: {names}')
              feature_type = names[0]
              constraints = sorted(
                  {
                      (element.text or '').strip()
                      for element in root.iter()
                      if (
                          element.tag.endswith('AccessConstraints')
                          or element.tag.endswith('Fees')
                      )
                      and (element.text or '').strip()
                      and (element.text or '').strip().lower() not in {'none', 'keine'}
                  }
              )
              if not constraints:
                  raise RuntimeError('official WFS did not expose license/access constraints')
              get_feature_params = {
                  'service': 'WFS',
                  'version': '2.0.0',
                  'request': 'GetFeature',
                  'typeNames': feature_type,
                  'srsName': 'EPSG:4326',
                  'outputFormat': 'application/json',
              }
              response = client.get(endpoint, params=get_feature_params)
              if response.status_code >= 400:
                  get_feature_params['outputFormat'] = 'json'
                  response = client.get(endpoint, params=get_feature_params)
              response.raise_for_status()
              if response.url.host != 'gdi.berlin.de':
                  raise RuntimeError('official feature response host changed unexpectedly')
              if len(response.content) > 128 * 1024 * 1024:
                  raise RuntimeError('official boundary response exceeds limit')
              feature_collection = response.json()

          if not isinstance(feature_collection, dict) or feature_collection.get('type') != 'FeatureCollection':
              raise RuntimeError('official WFS response is not a GeoJSON FeatureCollection')
          features = feature_collection.get('features')
          if not isinstance(features, list) or len(features) != 12:
              raise RuntimeError(
                  f'official Berlin district collection must contain 12 features; found '
                  f'{len(features) if isinstance(features, list) else "invalid"}'
              )
          geometries: list[str] = []
          source_ids: list[str] = []
          for feature in features:
              if not isinstance(feature, dict):
                  raise RuntimeError('official feature is not an object')
              geometry = feature.get('geometry')
              if not isinstance(geometry, dict) or geometry.get('type') not in {'Polygon', 'MultiPolygon'}:
                  raise RuntimeError('official feature geometry is not polygonal')
              geometries.append(
                  json.dumps(geometry, ensure_ascii=False, separators=(',', ':'), sort_keys=True)
              )
              identifier = feature.get('id')
              if identifier is not None:
                  source_ids.append(str(identifier))

          dsn = os.environ['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://', 1)
          with psycopg.connect(dsn) as connection:
              with connection.cursor() as cursor:
                  cursor.execute('CREATE TEMP TABLE official_districts (geometry geometry(Geometry, 4326))')
                  cursor.executemany(
                      'INSERT INTO official_districts (geometry) VALUES (ST_SetSRID(ST_GeomFromGeoJSON(%s), 4326))',
                      ((geometry,) for geometry in geometries),
                  )
                  cursor.execute(
                      '''
                      WITH dissolved AS (
                          SELECT ST_Multi(
                              ST_CollectionExtract(
                                  ST_MakeValid(ST_UnaryUnion(ST_Collect(geometry))),
                                  3
                              )
                          ) AS geometry
                          FROM official_districts
                      )
                      SELECT
                          ST_AsGeoJSON(ST_ForceRHR(geometry), 9, 0),
                          ST_IsValid(geometry),
                          ST_IsEmpty(geometry),
                          ST_SRID(geometry),
                          ST_Area(geometry::geography) / 1000000.0,
                          ST_XMin(ST_Extent(geometry)),
                          ST_YMin(ST_Extent(geometry)),
                          ST_XMax(ST_Extent(geometry)),
                          ST_YMax(ST_Extent(geometry))
                      FROM dissolved
                      GROUP BY geometry
                      '''
                  )
                  row = cursor.fetchone()
          if row is None:
              raise RuntimeError('PostGIS did not return a dissolved boundary')
          (
              boundary_json,
              is_valid,
              is_empty,
              srid,
              area_km2,
              min_lon,
              min_lat,
              max_lon,
              max_lat,
          ) = row
          if not is_valid or is_empty or srid != 4326:
              raise RuntimeError('dissolved official boundary is invalid')
          if not 850.0 <= float(area_km2) <= 950.0:
              raise RuntimeError(f'official Berlin boundary area is implausible: {area_km2}')
          if not (
              12.8 <= float(min_lon) <= 13.3
              and 52.2 <= float(min_lat) <= 52.5
              and 13.6 <= float(max_lon) <= 14.0
              and 52.6 <= float(max_lat) <= 52.9
          ):
              raise RuntimeError('official Berlin boundary extent is implausible')
          boundary = json.loads(str(boundary_json))
          canonical = json.dumps(
              boundary,
              ensure_ascii=False,
              separators=(',', ':'),
              sort_keys=True,
          ).encode('utf-8') + b'\n'
          boundary_path.write_bytes(canonical)
          digest = f"sha256:{hashlib.sha256(canonical).hexdigest()}"
          provenance_path = boundary_path.with_suffix('.provenance.json')
          provenance = {
              'artifactDigest': digest,
              'authority': 'Land Berlin',
              'boundaryKey': 'berlin',
              'crs': 'EPSG:4326',
              'featureType': feature_type,
              'licenseOrAccessConstraints': constraints,
              'sourceEndpoint': endpoint,
              'sourceFeatureCount': len(features),
              'sourceFeatureIds': sorted(source_ids),
              'sourceTitle': titles[feature_type],
          }
          provenance_path.write_text(
              json.dumps(
                  provenance,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )

          commands = [
              ['uv', 'run', 'collector', 'config', 'validate', 'berlin_recording_services'],
              ['uv', 'run', 'collector', 'config', 'validate', str(CAMPAIGN_ROOT)],
          ]
          successful_output = None
          for command in commands:
              completed = subprocess.run(command, text=True, capture_output=True)
              if completed.returncode == 0:
                  successful_output = completed.stdout + completed.stderr
                  break
          if successful_output is None:
              raise RuntimeError('campaign snapshot validation failed after official boundary import')
          if 'BERLIN_BOUNDARY_ARTIFACT_MISSING' in successful_output:
              raise RuntimeError('official boundary did not satisfy the campaign geography owner')
          print(f'boundary={boundary_path.relative_to(ROOT)}')
          print(f'digest={digest}')
          print(f'feature_type={feature_type}')
          PY
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration and not object_store_integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          mkdir -p docs/proofs
          cat > docs/proofs/official-berlin-boundary.md <<EOF
          # Official Berlin boundary artifact

          - authority: Land Berlin
          - transport: official gdi.berlin.de WFS
          - source features: 12 Berlin districts
          - transformation: PostGIS valid unary union in EPSG:4326
          - validation: polygonal, valid, non-empty, plausible area and extent
          - provenance: campaign-owned adjacent JSON
          - campaign blocker: BERLIN_BOUNDARY_ARTIFACT_MISSING absent
          EOF

      - name: Commit verified boundary or remove blocked importer
        if: always()
        shell: bash
        env:
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        run: |
          set -euo pipefail
          if [ "$BOUNDARY_OUTCOME" != 'success' ]; then
            git reset --hard HEAD
          fi
          git rm -f --ignore-unmatch .github/workflows/import-official-berlin-boundary.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "$BOUNDARY_OUTCOME" = 'success' ]; then
            git commit -m 'Feature (Geography): add verified official Berlin boundary'
          else
            git commit -m 'Build (Tooling): remove blocked Berlin boundary importer'
          fi
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1

      - name: Preserve failed status
        if: steps.boundary.outcome != 'success'
        run: exit 1
