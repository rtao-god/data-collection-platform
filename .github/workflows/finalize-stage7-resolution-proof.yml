name: Finalize Stage 7 Resolution Proof

on:
  workflow_run:
    workflows:
      - Verify
      - Resolution Worker Isolation
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: data-collection-platform-stage7-resolution-proof
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Record proof when both exact-head workflows are green
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [[ "$current" != "$SUBJECT_SHA" ]]; then
            echo "Skipping stale subject $SUBJECT_SHA; current main is $current."
            exit 0
          fi

          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SUBJECT_SHA&per_page=100")"
          verify="$(jq -c '[.workflow_runs[] | select(.name == "Verify" and .event == "push")] | sort_by(.created_at) | last // empty' <<<"$runs")"
          isolation="$(jq -c '[.workflow_runs[] | select(.name == "Resolution Worker Isolation" and .event == "push")] | sort_by(.created_at) | last // empty' <<<"$runs")"

          if [[ -z "$verify" || -z "$isolation" ]]; then
            echo "Both exact-head runs are not present yet."
            exit 0
          fi
          if [[ "$(jq -r '.status' <<<"$verify")" != "completed" || "$(jq -r '.status' <<<"$isolation")" != "completed" ]]; then
            echo "Both exact-head runs are not completed yet."
            exit 0
          fi
          if [[ "$(jq -r '.conclusion' <<<"$verify")" != "success" || "$(jq -r '.conclusion' <<<"$isolation")" != "success" ]]; then
            echo "One or more exact-head Stage 7 proofs failed."
            exit 1
          fi

          verify_id="$(jq -r '.id' <<<"$verify")"
          isolation_id="$(jq -r '.id' <<<"$isolation")"
          mkdir -p docs/proofs
          cat > docs/proofs/resolution-geography-quality-ci.md <<EOF
          # Entity resolution, geography integration, and quality CI proof

          ## Proven subject

          - Status: \`proven\`
          - Repository: \`$GITHUB_REPOSITORY\`
          - Branch: \`main\`
          - Subject commit: \`$SUBJECT_SHA\`
          - Verify run: \`$verify_id\` — \`success\`
          - Resolution Worker Isolation run: \`$isolation_id\` — \`success\`

          ## Proven gates

          The permanent \`Verify\` workflow restored the frozen workspace and passed generated-contract drift, Ruff formatting and lint, strict mypy, the non-integration test suite, architecture dependency enforcement, Python compilation, campaign snapshot validation, baseline image builds, and the fresh PostgreSQL/PostGIS migration contract.

          Stage 7 tests prove deterministic blocking and pair identities; exact strong-identifier matching; name-only non-merge; fuzzy Berlin review; direct and transitive manual separation; immutable split lineage and deterministic reversal; geography readiness/revision/digest validation; fail-closed quality and export eligibility; non-source lease enforcement; restart behavior; and the versioned synthetic golden dataset.

          The permanent \`Resolution Worker Isolation\` workflow built \`deploy/docker/resolution-worker.Dockerfile\`, verified runtime identity \`10001:10001\`, verified entrypoint \`resolution-worker\`, imported the Stage 7 owners, and proved the runtime image contains no Alembic, boto3, botocore, phonenumbers, Playwright, psycopg, Scrapy, or SQLAlchemy.

          ## Boundary result

          Existing campaign geography remains canonical for point/boundary classification. Stage 7 consumes exact geography identity, never auto-merges name-only or fuzzy Berlin pairs, preserves reversible cluster lineage, and publishes a fail-closed export-eligibility verdict without database, crawler, browser, or direct Object Store ownership.
          EOF

          git add docs/proofs/resolution-geography-quality-ci.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Proofs): record resolution CI"
          git push origin HEAD:main
