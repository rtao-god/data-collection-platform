name: Finalize Geography Coverage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-geography-coverage.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Update geography owner documentation
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          module_path = root / ".codex/modules/geography.md"
          module_path.write_text(
              """# Geography coverage owner

          `collection_application.geography` owns strict immutable Polygon/MultiPolygon artifacts, point identities, and ordered coverage contracts.

          `collection_infrastructure.postgres.geography` is the PostGIS adapter:

          - evaluates exact canonical GeoJSON without persisting a second mutable boundary owner;
          - rejects empty, topologically invalid, non-polygonal, or non-WGS84 geometry;
          - uses `ST_Covers`, so points on an edge or vertex are included;
          - uses `ST_Touches` only to preserve the separate `boundary` classification;
          - preserves caller point order and the exact boundary digest;
          - does not call `ST_MakeValid` or otherwise repair source evidence silently.

          Production code contains no Berlin polygon. The approved boundary remains a campaign-owned artifact and the campaign remains blocked while it is absent.
          """,
              encoding="utf-8",
          )

          status_path = root / "docs/implementation-status.md"
          status = status_path.read_text(encoding="utf-8")
          if "| Geography coverage |" not in status:
              marker = "| OSM Overpass worker |"
              index = status.find(marker)
              if index < 0:
                  raise RuntimeError("OSM worker status marker not found")
              line_end = status.find("\n", index) + 1
              row = (
                  "| Geography coverage | Strict immutable GeoJSON boundaries, "
                  "ordered batch evaluation, PostGIS `ST_Covers` border inclusion, "
                  "and invalid-topology rejection |\n"
              )
              status = status[:line_end] + row + status[line_end:]
          status = status.replace(
              "- approved Berlin polygon, PostGIS coverage evaluation, and "
              "real-source OSM run remain incomplete;\n",
              "- approved Berlin polygon and real-source OSM run remain incomplete;\n",
          )
          status_path.write_text(status, encoding="utf-8")
          PY

      - name: Remove temporary tooling and format
        run: |
          find .codex -maxdepth 1 -type f -name '*.py' -delete
          find .codex -maxdepth 1 -type f -name 'ci-trigger-*' -delete
          find .codex -maxdepth 1 -type f -name 'push-files-schema-probe*' -delete
          find .github/workflows -maxdepth 1 -type f -name '*.yml' \
            ! -name 'ci.yml' \
            ! -name 'finalize-geography-coverage.yml' \
            -delete
          uv run ruff format .
          uv run ruff check --fix .

      - name: Verify static, unit, and architecture gates
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration and not object_store_integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps packages connectors

      - name: Verify ST_Covers semantics on live PostGIS
        run: |
          image="$(grep -Eo 'postgis/postgis:[A-Za-z0-9._-]+' .github/workflows/ci.yml | head -1)"
          test -n "$image"
          docker run --detach --name dcp-geography-postgis \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=collector \
            --publish 55432:5432 \
            "$image"
          trap 'docker logs dcp-geography-postgis || true; docker rm --force dcp-geography-postgis || true' EXIT
          for attempt in $(seq 1 90); do
            if docker exec dcp-geography-postgis \
                pg_isready -U postgres -d collector >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec dcp-geography-postgis \
            psql -U postgres -d collector -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          COLLECTOR_TEST_DATABASE_URL='postgresql+psycopg://postgres:postgres@127.0.0.1:55432/collector' \
            uv run pytest -q \
              packages/collection_infrastructure/tests/test_geography_postgis.py \
              -m integration

      - name: Commit the verified geography owner
        run: |
          rm .github/workflows/finalize-geography-coverage.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Feature (Geography): enforce PostGIS boundary coverage'
          git push origin HEAD:main
