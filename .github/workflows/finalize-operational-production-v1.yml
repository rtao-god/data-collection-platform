name: Finalize Operational Production V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-operational-production-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: data-collection-platform-final-operational-mutation
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Serialize prior mutations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY/actions/runs?branch=main&per_page=100"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          names='["Pipeline Owner Repair V3","Reconcile Operational Production V4","Reconcile Operational Production V5","Operational Closure V1"]'
          for _ in $(seq 1 900); do
            payload="$(curl -fsSL "${headers[@]}" "$api")"
            active="$(jq --arg current "$CURRENT_RUN_ID" --argjson names "$names" '[.workflow_runs[] | select((.id|tostring) != $current and .status != "completed" and (.name as $n | $names | index($n)) != null)] | length' <<<"$payload")"
            [[ "$active" == 0 ]] && break
            sleep 5
          done
          payload="$(curl -fsSL "${headers[@]}" "$api")"
          active="$(jq --arg current "$CURRENT_RUN_ID" --argjson names "$names" '[.workflow_runs[] | select((.id|tostring) != $current and .status != "completed" and (.name as $n | $names | index($n)) != null)] | length' <<<"$payload")"
          [[ "$active" == 0 ]] || { echo 'prior production mutations did not quiesce' >&2; exit 1; }
          git fetch origin main
          git reset --hard origin/main

      - name: Preserve current run and pipeline owners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/current-overlay"
          overlay=(
            AGENTS.md
            docs/specifications/pipeline-advancement.md
            packages/collection_application/src/collection_application/run_control.py
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_application/src/collection_application/pipeline_supervision.py
            packages/collection_application/tests/test_run_control.py
            packages/collection_application/tests/test_pipeline_advancement.py
            packages/collection_application/tests/test_pipeline_supervision.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py
            packages/collection_infrastructure/tests/test_pipeline_run_control.py
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
            database/migrations/versions/20260815_0012_run_control.py
            database/migrations/versions/20260815_0013_pipeline_advancement.py
            database/tests/test_pipeline_advancement_schema.py
          )
          printf '%s\n' "${overlay[@]}" > "$RUNNER_TEMP/current-overlay-paths"
          for path in "${overlay[@]}"; do
            if test -f "$path"; then
              mkdir -p "$RUNNER_TEMP/current-overlay/$(dirname "$path")"
              cp "$path" "$RUNNER_TEMP/current-overlay/$path"
            fi
          done

      - name: Restore proven operational owner set
        shell: bash
        run: |
          set -euo pipefail
          e2e_sha="9bec95589ee0592a873edbc0548be27707f53af6"
          protected='^(packages/collection_application/src/collection_application/(run_control|pipeline_advancement|pipeline_supervision)\.py|packages/collection_infrastructure/src/collection_infrastructure/postgres/(run_control|pipeline_advancement|pipeline_advancement_metadata|pipeline_run_control|succeeded_work_catalog)\.py|database/migrations/versions/20260815_001[23]_.*\.py|database/tests/test_pipeline_advancement_schema\.py)$'
          commits=(
            0da188be6fe963e3fae18f460ea5e566d104fa3c
            5a035e8031a5d6e1eddfa4212b9f9c17dbb6f87c
            553c63ad7e4d3f107894f687acb787e754ce61bf
            0abfbe53bfeb18623f83f72584e5be22971ff7d5
            e80bbcfebe8dce765b0bcdf7b362e069a979dbac
            8069f7d9e926c9109e6aa7f47770ef7cfbb8d4cb
            a175eb66110e4899741af6991cce829cc1b5112f
            05d8ab74e1f20f3654b097c7e7812bcf94c70d82
            47bda1aed7f0a49ac02d5586c88bd04b38ccff71
            7e09b245b4d7b851d8d5efca2f1c765593ec2726
            24c2979e7e871c814a895d9e8ec182cb6705321f
            9bec95589ee0592a873edbc0548be27707f53af6
          )
          declare -A restore=()
          for commit in "${commits[@]}"; do
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              [[ "$path" == .github/workflows/* ]] && continue
              [[ "$path" == .github/apply/* ]] && continue
              [[ "$path" == docs/diagnostics/* ]] && continue
              [[ "$path" == .codex/* ]] && continue
              [[ "$path" =~ $protected ]] && continue
              git cat-file -e "$e2e_sha:$path" 2>/dev/null || continue
              restore["$path"]=1
            done < <(git diff-tree --no-commit-id --name-only -r "$commit")
          done
          for path in \
            apps/review_web \
            apps/browser_worker \
            apps/retention_job \
            apps/orchestrator \
            packages/export_core \
            tools/operations \
            deploy/compose/application.yaml; do
            git cat-file -e "$e2e_sha:$path" 2>/dev/null && restore["$path"]=1 || true
          done
          for path in "${!restore[@]}"; do
            git checkout "$e2e_sha" -- "$path"
          done

          while IFS= read -r path; do
            if test -f "$RUNNER_TEMP/current-overlay/$path"; then
              mkdir -p "$(dirname "$path")"
              cp "$RUNNER_TEMP/current-overlay/$path" "$path"
            fi
          done < "$RUNNER_TEMP/current-overlay-paths"

          python - <<'PY'
          from pathlib import Path

          migration = Path(
              "database/migrations/versions/20260815_0013_pipeline_advancement.py"
          )
          if migration.exists():
              text = migration.read_text(encoding="utf-8").replace(
                  '"work.work_units.work_unit_id"',
                  '"work.work_units.work_id"',
              )
              migration.write_text(text, encoding="utf-8")

          metadata = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "pipeline_advancement_metadata.py"
          )
          catalog = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "succeeded_work_catalog.py"
          )
          if metadata.exists():
              source = metadata.read_text(encoding="utf-8")
              if "work_units.c.work_id" not in source or "collector_metadata" not in source:
                  raise RuntimeError("pipeline metadata is not bound to canonical work ownership")
          if catalog.exists():
              source = catalog.read_text(encoding="utf-8")
              required = (
                  "work_units.c.work_id",
                  "artifact_records.c.object_id == artifact_objects.c.object_id",
                  "work_input_artifacts",
                  "work_output_artifacts",
              )
              missing = [item for item in required if item not in source]
              if missing:
                  raise RuntimeError(f"pipeline catalog misses canonical owners: {missing}")
          PY

          required=(
            apps/review_web/package-lock.json
            apps/browser_worker/pyproject.toml
            apps/retention_job/pyproject.toml
            apps/orchestrator/pyproject.toml
            packages/export_core/src/export_core/service.py
            tools/operations/backup_restore.py
            deploy/compose/application.yaml
            packages/collection_application/src/collection_application/run_control.py
            packages/collection_application/src/collection_application/pipeline_advancement.py
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing final owner: $path" >&2; exit 1; }
          done

      - name: Reconcile deterministic workspace
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py
          uv run python tools/contract_generation/generate.py --check
          if test -f tools/control_api_contract_generation/generate.py; then
            uv run python tools/control_api_contract_generation/generate.py
            uv run python tools/control_api_contract_generation/generate.py --check
          fi
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py
            uv run python tools/review_contract_generation/generate.py --check
          fi

      - name: Prove complete Python and database product
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          git diff --check

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Prove review console and deployment topology
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/review_web ci
          npm --prefix apps/review_web run lint
          npm --prefix apps/review_web run typecheck --if-present
          npm --prefix apps/review_web test -- --run
          npm --prefix apps/review_web run build
          docker compose -f deploy/compose/application.yaml config >/dev/null
          grep -R "image:.*latest" deploy/compose && exit 1 || true

      - name: Commit final production tree
        id: production
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude).github/apply/**' \
            ':(exclude)docs/diagnostics/**' \
            ':(exclude)docs/proofs/end-to-end-operational-ci.md'
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name rtao-god
            git config user.email rtaogod@gmail.com
            git commit -m "Fix (Recovery): finalize operational E2E production tree"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          echo "subject_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record exact-subject proof
        env:
          SUBJECT_SHA: ${{ steps.production.outputs.subject_sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          mkdir -p docs/proofs
          cat > docs/proofs/end-to-end-operational-ci.md <<EOF
          # End-to-end operational CI proof

          - Status: proven
          - Repository: rtao-god/data-collection-platform
          - Branch: main
          - Subject commit: \`$SUBJECT_SHA\`
          - Workflow: Finalize Operational Production V1
          - Workflow run: \`$RUN_ID\`

          The exact subject passed deterministic workspace and contract generation,
          Ruff, strict mypy, the complete non-integration suite, architecture checks,
          fresh PostgreSQL/PostGIS migration and database integration tests, review
          console lint/type/test/build, and resolved application Compose validation.

          This proof establishes software and controlled-environment operational
          readiness. It does not manufacture an approved Berlin boundary, production
          source consent, or a real Berlin campaign run.
          EOF
          git add docs/proofs/end-to-end-operational-ci.md
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Proofs): record final operational E2E closure"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
