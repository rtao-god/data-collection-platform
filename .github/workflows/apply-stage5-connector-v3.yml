name: Apply Stage 5 Connector V3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage5-connector-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage5-connector-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 10

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Apply and prove connector owner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if ! test -f connectors/official_website_http/src/official_website_http/core.py; then
            python - <<'PY'
          from pathlib import Path
          import runpy

          path = Path(".github/stage5/apply_official_website_connector.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("    xml = b'''<?xml", '    xml = b"<?xml')
          text = text.replace("</urlset>'''\n", '</urlset>"\n')
          path.write_text(text, encoding="utf-8")
          runpy.run_path(str(path))
          PY
          fi
          if test -f .github/stage5/fix_official_website_connector.py; then
            python .github/stage5/fix_official_website_connector.py
          fi
          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff format connectors/official_website_http tools/architecture_checks/check_dependencies.py
          uv run ruff check connectors/official_website_http tools/architecture_checks/check_dependencies.py --fix
          uv run mypy
          uv run pytest -q connectors/official_website_http/tests
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run python -m compileall -q connectors/official_website_http
          git rm -f .github/stage5/apply_official_website_connector.py .github/stage5/fix_official_website_connector.py || true
          rmdir .github/stage5 || true
          git add connectors/official_website_http docs/specifications/stage5-official-website-http.md docs/architecture/dependency-rules.md pyproject.toml tools/architecture_checks/check_dependencies.py uv.lock
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feat: add official website HTTP connector"
          git push origin HEAD:main
