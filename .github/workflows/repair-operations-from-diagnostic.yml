name: Repair Operations From Diagnostic

on:
  push:
    branches: [main]
    paths:
      - docs/diagnostics/materialize-operations-after-export.md
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-operations-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore complete operations boundary from history
        shell: bash
        run: |
          set -euo pipefail
          markers=(
            apps/retention_job/pyproject.toml
            apps/orchestrator/pyproject.toml
            tools/operations/backup_restore.py
            deploy/compose/application.yaml
          )
          for marker in "${markers[@]}"; do
            commit="$(git log --all --format=%H -- "$marker" | head -1)"
            test -n "$commit" || { echo "missing historical owner: $marker" >&2; exit 1; }
            case "$marker" in
              apps/retention_job/*) git checkout "$commit" -- apps/retention_job ;;
              apps/orchestrator/*) git checkout "$commit" -- apps/orchestrator ;;
              tools/operations/*) git checkout "$commit" -- tools/operations ;;
              deploy/compose/*) git checkout "$commit" -- deploy/compose/application.yaml ;;
            esac
          done
          for path in \
            deploy/docker/retention-job.Dockerfile \
            deploy/docker/orchestrator.Dockerfile \
            .github/workflows/application-compose-ci.yml \
            .github/workflows/vertical-data-flow-e2e.yml \
            .github/workflows/operations-ci.yml \
            .github/workflows/backup-restore-ci.yml \
            tools/architecture_checks/check_dependencies.py; do
            commit="$(git log --all --format=%H -- "$path" | head -1)"
            if [[ -n "$commit" ]] && git cat-file -e "$commit:$path" 2>/dev/null; then git checkout "$commit" -- "$path"; fi
          done

      - name: Rebuild exact current workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('pyproject.toml')
          text=root.read_text(encoding='utf-8')
          members=[]
          for pattern in ('apps/*/pyproject.toml','connectors/*/pyproject.toml','packages/*/pyproject.toml'):
              members.extend(p.parent.as_posix() for p in Path().glob(pattern))
          members=sorted(set(members))
          ws=re.search(r'(?ms)(\[tool\.uv\.workspace\]\s*members\s*=\s*\[)(.*?)(\])',text)
          if ws is None: raise RuntimeError('workspace registry missing')
          body=''.join(f'\n  "{m}",' for m in members)+'\n'
          text=text[:ws.start(2)]+body+text[ws.end(2):]
          roots=[]
          for member in members:
              src=Path(member)/'src'
              if src.is_dir():
                  roots.extend(c.as_posix() for c in src.iterdir() if c.is_dir() and (c/'__init__.py').exists())
          mypy=re.search(r'(?ms)(\[tool\.mypy\].*?\nfiles\s*=\s*\[)(.*?)(\])',text)
          if mypy is None: raise RuntimeError('mypy registry missing')
          existing=[x.strip().strip('",') for x in mypy.group(2).splitlines() if x.strip()]
          extra=['tools/operations/backup_restore.py']
          body=''.join(f'\n  "{r}",' for r in sorted(set(existing+roots+extra)))+'\n'
          text=text[:mypy.start(2)]+body+text[mypy.end(2):]
          root.write_text(text,encoding='utf-8')
          PY
          uv lock
          uv sync --all-packages --dev --locked

      - name: Prove operations and resolved topology
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format apps/retention_job apps/orchestrator tools/operations
          uv run ruff check --fix apps/retention_job apps/orchestrator tools/operations
          uv run ruff format --check apps/retention_job apps/orchestrator tools/operations
          uv run ruff check apps/retention_job apps/orchestrator tools/operations
          uv run mypy apps/retention_job/src apps/orchestrator/src tools/operations/backup_restore.py
          uv run pytest -q apps/retention_job/tests apps/orchestrator/tests tools/operations/tests
          uv run python tools/architecture_checks/check_dependencies.py
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker compose -f deploy/compose/application.yaml config > /tmp/application-compose.yaml
          ! grep -nE 'image:.*:latest([[:space:]]|$)' /tmp/application-compose.yaml
          ! grep -nEi '(password|secret|access[_-]?key):[[:space:]]+[^$<{]' /tmp/application-compose.yaml
          uv run python tools/operations/backup_restore.py --help >/dev/null
          if test -f deploy/docker/retention-job.Dockerfile; then
            docker build --file deploy/docker/retention-job.Dockerfile --tag data-collection-platform/retention-job:ci .
          fi
          if test -f deploy/docker/orchestrator.Dockerfile; then
            docker build --file deploy/docker/orchestrator.Dockerfile --tag data-collection-platform/orchestrator:ci .
          fi

      - name: Commit repaired operations and close E2E
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/repair-operations-from-diagnostic.yml \
            .github/workflows/materialize-operations-after-export.yml \
            docs/diagnostics/materialize-operations-after-export.md
          git add apps/retention_job apps/orchestrator tools/operations deploy/compose/application.yaml pyproject.toml uv.lock
          for path in \
            deploy/docker/retention-job.Dockerfile \
            deploy/docker/orchestrator.Dockerfile \
            .github/workflows/application-compose-ci.yml \
            .github/workflows/vertical-data-flow-e2e.yml \
            .github/workflows/operations-ci.yml \
            .github/workflows/backup-restore-ci.yml \
            tools/architecture_checks/check_dependencies.py; do
            test ! -f "$path" || git add "$path"
          done
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m 'Fix (Operations): close executable runtime topology'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/close-operational-e2e-after-operations.yml/dispatches" \
            -d '{"ref":"main"}' >/dev/null
