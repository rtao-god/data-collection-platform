name: Orchestrate Stage 8 Review Closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/orchestrate-stage8-review-20260814.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: data-collection-platform-stage8-review-orchestration
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Close Stage 8A and Stage 8B in dependency order
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          proof_exists() {
            local path="$1"
            local status
            status="$(curl -sS -o /dev/null -w '%{http_code}' "${headers[@]}" "$api/contents/$path?ref=main")"
            [[ "$status" == "200" ]]
          }

          dispatch_and_wait() {
            local workflow="$1"
            local label="$2"
            local before_file
            before_file="$(mktemp)"
            curl -fsSL "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&per_page=50" \
              | jq -r '.workflow_runs[].id' | sort -n > "$before_file"
            curl -fsSL -X POST "${headers[@]}" \
              "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}'

            local run_id=""
            for _ in $(seq 1 120); do
              payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&per_page=50")"
              while IFS= read -r candidate; do
                if ! grep -qx "$candidate" "$before_file"; then
                  run_id="$candidate"
                  break
                fi
              done < <(jq -r '.workflow_runs[].id' <<<"$payload")
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            rm -f "$before_file"
            [[ -n "$run_id" ]] || { echo "$label run was not created" >&2; exit 1; }

            for _ in $(seq 1 240); do
              run="$(curl -fsSL "${headers[@]}" "$api/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || {
                  echo "$label failed in run $run_id with conclusion $conclusion" >&2
                  exit 1
                }
                echo "$label succeeded in run $run_id"
                return 0
              fi
              sleep 5
            done
            echo "$label run $run_id did not complete" >&2
            exit 1
          }

          if ! proof_exists "docs/proofs/stage8a-candidate-review-ci.md"; then
            dispatch_and_wait \
              "apply-stage8a-recovery-v2-20260814.yml" \
              "Stage 8A candidate review foundation"
          fi
          proof_exists "docs/proofs/stage8a-candidate-review-ci.md" || {
            echo "Stage 8A exact-head proof is still missing" >&2
            exit 1
          }

          if ! proof_exists "docs/proofs/stage8b-control-api-ci.md"; then
            dispatch_and_wait \
              "apply-stage8b-control-api-20260814.yml" \
              "Stage 8B Review Control API"
          fi
          proof_exists "docs/proofs/stage8b-control-api-ci.md" || {
            echo "Stage 8B exact-head proof is still missing" >&2
            exit 1
          }

          echo "Stage 8A and Stage 8B exact-head proofs are present."
