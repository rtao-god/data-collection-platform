name: Export Pipeline Owner API

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-pipeline-owner-api.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-pipeline-owner-repair-v2
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install explicit package exports
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/collection_application/src/collection_application/pipeline_advancement.py
          test -f packages/collection_application/src/collection_application/pipeline_supervision.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          def definitions(path: str) -> set[str]:
              tree = ast.parse(Path(path).read_text(encoding="utf-8"))
              return {
                  node.name
                  for node in tree.body
                  if isinstance(node, (ast.ClassDef, ast.FunctionDef))
              }

          def install(
              path: str,
              marker: str,
              imports: list[tuple[str, list[str]]],
          ) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  return
              blocks: list[str] = [marker]
              exported: list[str] = []
              for module, names in imports:
                  if not names:
                      continue
                  exported.extend(names)
                  rendered = "\n".join(f"    {name}," for name in names)
                  blocks.append(f"from {module} import (\n{rendered}\n)")
              blocks.append(
                  "__all__.extend(\n"
                  "    [\n"
                  + "\n".join(f'        "{name}",' for name in exported)
                  + "\n    ]\n"
                  ")"
              )
              target.write_text(
                  text.rstrip() + "\n\n" + "\n".join(blocks) + "\n",
                  encoding="utf-8",
              )

          advancement_path = (
              "packages/collection_application/src/collection_application/"
              "pipeline_advancement.py"
          )
          supervision_path = (
              "packages/collection_application/src/collection_application/"
              "pipeline_supervision.py"
          )
          advancement_definitions = definitions(advancement_path)
          supervision_definitions = definitions(supervision_path)
          desired_advancement = [
              "ApplyPipelineAdvancement",
              "ArtifactIdentity",
              "BlockPipelineAdvancement",
              "ClaimPipelineAdvancement",
              "PipelineAdvancementConflict",
              "PipelineAdvancementLease",
              "PipelineAdvancementService",
              "PipelineAdvancementState",
              "PipelineAdvancementStatus",
              "PipelineBlocker",
              "PipelineTransitionPlan",
              "SucceededWorkOutput",
          ]
          desired_supervision = [
              "PipelinePreviewBlocked",
              "PipelineSupervisorService",
              "PipelineSupervisorTick",
              "PipelineTransitionPreviewer",
              "SuccessfulWorkDiscoveryPort",
          ]
          install(
              "packages/collection_application/src/collection_application/__init__.py",
              "# pipeline-owner-public-api",
              [
                  (
                      "collection_application.pipeline_advancement",
                      [name for name in desired_advancement if name in advancement_definitions],
                  ),
                  (
                      "collection_application.pipeline_supervision",
                      [name for name in desired_supervision if name in supervision_definitions],
                  ),
              ],
          )

          repository_path = (
              "packages/collection_infrastructure/src/collection_infrastructure/"
              "postgres/pipeline_advancement.py"
          )
          catalog_path = (
              "packages/collection_infrastructure/src/collection_infrastructure/"
              "postgres/succeeded_work_catalog.py"
          )
          projection_path = (
              "packages/collection_infrastructure/src/collection_infrastructure/"
              "postgres/pipeline_run_control.py"
          )
          repository_names = sorted(
              name for name in definitions(repository_path) if name.startswith("Postgres")
          )
          catalog_names = sorted(
              name for name in definitions(catalog_path) if name.startswith("Postgres")
          )
          projection_names = (
              sorted(
                  name
                  for name in definitions(projection_path)
                  if name.startswith("Postgres")
              )
              if Path(projection_path).is_file()
              else []
          )
          postgres_exports = repository_names + catalog_names + projection_names
          install(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "__init__.py",
              "# pipeline-postgres-public-api",
              [
                  (
                      "collection_infrastructure.postgres.pipeline_advancement",
                      repository_names,
                  ),
                  (
                      "collection_infrastructure.postgres.succeeded_work_catalog",
                      catalog_names,
                  ),
                  (
                      "collection_infrastructure.postgres.pipeline_run_control",
                      projection_names,
                  ),
              ],
          )
          install(
              "packages/collection_infrastructure/src/collection_infrastructure/__init__.py",
              "# pipeline-infrastructure-public-api",
              [("collection_infrastructure.postgres", postgres_exports)],
          )
          PY

      - name: Prove exported composition boundary
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          files=(
            packages/collection_application/src/collection_application/__init__.py
            packages/collection_infrastructure/src/collection_infrastructure/__init__.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run mypy "${files[@]}"
          uv run python - <<'PY'
          import collection_application as application
          import collection_infrastructure as infrastructure

          assert application.PipelineAdvancementService
          assert application.PipelineSupervisorService
          assert infrastructure.PostgresSucceededWorkCatalog
          PY

      - name: Commit explicit exports
        shell: bash
        run: |
          set -euo pipefail
          git add \
            packages/collection_application/src/collection_application/__init__.py \
            packages/collection_infrastructure/src/collection_infrastructure/__init__.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Refactor (Pipeline): expose explicit owner API"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
