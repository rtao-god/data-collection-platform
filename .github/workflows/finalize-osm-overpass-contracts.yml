name: Finalize OSM Overpass Contracts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-osm-overpass-contracts.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 12

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: true

      - name: Register the OSM connector owner
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          root = Path.cwd()
          pyproject_path = root / "pyproject.toml"
          pyproject = pyproject_path.read_text(encoding="utf-8")
          member = '  "connectors/osm_overpass",\n'
          if '"connectors/osm_overpass"' not in pyproject:
              for anchor in (
                  '  "connectors/manual_import",\n',
                  '  "packages/manual_import_core",\n',
              ):
                  if anchor in pyproject:
                      pyproject = pyproject.replace(anchor, anchor + member, 1)
                      break
              else:
                  marker = "members = [\n"
                  if marker not in pyproject:
                      raise RuntimeError("workspace member list not found")
                  pyproject = pyproject.replace(marker, marker + member, 1)
          pyproject_path.write_text(pyproject, encoding="utf-8")

          architecture_path = root / "tools/architecture_checks/check_dependencies.py"
          source = architecture_path.read_text(encoding="utf-8")
          if "connectors/osm_overpass" not in source:
              tree = ast.parse(source)
              lines = source.splitlines(keepends=True)
              candidates: list[tuple[ast.Call, str]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call) or not hasattr(node, "end_lineno"):
                      continue
                  segment = "".join(lines[node.lineno - 1 : node.end_lineno])
                  if "connectors/manual_import" in segment:
                      candidates.append((node, segment))
              if not candidates:
                  raise RuntimeError("manual connector owner rule not found")
              node, segment = min(candidates, key=lambda item: len(item[1]))
              replacement = (
                  segment.replace(
                      "connectors/manual_import", "connectors/osm_overpass"
                  )
                  .replace("manual-import-connector", "osm-overpass-connector")
                  .replace("manual-import-core", "osm-overpass-connector")
                  .replace("manual_import_core", "osm_overpass")
                  .replace("manual import", "OSM Overpass")
                  .replace("Manual import", "OSM Overpass")
              )
              lines.insert(node.end_lineno, replacement)
              architecture_path.write_text("".join(lines), encoding="utf-8")

          module_path = root / ".codex/modules/osm-overpass.md"
          module_path.write_text(
              """# OSM Overpass owner

          `connectors/osm_overpass` owns deterministic allowlisted query construction and strict response-to-observation contracts.

          - Production code never accepts arbitrary Overpass QL.
          - Geography enters through an approved polygon artifact; no Berlin boundary is fabricated in code.
          - OSM element type and ID remain the source identity.
          - Coordinates, structured address tags, provenance URL, and canonical attribution are preserved.
          - Duplicate identities, unknown fields, missing coordinates, invalid UTF-8/JSON, and size/element-limit violations fail closed.
          - The package performs no network or database I/O.
          """,
              encoding="utf-8",
          )

          status_path = root / "docs/implementation-status.md"
          status = status_path.read_text(encoding="utf-8")
          if "| OSM Overpass contracts |" not in status:
              marker = "| Manual import planning |"
              index = status.find(marker)
              if index < 0:
                  raise RuntimeError("implementation status marker not found")
              line_end = status.find("\n", index) + 1
              row = (
                  "| OSM Overpass contracts | Deterministic polygon/tag queries, "
                  "strict response parsing, OSM identity, coordinates, address, "
                  "provenance, and attribution |\n"
              )
              status = status[:line_end] + row + status[line_end:]
          incomplete = (
              "- OSM/Overpass network worker, approved Berlin polygon, "
              "PostGIS coverage evaluation, and real-source run remain incomplete;\n"
          )
          if incomplete not in status:
              heading = "## Explicitly incomplete\n\n"
              if heading not in status:
                  raise RuntimeError("incomplete section not found")
              status = status.replace(heading, heading + incomplete, 1)
          status_path.write_text(status, encoding="utf-8")
          PY

      - name: Lock and restore the exact workspace
        run: |
          uv lock
          uv sync --frozen --all-packages --dev

      - name: Format and apply safe lint fixes
        run: |
          uv run ruff format .
          uv run ruff check --fix .

      - name: Verify the contract owner
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration and not object_store_integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps packages connectors

      - name: Commit the verified owner tree
        run: |
          rm .github/workflows/finalize-osm-overpass-contracts.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Feature (OSM Overpass): add strict query contracts'
          git push origin HEAD:main
