name: Reconcile Artifact Completion 20260812

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-artifact-completion-20260812.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Reconcile production owners
        run: |
          if test ! -f database/migrations/versions/20260812_0007_artifact_completion.py; then
            test -f tools/apply_artifact_completion_core_20260812.py
            test -f tools/apply_artifact_completion_tests_20260812.py
            test -f tools/apply_artifact_gateway_tests_20260812.py
            uv run python tools/apply_artifact_completion_core_20260812.py
            uv run python tools/apply_artifact_completion_tests_20260812.py
            uv run python tools/apply_artifact_gateway_tests_20260812.py
          fi
          uv run ruff check --fix .
          uv run ruff format .
          uv run python tools/contract_generation/generate.py

      - name: Verify complete repository
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps database packages tools
          uv run collector config validate berlin_recording_services
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          docker build --file deploy/docker/collector-cli.Dockerfile .
          docker build --file deploy/docker/migration.Dockerfile .
          docker build --file deploy/docker/worker-gateway.Dockerfile .

      - name: Seal production tree and remove temporary paths
        run: |
          rm -f \
            tools/apply_artifact_foundation_20260812.py \
            tools/apply_artifact_completion_core_20260812.py \
            tools/apply_artifact_completion_tests_20260812.py \
            tools/apply_artifact_gateway_tests_20260812.py \
            .github/workflows/apply-artifact-foundation-20260812.yml \
            .github/workflows/apply-artifact-completion-20260812.yml \
            .github/workflows/reconcile-artifact-completion-20260812.yml
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit \
            -m "Build (Safety): seal verified artifact completion tree" \
            -m "Owner layer: permanent repository safety and proof boundary." \
            -m "Root cause: bounded implementation executors must not survive after the artifact owner reaches a proven state." \
            -m "Replacement: retain only production contracts, migrations, adapters, generated artifacts, tests, and permanent read-only CI." \
            -m "Proof target: complete repository gates and a subsequent permanent CI run on the sealed main tree."
          git push origin HEAD:main
