name: Extraction Worker Isolation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/extraction-worker-isolation.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - apps/extraction_worker/**
      - packages/extraction_core/**
      - packages/normalization_core/**
      - packages/observation_contracts/**
      - packages/source_connector_sdk/**
      - deploy/docker/extraction-worker.Dockerfile
  pull_request:
    paths:
      - .github/workflows/extraction-worker-isolation.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - apps/extraction_worker/**
      - packages/extraction_core/**
      - packages/normalization_core/**
      - packages/observation_contracts/**
      - packages/source_connector_sdk/**
      - deploy/docker/extraction-worker.Dockerfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-isolation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build capability-minimal extraction image
        run: >-
          docker build
          --tag data-collection-platform/extraction-worker:ci
          --file deploy/docker/extraction-worker.Dockerfile
          .

      - name: Verify runtime identity and entrypoint
        shell: bash
        run: |
          set -euo pipefail
          image="data-collection-platform/extraction-worker:ci"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image")" = "extraction-worker"

      - name: Verify extraction ownership and forbidden dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --entrypoint python \
            data-collection-platform/extraction-worker:ci \
            - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          import_module("extraction_worker")
          import_module("extraction_core")
          import_module("normalization_core")
          import_module("observation_contracts")
          import_module("phonenumbers")

          forbidden = {
              "alembic",
              "boto3",
              "botocore",
              "playwright",
              "psycopg",
              "scrapy",
              "sqlalchemy",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit(
                  "extraction worker image contains forbidden dependencies: "
                  + ", ".join(present)
              )
          PY
