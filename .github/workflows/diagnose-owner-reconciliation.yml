name: Diagnose Owner Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-owner-reconciliation.yml

permissions:
  contents: write

env:
  DIAGNOSTIC_DIR: .artifact/owner-reconciliation

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Execute deterministic gates
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAGNOSTIC_DIR"
          : > "$DIAGNOSTIC_DIR/summary.tsv"
          run_gate() {
            local name="$1"
            shift
            set +e
            "$@" > "$DIAGNOSTIC_DIR/${name}.log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$DIAGNOSTIC_DIR/summary.tsv"
          }
          run_gate lock uv lock --check
          run_gate contracts uv run python tools/contract_generation/generate.py --check
          run_gate format uv run ruff format --check .
          run_gate lint uv run ruff check .
          run_gate mypy uv run mypy
          run_gate collect uv run pytest -q --collect-only
          run_gate unit uv run pytest -q -m 'not integration'
          run_gate architecture uv run python tools/architecture_checks/check_dependencies.py
          run_gate compile uv run python -m compileall -q apps connectors database packages tools
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.artifact/owner-reconciliation')
          rows = []
          for line in (root / 'summary.tsv').read_text(encoding='utf-8').splitlines():
              name, code = line.split('\t', 1)
              rows.append({'gate': name, 'returnCode': int(code)})
          (root / 'summary.json').write_text(
              json.dumps({'gates': rows}, indent=2), encoding='utf-8'
          )
          PY

      - name: Upload exact diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: data-collection-platform-owner-reconciliation
          path: .artifact/owner-reconciliation
          retention-days: 1

      - name: Remove diagnostics workflow
        if: always()
        run: |
          set -euo pipefail
          git rm .github/workflows/diagnose-owner-reconciliation.yml
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'Build (Diagnostics): remove owner reconciliation runner'
          git push origin HEAD:main
