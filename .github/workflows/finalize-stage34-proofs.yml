name: Finalize Stage 3-4 Proofs

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage34-proof-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Record exact successful permanent proofs
        if: github.event.workflow_run.conclusion == 'success'
        shell: bash
        env:
          VERIFIED_HEAD: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD"
          test -f docs/proofs/reconciled-baseline.md
          test -f docs/proofs/worker-image-isolation.md
          grep -q 'Build isolated worker images' .github/workflows/ci.yml
          grep -q 'Verify worker image capability inventory' .github/workflows/ci.yml
          cat > docs/proofs/reconciled-baseline-ci.md <<EOF
          # Reconciled baseline permanent CI proof

          - workflow: \`Verify\`
          - conclusion: \`success\`
          - verified head: \`${VERIFIED_HEAD}\`
          - workflow run: \`${VERIFIED_RUN}\`
          EOF
          cat > docs/proofs/worker-image-isolation-ci.md <<EOF
          # Worker image permanent CI proof

          - workflow: \`Verify\`
          - conclusion: \`success\`
          - verified head: \`${VERIFIED_HEAD}\`
          - workflow run: \`${VERIFIED_RUN}\`
          - manual-import worker: built and inventoried
          - OSM worker: built and inventoried
          EOF

      - name: Remove finalizer and commit exact result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/finalize-stage34-proofs.yml
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -f docs/proofs/reconciled-baseline-ci.md ] && \
             [ -f docs/proofs/worker-image-isolation-ci.md ]; then
            git commit -m 'CI (Stage 3-4): finalize exact-head proofs'
          else
            git commit -m 'Build (Tooling): remove unsuccessful Stage 3-4 finalizer'
          fi
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
