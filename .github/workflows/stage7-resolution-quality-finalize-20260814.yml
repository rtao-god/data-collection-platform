name: Finalize Stage 7 Resolution and Quality

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage7-resolution-quality-finalize-20260814.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage7-resolution-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Verify exact Stage 7 owner block
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/resolution_contracts/src/resolution_contracts/contracts.py
          test -f packages/entity_resolution_core/src/entity_resolution_core/engine.py
          test -f packages/quality_core/src/quality_core/evaluation.py
          test -f tools/resolution_contract_generation/generate.py
          test -f contracts/resolution/manifest.json
          test -f docs/specifications/stage7-resolution-quality.md
          uv sync --frozen --all-packages --dev
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/resolution_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest packages/resolution_contracts/tests packages/entity_resolution_core/tests packages/quality_core/tests tools/resolution_contract_generation/tests
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

      - name: Record exact-subject proof and remove non-workflow apply scripts
        shell: bash
        run: |
          set -euo pipefail
          subject_sha="$GITHUB_SHA"
          mkdir -p docs/proofs
          cat > docs/proofs/stage7-resolution-quality-ci.md <<EOF
          # Stage 7 resolution and quality CI proof

          - Status: proven
          - Repository: rtao-god/data-collection-platform
          - Branch: main
          - Subject commit: \`$subject_sha\`
          - Finalizer workflow run: \`$GITHUB_RUN_ID\`
          - Event: \`$GITHUB_EVENT_NAME\`

          The exact subject commit passed frozen workspace restore, lock consistency,
          both generated-contract drift checks, Ruff formatting and lint, strict mypy,
          focused Stage 7 tests, the complete non-integration suite, fail-closed
          dependency-boundary checks, and owned Python compilation.

          Proven owners:

          - \`resolution_contracts\`: versioned deterministic pair, cluster, batch, and quality contracts;
          - \`entity_resolution_core\`: name-only non-merge, evidence-based pair decisions,
            transitivity-safe clustering, and reversible split lineage;
          - \`quality_core\`: fail-closed quality and export-eligibility evaluation.

          PostgreSQL candidate persistence, review workflow, Control API, and sealed export
          remain separate downstream owners and are not claimed by this proof.
          EOF
          if test -d .github/stage7_apply_20260814; then
            git rm -r .github/stage7_apply_20260814
          fi
          git add docs/proofs/stage7-resolution-quality-ci.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Proofs): record Stage 7 resolution and quality"
          git push origin HEAD:main
