name: Apply Artifact Owner Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-artifact-owner-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply exact owner patch
        run: |
          cat .codex/owner-patch/part-* > /tmp/artifact-owner.patch.b64
          base64 --decode /tmp/artifact-owner.patch.b64 | gzip --decompress > /tmp/artifact-owner.patch
          git apply --check /tmp/artifact-owner.patch
          git apply /tmp/artifact-owner.patch

      - name: Resolve exact dependency graph
        run: uv lock

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Format owned source
        run: uv run ruff format .

      - name: Regenerate owner contracts
        run: uv run python tools/contract_generation/generate.py

      - name: Verify lock consistency
        run: uv lock --check

      - name: Verify generated contract drift
        run: uv run python tools/contract_generation/generate.py --check

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Run non-integration tests
        run: uv run pytest -m "not integration"

      - name: Verify dependency boundaries
        run: uv run python tools/architecture_checks/check_dependencies.py

      - name: Compile owned Python
        run: uv run python -m compileall -q apps database packages tools

      - name: Validate first campaign snapshot
        run: uv run collector config validate berlin_recording_services

      - name: Commit owner-correct source
        run: |
          rm -rf .codex/owner-patch .github/workflows/apply-artifact-owner-patch.yml
          git add -A
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit --no-verify \
            -m "Feat (Artifacts): complete lease-scoped object protocol" \
            -m "Owner layer: Worker Gateway, Work Engine, Artifact Transfer, and S3-compatible Object Store." \
            -m "Root cause: artifact upload code existed without a complete dependency graph, input bindings, transport routes, or atomic completion contract." \
            -m "Replacement: exact lease-scoped upload/read contracts, verified artifact bindings, content-addressed object reuse, and one-transaction metadata plus work completion." \
            -m "Proof target: strict typing, non-integration tests, architecture checks, generated-contract drift, and the permanent PostgreSQL integration workflow."
          git push origin HEAD:main
