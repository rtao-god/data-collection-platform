name: Apply HTTP Acquisition Payload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-http-acquisition-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-http-acquisition-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Download immutable transfer payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download stage5-transfer-20260814 \
            --repo rtao-god/data-collection-platform \
            --pattern stage5-production.tar.gz \
            --dir /tmp/stage5-transfer
          test -s /tmp/stage5-transfer/stage5-production.tar.gz

      - name: Apply and prove production owners
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/stage5-transfer/stage5-production.tar.gz -C .

          rm -f .codex/stage5-write-probe.txt \
                .codex/stage5-bulk-probe.txt \
                .codex/stage5-transfer-readme.txt \
                .codex/stage5-transfer-manifest.txt \
                .codex/stage5-transfer-intent.txt \
                .codex/stage5-transfer-stop.txt \
                .codex/bulk-tool-discovery.txt \
                .codex/push-files-discovery.txt \
                .codex/stage5-transfer-pending.txt
          rmdir .codex 2>/dev/null || true

          uv sync --frozen --all-packages --dev
          uv lock --check
          uv run python tools/http_acquisition_contract_generation/generate.py --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration and not object_store_integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
          docker build --tag data-collection-platform/http-worker:apply --file deploy/docker/http-worker.Dockerfile .

          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/http-worker:apply)" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' data-collection-platform/http-worker:apply)" = "http-worker"
          docker run --rm -i --entrypoint python data-collection-platform/http-worker:apply - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          for name in (
              "http_worker",
              "official_website_http",
              "source_connector_sdk",
              "scrapy",
          ):
              import_module(name)

          forbidden = {
              "alembic",
              "boto3",
              "botocore",
              "playwright",
              "psycopg",
              "sqlalchemy",
          }
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit("forbidden HTTP worker dependencies: " + ", ".join(present))
          PY

      - name: Commit proven production diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No production diff remains to apply."
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Feature (HTTP acquisition): add official website worker"
          git push origin HEAD:main
