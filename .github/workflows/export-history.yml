name: Export Repository History

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-history.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 100

      - name: Create repository bundle
        run: git bundle create "$RUNNER_TEMP/data-collection-platform.bundle" --all

      - name: Upload repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: data-collection-platform-history
          path: ${{ runner.temp }}/data-collection-platform.bundle
          retention-days: 1
