name: End-to-End Closure Controller V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/end-to-end-controller-v2.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-end-to-end-controller-v2
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Execute dependency-ordered closure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          mutators='[
            "Commit Pipeline Owner Production Patch",
            "Fix Pipeline Catalog Types",
            "Export Pipeline Owner API",
            "Finalize Pipeline Advancement Owner",
            "Restore Operational E2E",
            "Restore Operational E2E Fallback",
            "Download and Persistence E2E V2"
          ]'

          refresh() {
            git fetch origin main
            git reset --hard origin/main
          }

          wait_idle() {
            for _ in $(seq 1 540); do
              payload="$(curl -fsSL "${headers[@]}" \
                "$api/actions/runs?branch=main&per_page=100")"
              active="$(jq --argjson names "$mutators" \
                '[.workflow_runs[] | select(.name as $name | $names | index($name)) |
                  select(.status != "completed")] | length' <<<"$payload")"
              [[ "$active" == 0 ]] && return 0
              sleep 10
            done
            return 1
          }

          dispatch_wait() {
            local workflow="$1"
            local started payload run_id status conclusion
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            curl -fsSL -X POST "${headers[@]}" \
              "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
            for _ in $(seq 1 540); do
              payload="$(curl -fsSL "${headers[@]}" \
                "$api/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=30")"
              run_id="$(jq -r --arg started "$started" \
                '.workflow_runs[] | select(.created_at >= $started) | .id' \
                <<<"$payload" | head -1)"
              status="$(jq -r --arg started "$started" \
                '.workflow_runs[] | select(.created_at >= $started) | .status' \
                <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg started "$started" \
                '.workflow_runs[] | select(.created_at >= $started) | .conclusion' \
                <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == completed ]]; then
                printf '%s\t%s\n' "$run_id" "$conclusion"
                return 0
              fi
              sleep 10
            done
            printf '%s\ttimeout\n' "${run_id:-unknown}"
          }

          pipeline_proven() {
            test -f docs/proofs/pipeline-advancement-ci.md \
              && grep -Fq -- '- Status: proven' docs/proofs/pipeline-advancement-ci.md
          }

          operational_complete() {
            local path
            for path in \
              apps/review_web/package-lock.json \
              apps/browser_worker/pyproject.toml \
              packages/export_core/src/export_core/service.py \
              apps/retention_job/pyproject.toml \
              apps/orchestrator/pyproject.toml \
              tools/operations/backup_restore.py \
              deploy/compose/application.yaml; do
              test -f "$path" || return 1
            done
          }

          data_flow_proven() {
            test -f docs/proofs/download-persistence-e2e-ci.md \
              && grep -Fq -- '- Status: proven' \
                docs/proofs/download-persistence-e2e-ci.md
          }

          wait_idle
          refresh

          if ! pipeline_proven; then
            dispatch_wait commit-pipeline-owner-production.yml \
              > "$RUNNER_TEMP/production.tsv"
            wait_idle
            refresh
            dispatch_wait fix-pipeline-catalog-types.yml \
              > "$RUNNER_TEMP/types.tsv"
            wait_idle
            refresh
            dispatch_wait export-pipeline-owner-api.yml \
              > "$RUNNER_TEMP/exports.tsv"
            wait_idle
            refresh
            dispatch_wait pipeline-owner-finalize.yml \
              > "$RUNNER_TEMP/pipeline-finalizer.tsv"
            wait_idle
            refresh
          fi

          if pipeline_proven && ! operational_complete; then
            dispatch_wait restore-operational-e2e.yml \
              > "$RUNNER_TEMP/restore.tsv"
            wait_idle
            refresh
            if ! operational_complete; then
              dispatch_wait restore-operational-e2e-fallback.yml \
                > "$RUNNER_TEMP/fallback.tsv"
              wait_idle
              refresh
            fi
          fi

          if pipeline_proven && operational_complete && ! data_flow_proven; then
            dispatch_wait data-flow-e2e-ci-v2.yml \
              > "$RUNNER_TEMP/data-flow.tsv"
            wait_idle
            refresh
          fi

          mkdir -p docs/proofs docs/diagnostics
          current_head="$(git rev-parse HEAD)"
          if pipeline_proven && operational_complete && data_flow_proven; then
            cat > docs/proofs/end-to-end-operational-ci.md <<EOF
          # End-to-end operational CI proof

          - Status: proven
          - Repository: rtao-god/data-collection-platform
          - Branch: main
          - Verified tree head: \`$current_head\`
          - Controller run: \`${{ github.run_id }}\`

          ## Proven result

          - durable pipeline advancement uses canonical work and artifact ownership;
          - the operational tree contains review web, isolated browser worker, deterministic sealed export, retention, orchestration, backup/restore, and full application Compose owners;
          - a deterministic real HTTP fixture is downloaded and persisted through the S3-compatible immutable object path with PostgreSQL metadata and lineage;
          - production Berlin geography and source approvals remain explicit external readiness inputs and are not fabricated by this proof.
          EOF
            rm -f docs/diagnostics/end-to-end-controller-v2-latest.md
          else
            runs="$(curl -fsSL "${headers[@]}" \
              "$api/actions/runs?branch=main&per_page=100")"
            {
              echo '# End-to-end controller V2 state'
              echo
              echo "- main HEAD: \`$current_head\`"
              echo "- pipeline proof: \`$(pipeline_proven && echo true || echo false)\`"
              echo "- operational inventory: \`$(operational_complete && echo true || echo false)\`"
              echo "- download/persistence proof: \`$(data_flow_proven && echo true || echo false)\`"
              echo
              echo '## Latest failed steps'
              echo
              for workflow in \
                commit-pipeline-owner-production.yml \
                fix-pipeline-catalog-types.yml \
                export-pipeline-owner-api.yml \
                pipeline-owner-finalize.yml \
                restore-operational-e2e.yml \
                restore-operational-e2e-fallback.yml \
                data-flow-e2e-ci-v2.yml; do
                run="$(curl -fsSL "${headers[@]}" \
                  "$api/actions/workflows/$workflow/runs?branch=main&per_page=1")"
                run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$run")"
                conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$run")"
                [[ -n "$run_id" ]] || continue
                jobs="$(curl -fsSL "${headers[@]}" \
                  "$api/actions/runs/$run_id/jobs?per_page=100")"
                failed_step="$(jq -r '.jobs[] | select(.conclusion == "failure") |
                  .steps[] | select(.conclusion == "failure") | .name' \
                  <<<"$jobs" | head -1)"
                echo "- \`$workflow\` run \`$run_id\`: \`$conclusion\`; step: \`${failed_step:-none}\`"
              done
            } > docs/diagnostics/end-to-end-controller-v2-latest.md
          fi

      - name: Publish proof or exact state
        shell: bash
        run: |
          set -euo pipefail
          git add docs/proofs/end-to-end-operational-ci.md \
            docs/diagnostics/end-to-end-controller-v2-latest.md 2>/dev/null || true
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if git diff --cached --name-only | grep -Fq \
            docs/proofs/end-to-end-operational-ci.md; then
            message='Docs (Proofs): close operational E2E'
          else
            message='Docs (Diagnostics): record E2E controller state'
          fi
          git commit -m "$message"
          git fetch origin main
          if test "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)"; then
            git reset --soft origin/main
            git commit -m "$message"
          fi
          git push origin HEAD:main
