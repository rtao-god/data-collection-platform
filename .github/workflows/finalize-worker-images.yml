name: Finalize Worker Images

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: finalize-worker-images-main
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 3

      - name: Seal successful worker image proof
        env:
          VERIFIED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
          VERIFIED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$VERIFIED_CONCLUSION" = success ] \
             && [ -f deploy/docker/osm-worker.Dockerfile ] \
             && grep -q 'Verify OSM Worker capability inventory' .github/workflows/ci.yml; then
            mkdir -p docs/proofs
            cat > docs/proofs/worker-images-ci.md <<EOF
          # Isolated worker images permanent CI proof

          - verified head: \`${VERIFIED_HEAD_SHA}\`
          - workflow: \`Verify\`
          - workflow run: \`${VERIFIED_RUN_ID}\`
          - conclusion: \`success\`
          - manual-import worker capability inventory: \`passed\`
          - OSM worker capability inventory: \`passed\`
          EOF
          fi
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -print0 | xargs -0 -r git rm -f
          git diff --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'CI (Workers): finalize isolated image proof'
            git push origin HEAD:main
          fi
