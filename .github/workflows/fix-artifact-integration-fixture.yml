name: Repair Artifact Storage Constraint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-artifact-integration-fixture.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Repair artifact storage owner and fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          fixture_path = Path("database/tests/test_artifact_transfer_runtime.py")
          fixture = fixture_path.read_text(encoding="utf-8")
          fixture_replacements = {
              '_label("artifact-flow")': '_label("artifact_flow")',
              '_label("artifact-unverified")': '_label("artifact_unverified")',
              '_label("artifact-dedup")': '_label("artifact_dedup")',
          }
          for before, after in fixture_replacements.items():
              if fixture.count(before) != 1:
                  raise SystemExit(f"expected exactly one fixture identity: {before}")
              fixture = fixture.replace(before, after)
          fixture_path.write_text(fixture, encoding="utf-8")

          metadata_path = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "artifact_metadata.py"
          )
          metadata = metadata_path.read_text(encoding="utf-8")
          replacements = {
              '''    sa.CheckConstraint(
                  "staging_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,511}$' AND "
                  "(final_reference IS NULL OR "
                  "final_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,511}$')",
                  name="ck_artifact_uploads_storage_reference",
              ),''': '''    sa.CheckConstraint(
                  "char_length(staging_reference) BETWEEN 1 AND 512 AND "
                  "staging_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]*$' AND "
                  "(final_reference IS NULL OR ("
                  "char_length(final_reference) BETWEEN 1 AND 512 AND "
                  "final_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]*$'))",
                  name="ck_artifact_uploads_storage_reference",
              ),''',
              '''    sa.CheckConstraint(
                  "storage_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,511}$'",
                  name="ck_artifact_objects_storage_reference",
              ),''': '''    sa.CheckConstraint(
                  "char_length(storage_reference) BETWEEN 1 AND 512 AND "
                  "storage_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]*$'",
                  name="ck_artifact_objects_storage_reference",
              ),''',
          }
          for before, after in replacements.items():
              if metadata.count(before) != 1:
                  raise SystemExit("expected exactly one artifact metadata constraint target")
              metadata = metadata.replace(before, after)
          metadata_path.write_text(metadata, encoding="utf-8")

          migration = '''\
          """Use PostgreSQL-compatible artifact storage-reference constraints.

          Revision ID: 20260812_0007
          Revises: 20260812_0006
          Create Date: 2026-08-12
          """

          from __future__ import annotations

          from collections.abc import Sequence

          from alembic import op

          revision: str = "20260812_0007"
          down_revision: str | None = "20260812_0006"
          branch_labels: str | Sequence[str] | None = None
          depends_on: str | Sequence[str] | None = None


          def upgrade() -> None:
              op.drop_constraint(
                  "ck_artifact_uploads_storage_reference",
                  "artifact_uploads",
                  schema="sources",
                  type_="check",
              )
              op.create_check_constraint(
                  "ck_artifact_uploads_storage_reference",
                  "artifact_uploads",
                  """
                  char_length(staging_reference) BETWEEN 1 AND 512
                  AND staging_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]*$'
                  AND (
                      final_reference IS NULL
                      OR (
                          char_length(final_reference) BETWEEN 1 AND 512
                          AND final_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]*$'
                      )
                  )
                  """,
                  schema="sources",
              )
              op.drop_constraint(
                  "ck_artifact_objects_storage_reference",
                  "artifact_objects",
                  schema="sources",
                  type_="check",
              )
              op.create_check_constraint(
                  "ck_artifact_objects_storage_reference",
                  "artifact_objects",
                  """
                  char_length(storage_reference) BETWEEN 1 AND 512
                  AND storage_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]*$'
                  """,
                  schema="sources",
              )


          def downgrade() -> None:
              op.drop_constraint(
                  "ck_artifact_objects_storage_reference",
                  "artifact_objects",
                  schema="sources",
                  type_="check",
              )
              op.create_check_constraint(
                  "ck_artifact_objects_storage_reference",
                  "artifact_objects",
                  "storage_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,511}$'",
                  schema="sources",
              )
              op.drop_constraint(
                  "ck_artifact_uploads_storage_reference",
                  "artifact_uploads",
                  schema="sources",
                  type_="check",
              )
              op.create_check_constraint(
                  "ck_artifact_uploads_storage_reference",
                  "artifact_uploads",
                  """
                  staging_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,511}$'
                  AND (
                      final_reference IS NULL
                      OR final_reference ~ '^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,511}$'
                  )
                  """,
                  schema="sources",
              )
          '''
          migration = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in migration.splitlines()
          ) + "\n"
          migration_path = Path(
              "database/migrations/versions/20260812_0007_artifact_storage_references.py"
          )
          if migration_path.exists():
              raise SystemExit(f"migration already exists: {migration_path}")
          migration_path.write_text(migration, encoding="utf-8")
          PY

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Normalize owned source
        run: |
          uv run ruff check --fix .
          uv run ruff format .

      - name: Verify formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Apply fresh database migration
        run: uv run collection-migrate upgrade head

      - name: Verify all PostgreSQL contracts
        run: uv run pytest -m integration database/tests

      - name: Commit owner repair
        run: |
          rm .github/workflows/fix-artifact-integration-fixture.yml
          git add -A
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit --no-verify \
            -m "Fix (Artifacts): enforce portable storage references" \
            -m "Owner layer: PostgreSQL artifact schema and integration proof." \
            -m "Root cause: storage-reference checks used a repetition bound of 511, which PostgreSQL accepts as DDL text but rejects when evaluating the regular expression." \
            -m "Replacement: enforce the 512-character limit with char_length and keep the character allowlist in an unbounded PostgreSQL-compatible regular expression." \
            -m "Proof target: strict typing, fresh migration, and the complete PostgreSQL integration suite."
          git push origin HEAD:main
