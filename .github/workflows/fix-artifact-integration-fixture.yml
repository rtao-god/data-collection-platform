name: Fix Artifact Integration Fixture

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-artifact-integration-fixture.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Correct contract-invalid fixture identities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("database/tests/test_artifact_transfer_runtime.py")
          content = path.read_text(encoding="utf-8")
          replacements = {
              '_label("artifact-flow")': '_label("artifact_flow")',
              '_label("artifact-unverified")': '_label("artifact_unverified")',
              '_label("artifact-dedup")': '_label("artifact_dedup")',
          }
          for before, after in replacements.items():
              if content.count(before) != 1:
                  raise SystemExit(f"expected exactly one fixture identity: {before}")
              content = content.replace(before, after)
          path.write_text(content, encoding="utf-8")
          PY

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Apply fresh database migration
        run: uv run collection-migrate upgrade head

      - name: Verify all PostgreSQL contracts
        run: uv run pytest -m integration database/tests

      - name: Commit verified fixture correction
        run: |
          rm .github/workflows/fix-artifact-integration-fixture.yml
          git add -A
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit --no-verify \
            -m "Test (Artifacts): use contract-valid campaign fixtures" \
            -m "Owner layer: PostgreSQL artifact integration proof." \
            -m "Root cause: three artifact fixtures embedded hyphens in campaign keys although the canonical campaign-key contract permits lowercase letters, digits, and underscores." \
            -m "Replacement: keep fixture uniqueness while using contract-valid underscore labels; the production database constraint remains unchanged." \
            -m "Proof target: fresh migration and the complete PostgreSQL integration suite."
          git push origin HEAD:main
