name: Repair Pipeline Advancement Owner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-operational-production-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-pipeline-owner-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Materialize canonical pipeline storage adapter
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          metadata = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/"
              "postgres/pipeline_advancement_metadata.py"
          )
          metadata_text = metadata.read_text(encoding="utf-8")
          metadata_text = metadata_text.replace(
              'sa.Column("work_unit_id", sa.Uuid(), primary_key=True)',
              'sa.Column("work_id", sa.Uuid(), primary_key=True)',
          )
          metadata_text = metadata_text.replace(
              "_work_units.c.work_unit_id",
              "_work_units.c.work_id",
          )
          if "_work_units.c.work_unit_id" in metadata_text:
              raise RuntimeError("obsolete pipeline metadata work identity remains")
          if "_work_units.c.work_id" not in metadata_text:
              raise RuntimeError("canonical pipeline metadata work identity is missing")
          metadata.write_text(metadata_text, encoding="utf-8")

          migration = Path(
              "database/migrations/versions/20260815_0013_pipeline_advancement.py"
          )
          migration_text = migration.read_text(encoding="utf-8")
          migration_text = migration_text.replace(
              '"work.work_units.work_unit_id"',
              '"work.work_units.work_id"',
          )
          if '"work.work_units.work_unit_id"' in migration_text:
              raise RuntimeError("obsolete pipeline migration work identity remains")
          if '"work.work_units.work_id"' not in migration_text:
              raise RuntimeError("canonical pipeline migration work identity is missing")
          migration.write_text(migration_text, encoding="utf-8")

          supervision_test = Path(
              "packages/collection_application/tests/test_pipeline_supervision.py"
          )
          supervision_text = supervision_test.read_text(encoding="utf-8")
          constants_anchor = (
              "        expires_at_utc=_NOW + timedelta(minutes=5),\n"
              "    )\n\n\n"
              "def _status(\n"
          )
          constants_replacement = (
              "        expires_at_utc=_NOW + timedelta(minutes=5),\n"
              "    )\n\n\n"
              "_DEFAULT_SOURCES = (_source(),)\n"
              "_DEFAULT_LEASE = _lease()\n\n\n"
              "def _status(\n"
          )
          if "_DEFAULT_SOURCES = (_source(),)" not in supervision_text:
              if constants_anchor not in supervision_text:
                  raise RuntimeError("pipeline supervision constants anchor is missing")
              supervision_text = supervision_text.replace(
                  constants_anchor,
                  constants_replacement,
                  1,
              )
          discovery_old = (
              "class Discovery:\n"
              "    def __init__(self, sources=(_source(),)) -> None:\n"
              "        self.sources = sources\n"
          )
          discovery_new = (
              "class Discovery:\n"
              "    def __init__(\n"
              "        self,\n"
              "        sources: tuple[SucceededWorkOutput, ...] = _DEFAULT_SOURCES,\n"
              "    ) -> None:\n"
              "        self.sources = sources\n"
          )
          if discovery_old in supervision_text:
              supervision_text = supervision_text.replace(
                  discovery_old,
                  discovery_new,
                  1,
              )
          elif "sources: tuple[SucceededWorkOutput, ...] = _DEFAULT_SOURCES" not in supervision_text:
              raise RuntimeError("pipeline supervision discovery signature is missing")
          port_old = (
              "class Port:\n"
              "    def __init__(self, *, lease=_lease()) -> None:\n"
              "        self.lease = lease\n"
          )
          port_new = (
              "class Port:\n"
              "    def __init__(\n"
              "        self,\n"
              "        *,\n"
              "        lease: PipelineAdvancementLease | None = _DEFAULT_LEASE,\n"
              "    ) -> None:\n"
              "        self.lease = lease\n"
          )
          if port_old in supervision_text:
              supervision_text = supervision_text.replace(port_old, port_new, 1)
          elif "lease: PipelineAdvancementLease | None = _DEFAULT_LEASE" not in supervision_text:
              raise RuntimeError("pipeline supervision port signature is missing")
          supervision_test.write_text(supervision_text, encoding="utf-8")
          PY

          cat > packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py <<'PYFILE'
          from __future__ import annotations

          from dataclasses import dataclass
          from uuid import UUID

          import sqlalchemy as sa
          from collection_application.pipeline_advancement import (
              ArtifactIdentity,
              PipelineAdvancementConflict,
              SucceededWorkOutput,
          )
          from collection_domain import WorkStage
          from sqlalchemy.engine import Connection, Engine, RowMapping
          from sqlalchemy.exc import SQLAlchemyError

          from collection_infrastructure.postgres.artifact_metadata import (
              artifact_objects,
              artifact_records,
              work_input_artifacts,
              work_output_artifacts,
          )
          from collection_infrastructure.postgres.pipeline_advancement_metadata import (
              pipeline_advancements,
          )
          from collection_infrastructure.postgres.work_metadata import stage_runs, work_units


          @dataclass(frozen=True, slots=True)
          class _BoundArtifact:
              position: int
              artifact: ArtifactIdentity


          class PostgresSucceededWorkCatalog:
              """Canonical succeeded-work reader over the explicit physical schema."""

              def __init__(self, engine: Engine) -> None:
                  self._engine = engine

              def __call__(
                  self,
                  connection: Connection,
                  source_work_unit_id: UUID,
              ) -> SucceededWorkOutput:
                  return self.read(connection, source_work_unit_id)

              def read(
                  self,
                  connection: Connection,
                  source_work_unit_id: UUID,
              ) -> SucceededWorkOutput:
                  work = (
                      connection.execute(
                          sa.select(work_units)
                          .where(work_units.c.work_id == source_work_unit_id)
                          .with_for_update(read=True)
                      )
                      .mappings()
                      .one_or_none()
                  )
                  if work is None:
                      raise _catalog_conflict(
                          "PIPELINE_SOURCE_WORK_NOT_FOUND",
                          "The source work unit does not exist.",
                          source_work_unit_id,
                          "Refresh canonical work state and select an existing successful work unit.",
                      )
                  if _required_text(work, "state") != "succeeded":
                      raise _catalog_conflict(
                          "PIPELINE_SOURCE_WORK_NOT_SUCCEEDED",
                          "Pipeline advancement accepts only successfully completed work.",
                          source_work_unit_id,
                          "Wait for canonical successful completion before registering advancement.",
                      )

                  run_id = _required_uuid(work, "run_id")
                  stage_run_id = _required_uuid(work, "stage_run_id")
                  stage_row = (
                      connection.execute(
                          sa.select(stage_runs).where(
                              stage_runs.c.stage_run_id == stage_run_id
                          )
                      )
                      .mappings()
                      .one_or_none()
                  )
                  if stage_row is None:
                      raise _catalog_conflict(
                          "PIPELINE_STAGE_OWNER_NOT_FOUND",
                          "The successful work has no canonical stage owner.",
                          source_work_unit_id,
                          "Repair stage ownership before advancing the successful output.",
                      )
                  if _required_uuid(stage_row, "run_id") != run_id:
                      raise _catalog_conflict(
                          "PIPELINE_STAGE_RUN_CONFLICT",
                          "The work and stage owners belong to different collection runs.",
                          source_work_unit_id,
                          "Repair the corrupted run/stage ownership before advancement.",
                      )

                  inputs = _load_artifacts(
                      connection,
                      work_input_artifacts,
                      source_work_unit_id,
                  )
                  outputs = _load_artifacts(
                      connection,
                      work_output_artifacts,
                      source_work_unit_id,
                  )
                  if len(outputs) != 1:
                      raise PipelineAdvancementConflict(
                          code="PIPELINE_OUTPUT_ARTIFACT_CARDINALITY",
                          message=(
                              "Successful work must bind exactly one canonical output artifact."
                          ),
                          context={
                              "sourceWorkUnitId": str(source_work_unit_id),
                              "outputArtifactCount": len(outputs),
                          },
                          required_action=(
                              "Repair work completion so the exact output contract has one "
                              "canonical artifact."
                          ),
                      )

                  identities = tuple(
                      item.artifact.artifact_id for item in (*inputs, *outputs)
                  )
                  if len(identities) != len(set(identities)):
                      raise _catalog_conflict(
                          "PIPELINE_ARTIFACT_BINDING_DUPLICATE",
                          "Successful work contains duplicate or conflicting artifact bindings.",
                          source_work_unit_id,
                          "Repair immutable input/output bindings before advancement.",
                      )

                  output_digest = _required_text(work, "output_digest")
                  if output_digest != outputs[0].artifact.content_digest:
                      raise PipelineAdvancementConflict(
                          code="PIPELINE_OUTPUT_DIGEST_CONFLICT",
                          message=(
                              "The work completion digest differs from its canonical output artifact."
                          ),
                          context={
                              "sourceWorkUnitId": str(source_work_unit_id),
                              "workOutputDigest": output_digest,
                              "artifactDigest": outputs[0].artifact.content_digest,
                          },
                          required_action=(
                              "Repair the corrupted completion or artifact binding before advancement."
                          ),
                      )

                  try:
                      stage = WorkStage(_required_text(stage_row, "stage"))
                  except ValueError as exc:
                      raise _catalog_conflict(
                          "PIPELINE_STAGE_VALUE_INVALID",
                          "The canonical stage value is not supported.",
                          source_work_unit_id,
                          "Migrate the stage value before advancing this output.",
                      ) from exc

                  return SucceededWorkOutput(
                      source_work_unit_id=source_work_unit_id,
                      run_id=run_id,
                      stage_run_id=stage_run_id,
                      stage=stage,
                      capability=_required_text(work, "capability"),
                      output_contract=_required_text(work, "output_contract"),
                      output_digest=output_digest,
                      output_artifact=outputs[0].artifact,
                      input_artifacts=tuple(item.artifact for item in inputs),
                  )

              def list_unregistered_succeeded(
                  self,
                  *,
                  limit: int,
                  correlation_id: str,
              ) -> tuple[SucceededWorkOutput, ...]:
                  del correlation_id
                  if not 1 <= limit <= 1_000:
                      raise ValueError(
                          "successful work discovery limit must be between 1 and 1000"
                      )
                  try:
                      with self._engine.connect() as connection:
                          statement = (
                              sa.select(work_units.c.work_id)
                              .where(
                                  work_units.c.state == "succeeded",
                                  ~sa.exists(
                                      sa.select(sa.literal(1)).where(
                                          pipeline_advancements.c.source_work_unit_id
                                          == work_units.c.work_id
                                      )
                                  ),
                              )
                              .order_by(work_units.c.updated_at_utc, work_units.c.work_id)
                              .limit(limit)
                          )
                          work_ids = tuple(
                              _uuid_value(value)
                              for value in connection.execute(statement).scalars()
                          )
                          return tuple(self.read(connection, work_id) for work_id in work_ids)
                  except PipelineAdvancementConflict:
                      raise
                  except SQLAlchemyError as exc:
                      raise PipelineAdvancementConflict(
                          code="PIPELINE_DISCOVERY_STORAGE_FAILED",
                          message="Successful work discovery did not complete.",
                          context={"causeType": type(exc).__name__},
                          required_action=(
                              "Inspect PostgreSQL owner state and retry exact discovery."
                          ),
                      ) from exc


          def _binding_statement(
              binding: sa.Table,
              source_work_unit_id: UUID,
          ) -> sa.Select[tuple[object, ...]]:
              return (
                  sa.select(
                      binding.c.position.label("binding_position"),
                      binding.c.role.label("binding_role"),
                      artifact_records.c.artifact_id.label("artifact_id"),
                      artifact_objects.c.content_digest.label("content_digest"),
                      artifact_objects.c.size_bytes.label("size_bytes"),
                      artifact_records.c.content_type.label("content_type"),
                  )
                  .select_from(
                      binding.join(
                          artifact_records,
                          binding.c.artifact_id == artifact_records.c.artifact_id,
                      ).join(
                          artifact_objects,
                          artifact_records.c.object_id == artifact_objects.c.object_id,
                      )
                  )
                  .where(binding.c.work_id == source_work_unit_id)
                  .order_by(binding.c.position, artifact_records.c.artifact_id)
              )


          def _load_artifacts(
              connection: Connection,
              binding: sa.Table,
              source_work_unit_id: UUID,
          ) -> tuple[_BoundArtifact, ...]:
              rows = (
                  connection.execute(
                      _binding_statement(binding, source_work_unit_id)
                  )
                  .mappings()
                  .all()
              )
              return tuple(_bound_artifact(row) for row in rows)


          def _bound_artifact(row: RowMapping) -> _BoundArtifact:
              return _BoundArtifact(
                  position=_non_negative_int(row["binding_position"], "binding position"),
                  artifact=ArtifactIdentity(
                      artifact_id=_uuid_value(row["artifact_id"]),
                      role=_non_empty_text(row["binding_role"], "artifact binding role"),
                      content_digest=_non_empty_text(
                          row["content_digest"],
                          "artifact digest",
                      ),
                      size_bytes=_positive_int(row["size_bytes"], "artifact size"),
                      content_type=_non_empty_text(
                          row["content_type"],
                          "artifact content type",
                      ),
                  ),
              )


          def _catalog_conflict(
              code: str,
              message: str,
              source_work_unit_id: UUID,
              required_action: str,
          ) -> PipelineAdvancementConflict:
              return PipelineAdvancementConflict(
                  code=code,
                  message=message,
                  context={"sourceWorkUnitId": str(source_work_unit_id)},
                  required_action=required_action,
              )


          def _required_uuid(row: RowMapping, key: str) -> UUID:
              return _uuid_value(row[key])


          def _uuid_value(value: object) -> UUID:
              if value is None:
                  raise TypeError("persisted UUID value is null")
              return value if isinstance(value, UUID) else UUID(str(value))


          def _required_text(row: RowMapping, key: str) -> str:
              return _non_empty_text(row[key], key)


          def _non_empty_text(value: object, meaning: str) -> str:
              if not isinstance(value, str) or not value:
                  raise TypeError(f"persisted {meaning} is not non-empty text")
              return value


          def _non_negative_int(value: object, meaning: str) -> int:
              if not isinstance(value, int) or value < 0:
                  raise TypeError(f"persisted {meaning} is not a non-negative integer")
              return value


          def _positive_int(value: object, meaning: str) -> int:
              if not isinstance(value, int) or value <= 0:
                  raise TypeError(f"persisted {meaning} is not a positive integer")
              return value
          PYFILE

          cat > packages/collection_infrastructure/tests/test_succeeded_work_catalog.py <<'PYTEST'
          from __future__ import annotations

          from uuid import UUID

          from collection_infrastructure.postgres.artifact_metadata import (
              work_input_artifacts,
              work_output_artifacts,
          )
          from collection_infrastructure.postgres.pipeline_advancement_metadata import (
              pipeline_advancements,
          )
          from collection_infrastructure.postgres.succeeded_work_catalog import (
              _binding_statement,
          )
          from sqlalchemy.dialects import postgresql

          _WORK_ID = UUID("00000000-0000-0000-0000-000000000601")


          def test_pipeline_checkpoint_targets_canonical_work_identity() -> None:
              foreign_key = next(
                  iter(pipeline_advancements.c.source_work_unit_id.foreign_keys)
              )

              assert foreign_key.target_fullname == "work.work_units.work_id"


          def test_input_binding_query_joins_canonical_artifact_owners() -> None:
              sql = str(
                  _binding_statement(work_input_artifacts, _WORK_ID).compile(
                      dialect=postgresql.dialect()
                  )
              )

              assert "work.work_input_artifacts" in sql
              assert "sources.artifact_records" in sql
              assert "sources.artifact_objects" in sql
              assert "work_input_artifacts.work_id" in sql
              assert "artifact_records.object_id = artifact_objects.object_id" in sql


          def test_output_binding_query_uses_the_same_explicit_lineage_path() -> None:
              sql = str(
                  _binding_statement(work_output_artifacts, _WORK_ID).compile(
                      dialect=postgresql.dialect()
                  )
              )

              assert "work.work_output_artifacts" in sql
              assert "work_output_artifacts.work_id" in sql
              assert "artifact_records.artifact_id" in sql
              assert "artifact_objects.content_digest" in sql
              assert "artifact_objects.size_bytes" in sql
          PYTEST

          cat > database/tests/test_pipeline_advancement_schema.py <<'PYTEST'
          from __future__ import annotations

          from pathlib import Path

          _MIGRATION = (
              Path(__file__).resolve().parents[1]
              / "migrations"
              / "versions"
              / "20260815_0013_pipeline_advancement.py"
          )


          def test_pipeline_advancement_migration_is_linear_and_owner_scoped() -> None:
              source = _MIGRATION.read_text(encoding="utf-8")

              assert 'revision: str = "20260815_0013"' in source
              assert 'down_revision: str | None = "20260815_0012"' in source
              assert '"pipeline_advancements"' in source
              assert '"pipeline_advancement_attempts"' in source
              assert 'schema="work"' in source
              assert '"work.work_units.work_id"' in source
              assert '"work.work_units.work_unit_id"' not in source
              assert "CASCADE" not in source


          def test_pipeline_advancement_migration_enforces_fail_closed_state() -> None:
              source = _MIGRATION.read_text(encoding="utf-8")

              assert "ck_pipeline_advancements_terminal_payload" in source
              assert "ck_pipeline_advancements_lease_payload" in source
              assert "ck_pipeline_advancement_attempts_event_payload" in source
              assert "source_output_digest ~ '^sha256:[0-9a-f]{64}$'" in source
              assert "transition_plan_digest ~ '^sha256:[0-9a-f]{64}$'" in source
              assert "jsonb_typeof(source_input_artifacts) = 'array'" in source


          def test_pipeline_advancement_attempt_history_is_append_only() -> None:
              source = _MIGRATION.read_text(encoding="utf-8")

              assert "reject_pipeline_advancement_attempt_mutation" in source
              assert "BEFORE UPDATE OR DELETE ON work.pipeline_advancement_attempts" in source
              assert "pipeline advancement attempt history is immutable" in source
              assert 'ondelete="RESTRICT"' in source
          PYTEST

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Normalize pipeline owner sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            database/migrations/versions/20260815_0013_pipeline_advancement.py
            database/tests/test_pipeline_advancement_schema.py
            packages/collection_application/src/collection_application/pipeline_supervision.py
            packages/collection_application/tests/test_pipeline_supervision.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"

      - name: Prove pipeline application and storage owners
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            packages/collection_application/tests/test_pipeline_advancement.py \
            packages/collection_application/tests/test_pipeline_supervision.py \
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py \
            packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py \
            packages/collection_infrastructure/tests/test_pipeline_run_control.py \
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py \
            database/tests/test_pipeline_advancement_schema.py
          uv run mypy \
            packages/collection_application/src/collection_application/pipeline_advancement.py \
            packages/collection_application/src/collection_application/pipeline_supervision.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q \
            packages/collection_application/src/collection_application \
            packages/collection_infrastructure/src/collection_infrastructure/postgres

      - name: Prove fresh canonical database
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -q -m integration database/tests

      - name: Commit proven production files
        shell: bash
        run: |
          set -euo pipefail
          git add \
            database/migrations/versions/20260815_0013_pipeline_advancement.py \
            database/tests/test_pipeline_advancement_schema.py \
            packages/collection_application/src/collection_application/pipeline_supervision.py \
            packages/collection_application/tests/test_pipeline_supervision.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py \
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py \
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git commit -m "Fix (Pipeline): align advancement with canonical work identity"
          git push origin HEAD:main
