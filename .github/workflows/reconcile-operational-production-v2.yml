name: Repair Pipeline Advancement Owner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-operational-production-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-pipeline-owner-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Align pipeline advancement with canonical physical owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import zlib
          from pathlib import Path

          def write_compressed(path: str, payload: str) -> None:
              Path(path).write_bytes(zlib.decompress(base64.b64decode(payload)))

          write_compressed(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "pipeline_advancement_metadata.py",
              "",
          )
          write_compressed(
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/"
              "succeeded_work_catalog.py",
              "",
          )
          write_compressed(
              "packages/collection_infrastructure/tests/test_succeeded_work_catalog.py",
              "",
          )

          migration = Path(
              "database/migrations/versions/20260815_0013_pipeline_advancement.py"
          )
          migration_text = migration.read_text(encoding="utf-8")
          migration_text = migration_text.replace(
              '"work.work_units.work_unit_id"',
              '"work.work_units.work_id"',
          )
          if '"work.work_units.work_id"' not in migration_text:
              raise RuntimeError("canonical pipeline advancement work FK was not installed")
          if '"work.work_units.work_unit_id"' in migration_text:
              raise RuntimeError("obsolete pipeline advancement work FK remains")
          migration.write_text(migration_text, encoding="utf-8")

          schema_test = Path("database/tests/test_pipeline_advancement_schema.py")
          schema_text = schema_test.read_text(encoding="utf-8")
          schema_text = schema_text.replace(
              '    assert "ON DELETE RESTRICT" in source\n',
              '    assert \'ondelete="RESTRICT"\' in source\n',
          )
          anchor = '    assert \'schema="work"\' in source\n'
          assertions = (
              '    assert \'"work.work_units.work_id"\' in source\n'
              '    assert \'"work.work_units.work_unit_id"\' not in source\n'
          )
          if assertions not in schema_text:
              if anchor not in schema_text:
                  raise RuntimeError("pipeline advancement schema-test anchor is missing")
              schema_text = schema_text.replace(anchor, anchor + assertions)
          schema_test.write_text(schema_text, encoding="utf-8")

          metadata_test = Path(
              "packages/collection_infrastructure/tests/"
              "test_pipeline_advancement_metadata.py"
          )
          metadata_test_text = metadata_test.read_text(encoding="utf-8")
          metadata_test_append = zlib.decompress(
              base64.b64decode("eNptj0EKgzAQRfc5xeBKFw3ttmCP0AuUMgxxlGCcSDK2ePtqLcVCZ/sf7/8xxjTcgnJWHP3IwQsjNQ8SxwOL4sBKDSmhUupYMzqSKN5RwGdMPfpmobzOZQWHC1yj8NnAcm1M7DvBnucMNeg0Bi7/NWTrbI5TcrwJJ/G6WO1eUJm3k3LmpBBYyp8U6hpOe2Kf3o53u23HdgpBaOCVL9Yy+23M9vNNYV4wj2Ng")
          ).decode()
          if "test_pipeline_advancement_metadata_targets_canonical_work_identity" not in (
              metadata_test_text
          ):
              metadata_test.write_text(
                  metadata_test_text.rstrip() + metadata_test_append,
                  encoding="utf-8",
              )
          PY

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Normalize pipeline owner sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            database/migrations/versions/20260815_0013_pipeline_advancement.py
            database/tests/test_pipeline_advancement_schema.py
            packages/collection_application/src/collection_application/pipeline_supervision.py
            packages/collection_application/tests/test_pipeline_supervision.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"

      - name: Prove pipeline application and storage owners
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q             packages/collection_application/tests/test_pipeline_advancement.py             packages/collection_application/tests/test_pipeline_supervision.py             packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py             packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py             packages/collection_infrastructure/tests/test_pipeline_run_control.py             packages/collection_infrastructure/tests/test_succeeded_work_catalog.py             database/tests/test_pipeline_advancement_schema.py
          uv run mypy             packages/collection_application/src/collection_application/pipeline_advancement.py             packages/collection_application/src/collection_application/pipeline_supervision.py             packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py             packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py             packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py             packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q             packages/collection_application/src/collection_application             packages/collection_infrastructure/src/collection_infrastructure/postgres

      - name: Prove fresh canonical database
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -q -m integration database/tests

      - name: Commit proven pipeline owner
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-operational-production-v2.yml
          git add             database/migrations/versions/20260815_0013_pipeline_advancement.py             database/tests/test_pipeline_advancement_schema.py             packages/collection_application/src/collection_application/pipeline_supervision.py             packages/collection_application/tests/test_pipeline_supervision.py             packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py             packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py             packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py             packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py             packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Fix (Pipeline): align advancement with canonical work identity"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
