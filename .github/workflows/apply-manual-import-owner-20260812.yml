name: Apply Manual Import Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-manual-import-owner-20260812.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Check out exact main history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Materialize canonical owner sources
        run: |
          cat .codex/payloads/manual-import-owner-20260812.part* | base64 --decode > /tmp/manual-import-owner.tar.gz
          echo "761c2d80af7bb8630996b5c66050f18b3e844126fecaa6f7c5181d0e0b276fcd  /tmp/manual-import-owner.tar.gz" | sha256sum --check
          tar -xzf /tmp/manual-import-owner.tar.gz -C .
          rm -f .github/workflows/apply-manual-import-planner-20260812.yml
          rm -f .github/workflows/reconcile-manual-import-planner-20260812.yml
          rm -f .github/workflows/repair-manual-import-planner-20260812.yml
          rm -f .github/workflows/export-current-source-20260812.yml
          rm -f tools/apply_manual_import_planner_20260812.py

      - name: Restore canonical generated state
        run: |
          uv lock
          uv sync --frozen --all-packages --dev
          uv run python tools/contract_generation/generate.py
          uv run ruff check --fix .
          uv run ruff format .

      - name: Verify owner and repository gates
        run: |
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps database packages tools
          uv run collector config validate berlin_recording_services

      - name: Verify database contract
        run: |
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests

      - name: Verify deployable images
        run: |
          docker build --file deploy/docker/collector-cli.Dockerfile .
          docker build --file deploy/docker/migration.Dockerfile .
          docker build --file deploy/docker/worker-gateway.Dockerfile .

      - name: Remove bounded delivery tooling
        run: |
          rm -f .github/workflows/apply-manual-import-owner-20260812.yml
          rm -f .codex/payloads/manual-import-owner-20260812.part*
          rmdir .codex/payloads
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "ci.yml"
          git diff --check

      - name: Commit verified owner batch
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add -A
          git commit -m "Feat (Manual Import): add deterministic import planner" -m "Owner layer: manual import contracts, parsing, validation, record identity, plan identity, and campaign adapter." -m "Root cause: CSV, JSON, and JSONL behavior was duplicated inside campaign application code and runtime intake had no immutable plan contract or complete row-context ledger." -m "Replacement: introduce one contract-owned deterministic planner, make campaign validation consume it, prove explicit atomic and partial dispositions, and remove every temporary apply path." -m "Proof: lock, generated contracts, Ruff, strict mypy, non-integration tests, architecture checks, compilation, campaign validation, fresh migration, integration tests, and all existing deployable image builds."
          git push origin HEAD:main
