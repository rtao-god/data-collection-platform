name: Apply Stage 8C Review Web V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage8c-review-web-v2-20260814.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: data-collection-platform-stage8c-review-web-v2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for primary Stage 8C writer or existing proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          for _ in $(seq 1 300); do
            proof="$(curl -sS -o /dev/null -w '%{http_code}' "${headers[@]}" "$api/contents/docs/proofs/stage8c-review-web-ci.md?ref=main")"
            [[ "$proof" == "200" ]] && exit 0
            payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/apply-stage8c-review-web-20260814.yml/runs?branch=main&per_page=10")"
            active="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$payload")"
            [[ "$active" == "0" ]] && exit 0
            sleep 5
          done
          echo "Primary Stage 8C writer did not settle" >&2
          exit 1

      - name: Check whether recovery is required
        id: required
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://api.github.com/repos/$REPOSITORY/contents/docs/proofs/stage8c-review-web-ci.md?ref=main")"
          if [[ "$status" == "200" ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Stage 8B proof
        if: steps.required.outputs.value == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 240); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "https://api.github.com/repos/$REPOSITORY/contents/docs/proofs/stage8b-control-api-ci.md?ref=main")"
            [[ "$status" == "200" ]] && exit 0
            sleep 5
          done
          echo "Stage 8B proof is missing" >&2
          exit 1

      - name: Check out complete current history
        if: steps.required.outputs.value == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Node.js line
        if: steps.required.outputs.value == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Recover and prove canonical review web
        if: steps.required.outputs.value == 'true'
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git reset --hard origin/main
          test -f docs/proofs/stage8b-control-api-ci.md

          revision="$(git log --all --format=%H -- apps/review_web/package-lock.json | head -1)"
          [[ -n "$revision" ]] || { echo "No historical review-web owner exists" >&2; exit 1; }
          git checkout "$revision" -- apps/review_web
          while IFS= read -r path; do
            case "$path" in
              docs/specifications/stage8c*|docs/specifications/*review-web*|.codex/modules/*review-web*)
                git checkout "$revision" -- "$path"
                ;;
            esac
          done < <(git ls-tree -r --name-only "$revision")

          cd apps/review_web
          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          manifest.scripts ??= {};
          if (!manifest.scripts.typecheck) {
            if (!manifest.devDependencies?.typescript && !manifest.dependencies?.typescript) {
              throw new Error("review web has no typecheck script or TypeScript dependency");
            }
            manifest.scripts.typecheck = "tsc --noEmit";
          }
          if (!manifest.scripts.test) {
            throw new Error("review web has no test script");
          }
          if (/^vitest(?:\s|$)/.test(manifest.scripts.test) && !/\brun\b/.test(manifest.scripts.test)) {
            manifest.scripts.test = manifest.scripts.test.replace(/^vitest/, "vitest run");
          }
          if (!manifest.scripts.build) {
            throw new Error("review web has no build script");
          }
          fs.writeFileSync("package.json", JSON.stringify(manifest, null, 2) + "\n");
          NODE
          npm ci
          npm run lint --if-present
          npm run typecheck
          CI=1 npm run test
          npm run build
          cd ../..

          if grep -R --line-number --include='*.ts' --include='*.tsx' \
              -E 'dangerouslySetInnerHTML|innerHTML[[:space:]]*=' apps/review_web/src; then
            echo "Unsafe raw HTML rendering path detected" >&2
            exit 1
          fi

          mkdir -p docs/proofs
          cat > docs/proofs/stage8c-review-web.md <<EOF
          # Stage 8C review web

          - Status: `locally-proven`
          - Historical owner revision: `$revision`
          - Gates: exact lock restore, lint when configured, TypeScript, deterministic tests, production build and raw-HTML negative inventory.
          - Boundary: matching, quality and export eligibility are not frontend-owned.
          EOF

          git add apps/review_web docs/specifications docs/proofs/stage8c-review-web.md .codex/modules
          git diff --cached --check
          production_sha="$(git rev-parse HEAD)"
          if ! git diff --cached --quiet; then
            git config user.name "rtao-god"
            git config user.email "rtaogod@gmail.com"
            git commit -m "Feat (Review): add candidate review console"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            production_sha="$(git rev-parse HEAD)"
          fi
          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for permanent proof and record exact-head evidence
        if: steps.required.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INITIAL_SHA: ${{ steps.materialize.outputs.production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          git fetch origin main
          git reset --hard origin/main
          subject_sha="$(git rev-parse HEAD)"
          test -f apps/review_web/package-lock.json

          wait_for() {
            local workflow="$1"
            local label="$2"
            for _ in $(seq 1 180); do
              payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&per_page=50")"
              run_id="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$payload" | head -1)"
              status="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$payload" | head -1)"
              conclusion="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' <<<"$payload" | head -1)"
              if [[ -n "$run_id" && "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || { echo "$label failed in run $run_id" >&2; exit 1; }
                printf '%s' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "$label was not completed for $subject_sha" >&2
            exit 1
          }

          verify_id="$(wait_for ci.yml Verify)"
          web_id="$(wait_for review-web-ci.yml 'Review Web Verify')"
          cat > docs/proofs/stage8c-review-web-ci.md <<EOF
          # Stage 8C review web CI proof

          - Status: `proven`
          - Repository: `rtao-god/data-collection-platform`
          - Branch: `main`
          - Subject commit: `$subject_sha`
          - Permanent Verify run: `$verify_id`
          - Permanent Review Web Verify run: `$web_id`
          - Conclusions: `success`

          Exact frontend restoration, TypeScript, tests, production build and the frontend/domain boundary are proven. Browser acquisition is not claimed.
          EOF
          git add docs/proofs/stage8c-review-web-ci.md
          git diff --cached --check
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Review): prove Stage 8C review console"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
