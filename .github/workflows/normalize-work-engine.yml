name: Normalize Work Engine

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-work-engine.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Apply exact source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/collection_infrastructure/src/collection_infrastructure/"
              "postgres/work_engine.py"
          )
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    WorkEngineConflict,\n    WorkFailure,": (
                  "    WorkEngineConflict,\n"
                  "    WorkerRegistration,\n"
                  "    WorkerRegistrationResult,\n"
                  "    WorkerRegistrationStatus,\n"
                  "    WorkFailure,"
              ),
              "def _same_work_identity(existing: Mapping[str, object], command: WorkUnitSpec)": (
                  "def _same_work_identity(existing: RowMapping, command: WorkUnitSpec)"
              ),
              "def _source_can_reserve(source: Mapping[str, object], now_utc: datetime)": (
                  "def _source_can_reserve(source: RowMapping, now_utc: datetime)"
              ),
              "def _retry_policy(work: Mapping[str, object])": (
                  "def _retry_policy(work: RowMapping)"
              ),
              "def _permit_from_work(work: Mapping[str, object])": (
                  "def _permit_from_work(work: RowMapping)"
              ),
              "    work: Mapping[str, object],\n    permit: SourcePermit | None,": (
                  "    work: RowMapping,\n    permit: SourcePermit | None,"
              ),
              '                required_action="Schedule work only for a created/running run and pending/running stage.",': (
                  "                required_action=(\n"
                  '                    "Schedule work only for a created/running run and "\n'
                  '                    "pending/running stage."\n'
                  "                ),"
              ),
              '                message="The work ID or semantic key is already bound to different immutable input.",': (
                  "                message=(\n"
                  '                    "The work ID or semantic key is already bound to different "\n'
                  '                    "immutable input."\n'
                  "                ),"
              ),
              "        work, attempt = active\n        expires_at_utc = now_utc + timedelta(": (
                  "        _work, attempt = active\n"
                  "        expires_at_utc = now_utc + timedelta("
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source fragment was not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply canonical formatting and lint fixes
        run: |
          uv run ruff format \
            database/migrations/versions/20260811_0004_worker_compatibility_and_failure_budget.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/work_engine.py
          uv run ruff check --fix \
            database/migrations/versions/20260811_0004_worker_compatibility_and_failure_budget.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/work_engine.py
          uv run ruff format \
            database/migrations/versions/20260811_0004_worker_compatibility_and_failure_budget.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/work_engine.py

      - name: Commit normalized source
        run: |
          if git diff --quiet -- \
            database/migrations/versions/20260811_0004_worker_compatibility_and_failure_budget.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/work_engine.py; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git add \
            database/migrations/versions/20260811_0004_worker_compatibility_and_failure_budget.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/work_engine.py
          git commit -m "Style (Work): normalize PostgreSQL adapter source" \
            -m "Owner layer: Work Engine PostgreSQL port and its migration." \
            -m "Root cause: the initial adapter commit differed from the pinned formatter and omitted three application imports while retaining broad row annotations and three lint findings." \
            -m "Replacement: apply the exact public imports, RowMapping boundaries, diagnostic wrapping, unused-binding correction, and canonical formatting." \
            -m "Proof target: permanent formatting, lint, mypy, unit, architecture, image, and migration gates."
          git push origin HEAD:main
