name: Operational End-to-End Closure

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - connectors/**
      - packages/**
      - database/**
      - deploy/**
      - tests/e2e/**
      - tests/operations/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/operational-e2e-closure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-operational-e2e-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for complete production inventory
        shell: bash
        run: |
          set -euo pipefail
          required=(
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
            apps/review_web/package-lock.json
            apps/browser_worker/pyproject.toml
            packages/export_core/src/export_core/service.py
            apps/retention_job/pyproject.toml
            apps/orchestrator/pyproject.toml
            tools/operations/backup_restore.py
            deploy/compose/application.yaml
          )
          ready=false
          for _ in $(seq 1 240); do
            git fetch --no-tags origin main
            missing=false
            for path in "${required[@]}"; do
              if ! git cat-file -e "origin/main:$path" 2>/dev/null; then
                missing=true
                break
              fi
            done
            if test "$missing" = false \
               && git show origin/main:database/migrations/versions/20260815_0013_pipeline_advancement.py \
                    | grep -q 'work.work_units.work_id' \
               && ! git show origin/main:database/migrations/versions/20260815_0013_pipeline_advancement.py \
                    | grep -q 'work.work_units.work_unit_id'; then
              git reset --hard origin/main
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          git rev-parse HEAD > /tmp/operational-subject-sha

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Prove frozen Python owner graph
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          uv lock --check
          for generator in \
            tools/contract_generation/generate.py \
            tools/control_api_contract_generation/generate.py \
            tools/review_contract_generation/generate.py; do
            if test -f "$generator"; then
              uv run python "$generator" --check
            fi
          done
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration and not object_store_integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services

      - name: Prove fresh PostgreSQL and PostGIS
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Prove review console
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/review_web ci
          npm --prefix apps/review_web run lint
          npm --prefix apps/review_web run typecheck --if-present
          npm --prefix apps/review_web test -- --run
          npm --prefix apps/review_web run build

      - name: Prove deployable Compose and images
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/application.yaml config >/tmp/application-compose.yaml
          test -s /tmp/application-compose.yaml
          docker compose -f deploy/compose/application.yaml build

      - name: Prove vertical and operational scenarios
        shell: bash
        run: |
          set -euo pipefail
          if test -d tests/e2e && find tests/e2e -type f -name 'test_*.py' | grep -q .; then
            uv run pytest tests/e2e
          fi
          if test -d tests/operations \
             && find tests/operations -type f -name 'test_*.py' | grep -q .; then
            uv run pytest tests/operations
          fi

      - name: Record tested subject
        shell: bash
        run: |
          set -euo pipefail
          subject="$(cat /tmp/operational-subject-sha)"
          git fetch origin main
          test "$subject" = "$(git rev-parse origin/main)"
          mkdir -p docs/proofs
          cat > docs/proofs/end-to-end-operational-ci.md <<EOF
          # End-to-end operational CI proof

          - subject SHA: \`$subject\`
          - workflow run: \`${GITHUB_RUN_ID}\`
          - workflow attempt: \`${GITHUB_RUN_ATTEMPT}\`
          - result: \`success\`

          The frozen Python owner graph, fresh PostgreSQL/PostGIS migration, database integration,
          review frontend, deployable Compose/images, and repository-owned vertical/operations
          scenarios completed for the exact subject above.

          This proof does not fabricate external Berlin campaign approval, production credentials,
          or collection consent. Those remain explicit deployment inputs.
          EOF
          git add docs/proofs/end-to-end-operational-ci.md
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Proofs): record operational E2E closure"
          git push origin HEAD:main
