name: Prove Reconciled Baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prove-reconciled-baseline.yml

permissions:
  contents: write

concurrency:
  group: data-collection-platform-baseline
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: collection
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: collection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collection -d collection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTION_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
      TEST_DATABASE_URL: postgresql+psycopg://collection:collection@localhost:5432/collection
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: false

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify static and unit baseline
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools

      - name: Apply fresh database migration
        run: uv run collection-migrate upgrade head

      - name: Verify PostgreSQL and PostGIS contracts
        run: uv run pytest -q -m integration

      - name: Build every existing deployable image
        shell: bash
        run: |
          set -euo pipefail
          declare -a images=(
            'collector-cli:deploy/docker/collector-cli.Dockerfile'
            'collection-migration:deploy/docker/migration.Dockerfile'
            'worker-gateway:deploy/docker/worker-gateway.Dockerfile'
            'manual-import-worker:deploy/docker/manual-import-worker.Dockerfile'
            'osm-worker:deploy/docker/osm-worker.Dockerfile'
          )
          for item in "${images[@]}"; do
            name="${item%%:*}"
            dockerfile="${item#*:}"
            if [ -f "$dockerfile" ]; then
              docker build --file "$dockerfile" --tag "data-collection-platform/${name}:proof" .
            fi
          done

      - name: Record proof and remove transient workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/reconciled-baseline.md <<EOF
          # Reconciled repository baseline

          - exact workspace restore: passed
          - lock and generated contract drift: passed
          - Ruff format and lint: passed
          - strict mypy: passed
          - non-integration tests: passed
          - fail-closed architecture checker: passed
          - Python compilation: passed
          - fresh PostgreSQL/PostGIS migration: passed
          - integration tests: passed
          - existing deployable images: built
          - verified source commit: \`$(git rev-parse HEAD)\`
          EOF
          find .github/workflows -maxdepth 1 -type f \
            ! -name ci.yml \
            ! -name prove-reconciled-baseline.yml \
            -print0 | xargs -0 -r git rm -f
          git rm -f .github/workflows/prove-reconciled-baseline.yml
          find .codex -maxdepth 1 -type f \
            \( -name '*.py' -o -name '*probe*' -o -name 'ci-trigger*' \) \
            -print0 | xargs -0 -r git rm -f
          rm -rf .codex/payloads
          git add -A
          git diff --cached --check
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git commit -m 'CI (Baseline): seal reconciled repository proof'
          git push origin HEAD:main

      - name: Remove proof workflow after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rm -f --ignore-unmatch .github/workflows/prove-reconciled-baseline.yml
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Build (Tooling): remove failed baseline proof workflow'
            git push origin HEAD:main
          fi
