name: Pipeline Owner Repair V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pipeline-owner-repair-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-pipeline-owner-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install canonical pipeline storage owners
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          cat > packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py <<'PY'
          from __future__ import annotations

          import sqlalchemy as sa
          from sqlalchemy.dialects import postgresql

          from collection_infrastructure.postgres.metadata import collector_metadata
          from collection_infrastructure.postgres.work_metadata import (
              collection_runs,
              stage_runs,
              work_units,
          )

          pipeline_advancement_metadata = collector_metadata

          pipeline_advancements = sa.Table(
              "pipeline_advancements",
              collector_metadata,
              sa.Column("advancement_id", sa.Uuid(), primary_key=True),
              sa.Column(
                  "source_work_unit_id",
                  sa.Uuid(),
                  sa.ForeignKey(work_units.c.work_id, ondelete="RESTRICT"),
                  nullable=False,
                  unique=True,
              ),
              sa.Column(
                  "run_id",
                  sa.Uuid(),
                  sa.ForeignKey(collection_runs.c.run_id, ondelete="RESTRICT"),
                  nullable=False,
              ),
              sa.Column(
                  "stage_run_id",
                  sa.Uuid(),
                  sa.ForeignKey(stage_runs.c.stage_run_id, ondelete="RESTRICT"),
                  nullable=False,
              ),
              sa.Column("source_stage", sa.Text(), nullable=False),
              sa.Column("source_capability", sa.Text(), nullable=False),
              sa.Column("source_output_contract", sa.Text(), nullable=False),
              sa.Column("source_output_digest", sa.Text(), nullable=False),
              sa.Column("source_output_artifact_id", sa.Uuid(), nullable=False),
              sa.Column("source_output_artifact_role", sa.Text(), nullable=False),
              sa.Column("source_output_artifact_digest", sa.Text(), nullable=False),
              sa.Column("source_output_artifact_size_bytes", sa.BigInteger(), nullable=False),
              sa.Column("source_output_artifact_content_type", sa.Text(), nullable=False),
              sa.Column(
                  "source_input_artifacts",
                  postgresql.JSONB(astext_type=sa.Text()),
                  nullable=False,
              ),
              sa.Column("transition_key", sa.Text(), nullable=False),
              sa.Column("transition_plan_digest", sa.Text(), nullable=False),
              sa.Column("state", sa.Text(), nullable=False),
              sa.Column("revision", sa.BigInteger(), nullable=False),
              sa.Column("attempt_count", sa.BigInteger(), nullable=False),
              sa.Column("result_digest", sa.Text(), nullable=True),
              sa.Column("blocker_owner", sa.Text(), nullable=True),
              sa.Column("blocker_code", sa.Text(), nullable=True),
              sa.Column("blocker_message", sa.Text(), nullable=True),
              sa.Column("blocker_required_action", sa.Text(), nullable=True),
              sa.Column(
                  "blocker_context",
                  postgresql.JSONB(astext_type=sa.Text()),
                  nullable=True,
              ),
              sa.Column("active_lease_id", sa.Uuid(), nullable=True),
              sa.Column("active_lease_token_digest", sa.Text(), nullable=True),
              sa.Column("leased_by_worker_id", sa.Text(), nullable=True),
              sa.Column("dagster_execution_id", sa.Text(), nullable=True),
              sa.Column("dagster_build_id", sa.Text(), nullable=True),
              sa.Column("lease_issued_at_utc", sa.DateTime(timezone=True), nullable=True),
              sa.Column("lease_expires_at_utc", sa.DateTime(timezone=True), nullable=True),
              sa.Column("created_at_utc", sa.DateTime(timezone=True), nullable=False),
              sa.Column("updated_at_utc", sa.DateTime(timezone=True), nullable=False),
              sa.Column("correlation_id", sa.Text(), nullable=False),
              schema="work",
          )

          pipeline_advancement_attempts = sa.Table(
              "pipeline_advancement_attempts",
              collector_metadata,
              sa.Column("event_id", sa.Uuid(), primary_key=True),
              sa.Column(
                  "advancement_id",
                  sa.Uuid(),
                  sa.ForeignKey(pipeline_advancements.c.advancement_id, ondelete="RESTRICT"),
                  nullable=False,
              ),
              sa.Column("attempt_number", sa.BigInteger(), nullable=False),
              sa.Column("event_kind", sa.Text(), nullable=False),
              sa.Column("lease_id", sa.Uuid(), nullable=True),
              sa.Column("lease_token_digest", sa.Text(), nullable=True),
              sa.Column("worker_id", sa.Text(), nullable=True),
              sa.Column("dagster_execution_id", sa.Text(), nullable=True),
              sa.Column("dagster_build_id", sa.Text(), nullable=True),
              sa.Column("transition_plan_digest", sa.Text(), nullable=False),
              sa.Column("lease_expires_at_utc", sa.DateTime(timezone=True), nullable=True),
              sa.Column("result_digest", sa.Text(), nullable=True),
              sa.Column("blocker_owner", sa.Text(), nullable=True),
              sa.Column("blocker_code", sa.Text(), nullable=True),
              sa.Column("blocker_message", sa.Text(), nullable=True),
              sa.Column("blocker_required_action", sa.Text(), nullable=True),
              sa.Column(
                  "blocker_context",
                  postgresql.JSONB(astext_type=sa.Text()),
                  nullable=True,
              ),
              sa.Column("occurred_at_utc", sa.DateTime(timezone=True), nullable=False),
              sa.Column("correlation_id", sa.Text(), nullable=False),
              sa.UniqueConstraint(
                  "advancement_id",
                  "attempt_number",
                  "event_kind",
                  name="uq_pipeline_advancement_attempts_event",
              ),
              schema="work",
          )

          PIPELINE_ADVANCEMENT_TABLES = (
              pipeline_advancements,
              pipeline_advancement_attempts,
          )
          PY

          cat > packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py <<'PY'
          from __future__ import annotations

          from uuid import UUID

          import sqlalchemy as sa
          from collection_application.pipeline_advancement import (
              ArtifactIdentity,
              PipelineAdvancementConflict,
              SucceededWorkOutput,
          )
          from collection_domain import WorkStage
          from sqlalchemy.engine import Connection, Engine, RowMapping
          from sqlalchemy.exc import SQLAlchemyError

          from collection_infrastructure.postgres.artifact_metadata import (
              artifact_objects,
              artifact_records,
              work_input_artifacts,
              work_output_artifacts,
          )
          from collection_infrastructure.postgres.pipeline_advancement_metadata import (
              pipeline_advancements,
          )
          from collection_infrastructure.postgres.work_metadata import stage_runs, work_units


          class PostgresSucceededWorkCatalog:
              """Read canonical succeeded work and discover outputs awaiting advancement."""

              def __init__(self, engine: Engine) -> None:
                  self._engine = engine

              def __call__(
                  self,
                  connection: Connection,
                  source_work_unit_id: UUID,
              ) -> SucceededWorkOutput:
                  return self.read(connection, source_work_unit_id)

              def read(
                  self,
                  connection: Connection,
                  source_work_unit_id: UUID,
              ) -> SucceededWorkOutput:
                  work = (
                      connection.execute(
                          sa.select(work_units)
                          .where(work_units.c.work_id == source_work_unit_id)
                          .with_for_update(read=True)
                      )
                      .mappings()
                      .one_or_none()
                  )
                  if work is None:
                      raise _catalog_conflict(
                          "PIPELINE_SOURCE_WORK_NOT_FOUND",
                          "The source work unit does not exist.",
                          source_work_unit_id,
                          "Refresh canonical work state and select an existing successful work unit.",
                      )
                  if _required_text(work, "state") != "succeeded":
                      raise _catalog_conflict(
                          "PIPELINE_SOURCE_WORK_NOT_SUCCEEDED",
                          "Pipeline advancement accepts only successfully completed work.",
                          source_work_unit_id,
                          "Wait for canonical successful completion before registering advancement.",
                      )

                  run_id = _required_uuid(work, "run_id")
                  stage_run_id = _required_uuid(work, "stage_run_id")
                  stage = (
                      connection.execute(
                          sa.select(stage_runs).where(
                              stage_runs.c.stage_run_id == stage_run_id,
                          )
                      )
                      .mappings()
                      .one_or_none()
                  )
                  if stage is None:
                      raise _catalog_conflict(
                          "PIPELINE_STAGE_OWNER_NOT_FOUND",
                          "The successful work has no canonical stage owner.",
                          source_work_unit_id,
                          "Repair stage ownership before advancing the successful output.",
                      )
                  if _required_uuid(stage, "run_id") != run_id:
                      raise _catalog_conflict(
                          "PIPELINE_STAGE_RUN_CONFLICT",
                          "The work and stage owners belong to different collection runs.",
                          source_work_unit_id,
                          "Repair the corrupted run/stage ownership before advancement.",
                      )

                  inputs = _load_artifacts(
                      connection,
                      work_input_artifacts,
                      source_work_unit_id,
                  )
                  outputs = _load_artifacts(
                      connection,
                      work_output_artifacts,
                      source_work_unit_id,
                  )
                  if len(outputs) != 1:
                      raise PipelineAdvancementConflict(
                          code="PIPELINE_OUTPUT_ARTIFACT_CARDINALITY",
                          message=(
                              "Successful work must bind exactly one canonical output artifact."
                          ),
                          context={
                              "sourceWorkUnitId": str(source_work_unit_id),
                              "outputArtifactCount": len(outputs),
                          },
                          required_action=(
                              "Repair work completion so the exact output contract has one "
                              "canonical artifact."
                          ),
                      )
                  input_ids = {item.artifact_id for item in inputs}
                  if outputs[0].artifact_id in input_ids:
                      raise _catalog_conflict(
                          "PIPELINE_ARTIFACT_DIRECTION_CONFLICT",
                          "One artifact is bound as both pipeline input and output.",
                          source_work_unit_id,
                          "Repair immutable artifact bindings before advancement.",
                      )

                  output_digest = _required_text(work, "output_digest")
                  if outputs[0].content_digest != output_digest:
                      raise PipelineAdvancementConflict(
                          code="PIPELINE_OUTPUT_DIGEST_CONFLICT",
                          message="Work completion and output artifact digests differ.",
                          context={
                              "sourceWorkUnitId": str(source_work_unit_id),
                              "workOutputDigest": output_digest,
                              "artifactDigest": outputs[0].content_digest,
                          },
                          required_action=(
                              "Repair canonical completion and artifact metadata before advancement."
                          ),
                      )

                  return SucceededWorkOutput(
                      source_work_unit_id=source_work_unit_id,
                      run_id=run_id,
                      stage_run_id=stage_run_id,
                      stage=WorkStage(_required_text(stage, "stage")),
                      capability=_required_text(work, "capability"),
                      output_contract=_required_text(work, "output_contract"),
                      output_digest=output_digest,
                      output_artifact=outputs[0],
                      input_artifacts=inputs,
                  )

              def list_unregistered_succeeded(
                  self,
                  *,
                  limit: int,
                  correlation_id: str,
              ) -> tuple[SucceededWorkOutput, ...]:
                  del correlation_id
                  if not 1 <= limit <= 1_000:
                      raise ValueError(
                          "successful work discovery limit must be between 1 and 1000"
                      )
                  try:
                      with self._engine.connect() as connection:
                          work_ids = tuple(
                              _uuid_value(value)
                              for value in connection.execute(
                                  sa.select(work_units.c.work_id)
                                  .where(
                                      work_units.c.state == "succeeded",
                                      ~sa.exists(
                                          sa.select(sa.literal(1)).where(
                                              pipeline_advancements.c.source_work_unit_id
                                              == work_units.c.work_id
                                          )
                                      ),
                                  )
                                  .order_by(work_units.c.updated_at_utc, work_units.c.work_id)
                                  .limit(limit)
                              ).scalars()
                          )
                          return tuple(self.read(connection, work_id) for work_id in work_ids)
                  except PipelineAdvancementConflict:
                      raise
                  except SQLAlchemyError as exc:
                      raise PipelineAdvancementConflict(
                          code="PIPELINE_DISCOVERY_STORAGE_FAILED",
                          message="Successful work discovery did not complete.",
                          context={"causeType": type(exc).__name__},
                          required_action=(
                              "Inspect PostgreSQL owner state and retry exact discovery."
                          ),
                      ) from exc


          def _load_artifacts(
              connection: Connection,
              binding_table: sa.Table,
              source_work_unit_id: UUID,
          ) -> tuple[ArtifactIdentity, ...]:
              rows = (
                  connection.execute(
                      sa.select(
                          binding_table.c.position,
                          binding_table.c.role,
                          artifact_records.c.artifact_id,
                          artifact_records.c.content_type,
                          artifact_objects.c.content_digest,
                          artifact_objects.c.size_bytes,
                      )
                      .select_from(
                          binding_table.join(
                              artifact_records,
                              binding_table.c.artifact_id == artifact_records.c.artifact_id,
                          ).join(
                              artifact_objects,
                              artifact_records.c.object_id == artifact_objects.c.object_id,
                          )
                      )
                      .where(binding_table.c.work_id == source_work_unit_id)
                      .order_by(binding_table.c.position)
                  )
                  .mappings()
                  .all()
              )
              artifacts = tuple(
                  ArtifactIdentity(
                      artifact_id=_required_uuid(row, "artifact_id"),
                      role=_required_text(row, "role"),
                      content_digest=_required_text(row, "content_digest"),
                      size_bytes=_required_non_negative_int(row, "size_bytes"),
                      content_type=_required_text(row, "content_type"),
                  )
                  for row in rows
              )
              identities = tuple(item.artifact_id for item in artifacts)
              if len(identities) != len(set(identities)):
                  raise _catalog_conflict(
                      "PIPELINE_ARTIFACT_BINDING_DUPLICATE",
                      "Successful work contains duplicate artifact bindings.",
                      source_work_unit_id,
                      "Repair duplicate immutable bindings before advancement.",
                  )
              return artifacts


          def _catalog_conflict(
              code: str,
              message: str,
              source_work_unit_id: UUID,
              required_action: str,
          ) -> PipelineAdvancementConflict:
              return PipelineAdvancementConflict(
                  code=code,
                  message=message,
                  context={"sourceWorkUnitId": str(source_work_unit_id)},
                  required_action=required_action,
              )


          def _required_uuid(row: RowMapping, key: str) -> UUID:
              return _uuid_value(row[key])


          def _uuid_value(value: object) -> UUID:
              if value is None:
                  raise TypeError("persisted UUID value is null")
              return value if isinstance(value, UUID) else UUID(str(value))


          def _required_text(row: RowMapping, key: str) -> str:
              value = row[key]
              if not isinstance(value, str) or not value:
                  raise TypeError(f"persisted {key} is not non-empty text")
              return value


          def _required_non_negative_int(row: RowMapping, key: str) -> int:
              value = row[key]
              if not isinstance(value, int) or value < 0:
                  raise TypeError(f"persisted {key} is not a non-negative integer")
              return value
          PY

          cat > packages/collection_infrastructure/tests/test_succeeded_work_catalog.py <<'PY'
          from __future__ import annotations

          import inspect

          import pytest
          from collection_infrastructure.postgres.artifact_metadata import (
              artifact_objects,
              artifact_records,
              work_input_artifacts,
              work_output_artifacts,
          )
          from collection_infrastructure.postgres.pipeline_advancement_metadata import (
              pipeline_advancements,
          )
          from collection_infrastructure.postgres.succeeded_work_catalog import (
              PostgresSucceededWorkCatalog,
          )
          from collection_infrastructure.postgres.work_metadata import work_units


          def test_catalog_targets_canonical_work_and_artifact_owners() -> None:
              source = inspect.getsource(PostgresSucceededWorkCatalog)

              assert work_units.c.work_id.name == "work_id"
              assert pipeline_advancements.c.source_work_unit_id.name == "source_work_unit_id"
              assert artifact_records.c.object_id.references(artifact_objects.c.object_id)
              assert work_input_artifacts.c.work_id.references(work_units.c.work_id)
              assert work_output_artifacts.c.work_id.references(work_units.c.work_id)
              assert "work_units.c.work_id" in source
              assert "artifact_records.c.object_id == artifact_objects.c.object_id" in source


          def test_catalog_rejects_unbounded_discovery_before_storage_access() -> None:
              catalog = object.__new__(PostgresSucceededWorkCatalog)

              with pytest.raises(ValueError, match="between 1 and 1000"):
                  catalog.list_unregistered_succeeded(limit=0, correlation_id="test")
              with pytest.raises(ValueError, match="between 1 and 1000"):
                  catalog.list_unregistered_succeeded(limit=1_001, correlation_id="test")
          PY

          python - <<'PY'
          from pathlib import Path

          migration = Path(
              "database/migrations/versions/20260815_0013_pipeline_advancement.py"
          )
          text = migration.read_text(encoding="utf-8")
          text = text.replace(
              '"work.work_units.work_unit_id"',
              '"work.work_units.work_id"',
          )
          if '"work.work_units.work_unit_id"' in text:
              raise RuntimeError("obsolete work-unit foreign key remains")
          migration.write_text(text, encoding="utf-8")

          schema_test = Path("database/tests/test_pipeline_advancement_schema.py")
          text = schema_test.read_text(encoding="utf-8")
          text = text.replace(
              '    assert "ON DELETE RESTRICT" in source\n',
              '    assert \'ondelete="RESTRICT"\' in source\n',
          )
          anchor = '    assert \'schema="work"\' in source\n'
          checks = (
              '    assert \'"work.work_units.work_id"\' in source\n'
              '    assert \'"work.work_units.work_unit_id"\' not in source\n'
          )
          if checks not in text:
              if anchor not in text:
                  raise RuntimeError("schema test anchor is missing")
              text = text.replace(anchor, anchor + checks, 1)
          schema_test.write_text(text, encoding="utf-8")

          supervision_test = Path(
              "packages/collection_application/tests/test_pipeline_supervision.py"
          )
          text = supervision_test.read_text(encoding="utf-8")
          lease_anchor = (
              "        expires_at_utc=_NOW + timedelta(minutes=5),\n"
              "    )\n\n\n"
              "def _status(\n"
          )
          if "_DEFAULT_SOURCES = (_source(),)" not in text:
              replacement = (
                  "        expires_at_utc=_NOW + timedelta(minutes=5),\n"
                  "    )\n\n\n"
                  "_DEFAULT_SOURCES = (_source(),)\n"
                  "_DEFAULT_LEASE = _lease()\n\n\n"
                  "def _status(\n"
              )
              if lease_anchor not in text:
                  raise RuntimeError("supervision test lease anchor is missing")
              text = text.replace(lease_anchor, replacement, 1)
          text = text.replace(
              "class Discovery:\n"
              "    def __init__(self, sources=(_source(),)) -> None:\n"
              "        self.sources = sources\n",
              "class Discovery:\n"
              "    def __init__(\n"
              "        self,\n"
              "        sources: tuple[SucceededWorkOutput, ...] = _DEFAULT_SOURCES,\n"
              "    ) -> None:\n"
              "        self.sources = sources\n",
          )
          text = text.replace(
              "class Port:\n"
              "    def __init__(self, *, lease=_lease()) -> None:\n"
              "        self.lease = lease\n",
              "class Port:\n"
              "    def __init__(\n"
              "        self,\n"
              "        *,\n"
              "        lease: PipelineAdvancementLease | None = _DEFAULT_LEASE,\n"
              "    ) -> None:\n"
              "        self.lease = lease\n",
          )
          supervision_test.write_text(text, encoding="utf-8")
          PY

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Normalize and prove pipeline owner
        shell: bash
        run: |
          set -euo pipefail
          files=(
            database/migrations/versions/20260815_0013_pipeline_advancement.py
            database/tests/test_pipeline_advancement_schema.py
            packages/collection_application/src/collection_application/pipeline_advancement.py
            packages/collection_application/src/collection_application/pipeline_supervision.py
            packages/collection_application/tests/test_pipeline_advancement.py
            packages/collection_application/tests/test_pipeline_supervision.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py
            packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py
            packages/collection_infrastructure/tests/test_pipeline_run_control.py
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run mypy \
            packages/collection_application/src/collection_application/pipeline_advancement.py \
            packages/collection_application/src/collection_application/pipeline_supervision.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_advancement_metadata.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/pipeline_run_control.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/succeeded_work_catalog.py
          uv run pytest -q \
            packages/collection_application/tests/test_pipeline_advancement.py \
            packages/collection_application/tests/test_pipeline_supervision.py \
            packages/collection_infrastructure/tests/test_pipeline_advancement_metadata.py \
            packages/collection_infrastructure/tests/test_pipeline_advancement_repository.py \
            packages/collection_infrastructure/tests/test_pipeline_run_control.py \
            packages/collection_infrastructure/tests/test_succeeded_work_catalog.py \
            database/tests/test_pipeline_advancement_schema.py
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q \
            packages/collection_application/src/collection_application \
            packages/collection_infrastructure/src/collection_infrastructure/postgres

      - name: Prove fresh PostgreSQL contract
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -q -m integration database/tests

      - name: Commit proven production sources
        shell: bash
        run: |
          set -euo pipefail
          git add \
            database/migrations/versions/20260815_0013_pipeline_advancement.py \
            database/tests/test_pipeline_advancement_schema.py \
            packages/collection_application/src/collection_application/pipeline_advancement.py \
            packages/collection_application/src/collection_application/pipeline_supervision.py \
            packages/collection_application/tests/test_pipeline_advancement.py \
