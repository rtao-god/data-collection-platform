name: Export Lost Owner History Bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-recovery-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-collection-platform-recovery-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch lost owner histories and build bundle
        shell: bash
        run: |
          set -euo pipefail
          shas=(
            b7368ba690f588cf5e254f905ce1cdf69305444f
            9bec95589ee0592a873edbc0548be27707f53af6
            24c2979e7e871c814a895d9e8ec182cb6705321f
            47bda1aed7f0a49ac02d5586c88bd04b38ccff71
            05d8ab74e1f20f3654b097c7e7812bcf94c70d82
            a175eb66110e4899741af6991cce829cc1b5112f
            8069f7d9e926c9109e6aa7f47770ef7cfbb8d4cb
            e80bbcfebe8dce765b0bcdf7b362e069a979dbac
            0abfbe53bfeb18623f83f72584e5be22971ff7d5
            553c63ad7e4d3f107894f687acb787e754ce61bf
            5a035e8031a5d6e1eddfa4212b9f9c17dbb6f87c
            0da188be6fe963e3fae18f460ea5e566d104fa3c
            0a9979e672541bbca6439a603229a14e561f5401
            6fedcb97e36cc7e65a9f926c9e536ab909e368c7
            4632801333ca0f998d7da27f2263cf40342c76c4
            6fa41af63f23fe90608544bb9efe3bf8b06de94c
            0ec632f6ffeacd0e89e481a2d0b5162e3d66a465
            134db9fbeede7170ff125b28ffa6fd54b4bb986e
            03bc0e8c41eaca3e63b0febc6dd7ca446bf97f20
            0ff622fbd4fb10b0b3d1ef16b4fc1b995f4f5044
            0a40610e169902a9ce06af6183c8f584ad5a0929
            c4a366cdfc8766341f7ab366194c7c0edb03b38a
          )

          mkdir -p recovery
          : > recovery/fetch-manifest.txt
          for sha in "${shas[@]}"; do
            echo "fetching $sha"
            git fetch --no-tags origin "$sha"
            git cat-file -e "$sha^{commit}"
            short="${sha:0:12}"
            git update-ref "refs/heads/recovery/$short" "$sha"
            printf '%s %s\n' "$sha" "$(git show -s --format=%s "$sha")" >> recovery/fetch-manifest.txt
          done

          mapfile -t bundle_refs < <(
            git for-each-ref --format='%(refname)' refs/heads/main refs/heads/recovery/
          )
          expected_ref_count=$((${#shas[@]} + 1))
          if [[ "${#bundle_refs[@]}" -ne "$expected_ref_count" ]]; then
            printf 'expected %s bundle refs, found %s\n' \
              "$expected_ref_count" "${#bundle_refs[@]}" >&2
            printf '%s\n' "${bundle_refs[@]}" >&2
            exit 1
          fi

          git for-each-ref --sort=-committerdate \
            --format='%(objectname) %(refname) %(committerdate:iso8601) %(subject)' \
            refs/heads/main refs/heads/recovery/ > recovery/refs.txt
          git log --all --date=iso-strict --pretty='%H %P %cI %s' > recovery/all-commits.txt
          git bundle create recovery/data-collection-platform-recovery.bundle \
            "${bundle_refs[@]}"
          git bundle verify recovery/data-collection-platform-recovery.bundle
          sha256sum recovery/data-collection-platform-recovery.bundle > recovery/SHA256SUMS

      - name: Upload bounded recovery material
        uses: actions/upload-artifact@v4
        with:
          name: data-collection-platform-recovery-bundle
          path: recovery/
          if-no-files-found: error
          retention-days: 1
