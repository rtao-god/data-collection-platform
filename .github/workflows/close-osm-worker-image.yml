name: Close OSM Worker Image Boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/close-osm-worker-image.yml

permissions:
  contents: write

concurrency:
  group: close-osm-worker-image
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require reconciled baseline
        run: test -f docs/proofs/reconciled-baseline.md

      - name: Add capability-minimal OSM image
        shell: bash
        run: |
          set -euo pipefail
          cat > deploy/docker/osm-worker.Dockerfile <<'EOF'
          FROM python:3.13.14-slim-bookworm AS build

          ENV UV_VERSION=0.10.0 \
              UV_COMPILE_BYTECODE=1 \
              UV_LINK_MODE=copy

          WORKDIR /workspace

          RUN pip install --no-cache-dir "uv==${UV_VERSION}"

          COPY .python-version pyproject.toml uv.lock ./
          COPY apps/osm_worker ./apps/osm_worker
          COPY connectors/osm_overpass ./connectors/osm_overpass
          COPY packages/source_connector_sdk ./packages/source_connector_sdk
          COPY packages/collection_contracts ./packages/collection_contracts

          RUN uv sync \
              --frozen \
              --package osm-worker \
              --no-dev \
              --no-editable

          FROM python:3.13.14-slim-bookworm AS runtime

          ENV PATH=/workspace/.venv/bin:${PATH} \
              PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1

          WORKDIR /workspace

          RUN groupadd --gid 10001 collector \
              && useradd --uid 10001 --gid collector --no-create-home --shell /usr/sbin/nologin collector

          COPY --from=build --chown=collector:collector /workspace/.venv /workspace/.venv

          USER 10001:10001

          ENTRYPOINT ["python", "-m", "osm_worker"]
          EOF

      - name: Register permanent CI proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          if 'Build OSM Worker image' not in text:
              marker = '\n  migration:\n'
              if marker not in text:
                  raise RuntimeError('CI migration job anchor not found')
              steps = '''
                - name: Build Manual Import Worker image
                  run: docker build -f deploy/docker/manual-import-worker.Dockerfile -t data-collection-platform/manual-import-worker:ci .

                - name: Build OSM Worker image
                  run: docker build -f deploy/docker/osm-worker.Dockerfile -t data-collection-platform/osm-worker:ci .

                - name: Verify worker image capability isolation
                  shell: bash
                  run: |
                    set -euo pipefail
                    for image in data-collection-platform/manual-import-worker:ci data-collection-platform/osm-worker:ci; do
                      docker run --rm --entrypoint python "$image" -c "import importlib.util; forbidden=('alembic','boto3','botocore','playwright','psycopg','scrapy','sqlalchemy'); present=[name for name in forbidden if importlib.util.find_spec(name) is not None]; assert not present, present"
                    done
          '''
              text = text.replace(marker, '\n' + steps + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Build and inspect image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f deploy/docker/osm-worker.Dockerfile -t data-collection-platform/osm-worker:local .
          docker run --rm --entrypoint python data-collection-platform/osm-worker:local -c "import importlib.util; required=('osm_worker','osm_overpass','source_connector_sdk'); missing=[name for name in required if importlib.util.find_spec(name) is None]; assert not missing, missing; forbidden=('alembic','boto3','botocore','playwright','psycopg','scrapy','sqlalchemy'); present=[name for name in forbidden if importlib.util.find_spec(name) is not None]; assert not present, present"

      - name: Commit image boundary and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rtao-god'
          git config user.email 'rtaogod@gmail.com'
          git add deploy/docker/osm-worker.Dockerfile .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'Build (OSM Worker): add isolated runtime image'
          git rm -f .github/workflows/close-osm-worker-image.yml
          git commit -m 'Chore (Tooling): remove OSM image closure workflow'
          git push origin HEAD:main
