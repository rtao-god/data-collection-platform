name: Finalize Stage 8C Production Commit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage8c-review-web-finalize2-20260814.yml
      - docs/proofs/stage8c-review-web-owner.md
      - apps/review_web/**
      - contracts/control_api/**
      - deploy/docker/review-web.Dockerfile
      - deploy/nginx/review-web.conf
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-stage8c-review-web-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json

      - name: Prove exact Stage 8C production subject
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/proofs/stage8c-review-web-owner.md
          test -f apps/review_web/package-lock.json
          test -f apps/review_web/src/shared/api/generated/schema.ts
          cd apps/review_web
          npm ci
          npm run generate:api
          git diff --exit-code -- src/shared/api/generated/schema.ts
          npm run typecheck
          npm run test
          npm run check:architecture
          npm run build
          npm audit --omit=dev --audit-level=high
          cd ../..
          docker build --tag data-collection-platform/review-web:final --file deploy/docker/review-web.Dockerfile .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/review-web:final)" != "0"

      - name: Record exact Stage 8C evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/proofs
          cat > docs/proofs/stage8c-review-web-ci.md <<EOF
          # Stage 8C review web CI proof

          - Status: proven
          - Subject commit: \`$GITHUB_SHA\`
          - Exact-head run: \`$GITHUB_RUN_ID\`

          The production subject passed exact npm lock restore, generated API drift,
          strict TypeScript, browser tests, frontend architecture checks, production
          build, runtime audit, CSP proof, and unprivileged image construction.

          Reviewer credentials remain session-only, command bodies contain no actor
          identity, and backend-owned quality and resolution state are not recomputed.
          EOF
          git add docs/proofs/stage8c-review-web-ci.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Proofs): record Stage 8C review web CI"
          git push origin HEAD:main
