name: Capture Operational Chain Failure

on:
  workflow_run:
    workflows:
      - "Reconcile Pipeline Foundation V6"
      - "Materialize Review Web After Pipeline"
      - "Materialize Browser Worker After Review"
      - "Materialize Sealed Export After Browser"
      - "Materialize Operations After Export"
      - "Close Operational E2E After Operations"
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: data-collection-platform-operational-failure-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Download exact failed run logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl -fsSL -L "${headers[@]}" "$api/actions/runs/$RUN_ID/logs" -o logs.zip
          mkdir logs
          unzip -q logs.zip -d logs
          slug="$(tr '[:upper:] ' '[:lower:]-' <<<"$WORKFLOW_NAME" | tr -cd 'a-z0-9_-')"
          echo "$slug" > slug.txt
      - name: Commit concise exact failure ledger
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          slug="$(cat slug.txt)"
          mkdir -p docs/diagnostics
          {
            echo "# $WORKFLOW_NAME failure"
            echo
            echo "- Run: \`$RUN_ID\`"
            echo "- Head: \`$HEAD_SHA\`"
            echo '- Conclusion: `failure`'
            echo
            echo '## Failed-step evidence'
            echo
            echo '```text'
            find logs -type f -print0 | sort -z | xargs -0 cat \
              | grep -E -B 8 -A 35 '##\[error\]|FAILED|Traceback|error:|Error:|AssertionError|ProgrammingError|mypy|would be reformatted' \
              | tail -n 320 || true
            echo '```'
          } > "docs/diagnostics/$slug.md"
          git add "docs/diagnostics/$slug.md"
          git diff --cached --check
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Diagnostics): record $WORKFLOW_NAME failure"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
