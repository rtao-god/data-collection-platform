name: Apply Artifact Lint Correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-artifact-lint-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ startsWith(github.event.head_commit.message, 'Build (Tooling): apply artifact lint correction') }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.10.0
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Apply exact artifact lint correction
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("packages/collection_infrastructure/src/collection_infrastructure/object_store/s3.py"): (
                  (
                      '                        "Restore object-store copy support and retry verification of the exact upload."\n',
                      '                        "Restore object-store copy support and retry verification of the "\n'
                      '                        "exact upload."\n',
                  ),
                  (
                      '                    required_action="Inspect the object store before retrying artifact verification.",\n',
                      '                    required_action=(\n'
                      '                        "Inspect the object store before retrying artifact verification."\n'
                      '                    ),\n',
                  ),
                  (
                      '                    "Retry verification or remove only this staging object through the artifact owner."\n',
                      '                    "Retry verification or remove only this staging object through the "\n'
                      '                    "artifact owner."\n',
                  ),
              ),
              Path(
                  "packages/collection_infrastructure/src/collection_infrastructure/postgres/artifact_transfer.py"
              ): (
                  (
                      '                required_action="Request only an artifact declared by the leased work input contract.",\n',
                      '                required_action=(\n'
                      '                    "Request only an artifact declared by the leased work input contract."\n'
                      '                ),\n',
                  ),
              ),
          }

          for path, path_replacements in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in path_replacements:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(
                          f"Expected one replacement in {path} for {old!r}, found {count}"
                      )
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

          uv run ruff check --fix \
            packages/collection_infrastructure/tests/test_s3_artifact_object_store.py
          uv run ruff format \
            packages/collection_infrastructure/src/collection_infrastructure/object_store/s3.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/artifact_transfer.py \
            packages/collection_infrastructure/tests/test_s3_artifact_object_store.py

      - name: Verify bounded mutation
        run: |
          uv run ruff format --check .
          uv run ruff check .
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              "packages/collection_infrastructure/src/collection_infrastructure/object_store/s3.py",
              "packages/collection_infrastructure/src/collection_infrastructure/postgres/artifact_transfer.py",
              "packages/collection_infrastructure/tests/test_s3_artifact_object_store.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if actual != expected:
              raise RuntimeError(
                  f"Unexpected repository mutation: expected={sorted(expected)}, actual={sorted(actual)}"
              )
          PY

      - name: Commit exact lint correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            packages/collection_infrastructure/src/collection_infrastructure/object_store/s3.py \
            packages/collection_infrastructure/src/collection_infrastructure/postgres/artifact_transfer.py \
            packages/collection_infrastructure/tests/test_s3_artifact_object_store.py
          git commit -m "Build (Lint): align artifact owner diagnostics" \
            -m "Owner layer: artifact object-store and transfer diagnostics." \
            -m "Root cause: four owner-action messages exceeded the repository line contract and one S3 test import block was not canonical." \
            -m "Replacement: preserve the exact diagnostic text through adjacent literals and apply Ruff-owned import ordering." \
            -m "Proof target: permanent CI passes formatting and lint without changing artifact behavior."
          git push origin HEAD:main
