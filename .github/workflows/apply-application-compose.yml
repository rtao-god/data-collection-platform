name: Apply Application Compose Owner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-application-compose.yml
      - .github/apply/application-compose.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-apply-application-compose
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Restore Compose owner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if test -f deploy/compose/application.yaml; then
            exit 0
          fi
          test -s .github/apply/application-compose.patch
          git apply --index --3way .github/apply/application-compose.patch
          git diff --cached --check

      - name: Render complete topology
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --env-file deploy/compose/.env.example \
            -f deploy/compose/infrastructure.yaml \
            -f deploy/compose/application.yaml \
            config >/tmp/application-compose.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          payload = yaml.safe_load(Path('/tmp/application-compose.yaml').read_text())
          required = {
              'migration',
              'worker-gateway',
              'control-api',
              'manual-import-worker',
              'osm-worker',
              'http-worker',
              'processing-worker',
              'resolution-worker',
              'pipeline-supervisor',
          }
          missing = required - set(payload['services'])
          if missing:
              raise SystemExit('missing services: ' + ', '.join(sorted(missing)))
          PY

      - name: Commit production Compose owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/apply-application-compose.yml \
            .github/apply/application-compose.patch
          git add \
            .github/workflows/application-compose-ci.yml \
            deploy/compose/application.yaml \
            deploy/compose/.env.example \
            docs/operations/application-compose.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Build (Compose): add complete application runtime"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
