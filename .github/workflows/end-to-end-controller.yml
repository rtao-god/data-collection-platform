name: End-to-End Closure Controller

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/end-to-end-controller.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-collection-platform-end-to-end-controller
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Drive dependency-ordered closure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          relevant_names='[
            "Repair Pipeline Advancement Owner V3",
            "Commit Pipeline Advancement Owner",
            "Commit Pipeline Advancement Schema",
            "Finalize Pipeline Advancement Owner",
            "Restore Operational E2E",
            "Restore Operational E2E Fallback",
            "Download and Persistence E2E V2"
          ]'

          wait_for_mutators() {
            for _ in $(seq 1 360); do
              payload="$(curl -fsSL "${headers[@]}" \
                "$api/actions/runs?branch=main&per_page=100")"
              active="$(jq --argjson names "$relevant_names" \
                '[.workflow_runs[] | select(.name as $name | $names | index($name)) |
                  select(.status != "completed")] | length' <<<"$payload")"
              if [[ "$active" == 0 ]]; then
                return 0
              fi
              sleep 10
            done
            echo 'Mutating workflow queue did not become idle.' >&2
            return 1
          }

          dispatch() {
            local workflow="$1"
            curl -fsSL -X POST "${headers[@]}" \
              "$api/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}' >/dev/null
          }

          refresh() {
            git fetch origin main
            git reset --hard origin/main
          }

          pipeline_proven() {
            test -f docs/proofs/pipeline-advancement-ci.md \
              && grep -Fq -- '- Status: proven' \
                docs/proofs/pipeline-advancement-ci.md
          }

          operational_complete() {
            local path
            for path in \
              apps/review_web/package-lock.json \
              apps/browser_worker/pyproject.toml \
              packages/export_core/src/export_core/service.py \
              apps/retention_job/pyproject.toml \
              apps/orchestrator/pyproject.toml \
              tools/operations/backup_restore.py \
              deploy/compose/application.yaml; do
              test -f "$path" || return 1
            done
          }

          data_flow_proven() {
            test -f docs/proofs/download-persistence-e2e-ci.md \
              && grep -Fq -- '- Status: proven' \
                docs/proofs/download-persistence-e2e-ci.md
          }

          wait_for_mutators
          refresh

          for _ in $(seq 1 3); do
            if pipeline_proven; then
              break
            fi
            dispatch commit-pipeline-owner.yml
            dispatch commit-pipeline-schema.yml
            wait_for_mutators
            refresh
            if ! pipeline_proven; then
              dispatch pipeline-owner-finalize.yml
              wait_for_mutators
              refresh
            fi
          done

          if pipeline_proven && ! operational_complete; then
            dispatch restore-operational-e2e.yml
            dispatch restore-operational-e2e-fallback.yml
            wait_for_mutators
            refresh
          fi

          if pipeline_proven && operational_complete && ! data_flow_proven; then
            dispatch data-flow-e2e-ci-v2.yml
            wait_for_mutators
            refresh
          fi

          mkdir -p docs/diagnostics
          current_head="$(git rev-parse HEAD)"
          runs="$(curl -fsSL "${headers[@]}" \
            "$api/actions/runs?branch=main&per_page=100")"
          python - "$current_head" "$runs" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          head = sys.argv[1]
          payload = json.loads(sys.argv[2])
          relevant = {
              "Repair Pipeline Advancement Owner V3",
              "Commit Pipeline Advancement Owner",
              "Commit Pipeline Advancement Schema",
              "Finalize Pipeline Advancement Owner",
              "Restore Operational E2E",
              "Restore Operational E2E Fallback",
              "Download and Persistence E2E V2",
              "Verify",
          }
          proof = Path("docs/proofs/pipeline-advancement-ci.md")
          data_flow = Path("docs/proofs/download-persistence-e2e-ci.md")
          inventory = (
              "apps/review_web/package-lock.json",
              "apps/browser_worker/pyproject.toml",
              "packages/export_core/src/export_core/service.py",
              "apps/retention_job/pyproject.toml",
              "apps/orchestrator/pyproject.toml",
              "tools/operations/backup_restore.py",
              "deploy/compose/application.yaml",
          )
          lines = [
              "# End-to-end closure controller state",
              "",
              f"- main HEAD: `{head}`",
              f"- pipeline proof: `{proof.exists()}`",
              f"- operational inventory: `{all(Path(item).is_file() for item in inventory)}`",
              f"- download/persistence proof: `{data_flow.exists()}`",
              "",
              "## Inventory",
              "",
          ]
          for item in inventory:
              lines.append(f"- `{item}`: `{'present' if Path(item).is_file() else 'missing'}`")
          lines.extend(["", "## Recent relevant workflows", ""])
          seen: set[str] = set()
          for run in payload.get("workflow_runs", []):
              name = run.get("name", "")
              if name not in relevant or name in seen:
                  continue
              seen.add(name)
              lines.append(
                  f"- `{name}` run `{run['id']}` on `{run['head_sha']}`: "
                  f"`{run['status']}` / `{run.get('conclusion')}`"
              )
          Path("docs/diagnostics/end-to-end-controller-latest.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish controller state
        shell: bash
        run: |
          set -euo pipefail
          git add docs/diagnostics/end-to-end-controller-latest.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Docs (Diagnostics): record E2E closure state"
          git fetch origin main
          if test "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)"; then
            git reset --soft origin/main
            git commit -m "Docs (Diagnostics): record E2E closure state"
          fi
          git push origin HEAD:main
