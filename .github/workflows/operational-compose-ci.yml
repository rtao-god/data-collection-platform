name: Operational Compose Verify

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/operational-compose-ci.yml
      - compose.yaml
      - compose.yml
      - docker-compose.yaml
      - docker-compose.yml
      - deploy/**
      - apps/retention_job/**
      - docs/runbooks/**
  pull_request:
    paths:
      - .github/workflows/operational-compose-ci.yml
      - compose.yaml
      - compose.yml
      - docker-compose.yaml
      - docker-compose.yml
      - deploy/**
      - apps/retention_job/**
      - docs/runbooks/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Locate Compose owner
        id: compose
        shell: bash
        run: |
          for candidate in compose.yaml compose.yml docker-compose.yaml docker-compose.yml deploy/compose/compose.yaml; do
            if test -f "$candidate"; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "path=" >> "$GITHUB_OUTPUT"

      - name: Validate resolved Compose contract
        if: steps.compose.outputs.path != ''
        env:
          COMPOSE_FILE: ${{ steps.compose.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          docker compose --file "$COMPOSE_FILE" config --quiet
          docker compose --file "$COMPOSE_FILE" config > /tmp/resolved-compose.yaml
          if grep -En 'image:[[:space:]]+[^[:space:]]+:latest([[:space:]]|$)' /tmp/resolved-compose.yaml; then
            echo "Operational Compose uses an unpinned latest image" >&2
            exit 1
          fi
          if grep -En '(POSTGRES_PASSWORD|SECRET_ACCESS_KEY|API_TOKEN):[[:space:]]+[^$]' /tmp/resolved-compose.yaml; then
            echo "Operational Compose embeds a credential literal" >&2
            exit 1
          fi

      - name: Build declared application images
        if: steps.compose.outputs.path != ''
        env:
          COMPOSE_FILE: ${{ steps.compose.outputs.path }}
        run: docker compose --file "$COMPOSE_FILE" build
