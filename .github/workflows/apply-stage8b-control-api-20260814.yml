name: Apply Stage 8B Review Control API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage8b-control-api-20260814.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: data-collection-platform-stage8b-control-api
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - name: Wait for Stage 8A exact-head proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          for _ in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "${headers[@]}" "$api/contents/docs/proofs/stage8a-candidate-review-ci.md?ref=main")"
            [[ "$status" == "200" ]] && exit 0
            sleep 5
          done
          echo "Stage 8A exact-head proof did not appear" >&2
          exit 1

      - name: Check out complete current history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Materialize Review Application, PostgreSQL adapter, and Control API
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git reset --hard origin/main
          test -f docs/proofs/stage8a-candidate-review-ci.md

          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          def latest_revision(path: str, *, added: bool = False) -> str:
              args = ["log", "--all", "--format=%H"]
              if added:
                  args.append("--diff-filter=A")
              revisions = git(*args, "--", path).splitlines()
              if not revisions:
                  raise RuntimeError(f"no historical owner found for {path}")
              return revisions[0]

          control_app = "apps/control_api/src/control_api/app.py"
          review_service = "packages/review_application/src/review_application/service.py"
          review_repository = (
              "packages/collection_infrastructure/src/collection_infrastructure/"
              "postgres/review_repository.py"
          )
          control_revision = latest_revision(control_app, added=True)

          restore = (
              "apps/control_api",
              "packages/review_application",
              review_repository,
          )
          for path in restore:
              subprocess.run(["git", "checkout", latest_revision(path), "--", path], check=True)

          changed = git(
              "diff-tree",
              "--no-commit-id",
              "--name-only",
              "-r",
              control_revision,
          ).splitlines()
          for path in changed:
              if path.startswith(
                  (
                      "contracts/control",
                      "tools/control_api",
                      "database/tests/",
                      "docs/specifications/stage8b",
                      ".codex/modules/review",
                      "deploy/docker/control-api",
                  )
              ) or path in {
                  "packages/collection_infrastructure/src/collection_infrastructure/postgres/__init__.py",
                  "database/migrations/env.py",
              }:
                  subprocess.run(["git", "checkout", control_revision, "--", path], check=True)

          historical_paths = git("ls-tree", "-r", "--name-only", control_revision).splitlines()
          for path in historical_paths:
              if (
                  (path.startswith("contracts/") and "control" in path)
                  or path.startswith("tools/control_api")
                  or path == "deploy/docker/control-api.Dockerfile"
              ):
                  subprocess.run(["git", "checkout", control_revision, "--", path], check=True)

          root_project = ROOT / "pyproject.toml"
          root_text = root_project.read_text(encoding="utf-8")

          def add_value(text: str, section: str, key: str, value: str) -> str:
              section_start = text.index(f"[{section}]")
              start = text.index(f"{key} = [", section_start)
              end = text.index("\n]", start)
              literal = f'  "{value}",'
              if literal in text[start:end]:
                  return text
              return text[:end] + f"\n{literal}" + text[end:]

          for value in ("apps/control_api", "packages/review_application"):
              root_text = add_value(root_text, "tool.uv.workspace", "members", value)
          for value in ("apps/control_api/tests", "packages/review_application/tests"):
              root_text = add_value(root_text, "tool.pytest.ini_options", "testpaths", value)
          for value in ("apps/control_api/src", "packages/review_application/src"):
              root_text = add_value(root_text, "tool.ruff", "src", value)
          for value in (
              "apps/control_api/src/control_api",
              "packages/review_application/src/review_application",
          ):
              root_text = add_value(root_text, "tool.mypy", "files", value)
          for tool_path in historical_paths:
              if tool_path.startswith("tools/control_api") and tool_path.endswith(".py"):
                  root_text = add_value(root_text, "tool.mypy", "files", tool_path)
          root_project.write_text(root_text, encoding="utf-8")

          infrastructure_project = ROOT / "packages/collection_infrastructure/pyproject.toml"
          current_project = infrastructure_project.read_text(encoding="utf-8")
          historical_project = git(
              "show",
              f"{control_revision}:packages/collection_infrastructure/pyproject.toml",
          )
          dependencies = re.search(
              r"(?ms)^dependencies = \[\n(.*?)^\]",
              historical_project,
          )
          if dependencies is None:
              raise RuntimeError("historical infrastructure dependencies are missing")
          for dependency in re.findall(r'"([^"]+)"', dependencies.group(1)):
              if not dependency.startswith("review-"):
                  continue
              current_dependencies = re.search(
                  r"(?ms)^dependencies = \[\n(.*?)^\]",
                  current_project,
              )
              if current_dependencies is None:
                  raise RuntimeError("current infrastructure dependencies are missing")
              literal = f'  "{dependency}",'
              if literal not in current_dependencies.group(0):
                  insert_at = current_dependencies.end() - 1
                  current_project = (
                      current_project[:insert_at]
                      + literal
                      + "\n"
                      + current_project[insert_at:]
                  )
          infrastructure_project.write_text(current_project, encoding="utf-8")

          checker_path = ROOT / "tools/architecture_checks/check_dependencies.py"
          checker = checker_path.read_text(encoding="utf-8")
          history = git("show", f"{control_revision}:{checker_path.relative_to(ROOT)}")

          def block(source: str, owner: str) -> str:
              start = source.index(f'    "{owner}": OwnerPolicy(')
              following = re.search(r'\n    "[^"]+": OwnerPolicy\(', source[start + 1 :])
              end = source.index("\n}", start) if following is None else start + 1 + following.start()
              return source[start:end] + "\n"

          map_start = checker.index("_OWNER_POLICIES: dict[str, OwnerPolicy] = {")
          map_end = checker.index("\n}", map_start)
          for owner in ("review_application", "control_api"):
              if f'"{owner}": OwnerPolicy(' not in checker[map_start:map_end]:
                  owner_block = block(history, owner)
                  checker = checker[:map_end] + "\n" + owner_block + checker[map_end:]
                  map_end += len(owner_block) + 1

          historical_infrastructure = block(history, "collection_infrastructure")
          current_start = checker.index('    "collection_infrastructure": OwnerPolicy(')
          following = re.search(r'\n    "[^"]+": OwnerPolicy\(', checker[current_start + 1 :])
          current_end = (
              checker.index("\n}", current_start)
              if following is None
              else current_start + 1 + following.start()
          )
          checker = (
              checker[:current_start]
              + historical_infrastructure.rstrip("\n")
              + checker[current_end:]
          )
          checker_path.write_text(checker, encoding="utf-8")
          PY

          uv lock
          uv sync --frozen --all-packages --dev
          uv run ruff format apps/control_api packages/review_application packages/collection_infrastructure/src/collection_infrastructure/postgres/review_repository.py tools/control_api_contract_generation tools/architecture_checks/check_dependencies.py
          uv run ruff check apps/control_api packages/review_application packages/collection_infrastructure/src/collection_infrastructure/postgres/review_repository.py tools/control_api_contract_generation tools/architecture_checks/check_dependencies.py --fix
          uv run python -m compileall -q apps/control_api packages/review_application
          if test -f tools/control_api_contract_generation/generate.py; then
            uv run python tools/control_api_contract_generation/generate.py --check
          fi
          uv run mypy
          uv run pytest -q apps/control_api packages/review_application
          uv run pytest -m "not integration"
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/contract_generation/generate.py --check
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests
          test -f deploy/docker/control-api.Dockerfile
          docker build --file deploy/docker/control-api.Dockerfile .

          python - <<'PY'
          import subprocess
          from pathlib import Path

          policy = subprocess.check_output(
              ["python", "tools/architecture_checks/check_dependencies.py", "--print-policy"],
              text=True,
          ).strip()
          path = Path("docs/architecture/dependency-rules.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "<!-- dependency-policy:start -->"
          end_marker = "<!-- dependency-policy:end -->"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + policy + text[end:], encoding="utf-8")
          PY

          mkdir -p docs/proofs
          cat > docs/proofs/stage8b-control-api.md <<'EOF'
          # Stage 8B Review Control API

          - Status: `locally-proven`
          - Owners: `review_application`, PostgreSQL review repository, `control_api`.
          - Boundary: review commands use optimistic revision checks and append-only decisions; the API does not compute match scores or export eligibility.
          - Gates: Ruff, strict mypy, focused and full non-integration tests, dependency boundaries, generated-contract drift, fresh PostgreSQL/PostGIS migration, database integration tests and Control API image build.
          EOF

          git add apps/control_api packages/review_application packages/collection_infrastructure database database/tests contracts tools/control_api_contract_generation deploy/docker/control-api.Dockerfile docs/specifications docs/proofs/stage8b-control-api.md docs/architecture/dependency-rules.md .codex/modules pyproject.toml tools/architecture_checks/check_dependencies.py uv.lock
          git diff --cached --check
          production_sha="$(git rev-parse HEAD)"
          if ! git diff --cached --quiet; then
            git config user.name "rtao-god"
            git config user.email "rtaogod@gmail.com"
            git commit -m "Feat (Review): add candidate review Control API"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            production_sha="$(git rev-parse HEAD)"
          fi
          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for permanent Verify and record Stage 8B proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INITIAL_SHA: ${{ steps.materialize.outputs.production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          git fetch origin main
          git reset --hard origin/main
          subject_sha="$(git rev-parse HEAD)"
          test -f apps/control_api/src/control_api/app.py
          test -f packages/review_application/src/review_application/service.py
          test -f packages/collection_infrastructure/src/collection_infrastructure/postgres/review_repository.py
          verify_id=""
          for _ in $(seq 1 120); do
            payload="$(curl -fsSL "${headers[@]}" "$api/actions/workflows/ci.yml/runs?branch=main&per_page=40")"
            verify_id="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$payload" | head -1)"
            status="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$payload" | head -1)"
            conclusion="$(jq -r --arg sha "$subject_sha" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' <<<"$payload" | head -1)"
            if [[ -n "$verify_id" && "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Verify $verify_id failed for $subject_sha" >&2; exit 1; }
              break
            fi
            sleep 5
          done
          [[ -n "$verify_id" ]] || { echo "Verify was not found for $subject_sha" >&2; exit 1; }

          cat > docs/proofs/stage8b-control-api-ci.md <<EOF
          # Stage 8B Review Control API CI proof

          - Status: `proven`
          - Repository: `rtao-god/data-collection-platform`
          - Branch: `main`
          - Subject commit: `$subject_sha`
          - Permanent Verify run: `$verify_id`
          - Verify conclusion: `success`

          ## Proven owners

          - `review_application` owns use-case orchestration and optimistic revision conflicts.
          - PostgreSQL review repository persists append-only decisions and manual observations.
          - `control_api` exposes typed review reads and commands without owning matching or quality calculations.
          - The capability-minimal Control API image builds successfully.

          Stage 8C review frontend is not claimed by this proof.
          EOF
          git add docs/proofs/stage8b-control-api-ci.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          git commit -m "Docs (Review): prove Stage 8B Control API"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
