name: Apply Review Persistence Boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-review-persistence-boundary.yml
      - .github/apply/review-persistence-boundary.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection-platform-apply-review-persistence-boundary
  cancel-in-progress: false

env:
  COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core

jobs:
  apply:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply reviewed owner patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -s .github/apply/review-persistence-boundary.patch.gz.b64
          base64 --decode .github/apply/review-persistence-boundary.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/review-persistence-boundary.patch
          git apply --index --3way \
            --exclude=database/tests/test_postgres_review_repository.py \
            /tmp/review-persistence-boundary.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("database/tests/test_postgres_review_repository.py")
          old = "from collection_infrastructure.postgres import PostgresReviewRepository\n"
          new = "from review_infrastructure import PostgresReviewRepository\n"
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("review repository import anchor is not unique")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git add database/tests/test_postgres_review_repository.py
          git rm -f \
            .github/workflows/apply-review-persistence-boundary.yml \
            .github/apply/review-persistence-boundary.patch.gz.b64
          git diff --cached --check

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Verify static contracts and owner boundaries
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format tools/architecture_checks/tests/test_check_dependencies.py
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run python -m compileall -q apps connectors database packages tools

      - name: Verify Review and Control API behavior
        run: >-
          uv run pytest -q
          tools/architecture_checks/tests
          packages/review_application/tests
          apps/control_api/tests
          tools/control_api_contract_generation/tests

      - name: Verify fresh PostgreSQL owner
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -q -m integration database/tests/test_postgres_review_repository.py

      - name: Build and inspect isolated images
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --tag data-collection-platform/control-api:review-boundary-ci \
            --file deploy/docker/control-api.Dockerfile \
            .
          docker build \
            --tag data-collection-platform/worker-gateway:review-boundary-ci \
            --file deploy/docker/worker-gateway.Dockerfile \
            .
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/control-api:review-boundary-ci)" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.User}}' data-collection-platform/worker-gateway:review-boundary-ci)" = "10001:10001"
          docker run --rm -i --entrypoint python data-collection-platform/control-api:review-boundary-ci - <<'PY'
          from importlib import import_module

          for name in (
              "review_application",
              "review_contracts",
              "review_core",
              "review_infrastructure",
          ):
              import_module(name)
          PY
          docker run --rm -i --entrypoint python data-collection-platform/worker-gateway:review-boundary-ci - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          import_module("collection_infrastructure")
          import_module("worker_gateway")
          forbidden = (
              "review_application",
              "review_contracts",
              "review_core",
              "review_infrastructure",
          )
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit("Worker Gateway contains Review owners: " + ", ".join(present))
          PY

      - name: Commit production owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          git commit -m "Refactor (Review): isolate PostgreSQL persistence owner"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
