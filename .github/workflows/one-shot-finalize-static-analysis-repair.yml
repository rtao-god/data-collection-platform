name: One-shot Finalize Static Analysis Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-finalize-static-analysis-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev

      - name: Run the proven static-analysis repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          import yaml

          planning = Path("connectors/official_http/src/official_http/planning.py")
          planning_text = planning.read_text(encoding="utf-8")
          old = "from defusedxml.ElementTree import (  # type: ignore[import-untyped]"
          new = "from defusedxml.ElementTree import (  # Hardened parser for untrusted WFS XML."
          if new not in planning_text:
              if old not in planning_text:
                  raise SystemExit("official HTTP parser import anchor is missing")
              planning.write_text(planning_text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/one-shot-lint-repair.yml")
          payload = yaml.safe_load(workflow.read_text(encoding="utf-8"))
          steps = payload["jobs"]["repair"]["steps"]
          repair = next(step["run"] for step in steps if step.get("name") == "Repair complete Ruff and mypy ledger")
          marker = "git fetch origin main\n"
          if repair.count(marker) != 1:
              raise SystemExit("static-analysis repair finalization anchor is invalid")
          repair = repair.replace(
              marker,
              "git rm .github/workflows/one-shot-finalize-static-analysis-repair.yml\n" + marker,
              1,
          )
          Path("/tmp/static-analysis-repair.sh").write_text(repair, encoding="utf-8")
          PY
          bash /tmp/static-analysis-repair.sh
