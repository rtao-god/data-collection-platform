name: Operational E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-database:
    runs-on: ubuntu-24.04
    services:
      collector-postgres:
        image: postgis/postgis:18-3.6@sha256:0d513af346b21c76bf084e90c0589043c30ff379025d079ce4befa9c3a539f72
        env:
          POSTGRES_DB: collector_core
          POSTGRES_USER: collector_migrator
          POSTGRES_PASSWORD: collector_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_migrator -d collector_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLECTOR_DATABASE_URL: postgresql+psycopg://collector_migrator:collector_migrator_test@127.0.0.1:5432/collector_core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Restore exact workspace
        run: uv sync --frozen --all-packages --dev
      - name: Verify generated contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/contract_generation/generate.py --check
          if test -f tools/control_api_contract_generation/generate.py; then
            uv run python tools/control_api_contract_generation/generate.py --check
          fi
          if test -f tools/review_contract_generation/generate.py; then
            uv run python tools/review_contract_generation/generate.py --check
          fi
      - name: Verify static and architectural contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python -m compileall -q apps connectors database packages tools
          uv run collector config validate berlin_recording_services
      - name: Verify unit and component behavior
        run: uv run pytest -m 'not integration and not object_store_integration'
      - name: Verify fresh PostgreSQL/PostGIS state
        shell: bash
        run: |
          set -euo pipefail
          uv run collection-migrate upgrade head
          uv run pytest -m integration database/tests

  review-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/review_web/package-lock.json
      - name: Require review application owner
        run: test -f apps/review_web/package-lock.json
      - name: Verify review application
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/review_web ci
          npm --prefix apps/review_web run lint
          npm --prefix apps/review_web run typecheck --if-present
          npm --prefix apps/review_web test -- --run
          npm --prefix apps/review_web run build

  compose-and-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require complete deployable inventory
        shell: bash
        run: |
          set -euo pipefail
          required=(
            apps/browser_worker/pyproject.toml
            apps/retention_job/pyproject.toml
            apps/orchestrator/pyproject.toml
            packages/export_core/src/export_core/service.py
            tools/operations/backup_restore.py
            deploy/compose/application.yaml
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing operational owner: $path" >&2; exit 1; }
          done
      - name: Verify resolved Compose contract
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/application.yaml config > /tmp/application-compose.yaml
          ! grep -Eq 'image:[[:space:]]*[^[:space:]]*:latest([[:space:]]|$)' /tmp/application-compose.yaml
          ! grep -Eqi '(password|secret|token):[[:space:]]*(admin|password|secret|changeme)([[:space:]]|$)' /tmp/application-compose.yaml
      - name: Build declared application images
        run: docker compose -f deploy/compose/application.yaml build

  browser-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Locate browser worker image owner
        id: dockerfile
        shell: bash
        run: |
          set -euo pipefail
          path='deploy/docker/browser-worker.Dockerfile'
          test -f "$path" || path='deploy/docker/browser_worker.Dockerfile'
          test -f "$path" || { echo 'browser worker Dockerfile is missing' >&2; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Build isolated browser worker
        run: docker build --tag data-collection-platform/browser-worker:ci --file '${{ steps.dockerfile.outputs.path }}' .
      - name: Verify browser runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          image='data-collection-platform/browser-worker:ci'
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '10001:10001'
          docker run --rm -i --entrypoint python "$image" - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          import_module('browser_worker')
          import_module('playwright')
          import_module('source_connector_sdk')
          forbidden = {'alembic', 'boto3', 'botocore', 'psycopg', 'scrapy', 'sqlalchemy'}
          present = sorted(name for name in forbidden if find_spec(name) is not None)
          if present:
              raise SystemExit('forbidden browser dependencies: ' + ', '.join(present))
          PY

  export-and-operations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Verify deterministic export and operations owners
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/export_core/src/export_core/service.py
          test -f tools/operations/backup_restore.py
          paths=()
          for path in \
            packages/export_core/tests \
            apps/retention_job/tests \
            apps/orchestrator/tests \
            tools/operations/tests; do
            test -d "$path" && paths+=("$path")
          done
          test "${#paths[@]}" -gt 0 || { echo 'operational test owners are missing' >&2; exit 1; }
          uv run pytest -q "${paths[@]}"
