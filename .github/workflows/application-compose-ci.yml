name: Application Compose Verify

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/application-compose-ci.yml
      - deploy/compose/**
      - deploy/docker/**
      - apps/collector_cli/**
      - apps/control_api/**
      - apps/http_worker/**
      - apps/manual_import_worker/**
      - apps/migration/**
      - apps/osm_worker/**
      - apps/processing_worker/**
      - apps/resolution_worker/**
      - apps/worker_gateway/**
      - connectors/**
      - packages/**
      - database/**
      - tools/compose_secrets/**
      - tools/compose_topology/**
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - .github/workflows/application-compose-ci.yml
      - deploy/compose/**
      - deploy/docker/**
      - apps/collector_cli/**
      - apps/control_api/**
      - apps/http_worker/**
      - apps/manual_import_worker/**
      - apps/migration/**
      - apps/osm_worker/**
      - apps/processing_worker/**
      - apps/resolution_worker/**
      - apps/worker_gateway/**
      - connectors/**
      - packages/**
      - database/**
      - tools/compose_secrets/**
      - tools/compose_topology/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-collection-platform-application-compose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  application-compose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Materialize file-backed Compose secrets
        run: >-
          python tools/compose_secrets/materialize.py
          --environment-file deploy/compose/.env.example
          --output-directory deploy/compose/.secrets

      - name: Validate resolved topology and privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source deploy/compose/.env.example
          set +a

          docker compose \
            --env-file deploy/compose/.env.example \
            -f deploy/compose/infrastructure.yaml \
            -f deploy/compose/application.yaml \
            --profile "*" \
            config --format json > /tmp/application-compose.json

          python tools/compose_topology/verify.py \
            --config /tmp/application-compose.json \
            --secret-root deploy/compose/.secrets
          python -m compileall -q tools/compose_secrets tools/compose_topology

      - name: Build every declared application image
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --env-file deploy/compose/.env.example \
            -f deploy/compose/infrastructure.yaml \
            -f deploy/compose/application.yaml \
            build \
              collector-cli \
              migration \
              control-api \
              worker-gateway \
              manual-import-worker \
              http-worker \
              osm-worker \
              extraction-worker \
              normalization-worker \
              resolution-worker

      - name: Prove clean bootstrap, loopback publication, APIs, and worker isolation
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source deploy/compose/.env.example
          set +a
          compose=(
            docker compose
            --env-file deploy/compose/.env.example
            -f deploy/compose/infrastructure.yaml
            -f deploy/compose/application.yaml
          )

          cleanup() {
            status=$?
            if (( status != 0 )); then
              "${compose[@]}" ps || true
              "${compose[@]}" logs --no-color --tail=200 || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          verify_loopback_network() {
            local network_name="$1"
            local expected_service="$2"
            local network_ids
            network_ids="$(
              docker network ls \
                --filter "label=com.docker.compose.project=data-collection-platform" \
                --filter "label=com.docker.compose.network=${network_name}" \
                --format '{{.ID}}'
            )"
            if [[ -z "$network_ids" || "$network_ids" == *$'\n'* ]]; then
              printf 'loopback network identity mismatch: %s -> %q\n' \
                "$network_name" "$network_ids" >&2
              return 1
            fi
            local network_state
            network_state="$(
              docker network inspect "$network_ids" \
                --format '{{.Internal}}|{{.Driver}}|{{index .Options "com.docker.network.bridge.enable_icc"}}|{{index .Options "com.docker.network.bridge.enable_ip_masquerade"}}|{{index .Options "com.docker.network.bridge.host_binding_ipv4"}}|{{len .Containers}}'
            )"
            if [[ "$network_state" != "false|bridge|false|false|127.0.0.1|1" ]]; then
              printf 'loopback network state mismatch: %s -> %s\n' \
                "$network_name" "$network_state" >&2
              return 1
            fi
            local attached_service
            attached_service="$(
              docker network inspect "$network_ids" \
                --format '{{range .Containers}}{{.Name}}{{end}}'
            )"
            if [[ "$attached_service" != "data-collection-platform-${expected_service}-1" ]]; then
              printf 'loopback network member mismatch: %s -> %s\n' \
                "$network_name" "$attached_service" >&2
              return 1
            fi
          }

          verify_published_port() {
            local service="$1"
            local container_port="$2"
            local expected_host_port="$3"
            local actual
            actual="$("${compose[@]}" port "$service" "$container_port")"
            if [[ "$actual" != "127.0.0.1:${expected_host_port}" ]]; then
              printf 'published port mismatch: %s:%s -> %s\n' \
                "$service" "$container_port" "$actual" >&2
              return 1
            fi
          }

          "${compose[@]}" up --detach --wait --wait-timeout 180 \
            collector-postgres seaweedfs
          "${compose[@]}" --profile bootstrap run --rm --no-deps \
            object-store-bootstrap
          "${compose[@]}" --profile migration run --rm --no-deps migration
          "${compose[@]}" up --detach --wait --wait-timeout 180 \
            control-api worker-gateway
          "${compose[@]}" up --detach --wait --wait-timeout 180 \
            manual-import-worker \
            http-worker \
            osm-worker \
            extraction-worker \
            normalization-worker \
            resolution-worker

          verify_loopback_network collection-control-loopback control-api
          verify_loopback_network collection-postgres-loopback collector-postgres
          verify_loopback_network collection-object-store-loopback seaweedfs
          verify_published_port control-api 8080 "$CONTROL_API_PORT"
          verify_published_port collector-postgres 5432 "$COLLECTOR_POSTGRES_PORT"
          verify_published_port seaweedfs 8333 "$SEAWEEDFS_S3_PORT"
          verify_published_port seaweedfs 9333 "$SEAWEEDFS_MASTER_PORT"

          python - <<'PY'
          import os
          import socket

          for variable in (
              "COLLECTOR_POSTGRES_PORT",
              "SEAWEEDFS_S3_PORT",
              "SEAWEEDFS_MASTER_PORT",
          ):
              with socket.create_connection(
                  ("127.0.0.1", int(os.environ[variable])),
                  timeout=5,
              ):
                  pass
          PY

          curl --fail --silent --show-error \
            http://127.0.0.1:"${CONTROL_API_PORT}"/health/ready \
            > /tmp/control-api-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/control-api-readiness.json").read_text(encoding="utf-8")
          )
          if payload != {"status": "ready"}:
              raise SystemExit(f"unexpected Control API readiness payload: {payload}")
          PY

          "${compose[@]}" exec -T worker-gateway python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen(
              "http://127.0.0.1:8080/health/ready",
              timeout=5,
          ) as response:
              payload = json.load(response)
          if payload != {"component": "worker-gateway", "status": "ready"}:
              raise SystemExit(f"unexpected Worker Gateway readiness payload: {payload}")
          PY

          expected_registrations=$'extraction-worker-local:extraction\nhttp-worker-local:http_fetch\nmanual-import-worker-local:manual_import\nnormalization-worker-local:normalization\nosm-worker-local:osm_query\nresolution-worker-local:entity_resolution'
          actual_registrations=''
          for _ in $(seq 1 60); do
            actual_registrations="$(
              "${compose[@]}" exec -T collector-postgres \
                psql \
                --username "$COLLECTOR_POSTGRES_USER" \
                --dbname "$COLLECTOR_POSTGRES_DB" \
                --tuples-only \
                --no-align \
                --command "
                  SELECT
                    registration.worker_id || ':' ||
                    string_agg(capability.capability, ',' ORDER BY capability.capability)
                  FROM work.worker_registrations AS registration
                  JOIN work.worker_capabilities AS capability
                    ON capability.worker_id = registration.worker_id
                  WHERE registration.worker_id IN (
                    'manual-import-worker-local',
                    'http-worker-local',
                    'osm-worker-local',
                    'extraction-worker-local',
                    'normalization-worker-local',
                    'resolution-worker-local'
                  )
                  GROUP BY registration.worker_id
                  ORDER BY registration.worker_id;
                "
            )"
            [[ "$actual_registrations" == "$expected_registrations" ]] && break
            sleep 2
          done
          if [[ "$actual_registrations" != "$expected_registrations" ]]; then
            printf 'worker registration mismatch\nexpected:\n%s\nactual:\n%s\n' \
              "$expected_registrations" "$actual_registrations" >&2
            exit 1
          fi

          trap - EXIT
          "${compose[@]}" down --volumes --remove-orphans
